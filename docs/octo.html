<meta charset="UTF-8">

<title>Octo Trivia</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(ellipse at 50% 30%, #232941 0%, #12141f 75%);
    color: #f2ede1;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: max(20px, calc(env(safe-area-inset-top) + 8px)) 10px calc(30px + env(safe-area-inset-bottom));
    user-select: none;
    -webkit-user-select: none;
  }
  h1 { font-size: 24px; letter-spacing: 4px; color: #e8c15a; margin-bottom: 2px; font-weight: 800; }
  .sub { font-size: 11px; opacity: .4; margin-bottom: 8px; }
  .topbar { width: min(96vw, 660px); display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .mbtn {
    width: 42px; height: 42px;
    border: none; border-radius: 10px;
    background: rgba(255,255,255,.08);
    color: #e8c15a; font-size: 19px; font-weight: 800;
    cursor: pointer;
  }
  .turnpill {
    display: flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,.08);
    border-radius: 10px;
    padding: 6px 10px;
    font-size: 12px; font-weight: 700;
    margin-right: auto;
  }
  .turnpill .pdot { width: 13px; height: 13px; border-radius: 4px; border: 2px solid #fff; }
  .diebox {
    width: 58px; height: 58px;
    background: linear-gradient(145deg, #ffffff, #e8e4d8);
    border-radius: 6px;
    position: relative;
    box-shadow: 0 3px 8px rgba(0,0,0,.45);
  }
  .diebox .pip { position: absolute; width: 11px; height: 11px; background: #191919; border-radius: 50%; transform: translate(-50%, -50%); }
  .diebox.spin { animation: dspin .5s ease; }
  @keyframes dspin { 50% { transform: rotate(180deg) scale(.85); } }
  .rollbtn {
    border: none; border-radius: 9px;
    background: linear-gradient(180deg, #e8c15a, #c99f2e);
    color: #22302a; font-size: 12px; font-weight: 800; letter-spacing: 1px;
    padding: 10px 12px;
    box-shadow: 0 3px 0 #97751c;
    cursor: pointer;
  }
  .rollbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 #97751c; }
  .rollbtn:disabled { opacity: .45; }
  .hint { font-size: 12px; opacity: .8; min-height: 16px; margin-bottom: 6px; text-align: center; }
  #board { width: min(96vw, 660px); }
  .hl { animation: hlp 1s infinite; cursor: pointer; }
  .halo { animation: hlp 1.3s infinite; }
  .fmini { animation: hlp 1s infinite; cursor: pointer; }
  @keyframes hlp { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  .legend { display: flex; flex-wrap: wrap; gap: 7px 13px; justify-content: center; margin-top: 12px; max-width: 660px; }
  .chip { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; }
  .octc { width: 14px; height: 14px; clip-path: polygon(30% 0, 70% 0, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0 70%, 0 30%); }
  .players { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
  .player svg { width: 52px; height: 52px; }
  @media (min-width: 700px) {
    .players { gap: 24px; margin-top: 18px; }
    .player { font-size: 15px; }
    .player svg { width: 96px; height: 96px; }
  }
  .player { text-align: center; font-size: 11px; font-weight: 700; opacity: .7; }
  .player.on { opacity: 1; }
  .player.on .pname { color: #e8c15a; }
  .player svg { display: block; margin: 0 auto 3px; }
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.78);
    display: none;
    align-items: center; justify-content: center;
    z-index: 50;
  }
  .overlay.show { display: flex; }
  .modal {
    background: #f4eeda; color: #22302a;
    border-radius: 18px;
    padding: 26px 30px;
    width: min(300px, 88vw);
    text-align: center;
    box-shadow: 0 12px 40px rgba(0,0,0,.6);
  }
  .modal h2 { color: #2e3555; font-size: 20px; margin-bottom: 14px; letter-spacing: 1px; }
  .modal button {
    display: block; width: 100%;
    margin: 9px 0; padding: 13px;
    border: none; border-radius: 12px;
    font-size: 15px; font-weight: 800;
    color: #fff; cursor: pointer;
  }
  .b-resume { background: linear-gradient(180deg,#3fa06a,#2b7c4e); box-shadow: 0 4px 0 #1d5c38; }
  .b-save   { background: linear-gradient(180deg,#4a7fd6,#3560ab); box-shadow: 0 4px 0 #244680; }
  .b-quit   { background: linear-gradient(180deg,#e85b5b,#c23434); box-shadow: 0 4px 0 #8f2323; }
  .modal button:active { transform: translateY(2px); box-shadow: none; }
  .sub2 { font-size: 13px; font-weight: 700; color: #6b6552; margin: 8px 0 4px; }
  .countrow { display: flex; gap: 6px; justify-content: center; margin: 8px 0 12px; }
  .cbtn {
    width: 38px; height: 38px;
    border-radius: 10px;
    border: 2px solid #d9d0b5;
    background: #fff;
    font-weight: 800; font-size: 16px;
    cursor: pointer; color: #22302a;
  }
  .cbtn.on { background: #e8c15a; border-color: #c99f2e; }
  .nfield { display: flex; align-items: center; gap: 8px; margin: 7px 0; }
  .nfield .pdot2 { flex-shrink: 0; width: 15px; height: 15px; border-radius: 4px; border: 2px solid #999; }
  .nfield input {
    flex: 1; min-width: 0;
    padding: 9px 10px;
    border: 2px solid #d9d0b5;
    border-radius: 10px;
    font-size: 14px; font-weight: 600;
    font-family: inherit;
    color: #22302a; background: #fff;
  }
  .nfield input:focus { outline: none; border-color: #c99f2e; }
  .qcard {
    background: #f4eeda; color: #22302a;
    border-radius: 16px;
    overflow: hidden;
    width: min(430px, 92vw);
    box-shadow: 0 12px 40px rgba(0,0,0,.6);
    text-align: left;
  }
  .qhead {
    padding: 12px 16px;
    color: #fff; font-weight: 800;
    letter-spacing: 1px; font-size: 13px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .qbody { padding: 16px; }
  .qtext { font-size: 16px; font-weight: 700; line-height: 1.4; margin-bottom: 12px; }
  .qa-btn {
    display: flex; align-items: center; gap: 10px;
    width: 100%; margin: 5px 0; padding: 11px 12px;
    border: 2px solid #d9d0b5; border-radius: 12px;
    background: #fff;
    cursor: pointer;
    font-size: 14px; font-weight: 600; color: #22302a;
    text-align: left;
  }
  .qa-btn .lt {
    flex-shrink: 0;
    width: 26px; height: 26px;
    border-radius: 8px;
    background: #eae2c8;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 13px;
  }
  .qa-btn.correct { background: #2eae60; border-color: #2eae60; color: #fff; }
  .qa-btn.correct .lt { background: rgba(255,255,255,.25); color: #fff; }
  .qa-btn.wrong { background: #d64545; border-color: #d64545; color: #fff; }
  .qa-btn.wrong .lt { background: rgba(255,255,255,.25); color: #fff; }
  .qa-btn.reveal { animation: qrev .7s infinite; }
  @keyframes qrev { 0%,100% { box-shadow: 0 0 0 0 rgba(46,174,96,0); } 50% { box-shadow: 0 0 0 6px rgba(46,174,96,.4); } }
  .qfb { min-height: 22px; margin-top: 8px; font-size: 14px; font-weight: 800; text-align: center; }
</style>
</head>

  <div class="topbar">

  <div class="players" id="players"></div>

      <button class="b-resume" id="startBtn" style="margin-top:14px;">START GAME</button>

  <div class="overlay" id="qOverlay">
    <div class="qcard">
      <div class="qhead" id="qHead">
        <span id="qCat"></span>
        <span style="display:flex;gap:6px;align-items:center;">
          <span id="qDiff" style="font-size:10px;font-weight:800;padding:3px 7px;border-radius:8px;background:rgba(0,0,0,.28);"></span>
          <span id="qTag" style="font-size:11px;opacity:.95;">★ SEGMENT</span>
        </span>
      </div>
      <div class="qbody">
        <div class="qtext" id="qText"></div>
        <div id="qAnswers"></div>
        <div class="qfb" id="qFb"></div>
      </div>
    </div>
  </div>

  <div class="overlay" id="menuOverlay">
    <div class="modal">
      <h2>GAME MENU</h2>
      <button class="b-resume" id="mResume">Resume</button>
      <button class="b-save" id="mRestart">Restart</button>
      <button class="b-quit" id="mExit">Exit</button>
    </div>
  </div>

  <div class="overlay" id="winOverlay">
    <div class="modal">
      <h2>🏆 WINNER!</h2>
      <div style="font-size:26px;font-weight:900;color:#2e3555;margin:6px 0 14px;" id="winName"></div>
      <button class="b-resume" id="wAgain">Play Again</button>
      <button class="b-quit" id="wExit">Exit</button>
    </div>
  </div>

const DIFF_NAMES = ["EASY", "MEDIUM", "HARD", "IMPOSSIBLE"];
const LETTERS = ["A","B","C","D","E"];

const CX = 500, CY = 500;
const RING_R = 415, SH_R = 50, SP_R = 24, CORE_R = 148;
const INK = "#0c0f18";

function pt(r, aDeg, cx = CX, cy = CY) {
  const a = aDeg * Math.PI / 180;
  return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
}
function octPts(cx, cy, r, rot = 22.5) {
  const p = [];
  for (let k = 0; k < 8; k++) p.push(pt(r, rot + k * 45, cx, cy));
  return p;
}
function octStr(cx, cy, r, rot = 22.5) {
  return octPts(cx, cy, r, rot).map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
}
const lerp = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];

function el(tag, cls, txt) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (txt !== undefined) e.textContent = txt;
  return e;
}
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// ---------- board graph ----------
const NODES = {}, ADJ = {};
function addNode(id, x, y, type, cat) { NODES[id] = { x, y, type, cat }; ADJ[id] = []; }
function addEdge(a, b) { ADJ[a].push(b); ADJ[b].push(a); }
const V = [];
(function buildGraph() {
  for (let k = 0; k < 8; k++) V.push(pt(RING_R, -90 + k * 45));
  for (let k = 0; k < 8; k++) addNode("H" + k, V[k][0], V[k][1], "hq", k);
  for (let s = 0; s < 8; s++) {
    const pat = [
      { cat: (s + 2) % 8 },
      { cat: (s + 5) % 8 },
      s % 2 === 0 ? { roll: true } : { cat: (s + 3) % 8 },
      { cat: (s + 6) % 8 }
    ];
    pat.forEach((p, i) => {
      const [x, y] = lerp(V[s], V[(s + 1) % 8], 0.25 + i / 6);
      addNode(`B${s}-${i}`, x, y, p.roll ? "roll" : "cat", p.roll ? null : p.cat);
    });
    addEdge("H" + s, `B${s}-0`);
    for (let i = 0; i < 3; i++) addEdge(`B${s}-${i}`, `B${s}-${i+1}`);
    addEdge(`B${s}-3`, "H" + ((s + 1) % 8));
  }
  addNode("C", CX, CY, "center", null);
  for (const k of [0, 2, 4, 6]) {
    const cols = [(k + 1) % 8, (k + 4) % 8, (k + 7) % 8];
    for (let i = 0; i < 3; i++) {
      const [x, y] = lerp(V[k], [CX, CY], 0.22 + i * 0.165);
      addNode(`L${k}-${i}`, x, y, "cat", cols[i]);
    }
    addEdge("H" + k, `L${k}-0`);
    addEdge(`L${k}-0`, `L${k}-1`);
    addEdge(`L${k}-1`, `L${k}-2`);
    addEdge(`L${k}-2`, "C");
  }
})();

function reachable(start, n) {
  let frontier = [[start, null]];
  for (let step = 0; step < n; step++) {
    const next = [], seen = new Set();
    frontier.forEach(([node, from]) => {
      ADJ[node].forEach(nb => {
        if (nb === from) return;
        const key = nb + "|" + node;
        if (!seen.has(key)) { seen.add(key); next.push([nb, node]); }
      });
    });
    frontier = next;
  }
  return [...new Set(frontier.map(f => f[0]))];
}
function findPath(start, n, target) {
  const path = [start];
  function dfs(node, from, depth) {
    if (depth === n) return node === target;
    for (const nb of ADJ[node]) {
      if (nb === from) continue;
      path.push(nb);
      if (dfs(nb, node, depth + 1)) return true;
      path.pop();
    }
    return false;
  }
  return dfs(start, null, 0) ? path : null;
}

// ---------- state ----------
const RINGS = ["#e74c3c", "#29c5e6", "#ffffff", "#16a085", "#8e44ad", "#f0b429"];
let players = [];
let cur = 0, moves = [], moving = false, trail = [], lastRoll = 4, qLock = false;
let decks = [];
const fullBadge = p => p.segs.every(s => s);

// ---------- save / resume ----------
const SAVE_KEY = "gg-save-octo";
function saveGame() {
  if (!players.length) return;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ players, cur, decks })); } catch (e) {}
}
function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }
function loadSave() {
  try { return JSON.parse(localStorage.getItem(SAVE_KEY) || "null"); } catch (e) { return null; }
}

function resetDeck(c) { decks[c] = { order: shuffle(QUESTIONS[c].map((_, i) => i)), ptr: 0 }; }
function drawQuestion(c) {
  if (!decks[c] || decks[c].ptr >= decks[c].order.length) resetDeck(c);
  return QUESTIONS[c][decks[c].order[decks[c].ptr++]];
}
function drawFor(catIdx) {
  if (catIdx === 7) {
    const r = Math.floor(Math.random() * 7);
    return { qd: drawQuestion(r), src: r };
  }
  return { qd: drawQuestion(catIdx), src: catIdx };
}

// ---------- rendering ----------
function boardSVG() {
  let svg = "";
  svg += `<polygon points="${octStr(CX, CY, 492)}" fill="#1c2233" stroke="${INK}" stroke-width="7"/>`;
  svg += `<polygon points="${octStr(CX, CY, 480)}" fill="none" stroke="#3c4763" stroke-width="1.5"/>`;
  for (let k = 0; k < 8; k++) {
    const a = V[k], b = V[(k + 1) % 8];
    svg += `<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" stroke="#3c4763" stroke-width="5"/>`;
  }
  for (const k of [0, 2, 4, 6]) {
    svg += `<line x1="${V[k][0].toFixed(1)}" y1="${V[k][1].toFixed(1)}" x2="${CX}" y2="${CY}" stroke="#3c4763" stroke-width="5"/>`;
  }
  // centre plate first — spaces are always drawn on top of it
  svg += `<polygon data-node="C" points="${octStr(CX, CY, CORE_R)}" fill="#242c44" stroke="${INK}" stroke-width="4"/>`;
  svg += `<polygon points="${octStr(CX, CY, CORE_R - 7)}" fill="none" stroke="#e8c15a" stroke-width="2.5" pointer-events="none"/>`;
  // small spaces
  Object.keys(NODES).forEach(id => {
    const nd = NODES[id];
    if (id[0] !== "B" && id[0] !== "L") return;
    if (nd.type === "roll") {
      svg += `<polygon data-node="${id}" points="${octStr(nd.x, nd.y, SP_R)}" fill="#f4eeda" stroke="${INK}" stroke-width="2.5"/>`;
      svg += `<text x="${nd.x.toFixed(1)}" y="${nd.y.toFixed(1)}" text-anchor="middle" dominant-baseline="central" font-size="22" pointer-events="none">🎲</text>`;
    } else {
      svg += `<polygon data-node="${id}" points="${octStr(nd.x, nd.y, SP_R)}" fill="${CATS[nd.cat].color}" stroke="${INK}" stroke-width="2.5"/>`;
      if (nd.cat === 7) svg += `<text x="${nd.x.toFixed(1)}" y="${nd.y.toFixed(1)}" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="800" fill="#fff" pointer-events="none">?</text>`;
    }
  });
  // strongholds
  for (let k = 0; k < 8; k++) {
    const [x, y] = V[k];
    svg += `<polygon data-node="H${k}" points="${octStr(x, y, SH_R)}" fill="${CATS[k].color}" stroke="${INK}" stroke-width="4"/>`;
    svg += `<polygon points="${octStr(x, y, SH_R - 8)}" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2" pointer-events="none"/>`;
    svg += `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" dominant-baseline="central" font-size="34" fill="#fff" font-weight="800" pointer-events="none">${k === 7 ? "?" : "★"}</text>`;
  }
  // centre final-question minis
  const camper = players[cur] && players[cur].camped ? players[cur] : null;
  for (let k = 0; k < 8; k++) {
    const [mx, my] = pt(101, -90 + k * 45);
    const done = camper && camper.final[k];
    const pulse = camper && !camper.final[k] && !qLock;
    svg += `<polygon ${pulse ? 'class="fmini" ' : ""}data-final="${k}" points="${octStr(mx, my, 24)}" ` +
           `fill="${done ? "#2a3046" : CATS[k].color}" stroke="${pulse ? "#ffffff" : INK}" stroke-width="${pulse ? 4 : 2.5}"/>`;
    if (done) svg += `<text x="${mx.toFixed(1)}" y="${my.toFixed(1)}" text-anchor="middle" dominant-baseline="central" font-size="19" fill="#5b6584" pointer-events="none">✓</text>`;
    else if (k === 7) svg += `<text x="${mx.toFixed(1)}" y="${my.toFixed(1)}" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="800" fill="#fff" pointer-events="none">?</text>`;
  }
  svg += `<circle data-node="C" cx="${CX}" cy="${CY}" r="46" fill="#f4eeda" stroke="${INK}" stroke-width="3.5"/>`;
  svg += `<text x="${CX}" y="${CY - 5}" text-anchor="middle" font-size="22" pointer-events="none">🏆</text>`;
  svg += `<text x="${CX}" y="${CY + 22}" text-anchor="middle" font-size="12" font-weight="800" fill="#242c44" pointer-events="none">FINAL 8</text>`;
  return svg;
}

function hlSVG() {
  return moves.map(id => {
    const nd = NODES[id];
    const r = id === "C" ? CORE_R + 8 : (id[0] === "H" ? SH_R + 8 : SP_R + 8);
    return `<polygon class="hl" data-node="${id}" points="${octStr(nd.x, nd.y, r)}" fill="rgba(255,255,255,0.13)" stroke="#ffffff" stroke-width="5"/>`;
  }).join("");
}
function trailSVG() {
  return trail.map(id => {
    const nd = NODES[id];
    return `<circle cx="${nd.x.toFixed(1)}" cy="${nd.y.toFixed(1)}" r="8" fill="#e8c15a" opacity="0.85" pointer-events="none"/>`;
  }).join("");
}

function initials(name) {
  const parts = name.trim().split(/\s+/);
  const s = parts.length > 1 ? parts[0][0] + parts[1][0] : name.slice(0, 2);
  return s.toUpperCase();
}
function octBadge(cx, cy, r, segs, ring, label) {
  const ROT = -112.5;  // aligns segment k with stronghold k on the board
  let s = `<polygon points="${octStr(cx, cy, r + 7, ROT)}" fill="#f4eeda" stroke="${ring}" stroke-width="5" pointer-events="none"/>`;
  const outer = octPts(cx, cy, r + 1, ROT), inner = octPts(cx, cy, r * 0.55, ROT);
  for (let k = 0; k < 8; k++) {
    const o1 = outer[k], o2 = outer[(k + 1) % 8], i2 = inner[(k + 1) % 8], i1 = inner[k];
    s += `<polygon points="${o1[0].toFixed(1)},${o1[1].toFixed(1)} ${o2[0].toFixed(1)},${o2[1].toFixed(1)} ${i2[0].toFixed(1)},${i2[1].toFixed(1)} ${i1[0].toFixed(1)},${i1[1].toFixed(1)}" ` +
         `fill="${segs[k] ? CATS[k].color : "#ded7c3"}" stroke="#fff" stroke-width="1" pointer-events="none"/>`;
  }
  s += `<polygon points="${octStr(cx, cy, r * 0.55, ROT)}" fill="#242c44" pointer-events="none"/>`;
  s += `<text x="${cx.toFixed(1)}" y="${cy.toFixed(1)}" text-anchor="middle" dominant-baseline="central" font-size="${(r * 0.52).toFixed(0)}" font-weight="900" fill="#f2ede1" pointer-events="none">${label}</text>`;
  return s;
}

const OFFSETS = [[0,0],[15,-12],[-15,12],[16,12],[-16,-12],[0,19]];
function tokensSVG() {
  let s = "";
  const byNode = {};
  players.forEach((p, i) => { (byNode[p.pos] = byNode[p.pos] || []).push(i); });
  players.forEach((p, i) => {
    const nd = NODES[p.pos];
    const stack = byNode[p.pos];
    const [ox, oy] = stack.length > 1 ? OFFSETS[stack.indexOf(i)] : [0, 0];
    const x = nd.x + ox, y = nd.y + oy;
    if (i === cur) s += `<polygon class="halo" points="${octStr(x, y, 34)}" fill="none" stroke="#e8c15a" stroke-width="5" pointer-events="none"/>`;
    s += octBadge(x, y, 21, p.segs, RINGS[i], initials(p.name));
  });
  return s;
}

function render() {
  if (!players.length) return;
  document.getElementById("board").innerHTML =
    `<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">${boardSVG()}${hlSVG()}${trailSVG()}${tokensSVG()}</svg>`;
  document.getElementById("turnDot").style.background = RINGS[cur];
  document.getElementById("turnName").textContent = players[cur].name + "'s turn";
  document.getElementById("players").innerHTML = players.map((p, i) => {
    const n = p.camped ? p.final.filter(Boolean).length : p.segs.filter(Boolean).length;
    const tag = p.camped ? `FINAL ${n}/8` : `${n}/8`;
    return `<div class="player${i === cur ? " on" : ""}"><svg viewBox="0 0 64 64">${octBadge(32, 32, 21, p.segs, RINGS[i], initials(p.name))}</svg><span class="pname">${p.name}</span> · ${tag}</div>`;
  }).join("");

  const P = players[cur];
  const btn = document.getElementById("rollBtn");
  btn.disabled = moving || P.camped || moves.length > 0;
  const hint = document.getElementById("hint");
  if (P.camped) hint.textContent = P.name + " — tap a glowing centre octagon to pick your final question";
  else if (moves.length) hint.textContent = "Tap a glowing space to move";
  else if (!moving) hint.textContent = P.name + " — roll the die!" + (fullBadge(P) ? " Land exactly on the centre to start the FINAL 8" : "");
}

// ---------- die ----------
const DIE_PIPS = {
  1: [[50,50]], 2: [[28,28],[72,72]], 3: [[28,28],[50,50],[72,72]],
  4: [[28,28],[72,28],[28,72],[72,72]], 5: [[28,28],[72,28],[50,50],[28,72],[72,72]],
  6: [[28,28],[72,28],[28,50],[72,50],[28,72],[72,72]]
};
function showDie(v) {
  const d = document.getElementById("die");
  d.querySelectorAll(".pip").forEach(p => p.remove());
  DIE_PIPS[v].forEach(([x, y]) => {
    const p = document.createElement("div");
    p.className = "pip";
    p.style.left = x + "%";
    p.style.top = y + "%";
    d.appendChild(p);
  });
}

document.getElementById("rollBtn").addEventListener("click", () => {
  if (!players.length || moving || moves.length || players[cur].camped) return;
  trail = [];
  const btn = document.getElementById("rollBtn");
  const d = document.getElementById("die");
  btn.disabled = true;
  d.classList.add("spin");
  let t = 0;
  const iv = setInterval(() => {
    lastRoll = 1 + Math.floor(Math.random() * 6);
    showDie(lastRoll);
    if (++t >= 8) {
      clearInterval(iv);
      d.classList.remove("spin");
      moves = reachable(players[cur].pos, lastRoll);
      if (!fullBadge(players[cur])) moves = moves.filter(m => m !== "C");
      render();
    }
  }, 70);
});

// ---------- movement ----------
document.getElementById("board").addEventListener("click", e => {
  const f = e.target.closest("[data-final]");
  if (f && players.length && players[cur].camped && !moving && !qLock) {
    const k = Number(f.getAttribute("data-final"));
    if (!players[cur].final[k]) askQuestion(k, { isFinal: true });
    return;
  }
  const t = e.target.closest("[data-node]");
  if (!t || moving || !players.length) return;
  const id = t.getAttribute("data-node");
  if (!moves.includes(id)) return;
  const path = findPath(players[cur].pos, lastRoll, id);
  if (!path) return;
  moves = [];
  moving = true;
  trail = [players[cur].pos];
  render();
  let step = 1;
  const iv = setInterval(() => {
    players[cur].pos = path[step];
    trail.push(path[step]);
    render();
    if (++step >= path.length) {
      clearInterval(iv);
      moving = false;
      onLand();
    }
  }, 220);
});

// ---------- landing ----------
function nextPlayer() {
  cur = (cur + 1) % players.length;
  moves = [];
  qLock = false;   // always release the answer lock on turn change
  render();
  saveGame();
}
function sameAgain(msg) {
  qLock = false;   // always release the answer lock when play continues
  render();
  if (msg) document.getElementById("hint").textContent = msg;
  saveGame();
}
function onLand() {
  const P = players[cur];
  const nd = NODES[P.pos];
  if (nd.type === "roll") { sameAgain("Roll again! 🎲"); return; }
  if (nd.type === "center") {
    if (fullBadge(P) && !P.camped) {
      P.camped = true;
      render();  // pick mode: minis pulse
      return;
    }
    sameAgain("Roll again! 🎲");
    return;
  }
  askQuestion(nd.cat, { isHQ: nd.type === "hq", hqCat: nd.cat });
}

// ---------- questions ----------
function askQuestion(catIdx, opts) {
  opts = opts || {};
  const { qd, src } = drawFor(catIdx);
  const order = shuffle([0, 1, 2, 3, 4]);
  const shown = order.map(i => qd.a[i]);
  const correctShown = order.indexOf(qd.c);
  qLock = false;
  let label = CATS[catIdx].name.toUpperCase();
  if (catIdx === 7) label = "RANDOM · " + CATS[src].name.toUpperCase();
  if (opts.isFinal) label = "FINAL · " + label;
  document.getElementById("qHead").style.background = CATS[src].color;
  document.getElementById("qCat").textContent = label;
  document.getElementById("qDiff").textContent = DIFF_NAMES[qd.d];
  document.getElementById("qTag").style.display = opts.isHQ ? "inline" : "none";
  document.getElementById("qText").textContent = qd.q;
  document.getElementById("qFb").textContent = "";
  const ansBox = document.getElementById("qAnswers");
  ansBox.innerHTML = "";
  shown.forEach((t, i) => {
    const b = el("button", "qa-btn");
    b.setAttribute("data-i", i);
    b.appendChild(el("span", "lt", LETTERS[i]));
    b.appendChild(el("span", "", t));
    ansBox.appendChild(b);
  });
  const ov = document.getElementById("qOverlay");
  ov.classList.add("show");
  ansBox.onclick = e => {
    const b = e.target.closest(".qa-btn");
    if (!b || qLock) return;
    qLock = true;
    const i = Number(b.getAttribute("data-i"));
    const btns = [...document.querySelectorAll("#qAnswers .qa-btn")];
    btns.forEach(x => x.disabled = true);
    const fb = document.getElementById("qFb");
    const P = players[cur];
    if (i === correctShown) {
      b.classList.add("correct");
      if (opts.isFinal) {
        P.final[catIdx] = true;
        qLock = false;
        if (P.final.every(f => f)) {
          fb.textContent = "CORRECT — " + P.name + " WINS! 🏆";
          fb.style.color = "#2eae60";
          clearSave();
          if (window.GGA){ GGA.award('octo_win'); GGA.haptic('success'); }
          setTimeout(() => {
            ov.classList.remove("show");
            document.getElementById("winName").textContent = P.name;
            document.getElementById("winOverlay").classList.add("show");
          }, 1600);
        } else {
          fb.textContent = "Correct! Final question " + P.final.filter(Boolean).length + "/8 done — next player";
          fb.style.color = "#2eae60";
          setTimeout(() => { ov.classList.remove("show"); nextPlayer(); }, 1700);
        }
      } else if (opts.isHQ && !P.segs[opts.hqCat]) {
        P.segs[opts.hqCat] = 1;
        if (window.GGA && fullBadge(P)){ GGA.award('octo_badge'); GGA.haptic('medium'); }
        fb.textContent = "Correct! Segment earned 🔶 — next player";
        fb.style.color = "#2eae60";
        setTimeout(() => { ov.classList.remove("show"); nextPlayer(); }, 1700);
      } else {
        fb.textContent = "Correct! Roll again 🎲";
        fb.style.color = "#2eae60";
        setTimeout(() => { ov.classList.remove("show"); sameAgain("Correct! Roll again 🎲"); }, 1400);
      }
    } else {
      b.classList.add("wrong");
      btns[correctShown].classList.add("correct", "reveal");
      fb.textContent = "Wrong — the answer was " + LETTERS[correctShown] + ". Next player!";
      fb.style.color = "#d64545";
      qLock = false;
      setTimeout(() => { ov.classList.remove("show"); nextPlayer(); }, 2200);
    }
  };
}

// ---------- setup ----------
let numPlayers = 2;
const savedNames = ["", "", "", "", "", ""];
function buildCountRow() {
  document.getElementById("countRow").innerHTML = [1,2,3,4,5,6].map(n =>
    `<button class="cbtn${n === numPlayers ? " on" : ""}" data-n="${n}">${n}</button>`
  ).join("");
}
function buildNameFields() {
  document.getElementById("nameFields").innerHTML = Array.from({ length: numPlayers }, (_, i) =>
    `<div class="nfield"><span class="pdot2" style="background:${RINGS[i]}"></span>` +
    `<input type="text" maxlength="12" placeholder="Player ${i + 1}" value="${savedNames[i]}" data-i="${i}"></div>`
  ).join("");
}
document.getElementById("countRow").addEventListener("click", e => {
  const b = e.target.closest(".cbtn");
  if (!b) return;
  document.querySelectorAll("#nameFields input").forEach(inp =>
    savedNames[Number(inp.getAttribute("data-i"))] = inp.value.trim());
  numPlayers = Number(b.getAttribute("data-n"));
  buildCountRow();
  buildNameFields();
});
document.getElementById("startBtn").addEventListener("click", () => {
  const names = [];
  document.querySelectorAll("#nameFields input").forEach(inp => {
    const i = Number(inp.getAttribute("data-i"));
    names[i] = inp.value.trim() || "Player " + (i + 1);
  });
  players = names.map(n => ({ name: n, pos: "C", segs: [0,0,0,0,0,0,0,0], camped: false, final: [false,false,false,false,false,false,false,false] }));
  cur = 0; moves = []; moving = false; trail = []; qLock = false;
  decks = [];
  document.getElementById("setupOverlay").classList.remove("show");
  document.getElementById("rollBtn").disabled = false;
  render();
  saveGame();
});
document.getElementById("continueBtn").addEventListener("click", () => {
  const sv = loadSave();
  if (!sv) return;
  players = sv.players;
  cur = sv.cur;
  decks = sv.decks || [];
  moves = []; moving = false; trail = []; qLock = false;
  document.getElementById("setupOverlay").classList.remove("show");
  document.getElementById("rollBtn").disabled = false;
  render();
});

// ---------- menu / win ----------
const mo = document.getElementById("menuOverlay");
document.getElementById("menuBtn").addEventListener("click", () => { if (players.length) mo.classList.add("show"); });
document.getElementById("mResume").addEventListener("click", () => mo.classList.remove("show"));
document.getElementById("mRestart").addEventListener("click", () => { mo.classList.remove("show"); restartGame(); });
document.getElementById("mExit").addEventListener("click", () => { mo.classList.remove("show"); exitGame(); });
document.getElementById("wAgain").addEventListener("click", () => { document.getElementById("winOverlay").classList.remove("show"); restartGame(); });
document.getElementById("wExit").addEventListener("click", () => { document.getElementById("winOverlay").classList.remove("show"); exitGame(); });
function restartGame() {
  players = players.map(p => ({ name: p.name, pos: "C", segs: [0,0,0,0,0,0,0,0], camped: false, final: [false,false,false,false,false,false,false,false] }));
  cur = 0; moves = []; moving = false; trail = []; qLock = false;
  decks = [];
  document.getElementById("qOverlay").classList.remove("show");
  document.getElementById("rollBtn").disabled = false;
  render();
  saveGame();
}
function exitGame() {
  if (EXIT_URL) { window.location.href = EXIT_URL; return; }
  players = []; moves = []; moving = false; trail = [];
  document.getElementById("board").innerHTML = "";
  document.getElementById("players").innerHTML = "";
  document.getElementById("turnName").textContent = "";
  document.getElementById("turnDot").style.background = "transparent";
  document.getElementById("hint").textContent = "";
  document.getElementById("qOverlay").classList.remove("show");
  document.getElementById("setupOverlay").classList.add("show");
}

document.getElementById("legend").innerHTML = CATS.map(c =>
  `<span class="chip"><span class="octc" style="background:${c.color}"></span>${c.name}</span>`
).join("");
showDie(lastRoll);
buildCountRow();
buildNameFields();
document.getElementById("hint").textContent = "Set up a new game to begin";
(function bootResume() {
  const sv = loadSave();
  if (sv && sv.players && sv.players.length) {
    const b = document.getElementById("continueBtn");
    b.textContent = "▶ CONTINUE (" + sv.players.map(p => p.name).join(", ") + ")";
    b.style.display = "block";
  }
})();

</script>
