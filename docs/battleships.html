<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sea Battle</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }

  :root{
    --sky1:#7ee8fa; --sky2:#80ff72;
    --water1:#4facfe; --water2:#00c6fb;
    --coral:#ff6b6b; --sunshine:#ffd93d; --mint:#6bffb8;
    --purple:#a78bfa; --orange:#ff9f43; --pink:#ff8fab;
    --deep:#1e3c72;
  }

  html,body{ height:100%; }
  body{
    font-family:-apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background:linear-gradient(160deg,#7ee8fa 0%, #6bc6ff 35%, #4facfe 70%, #38b6ff 100%);
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:12px;
    padding-top:calc(12px + env(safe-area-inset-top, 44px));
    padding-left:calc(12px + env(safe-area-inset-left, 0px));
    padding-right:calc(12px + env(safe-area-inset-right, 0px));
    padding-bottom:calc(12px + env(safe-area-inset-bottom, 0px));
    overflow-x:hidden;
    color:#fff;
  }

  /* floating bubbles background */
  .bubble{ position:fixed; border-radius:50%; background:rgba(255,255,255,.18);
    box-shadow:inset -4px -4px 10px rgba(0,0,0,.05), inset 4px 4px 10px rgba(255,255,255,.4);
    animation:floatUp linear infinite; pointer-events:none; z-index:0; }
  @keyframes floatUp{ from{ transform:translateY(110vh) scale(1);} to{ transform:translateY(-15vh) scale(1.15);} }

  /* ---------- header ---------- */
  header{
    width:100%; max-width:760px; display:flex; align-items:center; justify-content:space-between;
    margin-bottom:10px; z-index:2;
  }
  h1{
    font-size:clamp(1.4rem, 5vw, 2.2rem); letter-spacing:1px;
    background:linear-gradient(180deg,#fff, #ffe27a);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 3px 0 rgba(30,60,114,.35));
  }

  .btn{
    border:none; cursor:pointer; color:#fff; font-weight:800; font-size:1rem;
    padding:10px 20px; border-radius:16px; position:relative;
    transition:transform .12s, box-shadow .12s;
    text-decoration:none; display:inline-block; text-align:center;
  }
  .btn:active{ transform:translateY(4px); }
  .btn-menu{
    background:linear-gradient(180deg,#ffb26b,#ff9f43);
    box-shadow:0 5px 0 #d97b1f, 0 8px 14px rgba(0,0,0,.2);
  }
  .btn-menu:active{ box-shadow:0 1px 0 #d97b1f, 0 3px 6px rgba(0,0,0,.2); }
  .btn-primary{
    background:linear-gradient(180deg,#7dffb0,#3ddc84);
    box-shadow:0 5px 0 #1fa85f, 0 8px 14px rgba(0,0,0,.2);
  }
  .btn-primary:active{ box-shadow:0 1px 0 #1fa85f, 0 3px 6px rgba(0,0,0,.2); }
  .btn-secondary{
    background:linear-gradient(180deg,#c4b5fd,#a78bfa);
    box-shadow:0 5px 0 #7c5cd6, 0 8px 14px rgba(0,0,0,.2);
  }
  .btn-secondary:active{ box-shadow:0 1px 0 #7c5cd6, 0 3px 6px rgba(0,0,0,.2); }
  .btn-coral{
    background:linear-gradient(180deg,#ff9a9a,#ff6b6b);
    box-shadow:0 5px 0 #d64545, 0 8px 14px rgba(0,0,0,.2);
  }
  .btn-coral:active{ box-shadow:0 1px 0 #d64545, 0 3px 6px rgba(0,0,0,.2); }

  /* ---------- status bar ---------- */
  #status{
    z-index:2; width:100%; max-width:760px; text-align:center; margin-bottom:10px;
    background:rgba(255,255,255,.22); backdrop-filter:blur(6px);
    border:2px solid rgba(255,255,255,.45); border-radius:18px;
    padding:10px 14px; font-weight:800; font-size:clamp(.95rem,3.5vw,1.15rem);
    color:#1e3c72; text-shadow:0 1px 0 rgba(255,255,255,.6);
    box-shadow:0 6px 16px rgba(30,60,114,.18);
  }

  /* ---------- boards ---------- */
  #gameArea{
    z-index:2; display:flex; flex-wrap:wrap; gap:22px; justify-content:center;
    width:100%; max-width:760px; perspective:900px;
  }
  .boardWrap{ display:flex; flex-direction:column; align-items:center; gap:8px; }
  .boardTitle{
    font-weight:900; font-size:1rem; color:#fff; letter-spacing:.5px;
    text-shadow:0 2px 4px rgba(30,60,114,.4); display:flex; align-items:center; gap:8px;
  }
  .boardTitle .dot{ width:12px; height:12px; border-radius:50%; box-shadow:inset -2px -2px 4px rgba(0,0,0,.2), inset 2px 2px 4px rgba(255,255,255,.5); }

  .board{
    display:grid; grid-template-columns:repeat(10,1fr); gap:3px;
    padding:10px; border-radius:20px;
    background:linear-gradient(180deg,#2a5298,#1e3c72);
    box-shadow:0 14px 0 #16305c, 0 24px 34px rgba(20,40,90,.45),
               inset 0 2px 6px rgba(255,255,255,.25);
    transform:rotateX(14deg);
    transform-style:preserve-3d;
    width:min(92vw, 350px); aspect-ratio:1/1;
    transition:transform .3s;
  }
  .board.flat{ transform:rotateX(6deg); }

  .cell{
    border-radius:6px; position:relative; cursor:pointer;
    background:linear-gradient(145deg,#5db9ff,#3f9cf5);
    box-shadow:inset 2px 2px 4px rgba(255,255,255,.45), inset -2px -2px 5px rgba(20,60,140,.45);
    transition:transform .12s, background .2s;
    transform-style:preserve-3d;
  }
  .cell::after{ /* subtle wave shimmer */
    content:""; position:absolute; inset:0; border-radius:6px;
    background:linear-gradient(120deg, transparent 30%, rgba(255,255,255,.25) 50%, transparent 70%);
    opacity:0; animation:shimmer 4s infinite; animation-delay:var(--d,0s);
  }
  @keyframes shimmer{ 0%,88%{opacity:0;} 92%{opacity:1;} 100%{opacity:0;} }

  .cell.hoverOK{ background:linear-gradient(145deg,#8dffc4,#4be08d); transform:translateZ(6px); }
  .cell.hoverBad{ background:linear-gradient(145deg,#ff9a9a,#ff6b6b); }

  .cell.ship{
    background:linear-gradient(145deg,#ffe27a,#ffc93d);
    box-shadow:inset 2px 2px 4px rgba(255,255,255,.6), inset -3px -3px 6px rgba(180,120,0,.4),
               0 4px 8px rgba(30,60,114,.35);
    transform:translateZ(8px);
  }
  .cell.miss{
    background:linear-gradient(145deg,#e8f7ff,#bfe4ff);
    box-shadow:inset 2px 2px 5px rgba(255,255,255,.8), inset -2px -2px 5px rgba(100,150,200,.35);
  }
  .cell.miss::before{
    content:""; position:absolute; inset:30%; border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #ffffff, #a9d6f5);
    box-shadow:0 2px 4px rgba(30,60,114,.3);
    animation:pop .3s ease-out;
  }
  .cell.hit{
    background:linear-gradient(145deg,#ff8f8f,#ff5252);
    box-shadow:inset 2px 2px 4px rgba(255,255,255,.5), inset -3px -3px 6px rgba(150,20,20,.5),
               0 0 14px rgba(255,90,90,.8);
    transform:translateZ(10px);
    animation:thump .35s ease-out;
  }
  .cell.hit::before{
    content:"✦"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:#fff176; font-size:1rem; text-shadow:0 0 8px #ff9800;
    animation:pop .35s ease-out;
  }
  .cell.sunk{
    background:linear-gradient(145deg,#8a94a6,#5c6675);
    box-shadow:inset 2px 2px 4px rgba(255,255,255,.3), inset -3px -3px 6px rgba(20,30,50,.6);
  }
  .cell.sunk::before{
    content:"✖"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:#ffd0d0; font-size:.9rem;
  }
  @keyframes pop{ 0%{ transform:scale(0);} 70%{ transform:scale(1.4);} 100%{ transform:scale(1);} }
  @keyframes thump{ 0%{ transform:translateZ(30px) scale(1.3);} 100%{ transform:translateZ(10px) scale(1);} }

  /* ---------- placement dock ---------- */
  #dock{
    z-index:2; width:100%; max-width:760px; margin-top:14px;
    background:rgba(255,255,255,.22); backdrop-filter:blur(6px);
    border:2px solid rgba(255,255,255,.45); border-radius:20px;
    padding:14px; display:flex; flex-direction:column; gap:12px; align-items:center;
    box-shadow:0 8px 20px rgba(30,60,114,.2);
  }
  #fleet{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
  .shipChip{
    display:flex; gap:3px; padding:8px 12px; border-radius:14px; cursor:pointer;
    background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.3));
    border:3px solid transparent;
    box-shadow:0 4px 0 rgba(30,60,114,.25), 0 6px 12px rgba(30,60,114,.15);
    transition:transform .12s, border-color .12s;
    align-items:center;
  }
  .shipChip.selected{ border-color:#ffd93d; transform:translateY(-3px);
    box-shadow:0 7px 0 rgba(30,60,114,.25), 0 10px 16px rgba(30,60,114,.2); }
  .shipChip.placed{ opacity:.35; pointer-events:none; }
  .shipChip .seg{
    width:16px; height:16px; border-radius:4px;
    background:linear-gradient(145deg,#ffe27a,#ffc93d);
    box-shadow:inset 1px 1px 2px rgba(255,255,255,.7), inset -1px -1px 2px rgba(180,120,0,.4);
  }
  .shipChip .name{ margin-left:6px; font-weight:800; font-size:.75rem; color:#1e3c72; }
  #dockButtons{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }

  /* ---------- overlay ---------- */
  #overlay{
    position:fixed; inset:0; background:rgba(20,40,90,.55); backdrop-filter:blur(5px);
    display:none; align-items:center; justify-content:center; z-index:10; padding:20px;
  }
  #overlay.show{ display:flex; }
  #overlayCard{
    background:linear-gradient(160deg,#ffffff,#e8f4ff);
    border-radius:26px; padding:34px 30px; text-align:center; max-width:340px; width:100%;
    box-shadow:0 16px 0 rgba(30,60,114,.25), 0 30px 50px rgba(0,0,0,.35);
    animation:cardIn .45s cubic-bezier(.2,1.4,.4,1);
    color:#1e3c72;
  }
  @keyframes cardIn{ from{ transform:translateY(50px) scale(.8); opacity:0;} to{ transform:none; opacity:1;} }
  #overlayCard .big{ font-size:3.4rem; margin-bottom:8px; }
  #overlayCard h2{ font-size:1.6rem; margin-bottom:8px; }
  #overlayCard p{ font-weight:600; opacity:.75; margin-bottom:20px; }
  #overlayCard .btn{ margin:4px; }

  /* confetti */
  .confetti{ position:fixed; width:10px; height:14px; top:-20px; z-index:11; border-radius:2px;
    animation:confFall linear forwards; pointer-events:none; }
  @keyframes confFall{ to{ transform:translateY(115vh) rotate(720deg); } }

  @media (max-width:760px){
    #gameArea{ gap:14px; }
    .board{ width:min(92vw, 340px); }
  }
</style>
</head>
<body>

<header>
  <h1>⚓ Sea Battle</h1>
  <a class="btn btn-menu" href="index.html">🏠 Menu</a>
</header>

<div id="status">Place your fleet! Tap a ship, then tap your board.</div>

<div id="gameArea">
  <div class="boardWrap">
    <div class="boardTitle"><span class="dot" style="background:#ffd93d"></span>Your Ocean</div>
    <div class="board" id="playerBoard"></div>
  </div>
  <div class="boardWrap" id="enemyWrap" style="display:none">
    <div class="boardTitle"><span class="dot" style="background:#ff6b6b"></span>Enemy Waters</div>
    <div class="board" id="enemyBoard"></div>
  </div>
</div>

<div id="dock">
  <div id="fleet"></div>
  <div id="dockButtons">
    <button class="btn btn-secondary" id="rotateBtn">🔄 Rotate: Across</button>
    <button class="btn btn-coral" id="randomBtn">🎲 Random</button>
    <button class="btn btn-primary" id="startBtn" disabled style="opacity:.5">⚔️ Battle!</button>
  </div>
</div>

<div id="overlay">
  <div id="overlayCard">
    <div class="big" id="ovEmoji">🏆</div>
    <h2 id="ovTitle">Victory!</h2>
    <p id="ovText">You sank the enemy fleet!</p>
    <button class="btn btn-primary" onclick="location.reload()">🔁 Play Again</button>
    <a class="btn btn-menu" href="index.html">🏠 Menu</a>
  </div>
</div>

<script>
(function(){
  const SIZE = 10;
  const SHIPS = [
    { name:'Carrier', len:5 },
    { name:'Battleship', len:4 },
    { name:'Cruiser', len:3 },
    { name:'Submarine', len:3 },
    { name:'Patrol', len:2 }
  ];

  const statusEl = document.getElementById('status');
  const playerBoardEl = document.getElementById('playerBoard');
  const enemyBoardEl = document.getElementById('enemyBoard');
  const enemyWrap = document.getElementById('enemyWrap');
  const dock = document.getElementById('dock');
  const fleetEl = document.getElementById('fleet');
  const rotateBtn = document.getElementById('rotateBtn');
  const randomBtn = document.getElementById('randomBtn');
  const startBtn = document.getElementById('startBtn');
  const overlay = document.getElementById('overlay');

  let horizontal = true;
  let selectedShip = null;         // index into SHIPS
  let phase = 'place';             // place | player | ai | over
  let playerGrid, enemyGrid;       // 2D arrays: 0 empty, shipId (1..5)
  let playerShots, enemyShots;     // 2D arrays: 0 none, 1 miss, 2 hit
  let playerShips, enemyShips;     // [{id,len,cells:[{r,c}],hits}]
  let aiQueue = [];                // AI hunt targets

  /* ---------- bubbles ---------- */
  for(let i=0;i<10;i++){
    const b = document.createElement('div');
    b.className='bubble';
    const s = 12 + Math.random()*38;
    b.style.width = b.style.height = s+'px';
    b.style.left = Math.random()*100+'vw';
    b.style.animationDuration = (9+Math.random()*14)+'s';
    b.style.animationDelay = (-Math.random()*14)+'s';
    document.body.appendChild(b);
  }

  /* ---------- helpers ---------- */
  const makeGrid = v => Array.from({length:SIZE}, ()=>Array(SIZE).fill(v));
  const inB = (r,c) => r>=0 && r<SIZE && c>=0 && c<SIZE;

  function shipCells(r,c,len,horiz){
    const cells=[];
    for(let i=0;i<len;i++) cells.push({ r: horiz?r:r+i, c: horiz?c+i:c });
    return cells;
  }
  function canPlace(grid,cells){
    return cells.every(p => inB(p.r,p.c) && grid[p.r][p.c]===0);
  }

  function buildBoard(el, onTap){
    el.innerHTML='';
    const cells=[];
    for(let r=0;r<SIZE;r++){
      cells.push([]);
      for(let c=0;c<SIZE;c++){
        const d = document.createElement('div');
        d.className='cell';
        d.style.setProperty('--d',(Math.random()*4)+'s');
        d.dataset.r=r; d.dataset.c=c;
        d.addEventListener('click', ()=>onTap(r,c));
        el.appendChild(d);
        cells[r].push(d);
      }
    }
    return cells;
  }

  let pCells = buildBoard(playerBoardEl, onPlayerBoardTap);
  let eCells = buildBoard(enemyBoardEl, onEnemyBoardTap);

  /* ---------- fleet dock ---------- */
  const chips=[];
  SHIPS.forEach((s,i)=>{
    const chip=document.createElement('div');
    chip.className='shipChip';
    for(let k=0;k<s.len;k++){ const seg=document.createElement('div'); seg.className='seg'; chip.appendChild(seg); }
    const nm=document.createElement('span'); nm.className='name'; nm.textContent=s.name; chip.appendChild(nm);
    chip.addEventListener('click', ()=>{
      if(chip.classList.contains('placed')) return;
      chips.forEach(c=>c.classList.remove('selected'));
      chip.classList.add('selected');
      selectedShip = i;
      setStatus('Placing '+s.name+' ('+s.len+') — tap your board.');
    });
    fleetEl.appendChild(chip);
    chips.push(chip);
  });

  rotateBtn.addEventListener('click', ()=>{
    horizontal = !horizontal;
    rotateBtn.textContent = '🔄 Rotate: ' + (horizontal ? 'Across' : 'Down');
  });

  function setStatus(t, color){
    statusEl.textContent = t;
    statusEl.style.color = color || '#1e3c72';
  }

  /* ---------- placement ---------- */
  function resetGame(){
    playerGrid = makeGrid(0); enemyGrid = makeGrid(0);
    playerShots = makeGrid(0); enemyShots = makeGrid(0);
    playerShips = []; enemyShips = []; aiQueue = [];
  }
  resetGame();

  function clearHover(){
    pCells.flat().forEach(c=>c.classList.remove('hoverOK','hoverBad'));
  }

  playerBoardEl.addEventListener('mousemove', e=>{
    if(phase!=='place' || selectedShip===null) return;
    const t = e.target.closest('.cell'); if(!t) return;
    clearHover();
    const cells = shipCells(+t.dataset.r, +t.dataset.c, SHIPS[selectedShip].len, horizontal);
    const ok = canPlace(playerGrid, cells);
    cells.forEach(p=>{ if(inB(p.r,p.c)) pCells[p.r][p.c].classList.add(ok?'hoverOK':'hoverBad'); });
  });
  playerBoardEl.addEventListener('mouseleave', clearHover);

  function onPlayerBoardTap(r,c){
    if(phase!=='place' || selectedShip===null) return;
    const s = SHIPS[selectedShip];
    const cells = shipCells(r,c,s.len,horizontal);
    if(!canPlace(playerGrid, cells)){ setStatus("Doesn't fit there — try another spot!", '#c0392b'); return; }
    placeShip(playerGrid, playerShips, selectedShip+1, cells);
    cells.forEach(p=>pCells[p.r][p.c].classList.add('ship'));
    chips[selectedShip].classList.remove('selected');
    chips[selectedShip].classList.add('placed');
    clearHover();
    selectedShip = null;
    checkReady();
  }

  function placeShip(grid, ships, id, cells){
    cells.forEach(p=>grid[p.r][p.c]=id);
    ships.push({ id, len:cells.length, cells, hits:0 });
  }

  function randomFleet(grid, ships){
    SHIPS.forEach((s,i)=>{
      let placed=false;
      while(!placed){
        const horiz = Math.random()<0.5;
        const r = Math.floor(Math.random()*SIZE);
        const c = Math.floor(Math.random()*SIZE);
        const cells = shipCells(r,c,s.len,horiz);
        if(canPlace(grid,cells)){ placeShip(grid,ships,i+1,cells); placed=true; }
      }
    });
  }

  randomBtn.addEventListener('click', ()=>{
    resetGame();
    pCells.flat().forEach(c=>c.className='cell');
    randomFleet(playerGrid, playerShips);
    playerShips.forEach(s=>s.cells.forEach(p=>pCells[p.r][p.c].classList.add('ship')));
    chips.forEach(c=>{ c.classList.add('placed'); c.classList.remove('selected'); });
    selectedShip=null;
    checkReady();
  });

  function checkReady(){
    if(playerShips.length===SHIPS.length){
      startBtn.disabled=false; startBtn.style.opacity='1';
      setStatus('Fleet ready! Hit ⚔️ Battle! to begin.');
    } else {
      setStatus('Tap the next ship, then tap your board. ('+playerShips.length+'/'+SHIPS.length+' placed)');
    }
  }

  startBtn.addEventListener('click', ()=>{
    if(playerShips.length!==SHIPS.length) return;
    randomFleet(enemyGrid, enemyShips);
    dock.style.display='none';
    enemyWrap.style.display='';
    playerBoardEl.classList.add('flat');
    phase='player';
    setStatus('Your turn — tap Enemy Waters to fire! 🎯');
  });

  /* ---------- battle ---------- */
  function onEnemyBoardTap(r,c){
    if(phase!=='player') return;
    if(playerShots[r][c]!==0) return;
    fire(true, r, c);
    if(phase==='player'){ /* game may have ended */ }
  }

  function fire(byPlayer, r, c){
    const grid   = byPlayer ? enemyGrid   : playerGrid;
    const shots  = byPlayer ? playerShots : enemyShots;
    const ships  = byPlayer ? enemyShips  : playerShips;
    const cellEls= byPlayer ? eCells      : pCells;

    const id = grid[r][c];
    if(id>0){
      shots[r][c]=2;
      cellEls[r][c].classList.add('hit');
      const ship = ships.find(s=>s.id===id);
      ship.hits++;
      const sunk = ship.hits===ship.len;
      if(sunk){
        ship.cells.forEach(p=>{ cellEls[p.r][p.c].classList.remove('hit'); cellEls[p.r][p.c].classList.add('sunk'); });
      }
      if(ships.every(s=>s.hits===s.len)){ endGame(byPlayer); return; }
      if(byPlayer){
        setStatus(sunk ? '💥 You sank their '+SHIPS[id-1].name+'! Go again!' : '🎯 Direct hit! Fire again!');
        // hit = another turn
      } else {
        if(sunk){
          setStatus('😱 They sank your '+SHIPS[id-1].name+'!', '#c0392b');
          aiQueue = aiQueue.filter(p=>playerGrid[p.r][p.c]!==id);
        } else {
          setStatus('💢 They hit your ship!', '#c0392b');
          [[r-1,c],[r+1,c],[r,c-1],[r,c+1]].forEach(([rr,cc])=>{
            if(inB(rr,cc) && enemyShots[rr][cc]===0) aiQueue.push({r:rr,c:cc});
          });
        }
        setTimeout(aiTurn, 750); // hit = AI goes again
      }
    } else {
      shots[r][c]=1;
      cellEls[r][c].classList.add('miss');
      if(byPlayer){
        setStatus('💦 Splash! Enemy is taking aim…');
        phase='ai';
        setTimeout(aiTurn, 800);
      } else {
        setStatus('💦 They missed! Your turn — fire away! 🎯');
        phase='player';
      }
    }
  }

  function aiTurn(){
    if(phase==='over') return;
    let r,c;
    // target mode
    while(aiQueue.length){
      const t = aiQueue.pop();
      if(enemyShots[t.r][t.c]===0){ r=t.r; c=t.c; break; }
    }
    // hunt mode: random with parity
    if(r===undefined){
      const open=[];
      for(let i=0;i<SIZE;i++) for(let j=0;j<SIZE;j++)
        if(enemyShots[i][j]===0 && (i+j)%2===0) open.push({r:i,c:j});
      if(!open.length){
        for(let i=0;i<SIZE;i++) for(let j=0;j<SIZE;j++)
          if(enemyShots[i][j]===0) open.push({r:i,c:j});
      }
      const p = open[Math.floor(Math.random()*open.length)];
      r=p.r; c=p.c;
    }
    fire(false, r, c);
  }

  /* ---------- end ---------- */
  function endGame(playerWon){
    phase='over';
    document.getElementById('ovEmoji').textContent = playerWon ? '🏆' : '🌊';
    document.getElementById('ovTitle').textContent = playerWon ? 'Victory!' : 'Fleet Sunk!';
    document.getElementById('ovText').textContent  = playerWon
      ? 'You sank the entire enemy fleet! Amazing shooting, Admiral!'
      : 'The enemy got your fleet this time. Ready for revenge?';
    overlay.classList.add('show');
    if(playerWon) confetti();
  }

  function confetti(){
    const colors=['#ff6b6b','#ffd93d','#6bffb8','#a78bfa','#ff9f43','#ff8fab','#4facfe'];
    for(let i=0;i<80;i++){
      const c=document.createElement('div');
      c.className='confetti';
      c.style.left=Math.random()*100+'vw';
      c.style.background=colors[Math.floor(Math.random()*colors.length)];
      c.style.animationDuration=(2+Math.random()*2.5)+'s';
      c.style.animationDelay=(Math.random()*1.2)+'s';
      c.style.transform='rotate('+Math.random()*360+'deg)';
      document.body.appendChild(c);
      setTimeout(()=>c.remove(), 6000);
    }
  }

  checkReady();
})();
</script>
</body>
</html>
