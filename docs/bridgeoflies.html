<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Bridge of Lies</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  color:#fff;overflow-x:hidden;-webkit-user-select:none;user-select:none;
  background:linear-gradient(180deg,#05102a 0%,#0b2a5e 38%,#123c7a 62%,#05102a 100%);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(circle at 16% 8%,rgba(0,229,255,.28),transparent 46%),
    radial-gradient(circle at 86% 14%,rgba(255,0,128,.24),transparent 44%),
    radial-gradient(circle at 50% 94%,rgba(120,0,255,.32),transparent 56%);
}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:7px 10px 22px}

/* ---------------- top ---------------- */
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.menu-btn{
  display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:#fff;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);
  padding:7px 12px;border-radius:999px;font-size:13px;font-weight:700;
  backdrop-filter:blur(8px);white-space:nowrap
}
.menu-btn:active{transform:scale(.95)}
.title{
  flex:1;text-align:center;font-weight:900;white-space:nowrap;line-height:1;
  font-size:clamp(13px,4.2vw,22px);letter-spacing:.5px;
  background:linear-gradient(180deg,#eafcff,#57e6ff 50%,#0aa6ff);
  -webkit-background-clip:text;background-clip:text;color:transparent
}
.strip{display:flex;gap:5px;margin-bottom:7px}
.chip{
  flex:1;text-align:center;padding:5px 2px;border-radius:10px;
  background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18)
}
.chip .k{font-size:8.5px;letter-spacing:1.3px;opacity:.7;font-weight:800}
.chip .v{font-size:clamp(12px,4vw,17px);font-weight:900;line-height:1.2}
.v-gold{color:#ffd83d}.v-safe{color:#7dffb0}.v-bad{color:#ff7a92}.v-info{color:#7de6ff}
.v.tick{animation:tickpulse .9s ease-in-out infinite alternate}
@keyframes tickpulse{from{opacity:.45}to{opacity:1}}

.qcard{
  background:linear-gradient(135deg,rgba(255,255,255,.17),rgba(255,255,255,.06));
  border:1px solid rgba(255,255,255,.26);border-radius:13px;padding:7px 11px;text-align:center;
  margin-bottom:6px
}
.qcard .lbl{font-size:8.5px;letter-spacing:2.2px;font-weight:800;color:#8ff6ff}
.qcard .q{font-size:clamp(13px,4.1vw,17px);font-weight:800;line-height:1.25}

/* ---------------- diamond board ---------------- */
.boardwrap{display:flex;justify-content:center}
.board{position:relative;width:100%}
.tile{
  position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;
  text-align:center;font-weight:800;line-height:1.05;overflow:hidden;padding:3px;
  color:#fff;border:2px solid rgba(255,255,255,.16);
  background:radial-gradient(circle at 34% 26%,#3c4a6d,#1b2440 72%,#131a30);
  box-shadow:0 3px 6px rgba(0,0,0,.55),inset 0 1px 2px rgba(255,255,255,.16);
  transition:transform .15s, box-shadow .2s;
  word-break:break-word;hyphens:auto
}
.tile span{display:block;width:100%}
.tile.dormant{
  background:radial-gradient(circle at 34% 26%,#5c6376,#343a4c 70%,#262b39);
  border-color:rgba(255,255,255,.09);
  box-shadow:0 3px 6px rgba(0,0,0,.5),inset 0 1px 2px rgba(255,255,255,.10)
}
.tile.justopened span{animation:reveal .5s ease}
@keyframes reveal{
  0%{opacity:0;transform:scale(.6)}
  60%{opacity:1;transform:scale(1.12)}
  100%{opacity:1;transform:scale(1)}
}
.tile.can{
  cursor:pointer;border-color:#ffd83d;z-index:5;
  background:radial-gradient(circle at 34% 26%,#4a5580,#181f3a 72%,#0c1020);
  box-shadow:0 0 8px rgba(255,216,61,.55),0 3px 6px rgba(0,0,0,.5)
}
.tile.can.near{animation:pulse 1.2s ease-in-out infinite alternate}
@keyframes pulse{
  from{box-shadow:0 0 7px rgba(255,216,61,.5),0 3px 6px rgba(0,0,0,.5)}
  to{box-shadow:0 0 18px rgba(255,216,61,.95),0 3px 6px rgba(0,0,0,.5)}
}
.tile.can:active{transform:scale(.92)}
.tile.truth{
  background:radial-gradient(circle at 34% 26%,#b7ffd4,#2ee06e 62%,#12a350);
  color:#04331a;border-color:rgba(200,255,220,.9);
  box-shadow:0 0 13px rgba(50,240,130,.65),0 3px 6px rgba(0,0,0,.45)
}
.tile.lie{
  background:#e00d2c;color:#fff;border-color:#ff8fa3;
  box-shadow:0 0 16px rgba(255,40,70,.85),0 3px 6px rgba(0,0,0,.45);
  letter-spacing:1px
}
.tile.lie.fresh{animation:shake .5s ease}
@keyframes shake{
  0%,100%{transform:translate(0,0)}20%{transform:translate(-4px,2px)}
  45%{transform:translate(4px,-2px)}70%{transform:translate(-3px,1px)}
}
.tile.safespot{
  background:radial-gradient(circle at 34% 26%,#bff0ff,#22b8e0 62%,#0b7ba0);
  color:#04283a;border-color:rgba(190,240,255,.9);
  box-shadow:0 0 13px rgba(60,210,255,.6),0 3px 6px rgba(0,0,0,.45)
}
.tile.endpt{
  background:radial-gradient(circle at 34% 26%,#ffe9a8,#f0b429 62%,#b07d0a);
  color:#3a2600;border-color:rgba(255,230,160,.9);
  box-shadow:0 0 14px rgba(255,190,60,.7),0 3px 6px rgba(0,0,0,.45)
}
.tile.here{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.85),0 0 20px rgba(255,255,255,.6);z-index:6}
.walker{
  position:absolute;z-index:8;pointer-events:none;
  width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;
  border-top:11px solid #fff;filter:drop-shadow(0 2px 4px rgba(0,0,0,.85));
  animation:bob .85s ease-in-out infinite alternate
}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-4px)}}

/* ---------------- controls ---------------- */
.hint{
  text-align:center;font-size:12px;opacity:.85;margin:9px 0 8px;min-height:32px;line-height:1.4
}
.hint b{color:#ffd83d}
.btn{
  width:100%;border:none;border-radius:13px;padding:11px 8px;font-weight:900;font-size:14px;
  cursor:pointer;color:#0d1f45;box-shadow:0 5px 0 rgba(0,0,0,.35);transition:transform .08s
}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn:disabled{opacity:.35;cursor:default}
.b-bank{background:linear-gradient(180deg,#ffe36b,#ffb01f)}
.b-go{background:linear-gradient(180deg,#8affc1,#20d17c)}
.b-pink{background:linear-gradient(180deg,#ff9ecb,#ff3d92);color:#fff}
.crow{display:flex;gap:8px}
.crow .btn{flex:1}

/* ---------------- overlay / toast ---------------- */
.ovl{position:fixed;inset:0;background:rgba(2,8,26,.9);backdrop-filter:blur(7px);
  display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.ovl.on{display:flex}
.card{
  background:linear-gradient(160deg,#123c7a,#05102a);border:2px solid rgba(255,255,255,.25);
  border-radius:22px;padding:22px 20px;max-width:410px;width:100%;text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.65);max-height:88vh;overflow-y:auto
}
.card h2{font-size:21px;margin-bottom:10px;color:#57e6ff;line-height:1.2}
.card p{font-size:13.5px;line-height:1.6;opacity:.93;margin-bottom:14px;text-align:left}
.card p.mid{text-align:center}
.toast{
  position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom));
  transform:translate(-50%,24px) scale(.6);opacity:0;
  padding:12px 20px;border-radius:15px;font-weight:900;font-size:16px;z-index:60;
  pointer-events:none;text-align:center;max-width:88vw;box-shadow:0 10px 30px rgba(0,0,0,.55)
}
.toast.good{background:linear-gradient(135deg,#20d17c,#0d7a3f)}
.toast.bad{background:linear-gradient(135deg,#ff3d92,#c4102b)}
.toast.info{background:linear-gradient(135deg,#22b8e0,#0b6f92)}
.toast.show{animation:tst 1.7s ease forwards}
@keyframes tst{
  0%{opacity:0;transform:translate(-50%,24px) scale(.6)}
  14%{opacity:1;transform:translate(-50%,0) scale(1.07)}
  24%,80%{opacity:1;transform:translate(-50%,0) scale(1)}
  100%{opacity:0;transform:translate(-50%,-16px) scale(.95)}
}
</style>
</head>

/* ==========================================================
   BOARD — a 6x6 grid turned 45° = rows of 1,2,3,4,5,6,5,4,3,2,1 = 36 circles.
   The four corners are not questions:
     (0,0) bottom = START            (5,5) top = SAFE CROSSING
     (5,0) left and (0,5) right = SAFE SPOTS, each exposes a lie
   That leaves 32 playing tiles: 22 truths and 10 lies, as in the board game.
   ========================================================== */
const N=6, N_LIES=10, MAX_STRIKES=3, PER_TRUTH=500, CROSS_BONUS=5000, TIME_LIMIT=300;
const START="0,0", EXIT="5,5", SAFE_L="5,0", SAFE_R="0,5";
const CORNERS=[START,EXIT,SAFE_L,SAFE_R];

let S={};
const $=id=>document.getElementById(id);
const K=(r,c)=>r+","+c;
const money=n=>"£"+Math.round(n).toLocaleString();
const clock=s=>Math.floor(s/60)+":"+String(Math.max(0,s)%60).padStart(2,"0");
function tick(){
  if(S.over || S.paused) return;
  if($("ovl").classList.contains("on")) return;      // not while a dialog is up
  S.left--; updateClock();
  if(S.left<=0){ S.left=0; updateClock(); timeUp(); }
}
function updateClock(){
  const el=$("timeV");
  el.textContent=(S.paused?"❚❚ ":"")+clock(S.left);
  el.className="v "+(S.paused?"v-info":(S.left<=30?"v-bad tick":(S.left<=60?"v-gold":"v-safe")));
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function esc(s){return String(s).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));}

function neighbours(r,c){
  const o=[];
  if(r+1<N)o.push([r+1,c]); if(c+1<N)o.push([r,c+1]);
  if(r-1>=0)o.push([r-1,c]); if(c-1>=0)o.push([r,c-1]);
  return o;
}
/* landing safely lights up every stone you can now touch */
function openAround(r,c){
  const opened=[];
  neighbours(r,c).forEach(([nr,nc])=>{
    const cell=S.cells[K(nr,nc)];
    if(!cell.open){ cell.open=true; opened.push(K(nr,nc)); }
  });
  return opened;
}
/* a plain shuffle of five downs and five rights clusters around the middle
   diagonal, so lean the walk to one side or the other for real variety */
function buildPath(){
  const bias=[0.18,0.3,0.42,0.5,0.58,0.7,0.82][Math.floor(Math.random()*7)];
  let d=5,r0=5; const mv=[];
  while(d+r0>0){
    let pD;
    if(!r0) pD=1; else if(!d) pD=0;
    else pD=(d*bias)/(d*bias + r0*(1-bias));
    if(Math.random()<pD){mv.push("D");d--;} else {mv.push("R");r0--;}
  }
  const path=[[0,0]]; let r=0,c=0;
  mv.forEach(m=>{ m==="D"?r++:c++; path.push([r,c]); });
  return path;
}

function newGame(){
  const cat=CATS[Math.floor(Math.random()*CATS.length)];
  const path=buildPath();
  const onPath={}; path.forEach(p=>onPath[K(p[0],p[1])]=true);

  const cells={};
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const k=K(r,c);
    cells[k]={r:r,c:c,corner:CORNERS.indexOf(k)>=0,lie:false,label:"",state:"hidden",
              open:CORNERS.indexOf(k)>=0};   // corners are landmarks, always on show
  }
  // lies only go on playing tiles that are off the guaranteed path
  const spare=Object.values(cells).filter(x=>!x.corner && !onPath[K(x.r,x.c)]);
  shuffle(spare);
  for(let i=0;i<N_LIES;i++) spare[i].lie=true;

  // every playing tile carries its wording from the start — the whole board is readable
  const T=shuffle(cat.truths.slice()), L=shuffle(cat.lies.slice());
  Object.values(cells).forEach(x=>{ if(!x.corner) x.label = x.lie ? L.pop() : T.pop(); });

  cells[START].state="truth";

  S={cat:cat, cells:cells, pos:[0,0], strikes:0, truths:0, pot:0,
     busy:false, over:false, left:TIME_LIMIT, paused:false,
     lastLie:null, justOpened:[], timer:S.timer};
  S.justOpened=openAround(0,0);        // only the two stones touching START are lit

  $("question").textContent=cat.q;
  if(S.timer) clearInterval(S.timer);
  S.timer=setInterval(tick,1000);
  updateClock();

  layout(); render();
  setHint("Only the two stones ahead are lit. <b>5:00</b> on the clock — step onto the one you believe is <b>true</b>.");
}

/* ---------------- layout: the biggest circles the screen allows ---------------- */
let DIM={d:34,dx:24,dy:24,w:320};
function layout(){
  const board=$("board");
  const W=board.clientWidth||320;
  const top=board.getBoundingClientRect().top;
  let avail=window.innerHeight - top - 132;      // leave room for the hint + bank button
  avail=Math.max(250,Math.min(avail, W*1.75, 660));
  const g=4;
  let best=null;
  for(let d=Math.floor((W-5*g)/6); d>=16; d--){
    const dx=(W-d)/10, dy=(avail-d)/10;
    if(dy<dx) continue;                          // never narrower than a square diamond
    if(2*dx < d+g) continue;                     // side by side within a row
    if(dx*dx+dy*dy < (d+g)*(d+g)) continue;      // diagonal neighbours
    best={d:d,dx:dx,dy:dy}; break;
  }
  if(!best){ const d=Math.min(38,(W-5*g)/6); best={d:d,dx:(W-d)/10,dy:(W-d)/10}; }
  DIM={d:best.d,dx:best.dx,dy:best.dy,w:W};
  board.style.height=(10*best.dy+best.d)+"px";
}
/* measure the wording and shrink it until it really fits inside the circle */
const MC=document.createElement("canvas").getContext("2d");
const FCACHE={};
function fontFor(text,d,max){
  const cap=max||11.5, ck=text+"|"+d+"|"+cap;
  if(FCACHE[ck]!==undefined) return FCACHE[ck];
  const inner=d-11;                                  // padding + border, both sides
  const words=String(text).split(" ");
  let out=5;
  for(let f=cap; f>=5; f-=0.25){
    MC.font="800 "+f+"px -apple-system,system-ui,sans-serif";
    const sp=MC.measureText(" ").width;
    const w=words.map(x=>MC.measureText(x).width);
    if(Math.max.apply(null,w)>inner) continue;        // a single word must fit on its line
    let lines=1,cur=0;
    for(let i=0;i<w.length;i++){
      if(i===0){cur=w[i];}
      else if(cur+sp+w[i]<=inner){cur+=sp+w[i];}
      else{lines++;cur=w[i];}
    }
    if(lines*f*1.10<=inner+3){ out=f; break; }        // and the stack of lines must fit too
  }
  FCACHE[ck]=out; return out;
}

/* ---------------- render ---------------- */
/* every stone touching ANY proven stone stays live, so you can always
   go back and branch off somewhere else on the safe ground you own */
function moves(){
  if(S.busy||S.over) return [];
  const seen={}, out=[];
  Object.values(S.cells).forEach(x=>{
    if(x.state!=="truth") return;                       // proven ground only
    neighbours(x.r,x.c).forEach(([nr,nc])=>{
      const k=K(nr,nc), n=S.cells[k];
      if(seen[k] || n.state==="lie" || n.state==="truth") return;
      seen[k]=1; out.push([nr,nc]);
    });
  });
  return out;
}
function render(){
  $("lieV").textContent=S.strikes+"/"+MAX_STRIKES;
  $("truthV").textContent=S.truths;
  $("potV").textContent=money(S.pot);

  const board=$("board"); board.innerHTML="";
  const can={}; moves().forEach(([r,c])=>{ can[K(r,c)]=true; S.cells[K(r,c)].open=true; });
  const near={}; neighbours(S.pos[0],S.pos[1]).forEach(([r,c])=>{ if(can[K(r,c)]) near[K(r,c)]=true; });
  const hereK=K(S.pos[0],S.pos[1]);

  Object.values(S.cells).forEach(x=>{
    const k=K(x.r,x.c), el=document.createElement("div");
    el.className="tile";
    let text="", big=false;

    if(k===START){ el.classList.add("endpt"); text="START"; big=true; }
    else if(k===EXIT){ el.classList.add("endpt"); text="CROSS"; big=true; }
    else if(k===SAFE_L||k===SAFE_R){ el.classList.add("safespot"); text="SAFE"; big=true; }
    else if(x.state==="lie"){ el.classList.add("lie"); if(k===S.lastLie)el.classList.add("fresh"); text="LIE"; big=true; }
    else if(x.state==="truth"){ el.classList.add("truth"); text=x.label; }
    else if(x.open){ text=x.label; }
    else { el.classList.add("dormant"); text=""; }        // still in the dark

    if(S.justOpened && S.justOpened.indexOf(k)>=0) el.classList.add("justopened");

    if(k===hereK) el.classList.add("here");
    if(can[k]){
      el.classList.add("can");
      if(near[k]) el.classList.add("near");            // one step from where you stand
      el.addEventListener("click",()=>step(x.r,x.c));
    }

    if(text){
      const fs = fontFor(text, DIM.d, big ? Math.max(8,DIM.d*0.26) : 11.5);
      el.style.fontSize=fs.toFixed(1)+"px";
      el.innerHTML="<span>"+esc(text)+"</span>";
    }

    el.style.width=el.style.height=DIM.d+"px";
    el.style.left=(DIM.w/2 + (x.c-x.r)*DIM.dx - DIM.d/2)+"px";
    el.style.top =((10-(x.r+x.c))*DIM.dy)+"px";
    board.appendChild(el);
  });

  const w=document.createElement("div");
  w.className="walker";
  w.style.left=(DIM.w/2 + (S.pos[1]-S.pos[0])*DIM.dx - 8)+"px";
  w.style.top =((10-(S.pos[0]+S.pos[1]))*DIM.dy - 15)+"px";
  board.appendChild(w);

  $("bBank").disabled=S.busy||S.over||S.pot<=0;
  $("bBank").textContent=S.pot>0 ? ("BANK "+money(S.pot)+" & WALK AWAY") : "BANK & WALK AWAY";
}

function setHint(html){$("hint").innerHTML=html;}
function listMoves(){
  const names=moves().map(([r,c])=>{
    const k=K(r,c), x=S.cells[k];
    if(k===EXIT) return "the crossing";
    if(k===START) return "the start";
    if(x.corner) return "a safe spot";
    return x.state==="truth" ? "✔ "+x.label : x.label;
  });
  if(!names.length) return "";
  if(names.length>3) return "<b>"+names.length+" stones</b> are open — take any of them.";
  return "Open: <b>"+names.join("</b> · <b>")+"</b>";
}
function toast(msg,kind){
  const el=$("toast"); el.textContent=msg;
  el.className="toast "+(kind||"good"); void el.offsetWidth; el.classList.add("show");
}

/* ---------------- play ---------------- */
function step(r,c){
  if(S.busy||S.over) return;
  if(!moves().some(m=>m[0]===r&&m[1]===c)) return;
  const k=K(r,c), x=S.cells[k];
  if(S.paused){ S.paused=false; updateClock(); }      // choosing restarts the clock

  if(k===EXIT){ S.pos=[r,c]; win(); return; }

  if(k===SAFE_L||k===SAFE_R){
    S.pos=[r,c]; S.busy=true; x.state="truth";        // a safe stone counts as proven ground
    S.justOpened=openAround(r,c);
    S.paused=true; updateClock();                     // and it stops the clock
    render();
    const found=exposeALie();
    toast(found?"SAFE — clock stopped, a lie exposed!":"SAFE — the clock stops","info");
    setTimeout(()=>{ S.busy=false; render();
      setHint("❚❚ <b>Clock stopped</b> — it restarts the moment you choose."+
              (found?"<br>The board has given up a lie.":"")); },1000);
    return;
  }

  S.busy=true;                                    // an untested stone
  if(x.lie){
    x.state="lie"; x.open=true; S.lastLie=k; S.strikes++; S.justOpened=[];
    S.pot=Math.floor(S.pot/2/50)*50;              // a lie slashes the bank
    render();
    toast(S.strikes>=MAX_STRIKES?"THREE LIES — YOU'RE OUT!":"THAT'S A LIE!","bad");
    setTimeout(()=>{
      if(S.strikes>=MAX_STRIKES){ lose(); return; }
      S.busy=false; render();
      const left=MAX_STRIKES-S.strikes;
      setHint("The stone collapses — bank slashed to <b>"+money(S.pot)+"</b>. "+
              left+" "+(left===1?"life":"lives")+" left. "+listMoves());
    },1400);
  }else{
    x.state="truth"; S.pos=[r,c]; S.truths++; S.pot+=PER_TRUTH;
    S.justOpened=openAround(r,c);                 // the stones you can now touch light up
    render();
    toast("TRUE — +"+money(PER_TRUTH),"good");
    setTimeout(()=>{ S.busy=false; render(); setHint(listMoves()); },700);
  }
}

function exposeALie(){
  const hidden=Object.values(S.cells).filter(x=>x.lie && x.state==="hidden");
  if(!hidden.length) return false;
  const pick=hidden[Math.floor(Math.random()*hidden.length)];
  pick.state="lie"; pick.open=true; S.lastLie=K(pick.r,pick.c);
  render();
  return true;
}
function revealAll(){
  Object.values(S.cells).forEach(x=>{ x.open=true; if(!x.corner) x.state = x.lie ? "lie" : "truth"; });
  S.lastLie=null; S.justOpened=[];
}

function bank(){
  if(S.busy||S.over||S.pot<=0) return;
  S.over=true; revealAll(); render();
  overlay("💰 BANKED "+money(S.pot),
    "<p class='mid'>You walked off the bridge with <b>"+money(S.pot)+"</b> from "+S.truths+
    " truths"+(S.strikes?" and "+S.strikes+" "+(S.strikes===1?"lie":"lies"):"")+".</p>"+
    "<p class='mid'>The board is open — green was true, red was a lie.</p>",
    [{l:"PLAY AGAIN",c:"b-go",f:()=>{closeOverlay();newGame();}}]);
}
function win(){
  S.over=true; S.pot+=CROSS_BONUS; revealAll(); render();
  overlay("🏆 YOU CROSSED THE BRIDGE!",
    "<p class='mid'>Safe on the far side with <b>"+money(S.pot)+"</b><br>"+
    S.truths+" truths &times; "+money(PER_TRUTH)+" plus a "+money(CROSS_BONUS)+" crossing bonus</p>"+
    "<p class='mid'>Lies stepped on: <b>"+S.strikes+"</b> &nbsp;·&nbsp; Time left: <b>"+clock(S.left)+"</b></p>"+
    "<p class='mid'><i>"+esc(S.cat.q)+"</i></p>",
    [{l:"PLAY AGAIN",c:"b-go",f:()=>{closeOverlay();newGame();}}]);
}
function timeUp(){
  if(S.over) return;
  S.over=true; revealAll(); render();
  overlay("⏰ TIME'S UP",
    "<p class='mid'>Five minutes gone and you were still on the bridge, so the "+
    money(S.pot)+" goes with it.</p>"+
    "<p class='mid'>You had found <b>"+S.truths+"</b> truths. Next time, bank before the clock beats you.</p>",
    [{l:"TRY AGAIN",c:"b-pink",f:()=>{closeOverlay();newGame();}}]);
}
function lose(){
  S.over=true; revealAll(); render();
  overlay("💥 THREE LIES — THE BRIDGE WINS",
    "<p class='mid'>Three lies and you are off the bridge with nothing. You had found <b>"+
    S.truths+"</b> truths.</p>"+
    "<p class='mid'>The board is open — the green stones were the way across.</p>",
    [{l:"TRY AGAIN",c:"b-pink",f:()=>{closeOverlay();newGame();}}]);
}

/* ---------------- overlay ---------------- */
function overlay(title,body,buttons){
  const c=$("card");
  c.innerHTML="<h2>"+title+"</h2>"+body;
  const row=document.createElement("div"); row.className="crow";
  buttons.forEach(b=>{
    const el=document.createElement("button");
    el.className="btn "+(b.c||"b-go"); el.textContent=b.l;
    el.addEventListener("click",b.f); row.appendChild(el);
  });
  c.appendChild(row);
  $("ovl").classList.add("on");
}
function closeOverlay(){$("ovl").classList.remove("on");}

/* ---------------- events ---------------- */
$("bBank").addEventListener("click",bank);
let rt=null;
window.addEventListener("resize",()=>{
  clearTimeout(rt); rt=setTimeout(()=>{ if(S.cells){layout();render();} },120);
});

/* ---------------- start ---------------- */
newGame();
overlay("BRIDGE OF LIES",
  "<p>The diamond hides <b>22 truths and 10 lies</b>, and there is always a safe path across. "+
  "Only the <b>two stones ahead of you</b> show their answer — the rest stay dark until you "+
  "reach them. Every safe landing lights up the stones it touches.</p>"+
  "<p>Work your way up to the crossing at the top. <b>Every stone touching ground you have "+
  "already proven stays live</b>, so you can always drop back and branch off somewhere else.</p>"+
  "<p>✅ Each truth banks <b>"+money(PER_TRUTH)+"</b><br>"+
  "💀 A lie turns the stone red and <b>halves your bank</b><br>"+
  "🛑 <b>Three lies and you are out</b><br>"+
  "🔷 The <b>SAFE</b> stones left and right expose a lie <i>and stop the clock</i><br>"+
  "⏰ You have <b>5 minutes</b> to get across<br>"+
  "🏁 Reach <b>CROSS</b> at the top for a "+money(CROSS_BONUS)+" bonus</p>",
  [{l:"STEP ON",c:"b-go",f:closeOverlay}]);
})();
</script>
</body>
