// season start: credit league money + sponsorship + pending prizes, clear debt
// Jeevan's rule: a club whose inherited wage bill is IMPOSSIBLY far over its
// budget (>150% — e.g. Tamworth at 216%) gets a one-off reality trim: every
// player -5 rating and wages -30%. Ordinary overspenders (Wrexham etc, up to
// ~135%) are untouched — grace + downward swaps handle those. Once per career.
function normalizeOverspenders(){
  if(S.osFix) return;
  S.osFix=1;
  S.world.forEach(function(dv,ti){
    dv.clubs.forEach(function(c,ci){
      if(!c.fin) return;
      var bill=0; c.sq.forEach(function(p){ bill+=(p.w||wageOf(p.r)); });
      if(bill<=wageBudgetOf(ti,ci)*1.5) return;
      c.sq.forEach(function(p){ p.r=Math.max(30,p.r-5); p.w=Math.round(wageOf(p.r)*0.7); p.ask=null; });
      if(typeof invalidateSquadCaches==="function") invalidateSquadCaches(ti,ci);
    });
  });
}
function seasonStartFinance(){
  normalizeOverspenders();
  _calibCache={}; _revAvgCache={};
  S.world.forEach(function(dv,ti){
    dv.clubs.forEach(function(c,ci){
      if(!c.fin) return;
      var p=revenueParts(ti,ci);
      c.fin.expandPct=0;
      c.fin.bal+=Math.round(p.league+p.sponsor+(c.fin.pend||0));
      var credit={ league:Math.round(p.league), sponsor:Math.round(p.sponsor), prize:Math.round(c.fin.pend||0) };
      c.fin.pend=0;
      // per-match AI bookkeeping constants
      var md=S.season.divs[ti].sched.length;
      var wk=clubBillW(c)*52/md, admin=FIN.adminShare*annualRevenue(ti,ci)/md;
      c.fin.mHome=Math.round(c.fin.cap*0.75*p.ticket - c.fin.cap*1.2 - wk - admin);
      c.fin.mAway=Math.round(-0.02*divAvgAnnualWages(ti)/md*10 - wk - admin);
      if(ti===S.myTier&&ci===S.myIdx){
        S.season.fin={ rev:{league:credit.league,sponsor:credit.sponsor,prize:credit.prize,gate:0},
                       exp:{wages:0,ops:0,admin:0,staff:0,stadium:0}, last:null };
      }
    });
  });
}
// WEEKLY LEDGER: wages, overheads and staff are charged once per calendar week
// no matter how many games (league Saturday + midweek cup = ONE wage charge)
function chargeWeeksUpTo(D){
  if(!S.season.fin) return {wages:0,admin:0,staff:0};
  var lw=S.season.lw||40, sf=S.season.fin, fin=myFin();
  var wWages=Math.round(myBill()*52/lw);
  var wAdmin=Math.round(FIN.overheadShare*annualRevenue(S.myTier,S.myIdx)/lw);
  var wStaff=Math.round(staffWeekly()*52/lw);
  var tot={wages:0,admin:0,staff:0};
  var endWk=Math.floor(Math.max(0,D)/7);
  S.season.wkCharged=S.season.wkCharged||{};
  for(var wk=0;wk<=endWk;wk++){
    if(S.season.wkCharged[wk]) continue;
    S.season.wkCharged[wk]=1;
    fin.bal-=wWages+wAdmin+wStaff;
    sf.exp.wages+=wWages; sf.exp.admin+=wAdmin; sf.exp.staff=(sf.exp.staff||0)+wStaff;
    tot.wages+=wWages; tot.admin+=wAdmin; tot.staff+=wStaff;
  }
  return tot;
}
// my club's matchday cashflow: gate & ops per game, weekly costs via the ledger
function matchFinance(f){
  if(!S.season.fin||f.comp==="F") return; // friendlies: quiet books for now
  var fin=myFin(), sf=S.season.fin;
  var isCup=f.comp==="EC"||f.comp==="LC"||f.comp==="EU";
  var gate=0, ops=0, att=0, occ=0;
  if(f.home){
    var posF=1-(myPos()-1)/(S.world[S.myTier].clubs.length-1);
    occ=Math.max(0.4,Math.min(1,(isCup?0.72:0.62)+0.30*posF+rnd(-0.05,0.05)));
    att=Math.round(fin.cap*occ);
    gate=Math.round(att*revenueParts(S.myTier,S.myIdx).ticket);
    ops=Math.round(fin.cap*1.2);
  } else {
    ops=Math.round(0.02*divAvgAnnualWages(S.myTier)/(S.season.lw||40)*10);
  }
  fin.bal+=gate-ops;
  sf.rev.gate+=gate; sf.exp.ops+=ops;
  var wk=chargeWeeksUpTo(f.date!=null?f.date:0);
  var wkTot=wk.wages+wk.admin+wk.staff;
  sf.last={ opp:M?M.oppName:"", home:!!f.home, cup:isCup, gate:gate, att:att, occ:occ, ops:ops,
            wkWages:wk.wages, wkAdmin:wk.admin, wkStaff:wk.staff, wkCharged:wkTot>0,
            net:gate-ops-wkTot };
  // stadium build progresses with each HOME game — a new section opens
  if(f.home&&fin.build){
    var add=Math.min(fin.build.per,fin.build.left);
    fin.cap+=add; fin.build.left-=add;
    if(fin.build.left<=0) fin.build=null;
    _calibCache={};
    sf.last.built=add;
  }
}
// prizes & parachutes recorded at season end, paid at next season start
function seasonPrizes(res){
  S.world.forEach(function(dv,ti){
    var A=divAvgAnnualWages(ti), r=res[ti];
    dv.clubs.forEach(function(c,ci){
      if(!c.fin) return;
      if(ci===r.champion) c.fin.pend+=Math.round(0.35*A);
      else if(r.up.indexOf(ci)!==-1) c.fin.pend+=Math.round(0.20*A);
      if(r.down.indexOf(ci)!==-1&&ti<S.world.length-1){
        var Alow=divAvgAnnualWages(Math.min(ti+1,S.world.length-1));
        c.fin.pend+=Math.round(0.5*Math.max(0,A-Alow)); // parachute payment
      }
    });
  });
}
function debtBlocked(){ return myFin().bal < -debtFloor(); }

// ---------- stadium expansion ----------
// season-start capacity — the base every percentage is measured against
function expandBase(){
  var fin=myFin();
  return Math.round((fin.cap+(fin.build?fin.build.left:0))/(1+fin.expandPct));
}
function expandStadium(seats){
  var fin=myFin();
  var cost=seats*FIN.seatCost;
  var base=expandBase();
  if((fin.expandPct+seats/base)>FIN.maxExpandPct+1e-9){
    showModal('<h2>Too fast</h2><p class="small">The council will only approve expansion of up to '+Math.round(FIN.maxExpandPct*100)+'% of capacity per season.</p><button class="btn secondary" onclick="hideModal()">OK</button>'); return;
  }
  if(fin.bal-cost<-debtFloor()){
    showModal('<h2>Can’t afford it</h2><p class="small">That would take you beyond your debt limit of '+fmtMoney(debtFloor())+'.</p><button class="btn secondary" onclick="hideModal()">OK</button>'); return;
  }
  fin.bal-=cost;
  fin.expandPct+=seats/base;
  // built in stages: a section opens after each of your next ~3 home games
  if(!fin.build) fin.build={left:0,per:0};
  fin.build.left+=seats;
  fin.build.per+=Math.ceil(seats/3);
  if(S.season.fin) S.season.fin.exp.stadium+=cost;
  save(); render();
}
function confirmExpand(seats){
  showModal('<h2>🏗️ Expand the stadium?</h2>'
    +'<p class="small" style="margin:8px 0;">+'+seats.toLocaleString()+' seats for '+fmtMoney(seats*FIN.seatCost)+'.<br>Built in stages — new sections open over your next few home games. Bigger gates once open, and sponsors pay more for a bigger stage (from next season).</p>'
    +'<button class="btn" onclick="expandStadium('+seats+')">Build it</button>'
    +'<button class="btn secondary" onclick="hideModal()">Not now</button>');
}

// ============================================================
// PHASE 2.6 — PLAYER CONTRACTS & RETIREMENTS
// Contracts run in whole seasons (all end at season end). Wages are
// locked at signing. Renegotiate inside the final 2 years — longer
// deals come cheaper per week. Older players may announce retirement
// late in the season (34+, keepers hang on to ~40). Player club only.
// ============================================================
function initContracts(){
  S.world.forEach(function(dv){
    dv.clubs.forEach(function(c){
      c.sq.forEach(function(p){
        if(!p.a) p.a=ri(19,33);
        if(p.w==null) p.w=wageOf(p.r);
        if(p.yrs==null) p.yrs=pick([1,2,2,3,3,4]);
      });
    });
  });
}
// wages now come from contracts
function myBill(){ var b=0; myClub().sq.forEach(function(p){ b+=(p.w!=null?p.w:wageOf(p.r)); }); return b; }
function clubBillW(club){ var b=0; club.sq.forEach(function(p){ b+=(p.w!=null?p.w:wageOf(p.r)); }); return b; }
function pWage(p){ return p.w!=null?p.w:wageOf(p.r); }

// ---------- renegotiation ----------
function canRenegotiate(p){ return p.yrs<=2&&!p.ret; }
// his ask is rolled ONCE per negotiation window and cached — no re-roll shopping
function askBase(p){
  if(!p.ask) p.ask=Math.round(rnd(1.02,1.18)*100)/100;
  return Math.max(pWage(p), wageOf(p.r))*p.ask;
}
function askForLength(p,L){
  return Math.round(askBase(p)*(1.15-0.05*L)/50)*50; // 1yr: 110% · 5yr: 90%
}
function applyContract(p,w,L){
  var pre=myBill();
  p.w=w; p.yrs=L; p.ask=null; p.nego=null; p.counter=null;
  // a raise may take you over budget — same rule as signings: release before
  // your next match (afterSignOvershoot sets the block + the release target)
  if(typeof afterSignOvershoot==="function") afterSignOvershoot(pre);
}
function contractBudgetErr(p,newW){
  var pre=myBill(), nb=pre-pWage(p)+newW, cap=myCap();
  if(newW<=pWage(p)||nb<=cap) return null; // cuts & within-budget raises: always fine
  // over-budget raise is allowed IF releases could still fix your bill afterwards
  var sim=myClub().sq.map(function(q){ return q===p?{n:q.n,pos:q.pos,r:q.r,w:newW}:q; });
  var target=pre>cap?Math.max(cap,pre-0.01):cap;
  if(!canReachBill(sim,target))
    return 'Even after releasing players, this deal would leave your wage bill stuck over budget — trim the squad first.';
  return null;
}
// offering terms doesn't mean he signs: accept / reviewing / counter-offer
function offerContract(pi,L){
  var p=myClub().sq[pi]; if(!p||!canRenegotiate(p)||p.nego) return;
  var w=askForLength(p,L);
  var err=contractBudgetErr(p,w);
  if(err){ showModal('<h2>Can’t afford it</h2><p class="small">'+err+'</p><button class="btn secondary" onclick="hideModal()">OK</button>'); return; }
  var roll=Math.random();
  if(roll<0.60){
    applyContract(p,w,L);
    showModal('<h2>✍️ Signed!</h2><p class="small">'+esc(p.n)+' agrees a '+L+'-year deal at '+fmtMoney(w)+'/wk.</p><button class="btn" onclick="hideModal()">Great</button>');
  } else if(roll<0.85){
    p.nego={ w:w, L:L, at:playedLeague()+1 };
    showModal('<h2>🤔 He’s thinking it over</h2><p class="small">'+esc(p.n)+' and his agent are reviewing your '+L+'-year offer. You’ll hear back after the next match.</p><button class="btn" onclick="hideModal()">OK</button>');
  } else {
    p.counter={ w:Math.round(w*rnd(1.05,1.14)/50)*50, L:L };
    showModal('<h2>↩️ Counter-offer</h2><p class="small">'+esc(p.n)+' declines, but his agent counters: <b>'+fmtMoney(p.counter.w)+'/wk</b> over '+L+' years. Open his contract to accept or walk away.</p><button class="btn" onclick="hideModal();render()">OK</button>');
  }
  save();
}
function acceptCounter(pi){
  var p=myClub().sq[pi]; if(!p||!p.counter) return;
  var err=contractBudgetErr(p,p.counter.w);
  if(err){ showModal('<h2>Can’t afford it</h2><p class="small">'+err+'</p><button class="btn secondary" onclick="hideModal()">OK</button>'); return; }
  applyContract(p,p.counter.w,p.counter.L);
  hideModal(); save(); render();
}
function rejectCounter(pi){
  var p=myClub().sq[pi]; if(!p) return;
  p.counter=null; p.negoLock=S.yr; // talks collapse until next season
  hideModal(); save(); render();
}
// pending reviews resolve after your next match (returns true if news shown)
function resolveContractNews(){
  var shown=false;
  myClub().sq.forEach(function(p){
    if(shown||!p.nego||playedLeague()<p.nego.at) return;
    var o=p.nego; p.nego=null; shown=true;
    if(Math.random()<0.70&&!contractBudgetErr(p,o.w)){
      applyContract(p,o.w,o.L);
      showModal('<h2>✍️ Deal done</h2><p class="small">'+esc(p.n)+' has signed the '+o.L+'-year deal at '+fmtMoney(o.w)+'/wk.</p><button class="btn" onclick="hideModal()">Great</button>');
    } else {
      p.counter={ w:Math.round(o.w*rnd(1.05,1.14)/50)*50, L:o.L };
      showModal('<h2>↩️ He wants more</h2><p class="small">'+esc(p.n)+' turns it down but counters: <b>'+fmtMoney(p.counter.w)+'/wk</b> over '+o.L+' years.</p><button class="btn" onclick="hideModal();render()">OK</button>');
    }
    save();
  });
  return shown;
}
function negotiateModal(pi){
  var p=myClub().sq[pi]; if(!p) return;
  if(p.ret){
    showModal('<h2>'+esc(p.n)+'</h2><p class="small">He’s retiring at the end of the season — his mind is made up.</p><button class="btn secondary" onclick="hideModal()">OK</button>'); return;
  }
  if(p.yrs>2){
    showModal('<h2>'+esc(p.n)+'</h2><p class="small">'+p.yrs+' years left on his deal — contracts can only be renegotiated inside the final 2 years.</p><button class="btn secondary" onclick="hideModal()">OK</button>'); return;
  }
  if(p.negoLock===S.yr){
    showModal('<h2>'+esc(p.n)+'</h2><p class="small">Talks collapsed after you rejected his counter — he won’t discuss terms again until next season.</p><button class="btn secondary" onclick="hideModal()">OK</button>'); return;
  }
  if(p.nego){
    showModal('<h2>🤔 '+esc(p.n)+'</h2><p class="small">He’s still considering your '+p.nego.L+'-year offer of '+fmtMoney(p.nego.w)+'/wk — you’ll hear after the next match.</p><button class="btn secondary" onclick="hideModal()">OK</button>'); return;
  }
  if(p.counter){
    showModal('<h2>↩️ Counter-offer</h2>'
      +'<div class="small" style="margin:6px 0;">'+esc(p.n)+' wants <b>'+fmtMoney(p.counter.w)+'/wk</b> over '+p.counter.L+' years (you offered '+fmtMoney(askForLength(p,p.counter.L))+').</div>'
      +'<button class="btn" onclick="acceptCounter('+pi+')">✍️ Accept his terms</button>'
      +'<button class="btn danger" onclick="rejectCounter('+pi+')">Walk away (no talks till next season)</button>'
      +'<button class="btn secondary" onclick="hideModal()">Decide later</button>');
    return;
  }
  var h='<h2>📄 '+esc(p.n)+'</h2>'
    +'<div class="small" style="margin:6px 0;">'+p.pos.join("·")+' · rating '+p.r+' · age '+p.a+'<br>Current: '+fmtMoney(pWage(p))+'/wk, '+p.yrs+' year'+(p.yrs>1?'s':'')+' left</div>'
    +'<div class="small" style="margin-bottom:6px;">His ask — longer deals come cheaper per week. He may accept, mull it over, or counter:</div>';
  for(var L=1;L<=5;L++){
    var w=askForLength(p,L);
    var diff=w-pWage(p);
    h+='<div class="player-card" onclick="offerContract('+pi+','+L+')">'
      +'<span class="pc-pos">'+L+'yr</span>'
      +'<span class="pc-name">'+fmtMoney(w)+'/wk <span class="small '+(diff>0?"red":"green")+'">('+(diff>=0?"+":"−")+fmtMoney(Math.abs(diff))+')</span></span>'
      +'<span class="small">Offer ➜</span></div>';
  }
  h+='<button class="btn secondary" onclick="customOfferModal('+pi+')">✏️ Make my own offer</button>'
    +'<button class="btn secondary" onclick="hideModal()">Leave it</button>';
  showModal(h);
}
// ---------- custom offer: pick your own length + weekly wage ----------

function coPickLen(L){

}
function customOfferModal(pi){
  var p=myClub().sq[pi]; if(!p) return;
  var h='<h2>✏️ Your offer to '+esc(p.n)+'</h2>'
    +'<div class="small" style="margin:6px 0;">Current: '+fmtMoney(pWage(p))+'/wk · e.g. his 3-year ask: '+fmtMoney(askForLength(p,3))+'/wk</div>'
    +'<div class="small" style="margin-bottom:4px;">Contract length</div>'
    +'<div class="row">'+[1,2,3,4,5].map(function(L){return '<button class="btn secondary mini co-len" data-l="'+L+'" onclick="coPickLen('+L+')">'+L+'yr</button>';}).join('')+'</div>'
    +'<div class="small" style="margin:10px 0 4px;">Wage per week (£)</div>'

    +'<button class="btn secondary" onclick="negotiateModal('+pi+')">Back</button>';

}
function submitCustomOffer(pi){
  var p=myClub().sq[pi]; if(!p||!canRenegotiate(p)||p.nego||p.negoLock===S.yr) return;
  var w=Math.round((parseInt(el("co_wage").value,10)||0)/50)*50, L=_coLen;
  if(w<50){ showModal('<h2>Hmm</h2><p class="small">Enter a weekly wage of at least £50.</p><button class="btn secondary" onclick="customOfferModal('+pi+')">Back</button>'); return; }

  if(err){ showModal('<h2>Can’t afford it</h2><p class="small">'+esc(err)+'</p><button class="btn secondary" onclick="hideModal()">OK</button>'); return; }
  var ratio=w/askForLength(p,L), roll=Math.random();
  if(ratio>=1){                       // met or beat his ask
    if(roll<0.85){ applyContract(p,w,L); showModal('<h2>✍️ Signed!</h2><p class="small">'+esc(p.n)+' agrees a '+L+'-year deal at '+fmtMoney(w)+'/wk.</p><button class="btn" onclick="hideModal();render()">Great</button>'); }
    else { p.nego={w:w,L:L,at:playedLeague()+1}; showModal('<h2>🤔 He’s thinking it over</h2><p class="small">You’ll hear back after the next match.</p><button class="btn" onclick="hideModal()">OK</button>'); }
  } else if(ratio>=0.9){              // a little light
    if(roll<0.35){ applyContract(p,w,L); showModal('<h2>✍️ Signed!</h2><p class="small">'+esc(p.n)+' accepts your '+L+'-year offer of '+fmtMoney(w)+'/wk.</p><button class="btn" onclick="hideModal();render()">Great</button>'); }
    else if(roll<0.65){ p.nego={w:w,L:L,at:playedLeague()+1}; showModal('<h2>🤔 He’s thinking it over</h2><p class="small">You’ll hear back after the next match.</p><button class="btn" onclick="hideModal()">OK</button>'); }
    else { p.counter={ w:Math.round(askForLength(p,L)*rnd(1.0,1.05)/50)*50, L:L }; showModal('<h2>↩️ Counter-offer</h2><p class="small">'+esc(p.n)+' counters: <b>'+fmtMoney(p.counter.w)+'/wk</b> over '+L+' years. Open his contract to accept or walk away.</p><button class="btn" onclick="hideModal();render()">OK</button>'); }
  } else if(ratio>=0.75){             // clearly light
    if(roll<0.05){ applyContract(p,w,L); showModal('<h2>✍️ Signed!</h2><p class="small">Bargain — '+esc(p.n)+' accepts '+fmtMoney(w)+'/wk for '+L+' years.</p><button class="btn" onclick="hideModal();render()">Great</button>'); }
    else if(roll<0.60){ p.counter={ w:Math.round(askForLength(p,L)*rnd(1.02,1.08)/50)*50, L:L }; showModal('<h2>↩️ Counter-offer</h2><p class="small">'+esc(p.n)+' isn’t impressed and counters: <b>'+fmtMoney(p.counter.w)+'/wk</b>.</p><button class="btn" onclick="hideModal();render()">OK</button>'); }
    else { p.negoLock=S.yr; showModal('<h2>🚪 Talks collapse</h2><p class="small">'+esc(p.n)+' feels undervalued — he won’t discuss terms again until next season.</p><button class="btn" onclick="hideModal();render()">OK</button>'); }
  } else {                            // lowball
    if(roll<0.30){ p.counter={ w:Math.round(askForLength(p,L)*rnd(1.05,1.14)/50)*50, L:L }; showModal('<h2>↩️ Counter-offer</h2><p class="small">His agent laughs, then counters: <b>'+fmtMoney(p.counter.w)+'/wk</b>.</p><button class="btn" onclick="hideModal();render()">OK</button>'); }
    else { p.negoLock=S.yr; showModal('<h2>🚪 Talks collapse</h2><p class="small">'+esc(p.n)+' is insulted by the offer — no talks until next season.</p><button class="btn" onclick="hideModal();render()">OK</button>'); }
  }
  save();
}

// ---------- retirements ----------
function scheduleRetirements(){
  S.season.retire=[];
  var md=mdTotal();
  myClub().sq.forEach(function(p){
    p.ret=0;
    var pr=0;
    if(p.pos[0]==="GK"){ if(p.a>=38) pr=Math.min(0.95,(p.a-37)*0.3); }
    else if(p.a>=34) pr=Math.min(0.95,(p.a-33)*0.3);
    if(pr&&Math.random()<pr)
      S.season.retire.push({ n:p.n, md:ri(Math.ceil(md*0.55),md-2), done:false });
  });
}
function checkRetireNews(){ // returns true if news was shown
  if(!S.season.retire) return false;
  var pl=playedLeague(), shown=false;
  S.season.retire.forEach(function(r){
    if(shown||r.done||pl<r.md) return;
    r.done=true;
    var p=null;
    myClub().sq.forEach(function(x){ if(!p&&x.n===r.n) p=x; });
    if(!p) return; // moved on already
    p.ret=1; shown=true; save();
    showModal('<h2>📰 Club news</h2>'
      +'<p class="small" style="margin:8px 0;"><b>'+esc(p.n)+'</b> ('+p.a+', '+p.pos.join("·")+') has announced he will retire at the end of the season.</p>'
      +'<p class="small">There’s no talking him out of it — plan his replacement.</p>'
      +'<button class="btn" onclick="hideModal()">Understood</button>');
  });
  return shown;
}
// season rollover: retirements leave the game, expired deals become free agents
function processContractsSeasonEnd(){
  var out={retired:[],expired:[]};
  var sq=myClub().sq;
  for(var i=sq.length-1;i>=0;i--){
    var p=sq[i];
    if(p.ret){ out.retired.push(p.n); sq.splice(i,1); continue; }
    p.yrs--;
    if(p.yrs<=0){
      out.expired.push(p.n);
      S.freeAgents.push({ n:p.n, pos:p.pos.slice(), r:p.r, a:p.a, d:S.myTier });
      sq.splice(i,1);
    }
  }
  // the world grows a year older
  S.world.forEach(function(dv){ dv.clubs.forEach(function(c){ c.sq.forEach(function(p){ p.a=(p.a||24)+1; }); }); });
  S.lastDepartures=out;
}
function expiringList(){ return myClub().sq.map(function(p,pi){return {p:p,pi:pi};}).filter(function(x){ return x.p.yrs===1&&!x.p.ret; }); }
function retiringList(){ return myClub().sq.filter(function(p){ return p.ret; }); }

// squad shrunk below legal? matches blocked until you sign replacements
function squadIllegalMsg(){
  var sq=myClub().sq;
  if(sq.length<18) return "⚠️ Squad below the 18-player minimum — sign "+(18-sq.length)+" more before you can play.";
  for(var g in MINS){
    var cov=sq.filter(function(p){ return p.pos.some(function(x){return GRP[g].indexOf(x)!==-1;}); }).length;
    if(cov<MINS[g]) return "⚠️ Not enough "+g+" cover ("+cov+"/"+MINS[g]+") — sign reinforcements before you can play.";
  }
  return null;
}
// OVERRIDE (part5): play-blocker now also covers an illegal squad
function transferBlockMsg(){
  var ill=squadIllegalMsg();
  if(ill) return ill;
  if(!S.mustRelease) return null;
  var over=myClub().sq.length>24, cap=myBill()>myCap();
  return "⚠️ You must release a player before your next match"
    +(over&&cap?" — squad over the 24 limit AND over the wage budget."
    : over?" — squad over the 24-player limit."
    : S.swapFloor!=null?" — finish your downward swap: releases must take the wage bill below "+fmtMoney(S.swapFloor)+"/wk (where it was before the signing)."
    : " — the release must bring you back under the wage budget.");
}

{ id:"cups", t:"🏆 The cups & the draw", b:
"<p>Two knockout cups run alongside the men's leagues, with ties played <b>midweek</b> between league Saturdays. The <b>English Cup</b>: Division One, Two and National clubs enter at Round 1; Premier and Championship join at Round 3; eight rounds to the final in May. The <b>League Challenge Cup</b> (top four divisions): lower clubs and eight Championship sides start at Round 1, everyone else joins at Round 2. One-off ties, extra time and penalties, no replays.</p>"

{ id:"europe", t:"⭐ Europe", b:
"<p>Three continental competitions run alongside the men's season: the <b>Champions League</b> (Tuesdays), <b>Europa League</b> (Wednesdays) and <b>Conference League</b> (Thursdays), each with 36 clubs — England's entrants from last season's results (top 4 to the Champions League plus the holders; English Cup winners and 5th to the Europa; League Cup winners and 6th to the Conference — spots pass down the table if a winner already qualified) alongside fictional clubs from across Europe.</p>"

{ id:"calendar", t:"📆 The calendar", b:

{ id:"squadrules", t:"👥 Squad rules", b:

{ id:"contracts", t:"📄 Contracts", b:

// ---------- dates ----------
var MONTH_N=["January","February","March","April","May","June","July","August","September","October","November","December"];
var DAY_N=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function seasonStartDate(){
  var y=(S.baseYear||2026)+(S.yr-1); // season 1 starts the year the career began
  var d=new Date(y,7,1);
  var firstSat=1+((6-d.getDay()+7)%7);
  return new Date(y,7,firstSat+7);
}
// calendar-safe day arithmetic (ms maths slips an hour at the clock change,
// which is why Saturdays were turning into Fridays after October)
function offDate(off){ var s=seasonStartDate(); return new Date(s.getFullYear(),s.getMonth(),s.getDate()+off); }
function fmtOff(off){ var d=offDate(off); return DAY_N[d.getDay()]+" "+d.getDate()+" "+MONTH_N[d.getMonth()].slice(0,3); }
// 46-round divisions add midweek Tuesdays in weeks that never clash with cups
var LEAGUE_TUE_WEEKS=[4,8,13,18,28,34];
function leagueRoundOffs(n){
  var offs=[],w;
  if(n<=40){ for(w=0;w<n;w++) offs.push(w*7); return offs; }
  for(w=0;w<40;w++) offs.push(w*7);
  LEAGUE_TUE_WEEKS.slice(0,n-40).forEach(function(tw){ offs.push(tw*7+3); });
  return offs.sort(function(a,b){return a-b;});
}
function leagueDayShifts(){ return S.euroActive?[0,1]:[-1,0,1,2]; } // Fri Sat Sun Mon
function assignSeasonDates(){
  S.season.divs.forEach(function(d){ d.dates=leagueRoundOffs(d.sched.length); });
  var dates=S.season.divs[S.myTier].dates;
  S.season.mine.forEach(function(f){
    if(f.comp!=="L") return;
    var base=dates[f.md];
    f.date=(base%7===0)?base+pick(leagueDayShifts()):base; // midweek league rounds stay put
  });
  if(S.season.fr) S.season.fr.list.forEach(function(f,i){ f.date=-26+i*5; });
  // distinct weeks containing league fixtures — the weekly-ledger base
  var wks={};
  dates.forEach(function(o){ wks[Math.floor(o/7)]=1; });
  S.season.lw=Object.keys(wks).length;
  S.season.wkCharged={};
}
function sortMine(){ S.season.mine.sort(function(a,b){ return (a.date||0)-(b.date||0); }); }
function divEndOff(ti){ var d=S.season.divs[ti].dates; return d[d.length-1]; }
function poDate(stageIdx){ return divEndOff(S.myTier)+[4,11,18][Math.min(stageIdx,2)]; }
function lastPlayedDate(){
  var d=-99;
  S.season.mine.forEach(function(f){ if(f.played&&f.date!=null&&f.date>d) d=f.date; });
  return d;
}
// date-based background sim (overrides the proportional version)
function advanceOthers(){
  var D=lastPlayedDate();
  S.season.divs.forEach(function(d,ti){
    if(ti===S.myTier) return;
    while(d.md<d.sched.length&&d.dates[d.md]<=D) simRound(ti);
  });
}

// From season 2 the Europe phase will compute these from results.
var EURO_DEFAULT=["Liverpool","Manchester City","Aston Villa","Arsenal","Newcastle United","Brighton & Hove Albion","Tottenham Hotspur","Chelsea"];
function euroClubIdx(){ // tier-0 indices of the European 8 (name match, strength fallback)
  if(S.season&&S.season.euroIdx) return S.season.euroIdx;
  var names=EURO_DEFAULT.map(function(n){return n.toLowerCase();});
  var found=[];
  S.world[0].clubs.forEach(function(c,ci){ if(names.indexOf(c.n.toLowerCase())!==-1) found.push(ci); });
  if(found.length<8){ // alt-name mode or renames: top up with the biggest bills
    var rest=S.world[0].clubs.map(function(c,ci){ return {ci:ci,b:clubBillW(c)}; })
      .filter(function(x){ return found.indexOf(x.ci)===-1; })
      .sort(function(a,b){ return b.b-a.b; });
    while(found.length<8&&rest.length) found.push(rest.shift().ci);
  }

function encId(ti,ci){ return ti*1000+ci; }

function initMinnows(){

function minnowXi(mi){

// AI-only qualifying: 48 → 32 (16 byes) → 16 → 8, resolved before Round 1
function runQualifying(){
  var ids=S.minnows.map(function(_,mi){ return encId(MINNOW_TIER,mi); });
  var pool=shuffle(ids);
  var byes=pool.slice(0,16), play=pool.slice(16), winners=byes.slice();
  for(var i=0;i<play.length;i+=2) winners.push(qTie(play[i],play[i+1]));
  var r2=shuffle(winners), w2=[];
  for(i=0;i<r2.length;i+=2) w2.push(qTie(r2[i],r2[i+1]));
  var r3=shuffle(w2), w3=[];
  for(i=0;i<r3.length;i+=2) w3.push(qTie(r3[i],r3[i+1]));
  return w3; // the qualifying 8
}
function qTie(a,b){
  var r=quickSim(minnowXi(a%1000)+0.7,minnowXi(b%1000)-0.7);
  if(r[0]===r[1]) return Math.random()<0.5?a:b;
  return r[0]>r[1]?a:b;
}
function myCupId(){ return encId(S.myTier,S.myIdx); }
function tierClubs(ti){ return S.world[ti].clubs.map(function(_,ci){ return encId(ti,ci); }); }
function buildCups(){
  if(S.pyr!=="mfl"){ S.season.cups=null; S.euroActive=false; return; }
  initMinnows();
  S.minnows.forEach(function(c){ c.xi=null; }); // squads persist, form resets
  S.season.euroIdx=null;
  if(!S.season.euro) S.euroActive=(S.myTier===0&&euroClubIdx().indexOf(S.myIdx)!==-1);
  S.season.cups={};
  ["ec","lc"].forEach(function(key){
    var def=CUP_DEF[key];
    var alive=[];
    def.lowTiers.forEach(function(ti){ alive=alive.concat(tierClubs(ti)); });
    if(key==="ec") alive=alive.concat(runQualifying()); // the non-league 8
    var cup={ key:key, name:def.name, alive:alive, rIdx:0, meOut:false, winner:null,
      rounds:def.weeks.map(function(w,i){
        var off=w*7+(key==="ec"?1:3); // EC rounds on the weekend, LC midweek
        return { n:def.names[i], off:off, drawOff:Math.max(i?def.weeks[i-1]*7+5:1, off-12),
                 ties:null, byes:null, pot:null, seq:null, drawn:false, resolved:false };
      }) };
    // LC: non-European Premier clubs join R2, the European 8 join R3
    if(key==="lc"){
      var euro=euroClubIdx();
      cup.r2Joiners=tierClubs(0).filter(function(id){ return euro.indexOf(id%1000)===-1; });
      cup.r3Joiners=euro.map(function(ci){ return encId(0,ci); });

function cupEntrants(cup){
  var def=CUP_DEF[cup.key];
  var pot=cup.alive.slice();
  if(cup.key==="lc"){
    if(cup.rIdx===1) pot=pot.concat(cup.r2Joiners);
    if(cup.rIdx===2) pot=pot.concat(cup.r3Joiners);
  } else if(cup.rIdx===def.joinRound){
    def.joinTiers.forEach(function(ti){ pot=pot.concat(tierClubs(ti)); });
  }
  return pot;
}
function meInRound(cup){
  if(S.pyr!=="mfl"||cup.meOut||cup.winner!=null) return false;
  return cupEntrants(cup).indexOf(myCupId())!==-1;
}
function cupXi(id){ return idTi(id)===MINNOW_TIER?minnowXi(id%1000):clubXiAvg(idTi(id),id%1000); }
function cupPrize(cup,id,rIdx,runnerUp){
  var def=CUP_DEF[cup.key];
  var amt=runnerUp?def.ruPrize:def.prize[rIdx];
  var c=clubOfId(id);
  if(c.fin) c.fin.bal+=amt;
  if(id===myCupId()&&S.season.fin){ S.season.fin.rev.prize+=amt; }
}
function performDraw(cup){
  var r=cup.rounds[cup.rIdx];
  if(r.drawn) return;
  var pot=cupEntrants(cup);
  var nb=CUP_DEF[cup.key].byes[cup.rIdx]||0;
  var shuffled=shuffle(pot);
  r.byes=shuffled.slice(0,nb);
  var drawPot=shuffled.slice(nb);
  r.pot=drawPot.slice().sort(function(a,b){ return clubOfId(a).n<clubOfId(b).n?-1:1; });
  r.seq=shuffle(drawPot);
  r.ties=[];
  for(var i=0;i<r.seq.length;i+=2) r.ties.push({ a:r.seq[i], b:r.seq[i+1], ga:null, gb:null, pn:false, w:null });
  r.drawn=true;
  var me=myCupId();
  r.ties.forEach(function(t){
    if(t.a===me||t.b===me){
      var oppId=t.a===me?t.b:t.a;
      var wk=Math.floor(r.off/7);
      var myDate=cup.key==="ec"?wk*7+pick([0,1]):wk*7+pick([3,4]); // EC Sat/Sun · LC Tue/Wed
      if(cup.key==="ec"){
        // cup weekend: my league game that week is rearranged to the Tuesday
        S.season.mine.forEach(function(lf){
          if(lf.comp==="L"&&!lf.played&&Math.floor(lf.date/7)===wk) lf.date=wk*7+3;
        });
      }
      S.season.mine.push({ comp:cup.key.toUpperCase(), md:-1, ko:true, round:r.n, cupKey:cup.key,
                           oppTi:idTi(oppId), opp:oppId%1000, home:t.a===me,
                           date:myDate, played:false, scoreTxt:"" });
      sortMine();
    }
  });
  save();
}
function resolveCupRoundAI(cup){
  var r=cup.rounds[cup.rIdx], me=myCupId(), done=true;
  r.ties.forEach(function(t){
    if(t.w!=null) return;
    if(t.a===me||t.b===me){ done=false; return; }
    var ra=cupXi(t.a)+0.7, rb=cupXi(t.b)-0.7;
    var sc=quickSim(ra,rb);
    t.ga=sc[0]; t.gb=sc[1];
    if(sc[0]===sc[1]){ t.pn=true; t.w=(Math.random()<0.5+(ra-rb)*0.02)?t.a:t.b; }
    else t.w=sc[0]>sc[1]?t.a:t.b;
  });
  if(!done) return false;
  r.ties.forEach(function(t){ cupPrize(cup,t.w,cup.rIdx,false); });
  r.resolved=true;
  cup.alive=r.ties.map(function(t){return t.w;}).concat(r.byes);
  if(cup.alive.length===1){
    cup.winner=cup.alive[0];
    var fr=cup.rounds[cup.rIdx];
    var loser=fr.ties[0].w===fr.ties[0].a?fr.ties[0].b:fr.ties[0].a;
    cupPrize(cup,loser,cup.rIdx,true);
    S.season.cupWinners=S.season.cupWinners||{};
    S.season.cupWinners[cup.key]=clubOfId(cup.winner).n;
    if(cup.winner===myCupId()) addHonour({yr:S.yr,div:cup.name,club:myClub().n,type:cup.name+" winners"});
  } else cup.rIdx++;
  return true;
}
function resolveCupsUpTo(D){
  if(!S.season.cups) return;
  ["ec","lc"].forEach(function(key){
    var cup=S.season.cups[key], guard=0;
    while(cup.winner==null&&guard++<20){
      var r=cup.rounds[cup.rIdx];
      if(!r) break;
      if(!r.drawn){
        if(!meInRound(cup)&&r.drawOff<=D) performDraw(cup);
        else break; // my draws run through the ceremony
      }
      if(r.drawn&&!r.resolved&&r.off<=D){ if(!resolveCupRoundAI(cup)) break; }
      else break;
    }
  });
}
function resolveCupsAll(){
  if(!S.season.cups) return;
  ["ec","lc"].forEach(function(key){
    var cup=S.season.cups[key], guard=0;
    while(cup.winner==null&&guard++<20){
      var r=cup.rounds[cup.rIdx]; if(!r) break;
      if(!r.drawn) performDraw(cup);
      resolveCupRoundAI(cup);
    }
  });
}
function pendingDraw(){
  if(!S.season||!S.season.cups||S.season.stage!=="league") return null;
  var nf=nextFixture(), nd=nf?nf.date:1e9, found=null;

    var cup=S.season.cups[key], r=cup.rounds[cup.rIdx];

  });

}

// ---------- foreign club generation ----------
function hashN(s,mod){ var h=0; for(var i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return h%mod; }
function euroTarget(e){ // [n,nick,stad,cap,col,country,comp,lg]
  var base={CL:82,EL:75,CO:68}[e[6]]||68;
  base+=e[7]?2:-3;
  if(["Spain","Germany","Italy","France"].indexOf(e[5])!==-1) base+=2;
  else if(["Netherlands","Portugal"].indexOf(e[5])!==-1) base+=1;
  var cap=e[3]||12000;
  if(cap>=50000) base+=2; else if(cap>=25000) base+=1;
  else if(cap<8000) base-=4; else if(cap<15000) base-=2;
  base+=hashN(e[0],7)-3;
  return Math.max(56,Math.min(90,base));
}
function mkEuroClub(pi){ // pool index → club object with squad
  var e=DATA.euro[pi];
  var t=euroTarget(e);
  var sq=SQUAD_PLAN.slice(0,16).map(function(plan,i){ return genPlayer(plan,t+(i<4?2:0),false); });
  sq.sort(function(a,b){ return b.r-a.r; });
  // real identities by default; the fictionalised set under alternate-name mode
  var alt=altMode();
  return { n:(alt&&e[8])?e[8]:e[0], sq:sq, euro:true, pool:pi, country:e[5],
    meta:{ nick:(alt?e[9]:e[1])||"", stad:(alt?e[10]:e[2])||"",
           cap:Math.max(3000,e[3]||12000), col:(alt?e[11]:e[4])||"" }, fin:null };
}

// ---------- English entrants: season 1 defaults, then the waterfall ----------
function englishEntrants(){
  var out={cl:[],el:[],co:[]};
  function idByName(n){
    var found=null;
    S.world.forEach(function(dv,ti){ dv.clubs.forEach(function(c,ci){ if(!found&&c.n===n) found=encId(ti,ci); }); });
    return found;
  }
  if(S.yr===1||!S.prevPLtable){
    var ids=[];
    EURO_DEFAULT.forEach(function(n){ var id=idByName(n); if(id!=null) ids.push(id); });
    // strength fallback for renames/alt mode
    if(ids.length<8){
      S.world[0].clubs.forEach(function(c,ci){
        var id=encId(0,ci);
        if(ids.length<8&&ids.indexOf(id)===-1) ids.push(id);
      });
    }
    out.cl=ids.slice(0,4); out.el=ids.slice(4,6); out.co=ids.slice(6,8);
    return out;
  }
  // waterfall from last season: league positions + cup winners, spots pass down
  var order=S.prevPLtable.map(idByName).filter(function(x){return x!=null;});
  var used={};
  function take(id){ if(id!=null&&!used[id]){ used[id]=1; return true; } return false; }
  var next=4; // pass-down pointer (5th place onwards)
  function passDown(){ while(next<order.length){ var id=order[next++]; if(!used[id]) return id; } return null; }
  order.slice(0,4).forEach(function(id){ if(take(id)) out.cl.push(id); });
  // holders join the CL if English
  ["cl","el"].forEach(function(k){
    var h=S.euroHolders&&S.euroHolders[k];
    if(h&&h.eng){ var id=idByName(h.n); if(id!=null&&take(id)) out.cl.push(id); }
  });
  // a cup winner who already qualified passes the spot down the table —
  // and the passed-down club must be MARKED used, or it can enter twice
  function takeOrPass(id){
    if(take(id)) return id;
    var p=passDown();
    if(take(p)) return p;
    return null;
  }
  out.el.push(takeOrPass(S.prevCupWinnerNames&&idByName(S.prevCupWinnerNames.ec)));
  out.el.push(takeOrPass(null)); // 5th place (or next unqualified)
  out.co.push(takeOrPass(S.prevCupWinnerNames&&idByName(S.prevCupWinnerNames.lc)));
  out.co.push(takeOrPass(null)); // 6th place (or next unqualified)
  out.el=out.el.filter(function(x){return x!=null;});
  out.co=out.co.filter(function(x){return x!=null;});
  return out;
}
// the LC "European 8": PL members of Europe, topped up to exactly 8 by last finish
function euroClubIdx(){
  if(S.season&&S.season.euro&&S.season.euro.euro8PL) return S.season.euro.euro8PL;
  // pre-euro fallback (season build order guarantees euro first; safety only)
  var names=EURO_DEFAULT.map(function(n){return n.toLowerCase();});
  var found=[];
  S.world[0].clubs.forEach(function(c,ci){ if(names.indexOf(c.n.toLowerCase())!==-1) found.push(ci); });
  var rest=S.world[0].clubs.map(function(c,ci){ return {ci:ci,b:clubBillW(c)}; })
    .filter(function(x){ return found.indexOf(x.ci)===-1; })
    .sort(function(a,b){ return b.b-a.b; });
  while(found.length<8&&rest.length) found.push(rest.shift().ci);
  return found.slice(0,8);
}

// ---------- competition composition ----------
function pickCountry(pool,used,country,n,byRating){
  var cands=[];
  pool.forEach(function(e,i){ if(!used[i]&&e[5]===country) cands.push(i); });
  cands.sort(function(a,b){ return euroTarget(pool[b])-euroTarget(pool[a]); });
  if(!byRating) cands=shuffle(cands);
  var out=cands.slice(0,n);
  out.forEach(function(i){ used[i]=1; });
  return out;
}
function pickRandom(pool,used,n){
  var cands=[];
  pool.forEach(function(_,i){ if(!used[i]) cands.push(i); });
  var out=shuffle(cands).slice(0,n);
  out.forEach(function(i){ used[i]=1; });
  return out;
}
function buildEuro(){
  if(S.pyr!=="mfl"){ S.season.euro=null; return; }
  var pool=DATA.euro||[];
  if(!pool.length){ S.season.euro=null; return; }
  var used={}, eng=englishEntrants();
  var E={ clubs:[], comps:{}, euro8PL:null };
  S.season.euro=E;
  function addForeign(pi){
    E.clubs.push(mkEuroClub(pi));
    return EURO_TIER*1000+(E.clubs.length-1);
  }
  function holderForeign(k){
    var h=S.euroHolders&&S.euroHolders[k];
    if(!h||h.eng) return null;
    var pi=-1;
    pool.forEach(function(e,i){ if(pi<0&&!used[i]&&e[0]===h.n) pi=i; });
    if(pi<0) return null;
    used[pi]=1; return addForeign(pi);
  }
  // Champions League: quotas per the doc
  var clIds=eng.cl.slice();
  [holderForeign("cl"),holderForeign("el")].forEach(function(id){ if(id!=null) clIds.push(id); });
  [["Spain",4],["Italy",4],["Germany",4],["France",3],["Netherlands",2],["Portugal",1],["Belgium",1],["Czech Republic",1],["Türkiye",1]].forEach(function(q){
    var picks=pickCountry(pool,used,q[0],q[1],true);
    if(picks.length<q[1]&&q[0]==="Türkiye") picks=picks.concat(pickCountry(pool,used,"Turkey",q[1]-picks.length,true));
    picks.forEach(function(pi){ clIds.push(addForeign(pi)); });
  });
  // 2 next-highest associations (strongest clubs from countries not yet used)
  var bigC=["England","Spain","Italy","Germany","France","Netherlands","Portugal","Belgium","Czech Republic","Türkiye","Turkey"];
  var nextAssoc=[];
  pool.forEach(function(e,i){ if(!used[i]&&bigC.indexOf(e[5])===-1) nextAssoc.push(i); });
  nextAssoc.sort(function(a,b){ return euroTarget(pool[b])-euroTarget(pool[a]); });
  var takenC={};
  for(var i=0;i<nextAssoc.length&&Object.keys(takenC).length<2;i++){
    var e=pool[nextAssoc[i]];
    if(takenC[e[5]]) continue;
    takenC[e[5]]=1; used[nextAssoc[i]]=1; clIds.push(addForeign(nextAssoc[i]));
  }
  pickRandom(pool,used,36-clIds.length).forEach(function(pi){ clIds.push(addForeign(pi)); });
  // Europa League
  var elIds=eng.el.slice();
  var hco=holderForeign("co"); if(hco!=null) elIds.push(hco);
  [["Spain",2],["Italy",2],["Germany",2],["France",2],["Netherlands",1],["Portugal",1]].forEach(function(q){
    pickCountry(pool,used,q[0],q[1],true).forEach(function(pi){ elIds.push(addForeign(pi)); });
  });
  pickRandom(pool,used,36-elIds.length).forEach(function(pi){ elIds.push(addForeign(pi)); });
  // Conference League
  var coIds=eng.co.slice();
  pickRandom(pool,used,36-coIds.length).forEach(function(pi){ coIds.push(addForeign(pi)); });
  var me=myCupId();
  [["cl",clIds],["el",elIds],["co",coIds]].forEach(function(pair){
    var key=pair[0], ids=pair[1].slice(0,36);
    E.comps[key]={ key:key, ids:ids, stage:"groupDraw", mdIdx:0,
      t:{}, myIn:ids.indexOf(me)!==-1, chunks:null, myFix:null,
      po:null, br:null, winner:null, meOut:false };
    ids.forEach(function(id){ E.comps[key].t[id]={pts:0,gf:0,ga:0,pl:0}; });
    if(E.comps[key].myIn){ E.myComp=key; }
  });
  // the LC European 8 + weekend rule
  var allEng=eng.cl.concat(eng.el,eng.co);
  var pl=[];
  allEng.forEach(function(id){
    if(Math.floor(id/1000)===0&&pl.indexOf(id%1000)===-1) pl.push(id%1000);
  });
  if(S.prevPLtable){
    var orderIdx=[];
    S.prevPLtable.forEach(function(n){ S.world[0].clubs.forEach(function(c,ci){ if(c.n===n) orderIdx.push(ci); }); });
    for(var j=0;j<orderIdx.length&&pl.length<8;j++) if(pl.indexOf(orderIdx[j])===-1) pl.push(orderIdx[j]);
  }
  S.world[0].clubs.forEach(function(_,ci){ if(pl.length<8&&pl.indexOf(ci)===-1) pl.push(ci); });
  E.euro8PL=pl.slice(0,8);
  S.euroActive=allEng.indexOf(me)!==-1;
  E.myEng=allEng;
}

// ---------- the Swiss draw (pots of 9, 2 per pot, no same country, 4H/4A) ----------
function euCountry(id){
  if(id>=EURO_TIER*1000) return S.season.euro.clubs[id-EURO_TIER*1000].country;
  return "England";
}
// cycle through the pot with no same-country neighbours: interleaved placement
// (sort by country frequency, fill even positions then odd) + swap repair
function potCycle(pot){
  for(var t=0;t<40;t++){
    var byC={};
    shuffle(pot).forEach(function(id){ (byC[euCountry(id)]=byC[euCountry(id)]||[]).push(id); });
    var groups=Object.keys(byC).map(function(c){ return byC[c]; })
      .sort(function(a,b){ return b.length-a.length; });
    var flat=[]; groups.forEach(function(g){ flat=flat.concat(g); });
    var cyc=new Array(9), order=[0,2,4,6,8,1,3,5,7];
    for(var i=0;i<9;i++) cyc[order[i]]=flat[i];
    // repair any residual adjacency by swapping
    for(var rep=0;rep<60;rep++){
      var bad=-1;
      for(var j=0;j<9;j++) if(euCountry(cyc[j])===euCountry(cyc[(j+1)%9])){ bad=j; break; }
      if(bad<0) return cyc;
      var k=Math.floor(Math.random()*9);
      var tmp=cyc[bad]; cyc[bad]=cyc[k]; cyc[k]=tmp;
    }
  }
  return null;
}
// perfect matching pot P → pot Q avoiding same-country (and a prior matching):
// backtracking with most-constrained-first ordering — finds one if it exists
function potMatch(potP,potQ,avoid){
  var allowed=potP.map(function(p,i){
    var opts=[];
    potQ.forEach(function(q){
      if(euCountry(p)!==euCountry(q)&&(!avoid||avoid[i]!==q)) opts.push(q);
    });
    return shuffle(opts);
  });
  var rows=potP.map(function(_,i){ return i; })
    .sort(function(a,b){ return allowed[a].length-allowed[b].length; });
  var used={}, sigma=new Array(9);
  function bt(k){
    if(k===9) return true;
    var i=rows[k];
    for(var c=0;c<allowed[i].length;c++){
      var q=allowed[i][c];
      if(used[q]) continue;
      used[q]=1; sigma[i]=q;
      if(bt(k+1)) return true;
      delete used[q];
    }
    return false;
  }
  return bt(0)?sigma:null;
}
function swissDraw(comp){
  var ids=comp.ids.slice().sort(function(a,b){ return euIdXi(b)-euIdXi(a); });
  var pots=[ids.slice(0,9),ids.slice(9,18),ids.slice(18,27),ids.slice(27,36)];
  for(var attempt=0;attempt<60;attempt++){
    var edges=[], ok=true;
    pots.forEach(function(pot){
      var cyc=potCycle(pot);
      if(!cyc){ ok=false; return; }
      for(var i=0;i<9;i++) edges.push([cyc[i],cyc[(i+1)%9]]);
    });
    for(var p=0;p<4&&ok;p++) for(var q=p+1;q<4&&ok;q++){
      var s1=potMatch(pots[p],pots[q],null);
      var s2=s1?potMatch(pots[p],pots[q],s1):null;
      if(!s1||!s2){ ok=false; break; }
      for(var i3=0;i3<9;i3++){ edges.push([pots[p][i3],s1[i3]]); edges.push([pots[p][i3],s2[i3]]); }
    }
    if(!ok) continue;
    // home/away: orient edges along Eulerian circuits — every vertex of an
    // 8-regular graph then gets EXACTLY 4 out (home) and 4 in (away)
    var adj={}, usedE={};
    ids.forEach(function(id){ adj[id]=[]; });
    edges.forEach(function(e,ei){
      adj[e[0]].push({to:e[1],ei:ei});
      adj[e[1]].push({to:e[0],ei:ei});
    });
    ids.forEach(function(id){ adj[id]=shuffle(adj[id]); });
    var fx=[];
    ids.forEach(function(start){
      var stack=[start], path=[];
      while(stack.length){
        var v=stack[stack.length-1], moved=false;
        while(adj[v].length){
          var nx=adj[v].pop();
          if(usedE[nx.ei]) continue;
          usedE[nx.ei]=1;
          stack.push(nx.to);
          moved=true;
          break;
        }
        if(!moved) path.push(stack.pop());
      }
      for(var pi2=path.length-1;pi2>0;pi2--) fx.push({h:path[pi2],a:path[pi2-1]});
    });
    // split into 8 matchday chunks. MY games are seeded one per matchday FIRST
    // (so the player always has exactly 8 distinct MDs), then greedy-fill.
    var me=myCupId();
    var myGames=shuffle(fx.filter(function(g){ return g.h===me||g.a===me; }));
    var others=fx.filter(function(g){ return g.h!==me&&g.a!==me; });
    var rem=others.slice(), chunks=[];
    for(var m=0;m<8;m++){
      var busy={}, chunk=[], rest=[];
      if(myGames[m]){ chunk.push(myGames[m]); busy[myGames[m].h]=1; busy[myGames[m].a]=1; }
      shuffle(rem).forEach(function(g){
        if(chunk.length<18&&!busy[g.h]&&!busy[g.a]){ busy[g.h]=1; busy[g.a]=1; chunk.push(g); }
        else rest.push(g);
      });
      chunks.push(chunk); rem=rest;
    }
    rem.forEach(function(g){ chunks[7].push(g); }); // AI stragglers only — never mine
    return { pots:pots, chunks:chunks };
  }
  return null;
}
function performEuroGroupDraw(key){
  var comp=S.season.euro.comps[key];
  if(comp.stage!=="groupDraw") return;
  var d=swissDraw(comp);
  if(!d){ comp.stage="league"; comp.chunks=[[],[],[],[],[],[],[],[]]; return; } // never in practice
  comp.chunks=d.chunks;
  comp.stage="league";
  var me=myCupId();
  euroPrizeAll(key,"part");
  if(comp.myIn){
    comp.myFix=[];
    comp.chunks.forEach(function(chunk,mi){
      chunk.forEach(function(g){
        if(g.h===me||g.a===me){
          var opp=g.h===me?g.a:g.h;
          var f={ comp:"EU", euComp:key, md:mi, ko:false, round:EU_DEF[key].short+" MD"+(mi+1),
                  oppTi:Math.floor(opp/1000), opp:opp>=EURO_TIER*1000?(opp-EURO_TIER*1000):opp%1000,
                  home:g.h===me, date:EU_W.md[mi]*7+EU_DEF[key].day, played:false, scoreTxt:"", euOppId:opp };
          comp.myFix.push(f);

}
// a European midweek bumps my domestic cup tie to the other midweek day
function fixDomesticClash(euF){
  var wk=Math.floor(euF.date/7);
  S.season.mine.forEach(function(f){
    if(f===euF||f.played||f.mock) return;
    if((f.comp==="LC"||f.comp==="EC")&&Math.floor(f.date/7)===wk&&f.date%7>2){
      f.date=wk*7+(euF.date%7>=5?3:5); // Euro Thu → cup Tue; Euro Tue/Wed → cup Thu
    }

}
function euroPrizeAll(key,kind){

function euroPrize(id,amt){

  var c=clubOfId(id);

    c.fin.bal+=amt;

// Euro money strengthens the wage budget (65%) but never enters the levy
function wageBudgetOf(ti,ci){
  var base=Math.round(FIN.budgetShare*annualRevenue(ti,ci)/52/50)*50;
  var c=S.world[ti]&&S.world[ti].clubs[ci];
  if(c&&c.fin&&c.fin.euroEarnPrev) base+=Math.round(FIN.budgetShare*c.fin.euroEarnPrev/52/50)*50;
  return base;

// ---------- league phase running ----------
function euroStandings(key){
  var comp=S.season.euro.comps[key];
  return comp.ids.slice().sort(function(a,b){
    var A=comp.t[a],B=comp.t[b];
    return B.pts-A.pts||(B.gf-B.ga)-(A.gf-A.ga)||B.gf-A.gf;
  });
}
function applyEuroResult(key,h,a,gh,ga2){
  var t=S.season.euro.comps[key].t;
  t[h].gf+=gh; t[h].ga+=ga2; t[h].pl++;
  t[a].gf+=ga2; t[a].ga+=gh; t[a].pl++;
  var P=EU_DEF[key].prize;
  if(gh>ga2){ t[h].pts+=3; euroPrize(h,P.win); }
  else if(ga2>gh){ t[a].pts+=3; euroPrize(a,P.win); }
  else { t[h].pts++; t[a].pts++; euroPrize(h,P.draw); euroPrize(a,P.draw); }
}
function simEuroMd(key,mi){
  var comp=S.season.euro.comps[key], me=myCupId();
  comp.chunks[mi].forEach(function(g){
    if(g.done) return;
    if(comp.myIn&&(g.h===me||g.a===me)) return; // mine is played live
    var r=quickSim(euIdXi(g.h)+0.7,euIdXi(g.a)-0.7);
    g.ga=r[0]; g.gb=r[1]; g.done=true;
    applyEuroResult(key,g.h,g.a,r[0],r[1]);
  });
}
function euroMdComplete(key,mi){
  return S.season.euro.comps[key].chunks[mi].every(function(g){ return g.done; });
}

// ---------- knockouts (two legs, aggregate) ----------
function mkTie(seeded,unseeded){ return { a:seeded, b:unseeded, l1:null, l2:null, w:null, pn:false }; }
function simTieAI(key,tie){
  // leg 1 at the unseeded club, leg 2 at the seed
  var r1=quickSim(euIdXi(tie.b)+0.7,euIdXi(tie.a)-0.7);
  tie.l1=[r1[0],r1[1]]; // b's goals, a's goals
  var r2=quickSim(euIdXi(tie.a)+0.7,euIdXi(tie.b)-0.7);
  tie.l2=[r2[0],r2[1]];
  var aggA=r1[1]+r2[0], aggB=r1[0]+r2[1];
  if(aggA===aggB){ tie.pn=true; tie.w=Math.random()<0.5+(euIdXi(tie.a)-euIdXi(tie.b))*0.02?tie.a:tie.b; }
  else tie.w=aggA>aggB?tie.a:tie.b;
}
function myTieFixtures(key,tie,round,offs){
  var me=myCupId(), opp=tie.a===me?tie.b:tie.a;

  [0,1].forEach(function(leg){
    var home=(leg===0)?!seeded:seeded; // seed hosts leg 2
    var isFinal=round==="Final";
    var f={ comp:"EU", euComp:key, ko:leg===1||isFinal, leg:leg+1, round:EU_DEF[key].short+" "+round+(isFinal?"":" · Leg "+(leg+1)),
            oppTi:Math.floor(opp/1000), opp:opp>=EURO_TIER*1000?(opp-EURO_TIER*1000):opp%1000,
            home:isFinal?false:home, date:offs[leg], played:false, scoreTxt:"", euOppId:opp, euRound:round };

}
function performEuroPoDraw(key){
  var comp=S.season.euro.comps[key];

}
function performEuroBracketDraw(key){

  comp.stage="r16";

  });

}
function euroAdvanceKo(key){
  var comp=S.season.euro.comps[key], me=myCupId(), P=EU_DEF[key].prize;
  function allDone(ties){ return ties.length&&ties.every(function(t){ return t.w!=null; }); }
  function seedOrder(x,y){ return (comp.rank[x]||99)<(comp.rank[y]||99)?[x,y]:[y,x]; }

    comp.po.forEach(function(t){ euroPrize(t.w,P.po); });
    comp.stage="brDraw";
  }
  if(comp.stage==="r16"&&comp.br&&allDone(comp.br.r16)){
    comp.br.r16.forEach(function(t){ euroPrize(t.w,P.r16); });
    for(var i=0;i<8;i+=2){
      var so=seedOrder(comp.br.r16[i].w,comp.br.r16[i+1].w);
      comp.br.qf.push(mkTie(so[0],so[1]));
    }
    comp.stage="qf";
    comp.br.qf.forEach(function(t){ if(t.a===me||t.b===me) myTieFixtures(key,t,"Quarter-Final",[EU_W.qf[0]*7+EU_DEF[key].day,EU_W.qf[1]*7+EU_DEF[key].day]); });

  if(comp.stage==="qf"&&allDone(comp.br.qf)){
    comp.br.qf.forEach(function(t){ euroPrize(t.w,P.qf); });
    for(var j=0;j<4;j+=2){
      var so2=seedOrder(comp.br.qf[j].w,comp.br.qf[j+1].w);
      comp.br.sf.push(mkTie(so2[0],so2[1]));
    }
    comp.stage="sf";
    comp.br.sf.forEach(function(t){ if(t.a===me||t.b===me) myTieFixtures(key,t,"Semi-Final",[EU_W.sf[0]*7+EU_DEF[key].day,EU_W.sf[1]*7+EU_DEF[key].day]); });
  }
  if(comp.stage==="sf"&&allDone(comp.br.sf)){
    comp.br.sf.forEach(function(t){ euroPrize(t.w,P.sf); });
    var so3=seedOrder(comp.br.sf[0].w,comp.br.sf[1].w);
    comp.br.f=mkTie(so3[0],so3[1]);
    comp.stage="final";
    if(comp.br.f.a===me||comp.br.f.b===me) myTieFixtures(key,comp.br.f,"Final",[EU_DEF[key].finOff,EU_DEF[key].finOff]);
  }

    var w=comp.br.f.w, l=comp.br.f.w===comp.br.f.a?comp.br.f.b:comp.br.f.a;

    comp.winner=w;
    comp.stage="done";
    if(w===me){ addHonour({yr:S.yr,div:EU_DEF[key].name,club:myClub().n,type:EU_DEF[key].name+" winners"}); }
  }
}
function simEuroTiesAI(key,ties,uptoLeg){

// a final between AI clubs is one game
function simFinalAI(key){
  var comp=S.season.euro.comps[key], me=myCupId(), t=comp.br.f;
  if(!t||t.w!=null||t.a===me||t.b===me) return;

// ---------- date-driven resolution ----------
function resolveEuroUpTo(D){
  if(!S.season.euro) return;
  ["cl","el","co"].forEach(function(key){
    var comp=S.season.euro.comps[key], guard=0;
    while(guard++<40){
      if(comp.stage==="groupDraw"){
        if(comp.myIn) break; // my draw runs through the ceremony
        if(EU_DRAW.group<=D) performEuroGroupDraw(key); else break;
      }
      else if(comp.stage==="league"){
        var mi=comp.mdIdx;
        if(mi>=8){ comp.stage="poDraw"; continue; }
        var off=EU_W.md[mi]*7+EU_DEF[key].day;
        if(off>D) break;
        simEuroMd(key,mi);
        if(!euroMdComplete(key,mi)) break; // waiting on my match
        comp.mdIdx++;
      }
      else if(comp.stage==="poDraw"){
        if(comp.myIn&&euroStillIn(key)&&euroInPoBand(key)) break; // ceremony
        if(EU_DRAW.po<=D) performEuroPoDraw(key); else break;
      }
      else if(comp.stage==="po"){
        if(EU_W.po[1]*7+EU_DEF[key].day>D) break;
        simEuroTiesAI(key,comp.po);
        if(!comp.po.every(function(t){return t.w!=null;})) break;
        euroAdvanceKo(key);
      }
      else if(comp.stage==="brDraw"){
        if(comp.myIn&&euroStillIn(key)) break;
        if(EU_DRAW.br<=D) performEuroBracketDraw(key); else break;
      }
      else if(comp.stage==="r16"||comp.stage==="qf"||comp.stage==="sf"){
        var ties=comp.stage==="r16"?comp.br.r16:comp.stage==="qf"?comp.br.qf:comp.br.sf;
        var wk2=comp.stage==="r16"?EU_W.r16[1]:comp.stage==="qf"?EU_W.qf[1]:EU_W.sf[1];
        if(wk2*7+EU_DEF[key].day>D) break;
        simEuroTiesAI(key,ties);
        if(!ties.every(function(t){return t.w!=null;})) break;
        euroAdvanceKo(key);
      }
      else if(comp.stage==="final"){
        if(EU_DEF[key].finOff>D) break;
        simFinalAI(key);
        if(comp.br.f.w==null) break;
        euroAdvanceKo(key);
      }
      else break; // done
    }
  });
}
function resolveEuroAll(){
  if(!S.season.euro) return;
  resolveEuroUpTo(9999);
}
function euroStillIn(key){
  var comp=S.season.euro.comps[key], me=myCupId();
  if(!comp.myIn||comp.meOut) return false;
  if(comp.stage==="poDraw") return true;
  if(comp.stage==="brDraw"){
    return comp.autoQ.indexOf(me)!==-1||comp.po.some(function(t){ return t.w===me; });
  }
  return true;
}
function euroInPoBand(key){
  var pos=euroStandings(key).indexOf(myCupId())+1;
  return pos>=9&&pos<=24;
}

// my Euro match result (called from finishMatch)
function euroMyResult(f,won,byPens){
  var key=f.euComp, comp=S.season.euro.comps[key], me=myCupId(), opp=f.euOppId;
  if(f.md!=null&&!f.ko&&!f.leg){ // league phase
    var g=null;
    comp.chunks[f.md].forEach(function(x){ if((x.h===me&&x.a===opp)||(x.h===opp&&x.a===me)) g=x; });
    if(g&&!g.done){
      g.done=true;
      if(g.h===me) applyEuroResult(key,me,opp,M.gMe,M.gOpp);
      else applyEuroResult(key,opp,me,M.gOpp,M.gMe);
    }
    resolveEuroUpTo(f.date);
    if(comp.mdIdx>=8&&comp.stage==="league") comp.stage="poDraw";
    return;
  }
  // knockout legs
  var ties=comp.stage==="po"?comp.po:comp.stage==="r16"?comp.br.r16:comp.stage==="qf"?comp.br.qf:comp.stage==="sf"?comp.br.sf:[comp.br.f];
  var tie=null;
  ties.forEach(function(t){ if(t&&(t.a===me||t.b===me)) tie=t; });
  if(!tie) return;
  var iAmA=tie.a===me;
  if(f.euRound==="Final"){
    tie.l1=[M.gMe,M.gOpp]; tie.pn=!!byPens;
    tie.w=won?me:opp;
  } else if(f.leg===1){
    // leg 1: b hosts — store as [b goals, a goals]
    tie.l1=iAmA?[M.gOpp,M.gMe]:[M.gMe,M.gOpp];
    // arm leg 2 with the aggregate
    S.season.mine.forEach(function(x){
      if(x.comp==="EU"&&x.euComp===key&&x.leg===2&&!x.played&&x.euOppId===opp)
        x.agg=[M.gMe,M.gOpp];
    });
  } else {
    tie.l2=iAmA?[M.gMe,M.gOpp]:[M.gOpp,M.gMe];
    tie.pn=!!byPens;
    tie.w=won?me:opp;
  }
  if(tie.w&&tie.w!==me) comp.meOut=true;
  if(tie.w&&f.euRound==="Final"&&won){ M.note=EU_DEF[key].name+" WINNERS!"; celebrate(); }
  resolveEuroUpTo(f.date);
  euroAdvanceKo(key);
}

// ---------- draws: pending + ceremonies ----------

      found={kind:"cup",cup:cup,r:r,title:cup.name,sub:r.n+" draw"};

  if(found||!S.season.euro) return found;
  ["cl","el","co"].forEach(function(k){
    if(found) return;
    var comp=S.season.euro.comps[k];
    if(!comp.myIn) return;
    if(comp.stage==="groupDraw"&&EU_DRAW.group<=nd)

    DR={ test:false, cupName:EU_DEF[pd.comp].name, roundName:"Knockout playoffs",
         ids:seq, pot:seq.slice().sort(function(a,b){ return euName(a)<euName(b)?-1:1; }),
         byes:[], step:0, mode:"pending", over:false, myIdx:-1 };
  } else if(pd.kind==="euBr"){
    performEuroBracketDraw(pd.comp);
    var c3=S.season.euro.comps[pd.comp], seq2=[];
    c3.br.r16.forEach(function(t){ seq2.push(t.b); seq2.push(t.a); });
    DR={ test:false, cupName:EU_DEF[pd.comp].name, roundName:"Road to the Final",
         ids:seq2, pot:seq2.slice().sort(function(a,b){ return euName(a)<euName(b)?-1:1; }),
         byes:[], step:0, mode:"pending", over:false, myIdx:-1 };
  }
  var me=myCupId();
  DR.ids.forEach(function(id,i){ if(id===me) DR.myIdx=i; });
  S.phase="draw"; render();
  drawModeModal();
}
function drawInstantAll(){
  var guard=0,pd;
  while((pd=pendingDraw())&&guard++<12){
    if(pd.kind==="cup") performDraw(pd.cup);
    else if(pd.kind==="euGroup") performEuroGroupDraw(pd.comp);
    else if(pd.kind==="euPo") performEuroPoDraw(pd.comp);
    else if(pd.kind==="euBr") performEuroBracketDraw(pd.comp);
  }
}
function euroSeasonEndHook(){
  // record for next season: PL table, cup winners, holders; bank euro earnings
  if(S.pyr!=="mfl") return;
  S.prevPLtable=standings(0).map(function(ci){ return S.world[0].clubs[ci].n; });
  S.prevCupWinnerNames=S.season.cupWinners||null;
  if(S.season.euro){
    resolveEuroAll();
    S.euroHolders={};
    ["cl","el","co"].forEach(function(k){
      var w=S.season.euro.comps[k].winner;
      if(w!=null) S.euroHolders[k]={ n:euName(w), eng:w<EURO_TIER*1000 };
    });
  }
  S.world.forEach(function(dv){ dv.clubs.forEach(function(c){
    if(c.fin){ c.fin.euroEarnPrev=c.fin.euroEarn||0; c.fin.euroEarn=0; }
  }); });
}

// ---------- Europe view (Tables tab chip) ----------
function euroView(){
  if(!S.season.euro) return '<div class="card"><div class="small">No European competitions this season.</div></div>';
  if(!S.euView) S.euView=S.season.euro.myComp||"cl";
  var key=S.euView, comp=S.season.euro.comps[key], me=myCupId();
  var h='<div class="card"><div style="display:flex;gap:6px;margin-bottom:8px;">';
  ["cl","el","co"].forEach(function(k){
    h+='<button class="tab'+(S.euView===k?' on':'')+'" style="flex:none;padding:6px 10px;" onclick="S.euView=\''+k+'\';save();render()">'+EU_DEF[k].badge+' '+EU_DEF[k].short+'</button>';
  });
  h+='</div><h3>'+EU_DEF[key].name+'</h3>';
  if(comp.stage==="groupDraw"){ h+='<div class="small">League phase draw: late August.</div></div>'; return h; }
  if(comp.winner!=null) h+='<div class="winopen">🏆 Champions: '+esc(euName(comp.winner))+'</div>';
  // league table
  var st=euroStandings(key);
  h+='<div style="max-height:380px;overflow-y:auto;"><table><tr><th style="text-align:left">Team</th><th>P</th><th>GD</th><th>Pts</th></tr>';
  st.forEach(function(id,i){
    var t=comp.t[id];
    var zone=i<8?"▲":i<24?"○":"▼";
    h+='<tr'+(id===me?' class="me"':'')+'><td class="tn">'+(i+1)+'. '+esc(euName(id))+' <span class="small">'+zone+'</span></td>'
      +'<td>'+t.pl+'</td><td>'+(t.gf-t.ga)+'</td><td><b>'+t.pts+'</b></td></tr>';
  });
  h+='</table></div><div class="small" style="margin-top:4px;">▲ Round of 16 · ○ playoffs · ▼ out</div>';
  // knockout results
  function tieRow(t,label){
    if(!t) return "";
    var l1=t.l1?t.l1[1]+"–"+t.l1[0]:"–", l2=t.l2?t.l2[0]+"–"+t.l2[1]:"–";
    var agg=(t.l1&&t.l2)?" (agg "+(t.l1[1]+t.l2[0])+"–"+(t.l1[0]+t.l2[1])+(t.pn?" pens":"")+")":(t.l1&&!t.l2&&label==="Final"?(t.pn?" (pens)":""):"");
    return '<div class="fixture"><span class="fr">'+label+'</span>'
      +'<span class="tn'+(t.w===t.a?'':' dim2')+'">'+esc(euName(t.a))+'</span>'
      +'<span class="fs small">'+(label==="Final"?(t.l1?t.l1[0]+"–"+t.l1[1]:"v"):l1+" / "+l2)+esc(agg)+'</span>'
      +'<span class="tn'+(t.w===t.b?'':' dim2')+'" style="text-align:right;">'+esc(euName(t.b))+'</span></div>';
  }
  if(comp.po){ h+='<h3 style="margin-top:8px;">Playoffs</h3>'; comp.po.forEach(function(t){ h+=tieRow(t,"PO"); }); }
  if(comp.br){
    h+='<h3 style="margin-top:8px;">Bracket</h3>';
    comp.br.r16.forEach(function(t){ h+=tieRow(t,"R16"); });
    comp.br.qf.forEach(function(t){ h+=tieRow(t,"QF"); });
    comp.br.sf.forEach(function(t){ h+=tieRow(t,"SF"); });
    if(comp.br.f) h+=tieRow(comp.br.f,"Final");
  }
  h+='</div>';
  return h;
}
function euroStatusLine(){
  if(!S.season.euro||!S.season.euro.myComp) return "";
  var key=S.season.euro.myComp, comp=S.season.euro.comps[key], me=myCupId();
  var txt;
  if(comp.winner===me) txt='<b class="gold">🏆 CHAMPIONS!</b>';
  else if(comp.meOut||comp.winner!=null) txt='<span class="red">out</span>';
  else if(comp.stage==="league") txt='league phase · '+ord(euroStandings(key).indexOf(me)+1);
  else txt=comp.stage;
  return '<div class="small">'+EU_DEF[key].badge+' '+esc(EU_DEF[key].name)+': '+txt+'</div>';
}

KIND_BADGE.EU="⭐";
