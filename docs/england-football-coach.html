<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>England Football Coach</title>
<style>
  :root{
    --bg:#0d1321; --panel:#171f33; --panel2:#1e2942; --line:#2b3a5c;
    --gold:#f5c542; --green:#37c871; --red:#e6534f; --text:#e8edf7; --dim:#8fa0bf;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;align-items:center;
    user-select:none;-webkit-user-select:none;overscroll-behavior:none;
  }
  #wrap{width:100%;max-width:520px;min-height:100%;display:flex;flex-direction:column;padding:10px 12px 24px;}
  /* Top bar */
  #topbar{display:flex;align-items:center;justify-content:space-between;padding:6px 0 10px;}
  #topbar .title{font-weight:800;font-size:18px;letter-spacing:1px;color:var(--gold);}
  .menu-btn{
    background:var(--panel2);border:1px solid var(--line);color:var(--text);
    padding:8px 14px;border-radius:10px;font-size:14px;font-weight:700;text-decoration:none;cursor:pointer;
  }
  .menu-btn:active{transform:scale(.96);}
  /* Generic */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;}
  h2{font-size:17px;margin-bottom:10px;} h3{font-size:14px;color:var(--dim);margin-bottom:8px;font-weight:600;}
  .btn{
    display:block;width:100%;text-align:center;background:var(--gold);color:#1a1a1a;border:none;
    padding:14px;border-radius:12px;font-size:16px;font-weight:800;cursor:pointer;margin-top:10px;
  }
  .btn.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line);}
  .btn.danger{background:var(--red);color:#fff;}
  .btn:disabled{opacity:.4;}
  .txt{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;color:var(--text);
    padding:14px;font-size:17px;font-weight:700;text-align:center;outline:none;margin-top:8px;}
  .txt:focus{border-color:var(--gold);}
  .btn:active:not(:disabled){transform:scale(.98);}
  .row{display:flex;gap:10px;} .row .btn{margin-top:10px;}
  .small{font-size:12px;color:var(--dim);}
  .center{text-align:center;}
  .badge{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-size:12px;color:var(--dim);}
  .gold{color:var(--gold);} .green{color:var(--green);} .red{color:var(--red);}
  /* Tournament select */
  .tour-btn{display:flex;align-items:center;justify-content:center;text-align:center;gap:12px;background:var(--panel);border:1px solid var(--line);
    border-radius:14px;padding:16px;margin-bottom:10px;width:100%;cursor:pointer;color:var(--text);}
  .tour-btn:active{transform:scale(.98);}
  .tour-btn .emoji{font-size:28px;} .tour-btn .name{font-size:16px;font-weight:800;}
  .tour-btn .sub{font-size:12px;color:var(--dim);margin-top:2px;}
  /* Pitch */
  #pitch{background:linear-gradient(180deg,#14532d,#166534 45%,#14532d);border:2px solid #1e7a45;border-radius:14px;
    padding:14px 6px;display:flex;flex-direction:column;gap:10px;margin-bottom:10px;}
  .pitch-row{display:flex;justify-content:space-evenly;}
  .slot{width:74px;min-height:64px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(0,0,0,.28);border:1.5px dashed rgba(255,255,255,.35);padding:4px 2px;cursor:pointer;}
  .slot .pos{font-size:11px;font-weight:800;color:rgba(255,255,255,.75);}
  .slot.filled{border-style:solid;border-color:rgba(255,255,255,.25);background:rgba(0,0,0,.45);}
  .slot .nm{font-size:10.5px;font-weight:700;text-align:center;line-height:1.15;margin-top:2px;}
  .slot .rt{font-size:11px;font-weight:800;color:var(--gold);}
  .slot.glow{border-color:var(--gold);border-style:solid;box-shadow:0 0 10px rgba(245,197,66,.65);animation:pulse 1s infinite;}
  @keyframes pulse{50%{box-shadow:0 0 18px rgba(245,197,66,.9);}}
  /* Scout */
  .scout-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .scout-team{font-weight:900;font-size:24px;letter-spacing:.5px;line-height:1.15;}
  .player-card{display:flex;justify-content:space-between;align-items:center;background:var(--panel2);
    border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:6px;cursor:pointer;}
  .player-card.disabled{opacity:.35;pointer-events:none;}
  .player-card.selected{border-color:var(--gold);box-shadow:0 0 8px rgba(245,197,66,.5);}
  .player-card:active{transform:scale(.98);}
  .pc-pos{font-size:11px;font-weight:800;width:34px;color:var(--dim);}
  .pc-name{flex:1;font-size:14px;font-weight:700;padding:0 6px;}
  .pc-rat{font-size:15px;font-weight:800;color:var(--gold);}
  /* Fixtures / tables */
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--line);}
  th{color:var(--dim);font-size:11px;font-weight:600;}
  td.tn{text-align:left;font-weight:700;} tr.me td{color:var(--gold);}
  .fixture{display:flex;justify-content:space-between;align-items:center;padding:9px 6px;border-bottom:1px solid var(--line);font-size:13px;}
  .fixture .fr{color:var(--dim);font-size:11px;width:88px;}
  .fixture .fs{font-weight:800;}
  .fixture.next{background:rgba(245,197,66,.08);border-radius:8px;}
  /* Match */
  #scoreboard{display:flex;justify-content:space-between;align-items:center;padding:8px 4px;}
  #scoreboard .team{width:38%;text-align:center;font-weight:800;font-size:14px;line-height:1.2;}
  #scoreboard .score{font-size:34px;font-weight:900;color:var(--gold);}
  #matchclock{text-align:center;font-size:28px;font-weight:900;color:var(--green);margin:4px 0 10px;letter-spacing:1px;}
  #matchclock .mc-round{display:block;font-size:12px;font-weight:600;color:var(--dim);letter-spacing:0;}
  #matchclock.injury{color:var(--red);}
  #ticker{background:var(--panel2);border:1px solid var(--line);border-radius:10px;min-height:150px;max-height:230px;
    overflow-y:auto;padding:10px;font-size:13px;display:flex;flex-direction:column-reverse;}
  #ticker div{padding:3px 0;border-bottom:1px dashed rgba(255,255,255,.07);}
  .ev-goal{color:var(--gold);font-weight:800;} .ev-opp{color:var(--red);font-weight:800;} .ev-info{color:var(--dim);}
  /* Modal */
  #modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
  #modal-bg.show{display:flex;}
  #modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;width:100%;max-width:400px;max-height:82vh;overflow-y:auto;}
  #modal h2{color:var(--gold);}
  /* Title celebration */
  #celebrate{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden;opacity:1;transition:opacity 1.2s ease;}
  .confetti{position:absolute;top:-24px;width:10px;height:16px;border-radius:2px;animation:confall linear forwards;}
  @keyframes confall{to{transform:translateY(112vh) rotate(720deg);}}
  .big-cup{position:absolute;top:38%;left:50%;font-size:120px;transform:translate(-50%,-50%) scale(0);
    animation:cupin .7s cubic-bezier(.2,1.6,.4,1) forwards;filter:drop-shadow(0 0 30px rgba(245,197,66,.8));}
  @keyframes cupin{to{transform:translate(-50%,-50%) scale(1);}}
  /* Trophy banner */
  .trophy-line{font-size:13px;color:var(--dim);margin-top:6px;}
  .bigresult{font-size:26px;font-weight:900;text-align:center;margin:14px 0;}

  /* EFC additions */
  .tabbar{display:flex;gap:6px;margin-bottom:10px;}
  .tab{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--dim);
    padding:8px 4px;border-radius:10px;font-size:12.5px;font-weight:700;cursor:pointer;}
  .tab.on{color:var(--gold);border-color:var(--gold);}
  .tab:active{transform:scale(.96);}
  .dim2{opacity:.5;}
  .ev-oppgoal{color:#c07ef0;font-weight:800;}  /* opposition goals: purple, not red */
  /* iPhone notch: viewport-fit=cover + generous safe-area fallback */
  #wrap{padding-top:max(44px, calc(env(safe-area-inset-top) + 12px));}
  .btn.mini{padding:9px;font-size:13px;font-weight:700;}
  /* opponent team-colour bar + shared pitch styling */
  .oppbar{border-radius:10px;padding:10px 12px;font-weight:900;font-size:16px;
    letter-spacing:.5px;text-align:center;margin:10px 0 6px;}
  .pitchbox{background:linear-gradient(180deg,#14532d,#166534 45%,#14532d);
    border:2px solid #1e7a45;border-radius:14px;padding:12px 6px;display:flex;
    flex-direction:column;gap:8px;margin-bottom:10px;}
  .pitchbox .slot{cursor:default;}
  .helptext p{margin:0 0 9px;line-height:1.5;}
  .helptext b{color:var(--text);}
  /* calendar */
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
  .cal-head{text-align:center;font-size:10px;color:var(--dim);font-weight:700;padding:2px 0;}
  .cal-cell{min-height:44px;background:var(--panel2);border:1px solid var(--line);border-radius:7px;
    padding:2px 3px;font-size:11px;position:relative;}
  .cal-cell.dimc{opacity:.25;border-style:dashed;}
  .cal-cell.has{cursor:pointer;}
  .cal-cell.cW{background:rgba(55,200,113,.30);border-color:var(--green);}
  .cal-cell.cL{background:rgba(230,83,79,.30);border-color:var(--red);}
  .cal-cell.cD{background:rgba(245,166,66,.30);border-color:#f5a642;}
  .cal-cell.cUp{background:rgba(143,160,191,.16);border-color:var(--line);}
  .cal-cell.cNext{background:rgba(90,162,255,.32);border-color:#5aa2ff;box-shadow:0 0 8px rgba(90,162,255,.5);}
  .cal-d{color:var(--dim);font-weight:700;}
  .cal-b{position:absolute;bottom:2px;left:3px;font-size:12px;letter-spacing:-2px;}
  /* draw ceremony */
  .drwbowl{width:120px;height:74px;margin:6px auto 2px;position:relative;
    border:2px solid rgba(255,255,255,.28);border-top:none;border-radius:0 0 60px 60px;
    background:radial-gradient(ellipse at 50% 100%, rgba(245,197,66,.10), rgba(255,255,255,.03));overflow:hidden;}
  .drwjig{position:absolute;width:16px;height:16px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff, #cfd6e4 55%, #8fa0bf);
    animation:jig 1.1s infinite ease-in-out;}
  .j1{left:12px;bottom:6px;} .j2{left:36px;bottom:12px;animation-delay:.15s;}
  .j3{left:58px;bottom:5px;animation-delay:.32s;} .j4{left:80px;bottom:13px;animation-delay:.5s;}
  .j5{left:96px;bottom:6px;animation-delay:.72s;} .j6{left:24px;bottom:22px;animation-delay:.9s;}
  @keyframes jig{50%{transform:translate(2px,-7px) rotate(12deg);}}
  .drawball{width:74px;height:74px;border-radius:50%;margin:8px auto 6px;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 35% 28%, #ffffff, #e4e9f4 50%, #97a7c6);
    box-shadow:0 6px 18px rgba(0,0,0,.5), inset 0 -4px 10px rgba(0,0,0,.18);
    animation:ballpop .45s cubic-bezier(.2,1.7,.4,1);}
  .drawball .db-num{font-size:30px;font-weight:900;color:#14181f;}
  @keyframes ballpop{0%{transform:translateY(26px) scale(.2);opacity:0;}100%{transform:none;opacity:1;}}
  .drwbar{border-radius:9px;padding:8px 12px;font-weight:900;font-size:14px;text-align:center;
    min-width:120px;animation:ballpop .35s ease-out;}
  .drwglow{box-shadow:0 0 14px rgba(245,197,66,.85);outline:1.5px solid var(--gold);}
  .drpot-row{font-size:12px;padding:3px 2px;border-bottom:1px dashed rgba(255,255,255,.06);}
  .drpot-row.drawn{opacity:.32;text-decoration:line-through;}
  .drpot-row.cur{color:var(--gold);font-weight:800;opacity:1;text-decoration:none;}
  .drpot-row.meline{font-weight:800;}
  .drpot-num{display:inline-block;width:22px;height:22px;border-radius:50%;background:var(--panel2);
    border:1px solid var(--line);text-align:center;line-height:20px;font-size:10px;font-weight:800;margin-right:4px;}
  /* grid columns are hard-clamped — a long name can never hide its opponent */
  .drtie{display:grid;grid-template-columns:1fr 18px 1fr;align-items:center;gap:2px;
    padding:4px 0;border-bottom:1px dashed rgba(255,255,255,.07);}
  .drtie .drwbar{width:100%;min-width:0;max-width:100%;box-sizing:border-box;
    font-size:11.5px;padding:6px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .drtie>.small{text-align:center;}
  .drpot-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 8px;}
  .mytie-card .drwbar{font-size:10.5px;padding:4px 6px;}
  .mytie-card .drtie{padding:2px 0;border-bottom:none;}
  /* transfer window banners */
  .winopen{background:rgba(55,200,113,.16);border:1.5px solid var(--green);border-radius:12px;
    padding:12px;margin-bottom:12px;font-weight:800;font-size:14px;color:var(--green);}
  .winshut{background:rgba(230,83,79,.10);border:1px solid var(--line);border-radius:12px;
    padding:12px;margin-bottom:12px;font-weight:700;font-size:13px;color:var(--dim);}
  /* fixed-width position column: smaller font so even three positions fit on
     one line, and every player name starts at the same point */
  .player-card .pc-pos{width:58px;flex:none;margin-right:8px;
    font-size:10px;white-space:nowrap;line-height:1.25;}
</style>
</head>

function slotAccepts(slotPos, pp){
  if(pp.indexOf(slotPos)!==-1) return true;
  if(slotPos==="RM"&&pp.indexOf("RW")!==-1) return true;
  if(slotPos==="LM"&&pp.indexOf("LW")!==-1) return true;
  if(slotPos==="RW"&&pp.indexOf("RM")!==-1) return true;

}

function grpOf(pos){ for(var g in GRP) if(GRP[g].indexOf(pos)!==-1) return g; return "MID"; }

// wage model: one tunable exponential (weekly £)
function wageOf(r){ return Math.round(60*Math.exp(0.076*r)/50)*50; }

// ---------- helpers ----------
function rnd(a,b){ return a+Math.random()*(b-a); }
function ri(a,b){ return Math.floor(rnd(a,b+1)); }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t; } return a; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function el(id){ return (typeof document!=="undefined"&&document.getElementById)?document.getElementById(id):null; }
function ord(n){ var s=["th","st","nd","rd"],v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
function poisson(x){ var L=Math.exp(-x),k=0,p=1; do{k++;p*=Math.random();}while(p>L); return k-1; }
function quickSim(rA,rB){ var d=rA-rB; return [poisson(Math.max(0.3,1.35+d*0.09)),poisson(Math.max(0.3,1.35-d*0.09))]; }
// circle-method double round robin: n teams -> 2(n-1) rounds of [home,away] index pairs
function leagueSchedule(n){
  var ids=[],i; for(i=0;i<n;i++) ids.push(i);
  var rounds=[],arr=ids.slice(1);
  for(var r=0;r<n-1;r++){
    var round=[[ids[0],arr[0]]];
    for(i=1;i<n/2;i++) round.push([arr[i],arr[arr.length-i]]);
    if(r%2===1) round=round.map(function(p){return [p[1],p[0]];});
    rounds.push(round);
    arr.push(arr.shift());
  }
  return rounds.concat(rounds.map(function(rd){return rd.map(function(p){return [p[1],p[0]];});}));
}

  }catch(e){ return {clubs:{},players:{},meta:{}}; }
}

    var clubs=dv.clubs.map(function(c,ci){
      var key=pyr+"."+ti+"."+ci;
      var sq=c.p.map(function(p,pi){
        var pe=ed.players[key+"."+pi]||{};
        return { n:pe.n||(alt&&p[5]?p[5]:p[0]), pos:(pe.pos||p[1]).split(","), r:p[2], a:p[3], f:p[4] };
      });
      var bm=c.m||["","",0,""], me=ed.meta[key]||{};
      var baseStad=alt&&c.altStad?c.altStad:bm[1];
      return { n:ed.clubs[key]||(alt&&c.alt?c.alt:c.n), sq:sq,
        meta:{ nick:(me.nick!=null?me.nick:(alt?"":bm[0])), stad:(me.stad!=null?me.stad:baseStad),
               cap:(me.cap!=null?me.cap:bm[2]), col:(me.col!=null?me.col:bm[3]) } };
    });

}

// ---------- generated players (create-a-club + draft back-fill) ----------
var GEN_SUR="Walsh Beckett Doyle Hargreaves Whitfield Osei Nwosu Boateng Kamara Draper Holloway Pritchard Mensah Adeyemi Quigley Rowntree Fenwick Ashby Caulfield Renshaw Ogilvie Bexley Harmon Stroud Pickard Mercer Ludlow Farrow Ambrose Doughty Frampton Garrity Ives Loxley Mowbray Ormsby Rimmer Selby Venn Yardley".split(" ");
var GEN_INI="A B C D E F G H J K L M N O P R S T W".split(" ");
var GEN_WFIRST="Amelia Beth Chloe Daisy Ellie Freya Grace Holly Imogen Jade Keira Lily Maya Niamh Orla Poppy Rosie Sophie Tilly Willow Zara Erin Isla Lauren Katie".split(" ");
function genName(women){
  return (women?pick(GEN_WFIRST)+" ":pick(GEN_INI)+". ")+pick(GEN_SUR);
}
function gauss(){ return (Math.random()+Math.random()+Math.random())*2-3; }
function genPlayer(pos,target,women,f){
  var r=Math.round(Math.max(35,Math.min(82,target+gauss()*2.2+rnd(-2,2))));
  return { n:genName(women), pos:pos.slice(), r:r, a:ri(18,30), f:(f==null?2:f) };
}
// 18-man plan meeting minimums exactly (2 GK / 6 DEF / 8 MID / 2 ATT)
var SQUAD_PLAN=[["GK"],["GK"],["CB"],["CB"],["CB"],["CB","RB"],["LB"],["RB"],
  ["CM"],["CM"],["CM"],["CM","LM"],["LM","LW"],["RM","RW"],["LM"],["RM"],["ST"],["ST","LW"]];
function genDefaultSquad(pyr,bt,divs){
  // mid-table strength: median squad average of the division
  var avgs=divs[bt].map(function(c){
    return c.sq.length?c.sq.reduce(function(a,p){return a+p.r;},0)/c.sq.length:0;
  }).filter(function(x){return x>0;}).sort(function(a,b){return a-b;});
  var target=avgs[Math.floor(avgs.length/2)]||55;
  var sq=SQUAD_PLAN.map(function(plan,i){ return genPlayer(plan,target+(i<4?2:0),pyr==="wfl"); });
  return sq.sort(function(a,b){return b.r-a.r;});
}
function bottomTier(pyr){ return DIV_META[pyr].length-1; }
// a club that sells below the legal floor immediately signs affordable
// replacements for what it needs (so transfers are never blocked)
function backfillClub(club){
  var avg=club.sq.length?club.sq.reduce(function(a,p){return a+p.r;},0)/club.sq.length:50;
  var women=S.pyr==="wfl";
  var added=0;
  for(var g in MINS){
    while(club.sq.filter(function(p){return p.pos.some(function(x){return GRP[g].indexOf(x)!==-1;});}).length<MINS[g]&&added<6){
      var np=genPlayer([pick(GRP[g])],avg-ri(4,9),women);
      np.w=wageOf(np.r); np.yrs=pick([2,3]);
      club.sq.push(np); added++;
    }
  }
  while(club.sq.length<18&&added<8){
    var np2=genPlayer([pick(GRP[pick(["DEF","MID","ATT"])])],avg-ri(4,9),women);
    np2.w=wageOf(np2.r); np2.yrs=pick([2,3]);
    club.sq.push(np2); added++;
  }
  return added;
}

// create-a-club: new club takes the league place of the bottom division's weakest side

function draftWageUsed(){
  var t=0;
  S.draft.picks.forEach(function(pk){ t+=wageOf(S.world[S.myTier].clubs[pk[0]].sq[pk[1]].r); });
  return t;
}
function draftCover(g){
  var n=0;
  S.draft.picks.forEach(function(pk){
    var p=S.world[S.myTier].clubs[pk[0]].sq[pk[1]];
    if(p.pos.some(function(x){return GRP[g].indexOf(x)!==-1;})) n++;
  });
  return n;
}
var MINS={GK:2,DEF:6,MID:8,ATT:2};
// each club's top players (by rating) are protected from the draft
function draftProtectedSet(ci){
  var club=S.world[S.myTier].clubs[ci];
  var idx=club.sq.map(function(p,pi){ return pi; });
  idx.sort(function(a,b){ return club.sq[b].r-club.sq[a].r; });
  var set={};
  idx.slice(0,DRAFT.protect).forEach(function(pi){ set[pi]=1; });
  return set;
}
// cheapest wage among UNPICKED, UNPROTECTED pool players (reserve budget for unfilled slots)
function draftMinWage(){
  var picked={};
  S.draft.picks.forEach(function(pk){ picked[pk[0]+"."+pk[1]]=1; });
  var min=1e9;
  S.world[S.myTier].clubs.forEach(function(c,ci){
    if(ci===S.myIdx) return;
    var prot=draftProtectedSet(ci);
    c.sq.forEach(function(p,pi){
      if(picked[ci+"."+pi]||prot[pi]) return;
      var w=wageOf(p.r); if(w<min) min=w;
    });
  });
  return min;
}
// max you can spend on the next signing while still affording the rest
function draftSpendable(){
  var slotsAfter=DRAFT.size-S.draft.picks.length-1;
  return S.draft.budget-draftWageUsed()-slotsAfter*draftMinWage();
}
// cheapest unpicked, unprotected player who can cover group g
function draftGrpMinWage(g){
  var picked={};
  S.draft.picks.forEach(function(pk){ picked[pk[0]+"."+pk[1]]=1; });
  var min=1e9;
  S.world[S.myTier].clubs.forEach(function(c,ci){
    if(ci===S.myIdx) return;
    var prot=draftProtectedSet(ci);
    c.sq.forEach(function(p,pi){
      if(picked[ci+"."+pi]||prot[pi]) return;
      if(!p.pos.some(function(x){return GRP[g].indexOf(x)!==-1;})) return;
      var w=wageOf(p.r); if(w<min) min=w;
    });
  });
  return min===1e9?0:min;
}
// can this player be signed while still leaving budget AND slots for every
// position minimum? (position-aware reserve — prevents all stranding paths)
function draftCanAfford(ci,pi){
  if(S.draft.picks.length>=DRAFT.size) return false;
  var p=S.world[S.myTier].clubs[ci].sq[pi];
  var wage=wageOf(p.r);
  var slotsAfter=DRAFT.size-S.draft.picks.length-1;
  var needed=0, reserve=0;
  for(var g in MINS){
    var cov=draftCover(g)+(p.pos.some(function(x){return GRP[g].indexOf(x)!==-1;})?1:0);
    var need=Math.max(0,MINS[g]-cov);
    needed+=need;
    reserve+=need*draftGrpMinWage(g);
  }
  if(needed>slotsAfter) return false; // would make the squad shape impossible
  reserve+=(slotsAfter-needed)*draftMinWage();
  return wage<=S.draft.budget-draftWageUsed()-reserve;
}
function draftValid(){
  if(S.draft.picks.length!==DRAFT.size) return false;
  if(draftWageUsed()>S.draft.budget) return false;
  for(var g in MINS) if(draftCover(g)<MINS[g]) return false;
  return true;
}
function finalizeDraft(){
  if(!draftValid()) return;
  var mine=myClub(), tier=S.myTier;
  // move drafted players (remove from sources in descending index order)
  var byClub={};
  S.draft.picks.forEach(function(pk){ (byClub[pk[0]]=byClub[pk[0]]||[]).push(pk[1]); });
  for(var ci in byClub){
    var club=S.world[tier].clubs[ci];
    byClub[ci].sort(function(a,b){return b-a;}).forEach(function(pi){
      mine.sq.push(club.sq.splice(pi,1)[0]);
    });
    // back-fill the raided club to legal shape with generated fringe players
    var avg=club.sq.reduce(function(a,p){return a+p.r;},0)/Math.max(1,club.sq.length);
    for(var g in MINS){
      while(club.sq.filter(function(p){return p.pos.some(function(x){return GRP[g].indexOf(x)!==-1;});}).length<MINS[g])
        club.sq.push(genPlayer([pick(GRP[g])],avg-6,S.pyr==="wfl"));
    }
    while(club.sq.length<18) club.sq.push(genPlayer([pick(GRP[pick(["DEF","MID","ATT"])])],avg-6,S.pyr==="wfl"));
  }
  mine.sq.sort(function(a,b){return b.r-a.r;});
  S.draft=null;
  startGraceIfOver();
  buildSeason();
  S.phase="hub";
  save();
}
function myClub(){ return S.world[S.myTier].clubs[S.myIdx]; }
function buildSeason(){
  S.season={ divs:[], stage:"league", playoffs:null, endStep:0 };
  S.world.forEach(function(dv,ti){
    var n=dv.clubs.length;
    S.season.divs.push({
      sched:leagueSchedule(n), md:0,
      t:dv.clubs.map(function(){ return { pts:0,gf:0,ga:0,pl:0,w:0,d:0,l:0,form:[] }; })
    });
  });
  // my fixture list
  var d=S.season.divs[S.myTier];
  S.season.mine=[];
  d.sched.forEach(function(round,mdi){
    round.forEach(function(pr){
      if(pr[0]===S.myIdx||pr[1]===S.myIdx){
        S.season.mine.push({ md:mdi, opp:(pr[0]===S.myIdx?pr[1]:pr[0]), home:pr[0]===S.myIdx,
                             played:false, scoreTxt:"", comp:"L" });
      }
    });
  });
  S.xi=null; S.xiPicked=false; // Game 1: the manager picks the first team
  // five pre-season friendlies vs random clubs from any division
  S.season.fr={ list:[], done:false };
  for(var fi=0;fi<5;fi++){
    var ti=ri(0,S.world.length-1), ci=ri(0,S.world[ti].clubs.length-1);
    if(ti===S.myTier&&ci===S.myIdx){ fi--; continue; }
    S.season.fr.list.push({ comp:"F", fr:1, n:fi+1, oppTi:ti, opp:ci, home:fi%2===0, played:false, scoreTxt:"", res:"" });
  }
  // Europe first (entrants feed the LC + weekend rule), then cups, then dates
  if(typeof buildEuro==="function") buildEuro();
  if(typeof buildCups==="function") buildCups();
  if(typeof assignSeasonDates==="function") assignSeasonDates();
  S.season.cupWinners=null;
  S.calView=null;
  // season-start finances: credit league money, sponsorship + prizes
  if(typeof seasonStartFinance==="function") seasonStartFinance();
  if(typeof scheduleRetirements==="function") scheduleRetirements();
  // wage discipline: after relegation grace runs out, a flat points
  // deduction applies each season the club starts over its wage budget
  S.season.capNote="";
  // CONTRACT wages — what you actually pay — not fresh-deal rates
  var bill=0; myClub().sq.forEach(function(p){ bill+=(p.w!=null?p.w:wageOf(p.r)); });
  if(bill>myCap()){
    if(S.capGrace>0) S.season.capNote="⏳ Over your wage budget — "+S.capGrace+" grace season"+(S.capGrace>1?"s":"")+" left to comply.";
    else {
      S.season.divs[S.myTier].t[S.myIdx].pts=-6;
      S.season.capNote="⚠️ Over your wage budget with no grace left — 6-point deduction applied.";
    }
  }
}
function mdTotal(){ return S.season.divs[S.myTier].sched.length; }
function nextFixture(){ for(var i=0;i<S.season.mine.length;i++) if(!S.season.mine[i].played&&!S.season.mine[i].mock) return S.season.mine[i]; return null; }

// ---------- XI + ratings ----------
function autoXI(club, formation){
  var slots=[]; FORMATIONS[formation].forEach(function(row){ row.forEach(function(p){ slots.push({pos:p,pi:-1}); }); });
  var used={};
  // strict pass: exact/adjacent position, best rating; scarce slots first
  var order=slots.map(function(s,i){ return i; }).sort(function(a,b){
    var ca=club.sq.filter(function(p){return slotAccepts(slots[a].pos,p.pos);}).length;
    var cb=club.sq.filter(function(p){return slotAccepts(slots[b].pos,p.pos);}).length;
    return ca-cb;
  });
  order.forEach(function(si){
    var best=-1,br=-1;
    club.sq.forEach(function(p,pi){
      if(used[pi]) return;
      if(!slotAccepts(slots[si].pos,p.pos)) return;
      if(p.r>br){ br=p.r; best=pi; }
    });
    if(best>=0){ used[best]=1; slots[si].pi=best; }
  });
  // fallback: same group, then anyone
  slots.forEach(function(s){
    if(s.pi>=0) return;
    var g=grpOf(s.pos),best=-1,br=-1;
    club.sq.forEach(function(p,pi){
      if(used[pi]) return;
      var sameG=p.pos.some(function(x){return GRP[g].indexOf(x)!==-1;});
      var sc=p.r+(sameG?200:0);
      if(sc>br){ br=sc; best=pi; }
    });
    if(best>=0){ used[best]=1; s.pi=best; }
  });
  return slots;
}
function xiRating(club, slots){
  var tot=0,cnt=0,chem=0;
  slots.forEach(function(s){
    if(s.pi<0) return;
    var p=club.sq[s.pi]; tot+=p.r; cnt++;
    if(p.pos[0]===s.pos) chem+=0.15;
    else if(slotAccepts(s.pos,p.pos)) chem+=0.05;
  });
  if(!cnt) return 0;
  return Math.round((tot/cnt+Math.min(chem,1.7))*10)/10;
}
// the manager picks the team: no silent auto-pick — an unset XI is empty slots
function emptySlots(formation){
  var slots=[]; FORMATIONS[formation].forEach(function(row){ row.forEach(function(p){ slots.push({pos:p,pi:-1}); }); });
  return slots;
}
function myXI(){
  if(!S.xi||S.xi.formation!==S.formation||S.xi.slots.length!==flatCount(S.formation))
    S.xi={formation:S.formation,slots:emptySlots(S.formation)};
  return S.xi.slots;
}
function xiComplete(){ return myXI().filter(function(s){return s.pi>=0;}).length===11; }
function autoPickXI(){
  S.xi={formation:S.formation,slots:autoXI(myClub(),S.formation)};
  S.xiPicked=true; save();
}
function skipFriendlies(){
  if(S.season&&S.season.fr){ S.season.fr.list.forEach(function(f){ f.played=true; }); S.season.fr.done=true; save(); }
}
function flatCount(f){ var n=0; FORMATIONS[f].forEach(function(r){n+=r.length;}); return n; }
function myRating(){ return xiRating(myClub(),myXI()); }
// AI club strength: best-XI average (cached per season)
function clubXiAvg(ti,ci){
  var d=S.season.divs[ti];
  if(!d.xiCache) d.xiCache={};
  if(d.xiCache[ci]==null){
    var club=S.world[ti].clubs[ci];
    d.xiCache[ci]=xiRating(club,autoXI(club,"4-4-2"));
  }
  return d.xiCache[ci];
}

// ---------- background sim ----------
function applyResult(ti,a,b,ga,gb){
  var T=S.season.divs[ti].t;
  T[a].gf+=ga; T[a].ga+=gb; T[a].pl++;
  T[b].gf+=gb; T[b].ga+=ga; T[b].pl++;
  if(ga>gb){ T[a].pts+=3; T[a].w++; T[b].l++; T[a].form.push("W"); T[b].form.push("L"); }
  else if(gb>ga){ T[b].pts+=3; T[b].w++; T[a].l++; T[b].form.push("W"); T[a].form.push("L"); }
  else { T[a].pts++; T[b].pts++; T[a].d++; T[b].d++; T[a].form.push("D"); T[b].form.push("D"); }
  if(T[a].form.length>5) T[a].form.shift();
  if(T[b].form.length>5) T[b].form.shift();
}
// sim one full AI round of division ti (skipping my pair if it's my division)
function simRound(ti, results){
  var d=S.season.divs[ti];
  if(d.md>=d.sched.length) return;
  d.sched[d.md].forEach(function(pr){
    if(ti===S.myTier&&(pr[0]===S.myIdx||pr[1]===S.myIdx)) return; // mine is played live
    var r=quickSim(clubXiAvg(ti,pr[0])+0.7, clubXiAvg(ti,pr[1])-0.7);
    applyResult(ti,pr[0],pr[1],r[0],r[1]);
    // AI club books tick over every matchday
    var ca=S.world[ti].clubs[pr[0]], cb=S.world[ti].clubs[pr[1]];
    if(ca.fin&&ca.fin.mHome!=null) ca.fin.bal+=ca.fin.mHome;
    if(cb.fin&&cb.fin.mAway!=null) cb.fin.bal+=cb.fin.mAway;
    if(results) results.push({a:S.world[ti].clubs[pr[0]].n, ga:r[0], gb:r[1], b:S.world[ti].clubs[pr[1]].n});
  });
  d.md++;
}
// after my matchday advances, bring other divisions proportionally level
function advanceOthers(){
  var frac=S.season.divs[S.myTier].md/mdTotal();
  S.season.divs.forEach(function(d,ti){
    if(ti===S.myTier) return;
    var target=Math.round(frac*d.sched.length);
    while(d.md<target) simRound(ti);
  });
}
// standings for a division: array of club indices sorted by pts/gd/gf
function standings(ti){
  var T=S.season.divs[ti].t;
  var idx=T.map(function(_,i){return i;});
  idx.sort(function(a,b){ return T[b].pts-T[a].pts || (T[b].gf-T[b].ga)-(T[a].gf-T[a].ga) || T[b].gf-T[a].gf; });
  return idx;
}
function myPos(){ return standings(S.myTier).indexOf(S.myIdx)+1; }

// ============================================================
// MATCH ENGINE (forked from Premier Glory: per-minute xG, cards, ET/pens for KO)
// ============================================================
var SCORE_W={ST:2.4,LW:1.7,RW:1.7,LM:1.1,RM:1.1,CM:1.0,CB:0.25,RB:0.3,LB:0.3,GK:0};
var CARD_W={CB:1.5,CM:1.3,RB:1.2,LB:1.2,LM:0.9,RM:0.9,LW:0.7,RW:0.7,ST:0.8,GK:0.15};
function weightedName(list,wmap,excl){
  var ps=list.filter(function(p){return excl.indexOf(p.n)===-1;});
  if(!ps.length) return null;
  var w=ps.map(function(p){ return p.r*Math.max.apply(null,p.pos.map(function(x){return wmap[x]||0.3;})); });
  var sum=w.reduce(function(a,b){return a+b;},0);
  if(sum<=0) return ps[0].n;
  var t=rnd(0,sum);
  for(var i=0;i<ps.length;i++){ t-=w[i]; if(t<=0) return ps[i].n; }
  return ps[ps.length-1].n;
}
function xiPlayers(){ var c=myClub(); return myXI().filter(function(s){return s.pi>=0;}).map(function(s){return c.sq[s.pi];}); }
function scorerName(){ return weightedName(xiPlayers().filter(function(p){return p.pos.indexOf("GK")===-1;}),SCORE_W,M.offMe)||"Own goal"; }
function oppScorerName(){ return weightedName(M.oppSquad.filter(function(p){return p.pos.indexOf("GK")===-1;}),SCORE_W,M.offOpp)||"Unknown"; }
function cardName(mine){
  if(mine) return weightedName(xiPlayers(),CARD_W,M.offMe);
  return weightedName(M.oppSquad,CARD_W,M.offOpp);
}
function maybeCard(mine){
  if(Math.random()>=0.021) return;
  var n=cardName(mine); if(!n) return;
  var booked=mine?M.bookedMe:M.bookedOpp, off=mine?M.offMe:M.offOpp;
  if(off.indexOf(n)!==-1) return;
  var straightRed=Math.random()<0.02;
  if(booked[n]&&!straightRed&&Math.random()<0.78) return;
  if(!straightRed&&!booked[n]){
    booked[n]=1;
    M.cards.push({min:M.min,side:mine?"me":"opp",n:n,t:"Y"});
    addEv(M.min+"' 🟨 "+n+(mine?"":" ("+M.oppName+")"),"ev-info");
    if(mine) M.xgMe*=0.985; else M.xgOpp*=0.985;
  } else {
    var second=!straightRed;
    off.push(n);
    M.cards.push({min:M.min,side:mine?"me":"opp",n:n,t:second?"YR":"R"});
    var men=11-off.length; // correct count for a second (or third…) red
    addEv(M.min+"' 🟥 "+n+(second?" (second yellow)":"")+" — "+(mine?"down to "+men+" men!":M.oppName+" down to "+men+"!"),mine?"ev-opp":"ev-goal");
    if(mine){ M.xgMe*=0.72; M.xgOpp*=1.25; } else { M.xgOpp*=0.72; M.xgMe*=1.25; }
  }
}
function addEv(t,c){ M.events.push({t:t,c:c||"ev-info"}); }
function scoreStr(){ return M.f.home?(M.gMe+"\u2013"+M.gOpp):(M.gOpp+"\u2013"+M.gMe); } // home team first
function penStr(){ return M.f.home?(M.pens.me+"\u2013"+M.pens.opp):(M.pens.opp+"\u2013"+M.pens.me); }

function currentFixture(){
  if(S.season.stage==="playoff"){ var po=S.season.po[S.myTier]; return po&&po.myNext?po.myNext:null; }
  if(S.season.fr&&!S.season.fr.done){
    var nf=null;
    S.season.fr.list.forEach(function(f){ if(!nf&&!f.played) nf=f; });
    if(nf) return nf;
    S.season.fr.done=true;
  }
  return nextFixture();
}
function fxOppClub(f){ return S.world[f.oppTi!=null?f.oppTi:S.myTier].clubs[f.opp]; }
function kickOff(instant){
  var block=(typeof transferBlockMsg==="function")?transferBlockMsg():null;
  if(block){ showModal('<h2>Squad not ready</h2><p class="small">'+esc(block)+'</p><button class="btn" onclick="hideModal();setTab(\'trf\');render()">Go to Transfers</button>'); return; }
  if(typeof pendingDraw==="function"){
    var pd0=pendingDraw();
    if(pd0){ startDrawFor(pd0); return; } // the draw comes before the next match
  }
  if(!xiComplete()){
    S.phase="lineup"; save(); render();
    showModal('<h2>📋 Pick your team</h2><p class="small">You need a full XI before kick-off. Tap the slots to place players, or use Auto-pick.</p><button class="btn" onclick="hideModal()">OK</button>');
    return;
  }
  var f=currentFixture(); if(!f) return;
  var oppTi=f.oppTi!=null?f.oppTi:S.myTier;
  var oppClub=fxOppClub(f);
  var myR=myRating();
  var oppR=clubXiAvg(oppTi,f.opp)+DIFF_OFF[S.pyr][S.myTier]+(f.home?-1.2:1.2)+rnd(-2,2);
  oppR=Math.round(Math.max(35,Math.min(99,oppR))*10)/10;
  var d=myR-oppR;
  M={ f:f, oppName:oppClub.n, oppSquad:oppClub.sq, myR:myR, oppR:oppR,
      min:0,gMe:0,gOpp:0,events:[],
      xgMe:Math.max(0.35,1.45+d*0.10),xgOpp:Math.max(0.30,1.40-d*0.10),
      period:"1H",stop:ri(1,5),et:false,pens:null,over:false,speed:1,
      goalsMe:[],goalsOpp:[],shotsMe:0,shotsOpp:0,
      cards:[],offMe:[],offOpp:[],bookedMe:{},bookedOpp:{},others:[],note:null };
  if(f.agg){ M.events.push({t:"Second leg — aggregate "+(f.agg[0])+"\u2013"+(f.agg[1])+" from the first leg",c:"ev-info"}); }
  // pre-sim the rest of my division's round so scores tick in live
  if(f.comp==="L"){
    var d=S.season.divs[S.myTier];
    M.liveOthers=[];
    (d.sched[f.md]||[]).forEach(function(pr){
      if(pr[0]===S.myIdx||pr[1]===S.myIdx) return;
      var r=quickSim(clubXiAvg(S.myTier,pr[0])+0.7, clubXiAvg(S.myTier,pr[1])-0.7);
      var goals=[];
      for(var g=0;g<r[0];g++) goals.push({m:ri(2,92),s:0});
      for(g=0;g<r[1];g++) goals.push({m:ri(2,92),s:1});
      goals.sort(function(a,b){return a.m-b.m;});
      M.liveOthers.push({ a:pr[0], b:pr[1], ga:r[0], gb:r[1], goals:goals });
    });
  }
  if(instant){
    // synchronous: minuteStep's boundary handlers (endNinety / endExtraTime /
    // instantShootout) finish the match themselves since phase !== "match"
    var guard=0;
    while(!M.over&&guard++<400) minuteStep();
    showSummary();
  } else {
    S.phase="match"; save(); render(); startTicker();
  }
}
function minuteStep(){
  M.min++;
  var perMin=1/93;
  if(Math.random()<M.xgMe*perMin){
    M.gMe++; M.shotsMe++;
    var n=scorerName(); M.goalsMe.push({n:n,min:M.min});
    addEv(M.min+"' ⚽ GOAL! "+n+"! "+scoreStr(),"ev-goal");
  } else if(Math.random()<M.xgMe*perMin*1.9) M.shotsMe++;
  if(Math.random()<M.xgOpp*perMin){
    M.gOpp++; M.shotsOpp++;
    var o=oppScorerName(); M.goalsOpp.push({n:o,min:M.min});
    addEv(M.min+"' ⚽ "+M.oppName+" score — "+o+". "+scoreStr(),"ev-oppgoal");
  } else if(Math.random()<M.xgOpp*perMin*1.9) M.shotsOpp++;
  maybeCard(true); maybeCard(false);
  if(M.min===45&&M.period==="1H"){ M.period="2H"; addEv("Half-time: "+scoreStr()); }
  if(M.min===90&&M.period==="2H"&&M.stop>0) addEv("+"+M.stop+" minutes of stoppage time");
  if(M.min===90+(M.period==="2H"?M.stop:0)&&!M.et&&M.period==="2H"){ endNinety(); return false; }
  if(M.et&&M.min>=120){ endExtraTime(); return false; }
  return true;
}
function aggLevel(){
  var a0=M.f.agg?M.f.agg[0]:0, a1=M.f.agg?M.f.agg[1]:0;
  return (M.gMe+a0)===(M.gOpp+a1);
}
function endNinety(){
  if(!aggLevel()||!M.f.ko){ finishMatch(); return; }
  addEv("Full-time "+scoreStr()+" — EXTRA TIME!","ev-info");
  M.et=true; M.min=90; if(el("mscore")) drawMatch();
}
function endExtraTime(){
  if(!aggLevel()){ finishMatch(); return; }
  addEv("Still level after 120' — PENALTIES!","ev-info");
  stopMatchTimer();
  if(S.phase==="match") runShootout(); else instantShootout();
}
function penProbs(){ return [0.76+(M.myR-M.oppR)*0.006, 0.76-(M.myR-M.oppR)*0.006]; }
function shootoutKick(kick){
  var p=penProbs(), myTurn=(kick%2===1);
  if(myTurn){ if(Math.random()<p[0]) M.pens.me++; }
  else { if(Math.random()<p[1]) M.pens.opp++; }
  addEv("Pens: "+penStr(),myTurn?"ev-goal":"ev-opp");
  var meK=Math.ceil(kick/2), opK=Math.floor(kick/2), decided=false;
  if(meK<=5){
    if(M.pens.me>M.pens.opp+(5-opK)) decided=true;
    if(M.pens.opp>M.pens.me+(5-meK)) decided=true;
    if(meK===5&&kick%2===0&&M.pens.me!==M.pens.opp) decided=true;
  } else if(kick%2===0&&M.pens.me!==M.pens.opp) decided=true;
  return decided;
}
function runShootout(){
  M.pens={me:0,opp:0}; var kick=0;
  matchTimer=setInterval(function(){
    kick++;
    var done=shootoutKick(kick);
    drawMatch();
    if(done){ clearInterval(matchTimer); matchTimer=null; finishMatch(true); drawMatch(); showSummary(); }
  },650);
}
function instantShootout(){
  M.pens={me:0,opp:0}; var kick=0;
  while(true){ kick++; if(shootoutKick(kick)) break; if(kick>60) break; }
  finishMatch(true);
}
function startTicker(){
  stopMatchTimer();
  matchTimer=setInterval(function(){
    if(!M||M.over){ stopMatchTimer(); return; }
    for(var s=0;s<M.speed;s++){ if(!minuteStep()) break; }
    drawMatch();
    if(M.over&&!M.pens){ showSummary(); }
  },320);
}
function skipMatch(){
  if(!M||M.over||M.pens) return;
  stopMatchTimer();
  while(!M.over&&!M.pens){ if(!minuteStep()) break; }
  drawMatch();
  if(M.over) showSummary();
}
function toggleSpeed(){ M.speed=M.speed===1?4:1; var b=el("spdbtn"); if(b) b.textContent="⏩ Speed ×"+M.speed; }

function finishMatch(byPens){
  stopMatchTimer();
  if(M.over) return;
  M.over=true;
  var f=M.f;
  var won=M.gMe>M.gOpp, drew=M.gMe===M.gOpp;
  if(byPens){ won=M.pens.me>M.pens.opp; drew=false; }
  f.played=true;
  f.scoreTxt=M.gMe+"–"+M.gOpp+(byPens?" ("+M.pens.me+"–"+M.pens.opp+"p)":"");
  f.res=won?"W":(drew?"D":"L");
  if(f.comp!=="F"){ if(won) S.coach.w++; else if(drew) S.coach.d++; else S.coach.l++; }
  if(typeof matchFinance==="function") matchFinance(f);
  M.resWon=won; M.resDrew=drew;
  if(f.comp==="L"){
    var home=f.home?S.myIdx:f.opp, away=f.home?f.opp:S.myIdx;
    applyResult(S.myTier, home, away, f.home?M.gMe:M.gOpp, f.home?M.gOpp:M.gMe);
    // the round's other games were pre-simmed for the live feed — apply them now
    var d=S.season.divs[S.myTier];
    (M.liveOthers||[]).forEach(function(lo){
      applyResult(S.myTier, lo.a, lo.b, lo.ga, lo.gb);
      M.others.push({ a:S.world[S.myTier].clubs[lo.a].n, ga:lo.ga, gb:lo.gb, b:S.world[S.myTier].clubs[lo.b].n });
    });
    d.md++;
    advanceOthers();
    if(typeof resolveCupsUpTo==="function") resolveCupsUpTo(f.date);
    if(typeof resolveEuroUpTo==="function") resolveEuroUpTo(f.date);
    if(typeof rollCheck2==="function") rollCheck2(); else if(!nextFixture()) leagueComplete();
  } else if(f.comp==="EC"||f.comp==="LC"){
    cupMyResult(f,won);
    advanceOthers();
    if(typeof resolveEuroUpTo==="function") resolveEuroUpTo(f.date);
    rollCheck2();
  } else if(f.comp==="EU"){
    euroMyResult(f,won,byPens);
    advanceOthers();
    if(typeof resolveCupsUpTo==="function") resolveCupsUpTo(f.date);
    rollCheck2();
  } else if(f.comp==="PO"){
    playoffMyResult(won);
  }
  S.phase="hub"; save();
}

// ============================================================
// POSTSEASON: playoffs → moves → new season
// ============================================================
function leagueComplete(){
  // finish every division fully
  S.season.divs.forEach(function(d,ti){ while(d.md<d.sched.length) simRound(ti); });
  if(typeof resolveCupsAll==="function") resolveCupsAll();
  if(typeof resolveEuroAll==="function") resolveEuroAll();
  buildPlayoffs();
  S.season.stage="playoff";
  resolveAiPlayoffs();
  save();
}
function buildPlayoffs(){
  S.season.po={};
  S.world.forEach(function(dv,ti){
    var rule=PYR_RULES[S.pyr][ti];
    if(!rule.po) return;
    var st=standings(ti);
    var po={ ti:ti, ranks:st, matches:[], winner:null, myNext:null, log:[] };
    var six=rule.po[1]-rule.po[0]===5;
    if(six){
      po.stagePlan=[ [[st[3],st[6]],[st[4],st[5]]], null, null ]; // QF; SF/F filled as we go
      po.stageNames=["Playoff QF","Playoff SF","Playoff Final"];
    } else {
      po.stagePlan=[ [[st[rule.po[0]-1],st[rule.po[1]-1]],[st[rule.po[0]],st[rule.po[1]-2]]], null ];
      po.stageNames=["Playoff SF","Playoff Final"];
    }
    po.stageIdx=0; po.pending=po.stagePlan[0].slice(); po.winners=[];
    S.season.po[ti]=po;
  });
}
function poSimTie(ti,a,b){
  var ra=clubXiAvg(ti,a)+0.7, rb=clubXiAvg(ti,b)-0.7;
  var r=quickSim(ra,rb), pn="";
  var w;
  if(r[0]===r[1]){ var aw=Math.random()<0.5+(ra-rb)*0.02; w=aw?a:b; pn=" (pens)"; }
  else w=r[0]>r[1]?a:b;
  return { a:a,b:b,ga:r[0],gb:r[1],w:w,pn:pn };
}
function poAdvanceStage(po){
  var six=po.stageNames.length===3, st=po.ranks, ws=po.winners;
  po.stageIdx++;
  if(po.stageIdx>=po.stageNames.length){ po.winner=ws[0]; po.pending=[]; return; }
  if(six&&po.stageIdx===1) po.pending=[[st[1],ws[1]],[st[2],ws[0]]]; // 2nd v (5v6 winner), 3rd v (4v7 winner)
  else po.pending=[[ws[0],ws[1]]];
  po.winners=[];
}
function poStep(po){
  // resolve current stage: AI ties simmed; my tie -> playable fixture
  var mine=null;
  po.pending.forEach(function(pair){
    if(po.ti===S.myTier&&(pair[0]===S.myIdx||pair[1]===S.myIdx)) mine=pair;
  });
  po.pending.forEach(function(pair){
    if(pair===mine) return;
    var t=poSimTie(po.ti,pair[0],pair[1]);
    po.winners.push(t.w);
    po.log.push(po.stageNames[po.stageIdx]+": "+S.world[po.ti].clubs[t.a].n+" "+t.ga+"–"+t.gb+t.pn+" "+S.world[po.ti].clubs[t.b].n);
  });
  if(mine){
    var opp=mine[0]===S.myIdx?mine[1]:mine[0];
    var homeAdv=po.ranks.indexOf(S.myIdx)<po.ranks.indexOf(opp);
    po.myNext={ md:-1, opp:opp, home:homeAdv, played:false, scoreTxt:"", comp:"PO", ko:true, round:po.stageNames[po.stageIdx],
                date:(typeof poDate==="function"?poDate(po.stageIdx):undefined) };
    S.season.mine.push(po.myNext); // appears on the schedule screen
    return false; // wait for player match
  }
  poAdvanceStage(po);
  return true;
}
function resolveAiPlayoffs(){
  for(var ti in S.season.po){
    var po=S.season.po[ti];
    while(po.winner===null){
      if(!poStep(po)) break; // player involved — stop auto
    }
  }
  checkPostseasonDone();
}
function playoffMyResult(won){
  var po=S.season.po[S.myTier], f=po.myNext;
  po.log.push(f.round+": "+(f.home?myClub().n:S.world[po.ti].clubs[f.opp].n)+" "+
    (f.home?M.gMe+"–"+M.gOpp:M.gOpp+"–"+M.gMe)+(M.pens?" (pens)":"")+" "+
    (f.home?S.world[po.ti].clubs[f.opp].n:myClub().n));
  po.winners.push(won?S.myIdx:f.opp);
  po.myNext=null;
  poAdvanceStage(po);
  while(po.winner===null){ if(!poStep(po)) break; }
  checkPostseasonDone();
}
function checkPostseasonDone(){
  var allDone=true;
  for(var k in S.season.po){ if(S.season.po[k].winner===null) allDone=false; }
  if(allDone){ S.season.stage="moves"; computeMoves(); }
  save();
}
function computeMoves(){
  // per-tier: champions, promoted[], relegated[]  (club objects)
  var res=S.world.map(function(dv,ti){
    var rule=PYR_RULES[S.pyr][ti], st=standings(ti), clubs=dv.clubs;
    var up=st.slice(0,rule.up).map(function(i){return i;});
    if(ti===0) up=[];
    if(rule.po&&S.season.po[ti]&&S.season.po[ti].winner!==null) up.push(S.season.po[ti].winner);
    var down=rule.down?st.slice(st.length-rule.down):[];
    return { champion:st[0], up:up, down:down, table:st };
  });
  S.season.moves=res;
  if(typeof seasonPrizes==="function") seasonPrizes(res);
  // roll of honour: every division's champion this season
  S.history=S.history||[];
  var champList=S.world.map(function(dv,ti){ return { div:dv.name, club:dv.clubs[res[ti].champion].n }; });
  if(S.season.cupWinners){
    if(S.season.cupWinners.ec) champList.push({ div:"English Cup", club:S.season.cupWinners.ec });
    if(S.season.cupWinners.lc) champList.push({ div:"League Challenge Cup", club:S.season.cupWinners.lc });
  }
  S.history.push({ yr:S.yr, champs:champList, myDiv:S.world[S.myTier].name, myPos:myPos() });
  // record my season + honours
  var pos=myPos(), divName=S.world[S.myTier].name;
  var me={ yr:S.yr, div:divName, pos:pos, pts:S.season.divs[S.myTier].t[S.myIdx].pts };
  if(pos===1){ me.champion=true; addHonour({yr:S.yr,div:divName,club:myClub().n,type:"Champions"}); }
  var myMove=res[S.myTier];
  if(myMove.up.indexOf(S.myIdx)!==-1&&pos>1) addHonour({yr:S.yr,div:divName,club:myClub().n,type:pos<=PYR_RULES[S.pyr][S.myTier].up?"Promoted":"Playoff winners"});
  S.coach.seasons.push(me);
  save();
}
function applyMovesAndNextSeason(){
  var res=S.season.moves, pyr=S.pyr;
  var myClubObj=myClub();
  if(typeof processContractsSeasonEnd==="function") processContractsSeasonEnd();
  if(typeof processStaffSeasonEnd==="function") processStaffSeasonEnd();
  if(typeof euroSeasonEndHook==="function") euroSeasonEndHook();
  // record finishing positions for next season's league money & sponsorship
  S.world.forEach(function(dv,ti){
    standings(ti).forEach(function(ci,rank){ if(dv.clubs[ci].fin) dv.clubs[ci].fin.lastPos=rank+1; });
  });
  var newDivs=S.world.map(function(dv){ return { name:dv.name, clubs:[] }; });
  S.world.forEach(function(dv,ti){
    dv.clubs.forEach(function(c,ci){
      var dest=ti;
      if(res[ti].up.indexOf(ci)!==-1) dest=ti-1;
      else if(res[ti].down.indexOf(ci)!==-1) dest=ti+1;
      dest=Math.max(0,Math.min(newDivs.length-1,dest));
      newDivs[dest].clubs.push(c);
    });
  });
  // sanity: division sizes must be preserved
  newDivs.forEach(function(dv,ti){
    if(dv.clubs.length!==DIV_META[pyr][ti].n) throw new Error("division size broke: "+dv.name+"="+dv.clubs.length);
  });
  var tierBefore=S.myTier;
  S.world=newDivs;
  S.world.forEach(function(dv,ti){
    var i=dv.clubs.indexOf(myClubObj);
    if(i!==-1){ S.myTier=ti; S.myIdx=i; }
  });
  // relegation grants (or refreshes) a 2-season wage-cap grace period
  if(S.myTier>tierBefore) S.capGrace=2;
  else if(S.capGrace>0) S.capGrace--;
  S.yr++;
  buildSeason();
  save();
}

function render(){
  stopMatchTimer();
  var app=el("app"); if(!app) return;
  if(typeof HELP_OPEN!=="undefined"&&HELP_OPEN){ renderHelp(app); return; }
  if(EDITOR){ renderEditor(app); return; }
  if(!S){ renderHome(app); return; }
  if(S.phase==="match"){ renderMatch(app); return; }
  if(S.phase==="lineup"){ renderLineup(app); return; }
  if(S.phase==="draft"){ renderDraft(app); return; }
  if(S.phase==="draw"&&typeof DR!=="undefined"&&DR){ renderDrawShow(app); return; }
  if(S.phase==="draw"){ S.phase="hub"; }
  renderHub(app);
}

// live squad strength: average of all signings + rating of the best XI they'd form
function draftStrengthLine(){
  var ps=S.draft.picks.map(function(pk){ return S.world[S.myTier].clubs[pk[0]].sq[pk[1]]; });
  if(!ps.length) return '<div class="small" style="margin:4px 0;">Squad avg: – · Best XI: –</div>';
  var avg=ps.reduce(function(a,p){return a+p.r;},0)/ps.length;
  var temp={ n:"", sq:ps };
  var slots=autoXI(temp,"4-4-2");
  var filled=slots.filter(function(s){return s.pi>=0;}).length;
  var xi=xiRating(temp,slots);
  // division context: average club XI strength (cached — no season exists yet mid-draft)
  if(S.draft.divAvg==null){
    var tot=0,n=0;
    S.world[S.myTier].clubs.forEach(function(c,ci){
      if(ci===S.myIdx) return;
      tot+=xiRating(c,autoXI(c,"4-4-2")); n++;
    });
    S.draft.divAvg=n?Math.round(tot/n*10)/10:0;
  }
  var divAvg=S.draft.divAvg;
  return '<div class="small" style="margin:4px 0;">Squad avg: <b class="gold">'+avg.toFixed(1)+'</b>'
    +' · Best XI'+(filled<11?' ('+filled+'/11)':'')+': <b class="gold">'+xi.toFixed(1)+'</b>'
    +' <span class="small">(division XI avg '+divAvg.toFixed(1)+')</span></div>';
}

    h+='<div class="card"><h3>Your signings</h3>';

      var p=S.world[tier].clubs[pk[0]].sq[pk[1]];
      h+='<div class="player-card selected" onclick="draftToggle('+pk[0]+','+pk[1]+')">'
        +'<span class="pc-pos">'+p.pos.join("·")+'</span><span class="pc-name">'+esc(p.n)+'</span>'
        +'<span class="small" style="margin-right:8px;">'+fmtMoney(wageOf(p.r))+'</span><span class="pc-rat">'+p.r+'</span></div>';
    });
    h+='<div class="small">Tap a signing to release them.</div></div>';
  }
  // pool
  h+='<div class="card"><h3>Player pool — other '+esc(S.world[tier].name)+' clubs</h3>'
    +'<div style="display:flex;gap:6px;margin:6px 0 8px;flex-wrap:wrap;">';
  ["ALL","GK","DEF","MID","ATT"].forEach(function(g){
    h+='<button class="tab'+(S.draft.grp===g?' on':'')+'" style="flex:none;padding:6px 10px;" onclick="S.draft.grp=\''+g+'\';save();render()">'+g+'</button>';
  });
  h+='</div><div style="max-height:430px;overflow-y:auto;">';
  var rows=[];
  S.world[tier].clubs.forEach(function(c,ci){
    if(ci===S.myIdx) return;
    var prot=draftProtectedSet(ci);
    c.sq.forEach(function(p,pi){
      if(picksKey[ci+"."+pi]||prot[pi]) return; // top players are protected
      if(S.draft.grp!=="ALL"&&grpOf(p.pos[0])!==S.draft.grp) return;
      rows.push({ci:ci,pi:pi,p:p,club:c.n});
    });
  });
  rows.sort(function(a,b){return b.p.r-a.p.r;});
  // affordable players first so a tight budget never hides your only options;
  // affordability reserves budget for every unfilled position minimum
  rows.forEach(function(x){ x.ok=draftCanAfford(x.ci,x.pi); });
  var afford=rows.filter(function(x){return x.ok;});
  var tooDear=rows.filter(function(x){return !x.ok;});
  var shown=afford.slice(0,140);
  if(shown.length<140) shown=shown.concat(tooDear.slice(0,140-shown.length));
  shown.forEach(function(x){
    var wage=wageOf(x.p.r);
    h+='<div class="player-card'+(x.ok?'':' dim2')+'" onclick="draftToggle('+x.ci+','+x.pi+')">'
      +'<span class="pc-pos">'+x.p.pos.join("·")+'</span>'
      +'<span class="pc-name">'+esc(x.p.n)+'<br><span class="small">'+esc(x.club)+'</span></span>'
      +'<span class="small" style="margin-right:8px;">'+fmtMoney(wage)+'</span><span class="pc-rat">'+x.p.r+'</span></div>';
  });
  if(afford.length>140) h+='<div class="small center" style="padding:6px;">Showing your best 140 affordable players — use the position filters</div>';
  else if(rows.length>shown.length) h+='<div class="small center" style="padding:6px;">'+(rows.length-shown.length)+' more above your budget hidden — use the position filters</div>';
  h+='</div></div>'
    +'<button class="btn danger" onclick="abandon()">Abandon career</button>';
  app.innerHTML=h;
}
function draftToggle(ci,pi){
  var k=-1;
  S.draft.picks.forEach(function(pk,i){ if(pk[0]===ci&&pk[1]===pi) k=i; });
  if(k>=0) S.draft.picks.splice(k,1);
  else {
    if(draftProtectedSet(ci)[pi]) return; // protected player
    if(!draftCanAfford(ci,pi)) return;    // budget or squad-shape would break
    S.draft.picks.push([ci,pi]);
  }
  save(); render();
}

// applied whenever a save is loaded (boot or career switch)
function normalizeLoadedSave(){
  if(S.phase==="match"||S.phase==="lineup"||S.phase==="draw") S.phase="hub";
  // migrate pre-finance saves: give every club its books mid-career
  if(S.world&&S.world[0]&&S.world[0].clubs[0]&&!S.world[0].clubs[0].fin){
    initFinances();
    if(S.season) seasonStartFinance();
    save();
  }
  // migrate pre-contract saves
  if(S.world&&myClub().sq[0]&&myClub().sq[0].w==null){ initContracts(); save(); }
  // one-off trim for impossibly-overspending clubs (Tamworth rule) on old saves
  if(S.world&&!S.osFix&&typeof normalizeOverspenders==="function"){ normalizeOverspenders(); save(); }
  // migrate pre-Phase-3 saves: retrofit dates; cups begin next season
  if(S.season&&S.season.divs&&!S.season.divs[0].dates&&typeof assignSeasonDates==="function"){
    assignSeasonDates();
    if(S.season.fr&&S.season.fr.done) S.season.fr.list.forEach(function(f,i){ f.date=-26+i*5; });
    if(S.season.cups===undefined) S.season.cups=null;
    save();
  }
  // migrate pre-staff saves (and staff hired before contracts existed)
  if(!S.staff){ initStaff(); save(); }
  else if(S.staff.length&&S.staff[0].yrs==null){
    S.staff.forEach(function(s){ s.yrs=pick([1,2,3]); });
    save();
  }
  // migrate pre-metadata saves: match clubs to the dataset by name
  if(S.world&&!S.world[0].clubs[0].meta){
    var byName={};
    DATA[S.pyr].forEach(function(dv){ dv.clubs.forEach(function(c){ byName[c.n]=c.m||["","",0,""]; }); });
    S.world.forEach(function(dv){ dv.clubs.forEach(function(c){
      var m=byName[c.n]||["","",0,""];
      c.meta={ nick:m[0], stad:m[1], cap:m[2], col:m[3] };
      if(c.fin&&m[2]>0) c.fin.cap=Math.max(1500,m[2]); // real capacity
    }); });
    save();
  }
  // JSON round-trip breaks object identity between po.myNext and its schedule
  // entry — rebind so the schedule tracks the live playoff fixture
  if(S.season&&S.season.po){
    S.season.mine=S.season.mine.filter(function(f){ return !(f.comp==="PO"&&!f.played); });
    for(var k in S.season.po){ if(S.season.po[k].myNext) S.season.mine.push(S.season.po[k].myNext); }
  }
}

  for(var i=0;i<name.length;i++) h=(h*31+name.charCodeAt(i))>>>0;
  return "hsl("+(h%360)+",55%,34%)";

// parse dataset colour text ("Claret / blue") into hex pair
var COLOR_WORDS={red:"#D71920",white:"#e8e8e8",claret:"#670E36",blue:"#0a4bd6",
  sky:"#6CABDD",navy:"#001489",yellow:"#FFD700",amber:"#FFBF00",black:"#17171c",

  scarlet:"#B01E29",crimson:"#B01E29",cherry:"#B01E29"};
function clubColorPair(club){
  var txt=club.meta&&club.meta.col?String(club.meta.col).toLowerCase():"";
  var found=[];
  txt.split(/[^a-z]+/).forEach(function(w){
    if(COLOR_WORDS[w]&&found.indexOf(COLOR_WORDS[w])===-1) found.push(COLOR_WORDS[w]);
  });
  if(found.length) return [found[0], found[1]||null];
  return [clubColor(club.n), null];
}

    +'</div>';

function textOn(bg){
  if(bg.indexOf("hsl")===0) return "#fff";
  var c=bg.replace("#",""), r=parseInt(c.substr(0,2),16), g=parseInt(c.substr(2,2),16), b=parseInt(c.substr(4,2),16);
  return (0.299*r+0.587*g+0.114*b)>150?"#14181f":"#fff";
}

function clearXI(){ S.xi={formation:S.formation,slots:emptySlots(S.formation)}; save(); render(); }
// changing formation keeps your chosen players, re-slotting them sensibly
function setFormation(f){
  var chosen=myXI().filter(function(s){return s.pi>=0;}).map(function(s){return s.pi;});
  S.formation=f;
  var slots=emptySlots(f), used={};
  // fit pass then fill pass
  slots.forEach(function(s){
    var best=-1,br=-1;
    chosen.forEach(function(pi){
      if(used[pi]) return;
      var p=myClub().sq[pi];
      if(!p||!slotAccepts(s.pos,p.pos)) return;
      if(p.r>br){ br=p.r; best=pi; }
    });
    if(best>=0){ used[best]=1; s.pi=best; }
  });
  slots.forEach(function(s){
    if(s.pi>=0) return;
    var pick2=chosen.find(function(pi){ return !used[pi]&&myClub().sq[pi]; });
    if(pick2!=null){ used[pick2]=1; s.pi=pick2; }
  });
  S.xi={formation:f,slots:slots};
  save(); render();
}
function pitchHTML(){
  var slots=myXI(), c=myClub(), si=0, h='<div id="pitch">';
  FORMATIONS[S.formation].forEach(function(row){
    h+='<div class="pitch-row">';
    row.forEach(function(){
      var s=slots[si], idx=si;
      var p=s.pi>=0?c.sq[s.pi]:null;
      h+='<div class="slot '+(p?'filled':'')+'" onclick="slotTap('+idx+')">'
        +'<span class="pos">'+s.pos+'</span>'
        +(p?'<span class="nm">'+esc(p.n)+'</span><span class="rt">'+p.r+'</span>':'')
        +'</div>';
      si++;
    });
    h+='</div>';
  });
  return h+'</div>';
}
function slotTap(si){
  var slots=myXI(), c=myClub();
  var slotOf={}; slots.forEach(function(s,j){ if(s.pi>=0) slotOf[s.pi]=j; });
  var h='<h2>'+slots[si].pos+' slot</h2><div class="small" style="margin:4px 0 8px;">Anyone can play here — out of position costs chemistry. Picking someone on the pitch swaps them.</div>';
  var cands=c.sq.map(function(p,pi){return {p:p,pi:pi,onPitch:slotOf[pi]!=null&&slotOf[pi]!==si};})
    .filter(function(x){ return slots[si].pi!==x.pi; });
  var GRP_LABEL={GK:"Goalkeepers",DEF:"Defenders",MID:"Midfielders",ATT:"Attackers"};
  ["GK","DEF","MID","ATT"].forEach(function(g){
    var group=cands.filter(function(x){ return grpOf(x.p.pos[0])===g; })
      .sort(function(a,b){ return b.p.r-a.p.r; });
    if(!group.length) return;
    h+='<h3 style="margin-top:8px;">'+GRP_LABEL[g]+'</h3>';
    group.forEach(function(x){
      var fit=slotAccepts(slots[si].pos,x.p.pos);
      h+='<div class="player-card" onclick="slotSet('+si+','+x.pi+')">'
        +'<span class="pc-pos">'+x.p.pos.join("·")+'</span>'
        +'<span class="pc-name">'+esc(x.p.n)
        +(x.onPitch?' <span class="badge" style="font-size:10px;">on pitch · '+slots[slotOf[x.pi]].pos+'</span>':'')
        +(fit?'':' <span class="small" style="color:var(--gold);">out of position</span>')
        +'</span><span class="pc-rat">'+x.p.r+'</span></div>';
    });
  });
  h+='<button class="btn secondary" onclick="hideModal()">Cancel</button>';
  showModal(h);
}
function slotSet(si,pi){
  var slots=myXI();
  // if the chosen player is already on the pitch, swap the two slots
  var j=-1;
  slots.forEach(function(s,k){ if(s.pi===pi&&k!==si) j=k; });
  if(j>=0) slots[j].pi=slots[si].pi;
  slots[si].pi=pi;
  S.xiPicked=true;
  hideModal(); save(); render();
}

function drawMatch(){
  if(!el("mscore")||!M) return;
  el("mscore").textContent=M.f.home?(M.gMe+" – "+M.gOpp):(M.gOpp+" – "+M.gMe);
  var inj=!M.over&&!M.pens&&!M.et&&M.period==="2H"&&M.min>90;
  var clock=el("matchclock"), ct;
  if(M.over) ct="FULL TIME";
  else if(M.pens) ct="PENALTIES";
  else if(inj) ct="90+"+(M.min-90)+"'";
  else ct=(M.et&&M.min>=90?"ET ":"")+Math.min(M.min,M.et?120:90)+"'";
  clock.innerHTML=ct+'<span class="mc-round">'+esc(M.f.comp==="PO"?M.f.round:M.f.comp==="F"?("Friendly "+M.f.n+"/5"):("Matchday "+(M.f.md+1)))+'</span>';
  clock.className=inj?"injury":"";
  el("ticker").innerHTML=M.events.slice(-40).map(function(e){return '<div class="'+e.c+'">'+esc(e.t)+'</div>';}).reverse().join("");
  // live scores from the rest of the round
  var og=el("liveog");
  if(og&&M.liveOthers){
    og.innerHTML=M.liveOthers.map(function(lo){
      var ga=0,gb=0,recent=false;
      lo.goals.forEach(function(g){
        if(g.m<=M.min||M.over){ if(g.s===0) ga++; else gb++; if(M.min-g.m>=0&&M.min-g.m<2&&!M.over) recent=true; }
      });

        +'<span style="flex:1;">'+esc(S.world[S.myTier].clubs[lo.a].n)+'</span>'
        +'<span style="font-weight:800;color:'+(recent?"var(--gold)":"var(--text)")+';">'+(recent?"⚽ ":"")+ga+'–'+gb+'</span>'
        +'<span style="flex:1;text-align:right;">'+esc(S.world[S.myTier].clubs[lo.b].n)+'</span></div>';
    }).join("");
  }
}

function celebrate(){
  if(typeof document==="undefined"||!document.body||typeof document.createElement!=="function") return;
  var old=el("celebrate"); if(old) old.remove();
  var wrap=document.createElement("div"); wrap.id="celebrate";
  var colors=["#f5c542","#e6534f","#37c871","#4f9de6","#e6a24f","#b44fe6","#ffffff"];
  for(var i=0;i<130;i++){
    var c=document.createElement("div"); c.className="confetti";
    c.style.left=(Math.random()*100)+"vw";
    c.style.background=colors[Math.floor(Math.random()*colors.length)];
    c.style.width=(6+Math.random()*8)+"px"; c.style.height=(10+Math.random()*10)+"px";
    c.style.animationDuration=(2.6+Math.random()*2.4)+"s";
    c.style.animationDelay=(Math.random()*2.2)+"s";
    wrap.appendChild(c);
  }
  var cup=document.createElement("div"); cup.className="big-cup"; cup.textContent="🏆";
  wrap.appendChild(cup);
  document.body.appendChild(wrap);
  setTimeout(function(){ wrap.style.opacity="0"; },4500);
  setTimeout(function(){ if(wrap.parentNode) wrap.remove(); },5800);
}

// ============================================================
// PHASE 2 — TRANSFERS
// wage-cap economy: no fees, wages only. Windows: pre-season +
// one mid-season. Sign free agents or players from clubs within
// one division; selling club must stay legal. Release -> free agent.
// ============================================================
// signing range: up to two divisions ABOVE yours, one below
function tierInRange(ti){ return (S.myTier-ti)<=2 && (ti-S.myTier)<=1; }
var RANGE_MSG="Clubs can sign players from up to two divisions above their own, and one below.";
// ---- negotiation: the club and the player can both say no ----
function windowTag(){ var pl=playedLeague(); return S.yr+"-"+(pl===0?"pre":"mid"); }
function sellerRank(club,pi){
  var r=club.sq[pi].r, above=0;
  club.sq.forEach(function(p,i){ if(p.r>r||(p.r===r&&i<pi)) above++; });
  return above; // 0 = their best player
}
function clubStance(club,pi){ // [refuseProb, label]
  var rank=sellerRank(club,pi);
  if(rank<6)  return [0.75,"🛡️ A key player — "+club.n+" will fight to keep him"];
  if(rank<12) return [0.35,"They'd rather keep him, but might listen"];
  return [0.10,"Fringe player — the club is open to offers"];
}
function playerStance(ti){ // joining MY club from tier ti
  var drop=S.myTier-ti; // positive = he'd be moving DOWN
  if(drop>=2) return [0.80,"He's very reluctant to drop two divisions"];
  if(drop===1) return [0.55,"Dropping a division — he'll need convincing"];
  if(drop===0) return [0.10,"A sideways move — he's open to it"];
  return [0.05,"A step up — he's keen on the move"];
}
function negotiationKey(ti,ci,pi){
  return windowTag()+"|"+ti+"."+ci+"."+S.world[ti].clubs[ci].sq[pi].n;
}
function priorRefusal(key){ return (S.trfRefusals||{})[key]||null; }
function recordRefusal(key,who){
  S.trfRefusals=S.trfRefusals||{};
  // prune entries from other windows
  for(var k in S.trfRefusals) if(k.indexOf(windowTag()+"|")!==0) delete S.trfRefusals[k];
  S.trfRefusals[key]=who;
}
function refusalModal(who,p,club){
  var msg=who==="club"
    ? esc(club.n)+" have rejected your approach for "+esc(p.n)+". They won't sell in this window."
    : esc(p.n)+" has turned the move down. He won't reconsider in this window.";
  showModal('<h2>❌ Bid rejected</h2><p class="small" style="margin:8px 0;">'+msg+'</p>'
    +'<button class="btn secondary" onclick="hideModal()">OK</button>');
}
function myBill(){ var b=0; myClub().sq.forEach(function(p){ b+=wageOf(p.r); }); return b; }
function myCap(){ return WAGE_CAP[S.pyr][S.myTier]; }
function overCap(){ return myBill()>myCap(); }
function playedLeague(){ var n=0; S.season.mine.forEach(function(f){ if(f.comp==="L"&&f.played) n++; }); return n; }
function windowState(){
  if(!S.season||S.season.stage!=="league") return { open:false, label:"Window opens next pre-season" };
  var pl=playedLeague(), half=Math.floor(mdTotal()/2), close=half+6;
  if(pl===0) return { open:true, label:"Pre-season window — closes at Matchday 1" };
  if(pl>=half&&pl<close) return { open:true, label:"Mid-season window — closes after Matchday "+close };
  if(pl<half) return { open:false, label:"Mid-season window opens after Matchday "+half };
  return { open:false, label:"Window opens next pre-season" };
}
// can this squad (array) still get under the cap by repeatedly releasing its
// biggest legal earner? (greedy lookahead, max 8 steps)
function canReachCap(sqArr){ return canReachBill(sqArr,myCap()); }
function canReachBill(sqArr,target){
  var sim=sqArr.slice();
  for(var step=0;step<8;step++){
    var bill=0; sim.forEach(function(p){ bill+=pWage(p); });
    if(bill<=target) return true;
    var best=-1,bw=-1;
    for(var i=0;i<sim.length;i++){
      if(!legalWithout(sim,i)) continue;
      var w=pWage(sim[i]);
      if(w>bw){ bw=w; best=i; }
    }
    if(best<0) return false;
    sim.splice(best,1);
  }
  return false;
}
// squad legality if player at index pi were removed
function legalWithout(sq,pi){
  var rest=sq.filter(function(_,i){ return i!==pi; });
  if(rest.length<18) return false;
  for(var g in MINS){
    var cov=rest.filter(function(p){ return p.pos.some(function(x){return GRP[g].indexOf(x)!==-1;}); }).length;
    if(cov<MINS[g]) return false;
  }
  return true;
}
// sign-first-release-after: you may sign a 25th player (and/or briefly break the
// cap) as long as ONE release can fix everything. Matches are blocked until then.
function canSignPlayer(p){
  if(!windowState().open) return "The transfer window is closed.";
  var sq=myClub().sq;
  if(sq.length>=25) return "You're already a player over the limit — release someone first.";
  if(S.mustRelease) return "Complete your pending release before signing anyone else.";
  if(typeof debtBlocked==="function"&&debtBlocked()) return "You're beyond the club's debt limit — recover financially before signing anyone.";
  if(overCap()){
    // already over budget (e.g. inherited bill under grace): allow a DOWNWARD
    // swap — the newcomer must be cheaper than someone you could then release,
    // so every swap moves the bill in the right direction
    var wage0=wageOf(p.r), newSq0=myClub().sq.concat([{n:"__new__",pos:p.pos,r:p.r}]);
    for(var k=0;k<newSq0.length-1;k++){
      if(legalWithout(newSq0,k)&&pWage(newSq0[k])>wage0) return null; // improving swap possible
    }
    return "You're over your wage budget — while over, you can only sign someone CHEAPER than a player you could then release (a downward swap).";
  }
  var wage=wageOf(p.r), newBill=myBill()+wage;
  if(newBill>myCap()){
    var newSq=sq.concat([{n:"__new__",pos:p.pos,r:p.r}]);
    var fixable=false;
    for(var i=0;i<newSq.length-1;i++){ // you can't immediately release the new signing
      if(legalWithout(newSq,i)&&newBill-wageOf(newSq[i].r)<=myCap()){ fixable=true; break; }
    }
    if(!fixable) return "That wage breaks the cap and no single release would fix it.";
  }
  return null;
}
// after an overshoot signing, playing is blocked until a release restores order.
// preBill (bill before the signing) matters when the club was ALREADY over
// budget: the release target is then "below preBill", not the unreachable cap.
function afterSignOvershoot(preBill){
  if(myClub().sq.length>24||myBill()>myCap()) S.mustRelease=true;
  if(preBill!=null&&preBill>myCap()) S.swapFloor=preBill;
}
// the bill a mustRelease club has to get down to before playing again
function releaseTarget(){ return S.swapFloor!=null?Math.max(myCap(),S.swapFloor-0.01):myCap(); }
function transferBlockMsg(){
  if(!S.mustRelease) return null;
  var over=myClub().sq.length>24, cap=myBill()>myCap();
  return "⚠️ You must release a player before your next match"
    +(over&&cap?" — squad over the 24 limit AND over the wage cap."
    : over?" — squad over the 24-player limit."
    : " — the release must bring you back under the wage cap.");
}
function invalidateSquadCaches(ti,ci){
  S.xi=null;
  var d=S.season.divs[ti];
  if(d&&d.xiCache) delete d.xiCache[ci];
}
function signFreeAgent(i){
  var fa=S.freeAgents[i]; if(!fa) return;
  var err=canSignPlayer(fa);
  if(err){ showModal('<h2>Can’t sign</h2><p class="small">'+esc(err)+'</p><button class="btn secondary" onclick="hideModal()">OK</button>'); return; }
  if(!tierInRange(fa.d)){ showModal('<h2>Can’t sign</h2><p class="small">'+RANGE_MSG+'</p><button class="btn secondary" onclick="hideModal()">OK</button>'); return; }
  var preBill=myBill();
  S.freeAgents.splice(i,1);
  myClub().sq.push({ n:fa.n, pos:fa.pos.slice(), r:fa.r, a:fa.a, f:0, w:wageOf(fa.r), yrs:3, ret:0 });
  myClub().sq.sort(function(a,b){ return b.r-a.r; });
  invalidateSquadCaches(S.myTier,S.myIdx);
  afterSignOvershoot(preBill);
  hideModal(); save(); render();
}
function signFromClub(ti,ci,pi){
  var club=S.world[ti].clubs[ci], p=club.sq[pi]; if(!p) return;
  var err=canSignPlayer(p);
  if(!err&&!tierInRange(ti)) err=RANGE_MSG;
  if(err){ showModal('<h2>Can’t sign</h2><p class="small">'+err+'</p><button class="btn secondary" onclick="hideModal()">OK</button>'); return; }
  // negotiation: one roll per player per window — refusals stick
  var key=negotiationKey(ti,ci,pi);
  var prior=priorRefusal(key);
  if(prior){ refusalModal(prior,p,club); return; }
  if(Math.random()<clubStance(club,pi)[0]){ recordRefusal(key,"club"); save(); refusalModal("club",p,club); return; }
  if(Math.random()<playerStance(ti)[0]){ recordRefusal(key,"player"); save(); refusalModal("player",p,club); return; }
  var preBill=myBill();
  club.sq.splice(pi,1);
  p.w=wageOf(p.r); p.yrs=3; p.ask=null; p.ret=0; // fresh 3-year deal with us
  myClub().sq.push(p);
  myClub().sq.sort(function(a,b){ return b.r-a.r; });
  backfillClub(club); // seller replaces what it lost with what it can afford
  invalidateSquadCaches(ti,ci);
  invalidateSquadCaches(S.myTier,S.myIdx);
  afterSignOvershoot(preBill);
  hideModal(); save(); render();
}
function releasePlayer(pi){
  var sq=myClub().sq, p=sq[pi]; if(!p) return;
  // a forced correction (over limit / over cap from a signing) may happen any time
  if(!windowState().open&&!S.mustRelease){ showModal('<h2>Can’t release</h2><p class="small">The transfer window is closed.</p><button class="btn secondary" onclick="hideModal()">OK</button>'); return; }
  if(!legalWithout(sq,pi)){ showModal('<h2>Can’t release</h2><p class="small">Your squad must keep 18 players and meet the position minimums (2 GK · 6 DEF · 8 MID · 2 ATT).</p><button class="btn secondary" onclick="hideModal()">OK</button>'); return; }
  // multi-release is fine — but never into a dead end where the cap can no
  // longer be reached before hitting the squad-legality floor
  if(S.mustRelease&&myBill()-pWage(p)>releaseTarget()&&!canReachBill(sq.filter(function(_,i){ return i!==pi; }),releaseTarget())){
    showModal('<h2>Can’t release</h2><p class="small">Releasing him would leave you unable to get your wage bill back to '+fmtMoney(releaseTarget())+'/wk with the players you could still release.</p><button class="btn secondary" onclick="hideModal()">OK</button>'); return;
  }
  sq.splice(pi,1);
  S.freeAgents.push({ n:p.n, pos:p.pos.slice(), r:p.r, a:p.a, d:S.myTier });
  invalidateSquadCaches(S.myTier,S.myIdx);
  if(S.mustRelease&&sq.length<=24&&myBill()<=releaseTarget()) S.mustRelease=false;
  if(!S.mustRelease||myBill()<=myCap()) S.swapFloor=null;
  hideModal(); save(); render();
}
// squad-average impact line: old → new with a coloured arrow
function avgImpactHTML(newSq){
  var sq=myClub().sq;
  var oldAvg=sq.length?sq.reduce(function(x,p){return x+p.r;},0)/sq.length:0;
  var newAvg=newSq.length?newSq.reduce(function(x,p){return x+p.r;},0)/newSq.length:0;
  var d=newAvg-oldAvg;
  var arrow=d>0.049?'<span class="green" style="font-weight:900;">▲ +'+d.toFixed(1)+'</span>'
          : d<-0.049?'<span class="red" style="font-weight:900;">▼ '+d.toFixed(1)+'</span>'
          : '<span class="small">— no change</span>';
  return '<div style="margin:8px 0;padding:8px;border:1px solid var(--line);border-radius:8px;text-align:center;">'
    +'<span class="small">Squad average</span><br>'
    +'<b>'+oldAvg.toFixed(1)+'</b> <span class="small">→</span> <b class="gold">'+newAvg.toFixed(1)+'</b> &nbsp;'+arrow+'</div>';
}
function confirmSign(kind,a,b,c){

  showModal('<h2>Sign '+esc(p.n)+'?</h2>'

    +'<div class="small">Wage: <b>'+fmtMoney(wage)+'/wk</b><br>New bill: <b class="'+(nb>myCap()?"red":"green")+'">'+fmtMoney(nb)+'/wk</b> of '+fmtMoney(myCap())+'/wk cap</div>'
    +avgImpactHTML(myClub().sq.concat([{r:p.r}]))
    +warn
    +stance
    +'<button class="btn" onclick="'+(kind==="fa"?('signFreeAgent('+a+')'):('signFromClub('+a+','+b+','+c+')'))+'">'+(kind==="fa"?'✍️ Sign':'🤝 Make the approach')+'</button>'
    +'<button class="btn secondary" onclick="hideModal()">Cancel</button>');
}

// ============================================================
// PHASE 2.5 — CLUB FINANCES
// Revenue-based economy: every club has a stadium, gate receipts,
// league money, sponsorship and prize money. The wage budget is
// 65% of annual revenue — per CLUB, earned, replacing division caps.
// ============================================================
var FIN={
  budgetShare:0.65,      // wages allowed as share of annual revenue
  adminShare:0.35,       // AI clubs: flat admin/overheads share of revenue
  overheadShare:0.23,    // player club: fixed overhead (back office, academy,
                         // insurance, utilities, ground upkeep) — not cuttable
  staffShare:0.12,       // default staff department ≈ 12% of revenue
  debtShare:0.10,        // may go into debt up to 10% of revenue
  calib:1.15,            // division avg budget ≈ 1.15 × division avg bill
  levyFrom:1.12, levyRate:0.65, // solidarity levy: revenue above 112% of div avg taxed 65%…
  capRanges:{ mfl:[[28000,62000],[15000,32000],[8000,20000],[5000,13000],[2500,8000]],
              wfl:[[4000,15000],[1500,6000]] },
  tickets:{ mfl:[42,28,22,18,14], wfl:[22,16] },
  seatCost:210, maxExpandPct:0.15
};
function clubBillW(club){ var b=0; club.sq.forEach(function(p){ b+=wageOf(p.r); }); return b; }
function divAvgAnnualWages(ti){
  var t=0,n=0;
  S.world[ti].clubs.forEach(function(c){ t+=clubBillW(c)*52; n++; });
  return n?t/n:1;
}
// one-off at career start: stadiums sized by stature, opening balances
function initFinances(){
  S.world.forEach(function(dv,ti){
    var range=FIN.capRanges[S.pyr][ti];
    var bills=dv.clubs.map(function(c,ci){ return {ci:ci,b:clubBillW(c)}; })
      .sort(function(a,b){ return a.b-b.b; });
    bills.forEach(function(x,rank){
      var r01=bills.length>1?rank/(bills.length-1):0.5;
      var club=dv.clubs[x.ci];
      // real stadium capacity from the dataset when we have it
      var realCap=club.meta&&club.meta.cap>0?Math.max(1500,club.meta.cap):0;
      club.fin={
        cap:realCap||Math.round((range[0]+r01*(range[1]-range[0]))/100)*100,
        lastPos:dv.clubs.length-rank, // stronger squad = better assumed finish
        bal:0, pend:0, expandPct:0
      };
    });
  });
  // opening balance = 5% of first-year revenue
  S.world.forEach(function(dv,ti){
    dv.clubs.forEach(function(c,ci){ c.fin.bal=Math.round(annualRevenue(ti,ci)*0.05); });
  });
}
// annual revenue components for a club (uses current division + lastPos + stadium)
function revenueParts(ti,ci){
  var dv=S.world[ti], c=dv.clubs[ci], n=dv.clubs.length;
  var A=divAvgAnnualWages(ti);
  var t=FIN.tickets[S.pyr][ti];
  var hg=Math.floor(S.season?S.season.divs[ti].sched.length/2:(dv.clubs.length-1));
  var posF=(n-c.fin.lastPos)/(n-1||1); // 1 = champions, 0 = bottom
  var capAvg=(FIN.capRanges[S.pyr][ti][0]+FIN.capRanges[S.pyr][ti][1])/2;
  var league=0.30*A*(1+0.5*posF);
  var gate=c.fin.cap*0.75*t*hg;
  var sponsor=0.25*(A/0.55)*(0.7+0.6*(c.fin.cap/capAvg));
  var k=divCalib(ti);
  return { league:league*k, gate:gate*k, sponsor:sponsor*k, ticket:t, homeGames:hg };
}
// per-division calibration so avg wage budget = calib × avg bill (cached per season)
var _calibCache={};
function divCalib(ti){
  var key=S.yr+"-"+ti;
  if(_calibCache[key]) return _calibCache[key];
  var dv=S.world[ti], n=dv.clubs.length;
  var A=divAvgAnnualWages(ti);
  var t=FIN.tickets[S.pyr][ti];
  var hg=Math.floor(S.season?S.season.divs[ti].sched.length/2:(n-1));
  var capAvg=(FIN.capRanges[S.pyr][ti][0]+FIN.capRanges[S.pyr][ti][1])/2;
  var raw=0;
  dv.clubs.forEach(function(c){
    var posF=(n-c.fin.lastPos)/(n-1||1);
    raw+=0.30*A*(1+0.5*posF)+c.fin.cap*0.75*t*hg+0.25*(A/0.55)*(0.7+0.6*(c.fin.cap/capAvg));
  });
  raw/=n;
  var k=(FIN.calib*A/FIN.budgetShare)/raw;
  _calibCache[key]=k;
  return k;
}
function annualRevenueBase(ti,ci){ var p=revenueParts(ti,ci); return p.league+p.gate+p.sponsor; }
var _revAvgCache={};
// …and the pot is redistributed to clubs earning below the division average.
function divLevyInfo(ti){
  var key=S.yr+"-"+ti;
  if(_revAvgCache[key]) return _revAvgCache[key];
  var bases=S.world[ti].clubs.map(function(_,ci){ return annualRevenueBase(ti,ci); });
  var avg=bases.reduce(function(a,b){return a+b;},0)/bases.length;
  var thr=FIN.levyFrom*avg, pot=0, below=0;
  bases.forEach(function(b){ if(b>thr) pot+=FIN.levyRate*(b-thr); if(b<avg) below++; });
  _revAvgCache[key]={ thr:thr, avg:avg, grant:below?pot/below:0 };
  return _revAvgCache[key];
}
function annualRevenue(ti,ci){
  var base=annualRevenueBase(ti,ci);
  var L=divLevyInfo(ti);
  if(base>L.thr) return Math.round(base-FIN.levyRate*(base-L.thr));
  if(base<L.avg) return Math.round(base+L.grant);
  return Math.round(base);
}
function wageBudgetOf(ti,ci){ return Math.round(FIN.budgetShare*annualRevenue(ti,ci)/52/50)*50; }
function myFin(){ return myClub().fin; }
function debtFloor(){ return Math.round(FIN.debtShare*annualRevenue(S.myTier,S.myIdx)); }
function clubValue(ti,ci){
  var c=S.world[ti].clubs[ci];
  return Math.round(c.fin.bal+clubBillW(c)*52*2.5+c.fin.cap*350);
}
// OVERRIDE (part5): the cap is now the club's earned wage budget
function myCap(){ return wageBudgetOf(S.myTier,S.myIdx); }

// ---------- staff department (player club only) ----------
var STAFF_ROLES=[["Assistant Manager",0.22],["First-Team Coach",0.12],["Coach",0.10],
  ["GK Coach",0.08],["Fitness Coach",0.08],["Physio",0.08],["Physio",0.06],
  ["Scout",0.07],["Scout",0.05],["Analyst",0.06],["Kit Manager",0.04],["Groundskeeper",0.04]];
function staffName(){ return pick(GEN_INI)+". "+pick(GEN_SUR); }
function roleShare(role){
  var sh=0.08;
  STAFF_ROLES.forEach(function(r){ if(r[0]===role) sh=r[1]; });
  return sh;
}
// market rate for a role at YOUR CURRENT revenue — so staff pay scales with the
// league you're in, applied whenever a contract is signed or renewed
function marketStaffWage(role,q){
  var qm={2:0.55,3:1.0,4:1.55}[q]||1.0;
  return Math.round(roleShare(role)*FIN.staffShare*annualRevenue(S.myTier,S.myIdx)/52*qm/10)*10;
}
function initStaff(){

    return { n:staffName(), role:r[0], w:0, q:3, yrs:pick([1,2,3]) };
  });

}
function staffWeekly(){ var t=0; (S.staff||[]).forEach(function(s){ t+=s.w; }); return t; }
function releaseStaff(i){

    +'<button class="btn danger" onclick="S.staff.splice('+i+',1);hideModal();save();render()">Release</button>'

function staffMemberModal(i){

function renewStaff(i){

// season end: staff contracts tick down; expired staff leave
function processStaffSeasonEnd(){
  var gone=[];
  for(var i=(S.staff||[]).length-1;i>=0;i--){
    var s=S.staff[i];
    s.yrs--;
    if(s.yrs<=0){ gone.push(s.role+" "+s.n); S.staff.splice(i,1); }
  }
  if(S.lastDepartures) S.lastDepartures.staff=gone;
  else S.lastDepartures={retired:[],expired:[],staff:gone};
}
function hireStaffModal(role){

    ];

  var h='<h2>Hire: '+esc(role)+'</h2><div class="small" style="margin:6px 0;">Candidates this season (★ = pedigree):</div>';
  S.staffPool[pk].forEach(function(c,i){

      +'<span class="pc-pos">'+"★".repeat(c.q)+'</span>'
      +'<span class="pc-name">'+esc(c.n)+'</span>'
      +'<span class="small" style="margin-right:8px;">'+fmtMoney(c.w)+'/wk</span><span class="small">Hire ➜</span></div>';

function hireStaff(role,i){

function staffView(){
