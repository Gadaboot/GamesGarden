<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Wheel of Fortune</title>
<style>
:root{ --gold:#ffd83d; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  background:radial-gradient(circle at 50% 0%,#4b1a8f 0%,#25086b 45%,#0d0230 100%);
  color:#fff; overflow-x:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  -webkit-user-select:none; user-select:none;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(circle at 12% 18%,rgba(255,0,140,.30),transparent 42%),
    radial-gradient(circle at 88% 12%,rgba(0,229,255,.28),transparent 42%),
    radial-gradient(circle at 50% 92%,rgba(255,200,0,.22),transparent 48%);
}
.wrap{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:10px 12px 28px}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.menu-btn{
  display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:#fff;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);
  padding:9px 13px;border-radius:999px;font-size:14px;font-weight:700;
  backdrop-filter:blur(8px);white-space:nowrap;
}
.menu-btn:active{transform:scale(.95)}
.title{
  flex:1;text-align:center;font-weight:900;letter-spacing:0;line-height:1.05;
  white-space:nowrap;font-size:clamp(12px,3.6vw,21px);
  background:linear-gradient(180deg,#fff7c8,#ffcf3f 55%,#ff9a1f);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 2px 10px rgba(255,180,0,.35);
}
.round-pill{
  background:linear-gradient(135deg,#ff2e88,#ff8a00);padding:8px 11px;border-radius:999px;
  font-size:12px;font-weight:800;white-space:nowrap;box-shadow:0 4px 14px rgba(255,46,136,.4)
}

/* ---------- puzzle board ---------- */
.category{
  text-align:center;font-size:12px;letter-spacing:2.5px;font-weight:800;text-transform:uppercase;
  color:#8ff6ff;margin:4px 0 8px;text-shadow:0 0 12px rgba(0,229,255,.6)
}
.board{
  background:linear-gradient(180deg,#0a2e6b,#061d47);
  border:3px solid rgba(255,255,255,.25);border-radius:16px;
  padding:10px 8px;display:flex;flex-direction:column;gap:6px;align-items:center;
  box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 0 40px rgba(0,120,255,.18);
  min-height:96px;justify-content:center;
}
.brow{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.tile{
  width:clamp(22px,7.2vw,34px);height:clamp(30px,9.6vw,46px);border-radius:5px;
  display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:clamp(15px,5.2vw,25px);
  background:#f4f7ff;color:#0b1f4d;box-shadow:0 3px 0 rgba(0,0,0,.28)
}
.tile.blank{background:rgba(255,255,255,.10);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
.tile.gap{background:transparent;box-shadow:none;width:clamp(10px,3.2vw,16px)}
.tile.punct{background:transparent;box-shadow:none;color:#fff}
.tile.pop{animation:pop .45s ease}
@keyframes pop{0%{transform:scale(.4) rotateY(90deg);background:#ffe14d}60%{transform:scale(1.15);background:#ffe14d}100%{transform:scale(1)}}

/* ---------- players ---------- */
.players{display:flex;gap:6px;margin:10px 0}
.pl{
  flex:1;border-radius:12px;padding:8px 6px;text-align:center;
  background:rgba(255,255,255,.09);border:2px solid transparent;transition:.25s
}
.pl.active{border-color:#ffd83d;background:rgba(255,216,61,.18);box-shadow:0 0 18px rgba(255,216,61,.35)}
.pl .nm{font-size:11px;font-weight:800;opacity:.85;letter-spacing:.5px}
.pl .rd{font-size:clamp(14px,4.6vw,19px);font-weight:900;color:#7dffb0}
.pl .tt{font-size:10px;opacity:.7}

/* ---------- wheel ---------- */
.wheelbox{position:relative;display:flex;justify-content:center;margin:6px 0 4px}
canvas{max-width:100%;height:auto;filter:drop-shadow(0 12px 22px rgba(0,0,0,.5))}
.pointer{
  position:absolute;top:-4px;left:50%;transform:translateX(-50%);
  width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;
  border-top:26px solid #ffd83d;filter:drop-shadow(0 3px 4px rgba(0,0,0,.6));z-index:3
}
.readout{
  text-align:center;font-weight:900;font-size:clamp(15px,5vw,22px);min-height:28px;margin:2px 0 6px;
  color:#ffe473;text-shadow:0 0 14px rgba(255,220,80,.6)
}

/* ---------- controls ---------- */
.actions{display:flex;gap:8px;margin:6px 0 10px}
.btn{
  flex:1;border:none;border-radius:14px;padding:13px 6px;font-size:14px;font-weight:900;
  color:#20114a;cursor:pointer;letter-spacing:.3px;
  box-shadow:0 5px 0 rgba(0,0,0,.35);transition:transform .08s
}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn:disabled{opacity:.35;cursor:default}
.b-spin{background:linear-gradient(180deg,#ffe36b,#ffb01f)}
.b-vowel{background:linear-gradient(180deg,#8affc1,#20d17c)}
.b-solve{background:linear-gradient(180deg,#ff9ecb,#ff3d92);color:#fff}

.keys{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.key{
  aspect-ratio:1/1;border:none;border-radius:9px;font-weight:900;font-size:clamp(13px,4.4vw,18px);
  background:linear-gradient(180deg,#ffffff,#d5ddf5);color:#16234d;cursor:pointer;
  box-shadow:0 3px 0 rgba(0,0,0,.3)
}
.key.vowel{background:linear-gradient(180deg,#bff3ff,#6cd4f0)}
.key:disabled{opacity:.22;box-shadow:none}
.key:active:not(:disabled){transform:translateY(3px);box-shadow:none}
.hint{text-align:center;font-size:12px;opacity:.75;margin:8px 0 4px;min-height:16px}

/* ---------- overlay ---------- */
.ovl{
  position:fixed;inset:0;background:rgba(5,0,25,.86);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;padding:22px;z-index:50
}
.ovl.on{display:flex}
.card{
  background:linear-gradient(160deg,#3a1180,#1a0552);border:2px solid rgba(255,255,255,.25);
  border-radius:22px;padding:24px 20px;max-width:400px;width:100%;text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.6)
}
.card h2{font-size:24px;margin-bottom:10px;color:#ffd83d}
.card p{font-size:14px;line-height:1.55;opacity:.92;margin-bottom:14px}
.card input{
  width:100%;padding:13px;border-radius:12px;border:2px solid rgba(255,255,255,.3);
  background:rgba(255,255,255,.12);color:#fff;font-size:17px;font-weight:800;text-align:center;
  text-transform:uppercase;margin-bottom:12px
}
.card input::placeholder{color:rgba(255,255,255,.45);font-weight:600}
.nfield{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.nfield span{font-size:12px;font-weight:800;opacity:.8;width:62px;flex:none;text-align:left;letter-spacing:.5px}
.nfield input{margin-bottom:0;font-size:16px;padding:11px}
.crow{display:flex;gap:8px}
.toast{
  position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));
  transform:translate(-50%,24px) scale(.6);opacity:0;
  background:linear-gradient(135deg,#ff2e88,#ff9500);padding:14px 26px;border-radius:16px;
  font-weight:900;font-size:18px;z-index:60;pointer-events:none;text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:88vw
}
.toast.show{animation:toast 1.6s ease forwards}
@keyframes toast{
  0%{opacity:0;transform:translate(-50%,24px) scale(.6)}
  15%{opacity:1;transform:translate(-50%,0) scale(1.06)}
  25%{opacity:1;transform:translate(-50%,0) scale(1)}
  80%{opacity:1;transform:translate(-50%,0) scale(1)}
  100%{opacity:0;transform:translate(-50%,-16px) scale(.95)}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="menu-btn" href="index.html">&#9776; Menu</a>
    <div class="title">WHEEL OF FORTUNE</div>
    <div class="round-pill" id="roundPill">R1/3</div>
  </div>

  <div class="category" id="cat">&nbsp;</div>
  <div class="board" id="board"></div>

  <div class="players" id="players"></div>

  <div class="wheelbox">
    <div class="pointer"></div>
    <canvas id="wheel" width="600" height="600" style="width:min(74vw,300px)"></canvas>
  </div>
  <div class="readout" id="readout">&nbsp;</div>

  <div class="actions">
    <button class="btn b-spin"  id="bSpin">SPIN</button>
    <button class="btn b-vowel" id="bVowel">VOWEL &pound;250</button>
    <button class="btn b-solve" id="bSolve">SOLVE</button>
  </div>

  <div class="keys" id="keys"></div>
  <div class="hint" id="hint">Spin the wheel to begin!</div>
</div>

<div class="toast" id="toast"></div>

<div class="ovl" id="ovl">
  <div class="card" id="card"></div>
</div>

<script>
(function(){
"use strict";

/* ============ PUZZLES ============ */
const PUZZLES=[
 {c:"Phrase",t:"BETTER LATE THAN NEVER"},
 {c:"Phrase",t:"A PIECE OF CAKE"},
 {c:"Phrase",t:"RAINING CATS AND DOGS"},
 {c:"Phrase",t:"THE EARLY BIRD CATCHES THE WORM"},
 {c:"Phrase",t:"ONCE IN A BLUE MOON"},
 {c:"Phrase",t:"BREAK THE ICE"},
 {c:"Thing",t:"A CUP OF TEA"},
 {c:"Thing",t:"DOUBLE DECKER BUS"},
 {c:"Thing",t:"FISH AND CHIPS"},
 {c:"Thing",t:"MESSAGE IN A BOTTLE"},
 {c:"Place",t:"THE LONDON EYE"},
 {c:"Place",t:"EDINBURGH CASTLE"},
 {c:"Place",t:"THE GRAND CANYON"},
 {c:"Place",t:"BRIGHTON BEACH"},
 {c:"Food & Drink",t:"SUNDAY ROAST DINNER"},
 {c:"Food & Drink",t:"STRAWBERRIES AND CREAM"},
 {c:"Food & Drink",t:"BANGERS AND MASH"},
 {c:"Occupation",t:"AIR TRAFFIC CONTROLLER"},
 {c:"Occupation",t:"MARINE BIOLOGIST"},
 {c:"Around The House",t:"KITCHEN SINK"},
 {c:"Around The House",t:"WASHING MACHINE"},
 {c:"Song Title",t:"DANCING IN THE DARK"},
 {c:"Song Title",t:"HERE COMES THE SUN"},
 {c:"On Television",t:"STRICTLY COME DANCING"},
 {c:"On Television",t:"THE GREAT BRITISH BAKE OFF"},
 {c:"Fun & Games",t:"HIDE AND SEEK"},
 {c:"Fun & Games",t:"MUSICAL CHAIRS"},
 {c:"Same Name",t:"BRIGHT IDEA"},
 {c:"Event",t:"THE SUMMER HOLIDAYS"},
 {c:"Living Things",t:"A HERD OF ELEPHANTS"}
];

/* ============ WHEEL ============ */
const WHEEL=[900,"BANKRUPT",600,700,650,500,800,"LOSE A TURN",550,450,300,"BANKRUPT",
             350,400,650,750,500,900,400,600,"LOSE A TURN",750,650,550];
const COLORS=["#ff2e88","#ffb400","#00d9a5","#3d8bff","#b45cff","#ff6b35",
              "#00c2ff","#f5e050","#ff4d6d","#4ade80","#8b5cf6","#fb923c"];

const VOWELS="AEIOU";
const CONS="BCDFGHJKLMNPQRSTVWXYZ";
const FREQ="RSTLNDCMPBGHFWYVKJXQZ";

/* ============ STATE ============ */
let S={};

const CPU_NAMES=["MAX","IVY","ZARA","OTIS","NOVA"];
const NAMES={p1:"",p2:""};   // remembered for the session

function newGame(mode){
  S={
    mode: mode||"cpu",
    round:1, maxRounds:3,
    players: (mode==="pvp")
      ? [{n:NAMES.p1||"PLAYER 1", cpu:false, round:0, total:0},
         {n:NAMES.p2||"PLAYER 2", cpu:false, round:0, total:0}]
      : [{n:NAMES.p1||"YOU", cpu:false, round:0, total:0},
         {n:CPU_NAMES[Math.floor(Math.random()*CPU_NAMES.length)], cpu:true, round:0, total:0}],
    turn:0, used:new Set(), revealed:new Set(),
    puzzle:null, value:0, phase:"spin", spinning:false, pool:PUZZLES.slice(), over:false
  };
  shuffle(S.pool);
  startRound();
}
function startRound(){
  S.puzzle=S.pool.pop()||PUZZLES[Math.floor(Math.random()*PUZZLES.length)];
  S.used=new Set(); S.revealed=new Set(); S.value=0; S.phase="spin";
  S.players.forEach(p=>p.round=0);
  S.turn=(S.round-1)%S.players.length;   // players take it in turns to start
  $("roundPill").textContent="R"+S.round+"/"+S.maxRounds;
  $("cat").textContent=S.puzzle.c;
  render();
  const p=cur();
  if(p.cpu){ setHint(p.n+" starts this round…"); setTimeout(cpuTurn,1100); }
  else setHint(turnLabel(p)+" — spin the wheel!");
}
/* "Your turn" only while the human is still the unnamed default */
function turnLabel(p){ return (!p.cpu && p.n==="YOU") ? "Your turn" : p.n; }

/* ============ HELPERS ============ */
function $(id){return document.getElementById(id);}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}}
function money(n){return "£"+n.toLocaleString();}
function setHint(t){$("hint").textContent=t;}
function toast(msg){
  const el=$("toast"); el.textContent=msg; el.classList.remove("show");
  void el.offsetWidth; el.classList.add("show");
}
function cur(){return S.players[S.turn];}
function lettersLeft(set){
  return [...set].filter(ch=>S.puzzle.t.includes(ch)&&!S.revealed.has(ch)).length;
}
function allRevealed(){
  return S.puzzle.t.split("").every(ch=>!/[A-Z]/.test(ch)||S.revealed.has(ch));
}

/* ============ RENDER ============ */
function render(){
  /* board */
  const words=S.puzzle.t.split(" ");
  const board=$("board"); board.innerHTML="";
  // pack words into rows of max ~12 tiles
  const rows=[]; let row=[];
  let len=0; const MAX=window.innerWidth<380?11:13;
  words.forEach(w=>{
    if(len+w.length+ (row.length?1:0) > MAX && row.length){rows.push(row);row=[];len=0;}
    row.push(w); len+=w.length+1;
  });
  if(row.length)rows.push(row);
  rows.forEach(r=>{
    const d=document.createElement("div"); d.className="brow";
    r.forEach((w,wi)=>{
      w.split("").forEach(ch=>{
        const t=document.createElement("div");
        if(!/[A-Z]/.test(ch)){t.className="tile punct";t.textContent=ch;}
        else if(S.revealed.has(ch)){t.className="tile";t.textContent=ch;t.dataset.l=ch;}
        else{t.className="tile blank";}
        d.appendChild(t);
      });
      if(wi<r.length-1){const g=document.createElement("div");g.className="tile gap";d.appendChild(g);}
    });
    board.appendChild(d);
  });

  /* players */
  const pw=$("players"); pw.innerHTML="";
  S.players.forEach((p,i)=>{
    const d=document.createElement("div");
    d.className="pl"+(i===S.turn?" active":"");
    d.innerHTML='<div class="nm">'+p.n+'</div><div class="rd">'+money(p.round)+
                '</div><div class="tt">total '+money(p.total)+'</div>';
    pw.appendChild(d);
  });

  /* keys */
  buildKeys();
  updateButtons();
}

function buildKeys(){
  const k=$("keys");
  if(k.childElementCount!==26){
    k.innerHTML="";
    "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").forEach(ch=>{
      const b=document.createElement("button");
      b.className="key"+(VOWELS.includes(ch)?" vowel":"");
      b.textContent=ch; b.dataset.ch=ch;
      b.addEventListener("click",()=>pickLetter(ch));
      k.appendChild(b);
    });
  }
  [...k.children].forEach(b=>{
    const ch=b.dataset.ch, isV=VOWELS.includes(ch);
    let ok=false;
    if(!cur().cpu && !S.spinning && !S.over){
      if(S.phase==="guess" && !isV) ok=true;
      if(S.phase==="vowel" && isV)  ok=true;
    }
    b.disabled = S.used.has(ch) || !ok;
  });
}

function updateButtons(){
  const me=!cur().cpu && !S.spinning && !S.over;
  $("bSpin").disabled  = !(me && S.phase==="spin");
  $("bVowel").disabled = !(me && S.phase==="spin" && cur().round>=250 && lettersLeft(new Set(VOWELS))>0);
  $("bSolve").disabled = !(me && (S.phase==="spin"||S.phase==="guess"));
}

/* ============ WHEEL DRAW ============ */
const cv=$("wheel"), ctx=cv.getContext("2d");
const R=290, CX=300, CY=300, SEG=Math.PI*2/WHEEL.length;
let rot=0;

function drawWheel(){
  ctx.clearRect(0,0,600,600);
  ctx.save(); ctx.translate(CX,CY); ctx.rotate(rot);
  WHEEL.forEach((v,i)=>{
    const a0=-Math.PI/2+i*SEG, a1=a0+SEG;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,R,a0,a1); ctx.closePath();
    if(v==="BANKRUPT")      ctx.fillStyle="#111";
    else if(v==="LOSE A TURN") ctx.fillStyle="#ffffff";
    else ctx.fillStyle=COLORS[i%COLORS.length];
    ctx.fill();
    ctx.strokeStyle="rgba(0,0,0,.35)"; ctx.lineWidth=2; ctx.stroke();

    ctx.save();
    ctx.rotate(a0+SEG/2); ctx.translate(R-16,0); ctx.rotate(Math.PI);
    ctx.textAlign="left"; ctx.textBaseline="middle";
    if(typeof v==="number"){
      ctx.fillStyle="#111"; ctx.font="900 40px -apple-system,sans-serif";
      ctx.fillText(String(v),0,0);
    }else{
      ctx.fillStyle=(v==="BANKRUPT")?"#fff":"#c00";
      ctx.font="900 21px -apple-system,sans-serif";
      ctx.fillText(v,0,0);
    }
    ctx.restore();
  });
  // hub
  ctx.beginPath(); ctx.arc(0,0,52,0,Math.PI*2);
  const g=ctx.createRadialGradient(0,-18,6,0,0,52);
  g.addColorStop(0,"#fff3b0"); g.addColorStop(1,"#e0a000");
  ctx.fillStyle=g; ctx.fill();
  ctx.strokeStyle="#7a4c00"; ctx.lineWidth=5; ctx.stroke();
  ctx.restore();

  // rim
  ctx.beginPath(); ctx.arc(CX,CY,R+5,0,Math.PI*2);
  ctx.strokeStyle="#ffd83d"; ctx.lineWidth=9; ctx.stroke();
}
drawWheel();

/* ============ SPIN ============ */
function spin(cb){
  if(S.spinning)return;
  S.spinning=true; updateButtons(); buildKeys();
  $("readout").textContent="Spinning…";
  const idx=Math.floor(Math.random()*WHEEL.length);
  let target=-(idx+0.5)*SEG;
  while(target < rot + Math.PI*14) target += Math.PI*2;
  const start=rot, delta=target-start, dur=3400, t0=performance.now();
  (function step(now){
    const p=Math.min(1,(now-t0)/dur);
    const e=1-Math.pow(1-p,3.2);
    rot=start+delta*e; drawWheel();
    if(p<1) requestAnimationFrame(step);
    else{
      rot=target%(Math.PI*2);
      S.spinning=false;
      const v=WHEEL[idx];
      $("readout").textContent = typeof v==="number" ? money(v) : v;
      cb(v);
    }
  })(t0);
}

/* ============ FLOW ============ */
function doSpin(){
  spin(v=>{
    const p=cur();
    if(v==="BANKRUPT"){
      p.round=0; toast("BANKRUPT!");
      setTimeout(()=>{nextTurn("Bankrupt — "+p.n+" loses this round's cash.");},900);
    }else if(v==="LOSE A TURN"){
      toast("LOSE A TURN");
      setTimeout(()=>{nextTurn(p.n+" loses a turn.");},900);
    }else{
      S.value=v; S.phase="guess";
      render();
      if(p.cpu) setTimeout(cpuGuess,900);
      else setHint("Pick a consonant — worth "+money(v)+" each!");
    }
  });
}

function pickLetter(ch){
  if(S.used.has(ch))return;
  const isV=VOWELS.includes(ch);
  if(S.phase==="guess"&&isV)return;
  if(S.phase==="vowel"&&!isV)return;
  S.used.add(ch);
  const p=cur();
  const count=S.puzzle.t.split("").filter(c=>c===ch).length;

  if(S.phase==="vowel") p.round-=250;

  if(count>0){
    S.revealed.add(ch);
    const won = isV ? 0 : count*S.value;
    p.round += won;
    render();
    flash(ch);
    toast(count+" × "+ch+(won?"  +"+money(won):""));
    if(allRevealed()){
      setTimeout(()=>roundWon(p,"solved the puzzle"),1100);
      return;
    }
    S.phase="spin"; S.value=0;
    setTimeout(()=>{
      render();
      if(p.cpu) cpuTurn();
      else setHint("Nice! Spin again, buy a vowel, or solve.");
    },1000);
  }else{
    toast("No "+ch+"'s");
    setTimeout(()=>nextTurn("No "+ch+" in the puzzle."),800);
  }
}

function flash(ch){
  [...document.querySelectorAll('.tile[data-l="'+ch+'"]')].forEach((t,i)=>{
    setTimeout(()=>t.classList.add("pop"),i*80);
  });
}

function nextTurn(msg){
  S.value=0; S.phase="spin";
  S.turn=(S.turn+1)%S.players.length;
  render();
  const p=cur();
  let who;
  if(p.cpu)                 who = p.n+"'s turn.";
  else if(S.mode==="pvp")   who = "📱 Pass the device — "+p.n+"'s turn.";
  else                      who = turnLabel(p)+" — spin the wheel!";
  setHint((msg?msg+"  ":"")+who);
  if(p.cpu) setTimeout(cpuTurn,1000);
}

function roundWon(p,how){
  const won=Math.max(p.round,500);          // minimum £500 for solving
  p.round=won; p.total+=won;
  S.revealed=new Set("ABCDEFGHIJKLMNOPQRSTUVWXYZ".split(""));
  render();
  const isYou = !p.cpu && p.n==="YOU";
  overlay(
    (p.cpu ? p.n+" WINS THE ROUND" : (isYou ? "🎉 YOU WIN THE ROUND!" : "🎉 "+p.n+" WINS THE ROUND!")),
    "<b>"+S.puzzle.t+"</b><br><br>"+p.n+" "+how+" and banks <b>"+money(won)+"</b>.",
    S.round<S.maxRounds ? [{l:"NEXT ROUND",f:()=>{S.round++;closeOverlay();startRound();}}]
                        : [{l:"SEE RESULTS",f:()=>{closeOverlay();gameOver();}}]
  );
}

function gameOver(){
  S.over=true; render();
  const sorted=S.players.slice().sort((a,b)=>b.total-a.total);
  const tie = sorted[0].total===sorted[1].total;
  let html="";
  sorted.forEach((p,i)=>{
    const medal = tie ? "🤝" : ["🥇","🥈"][i];
    html+='<div style="display:flex;justify-content:space-between;padding:7px 4px;border-bottom:1px solid rgba(255,255,255,.15)"><span>'+
          medal+" "+p.n+'</span><b>'+money(p.total)+"</b></div>";
  });
  const win=sorted[0];
  let title,line;
  if(tie){
    title="🤝 IT'S A TIE!";
    line="Both finished on "+money(win.total)+". Rematch?";
  }else if(S.mode==="pvp"){
    title="🏆 "+win.n+" WINS!";
    line=win.n+" takes the game with "+money(win.total)+".";
  }else if(win.cpu){
    title="GAME OVER";
    line=win.n+" takes the crown with "+money(win.total)+". Better luck next time!";
  }else{
    title="🏆 "+(win.n==="YOU"?"CHAMPION!":win.n+" WINS!");
    line=(win.n==="YOU"?"You won with ":win.n+" won with ")+money(win.total)+"!";
  }
  overlay(title, html+"<br>"+line,
    [{l:"PLAY AGAIN",f:()=>{closeOverlay();newGame(S.mode);}},
     {l:"MAIN MENU",c:"b-vowel",f:()=>{closeOverlay();showMenu();}}]);
}

function showMenu(){
  overlay("WHEEL OF FORTUNE",
    "Spin the wheel, call a consonant and win cash for every one in the puzzle.<br><br>"+
    "🔤 Vowels cost <b>£250</b><br>"+
    "⚠️ <b>Bankrupt</b> wipes your round cash<br>"+
    "🏆 Highest total after 3 rounds wins<br><br>"+
    "<b>Pick a game</b>",
    [{l:"VS COMPUTER",f:()=>{closeOverlay();askNames("cpu");}},
     {l:"2 PLAYERS",c:"b-vowel",f:()=>{closeOverlay();askNames("pvp");}}]);
}

/* ============ NAME ENTRY ============ */
function askNames(mode){
  const two = (mode==="pvp");
  const c=$("card");
  c.innerHTML =
    "<h2>"+(two?"Who's playing?":"What's your name?")+"</h2>"+
    "<p>"+(two?"Enter both names — leave blank to use the defaults."
               :"Enter your name, or leave it blank to play as YOU.")+"</p>"+
    '<div class="nfield"><span>'+(two?"Player 1":"Name")+"</span>"+
      '<input id="n1" maxlength="10" placeholder="'+(two?"PLAYER 1":"YOU")+
      '" value="'+esc(NAMES.p1)+'" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false"></div>'+
    (two ? '<div class="nfield"><span>Player 2</span>'+
           '<input id="n2" maxlength="10" placeholder="PLAYER 2" value="'+esc(NAMES.p2)+
           '" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false"></div>' : "");
  const row=document.createElement("div"); row.className="crow";
  const back=document.createElement("button");
  back.className="btn b-vowel"; back.textContent="BACK";
  back.addEventListener("click",()=>{closeOverlay();showMenu();});
  const go=document.createElement("button");
  go.className="btn b-spin"; go.textContent="START";
  go.addEventListener("click",()=>startWithNames(mode));
  row.appendChild(back); row.appendChild(go); c.appendChild(row);
  $("ovl").classList.add("on");
  setTimeout(()=>{
    ["n1","n2"].forEach(id=>{
      const i=$(id); if(!i)return;
      i.addEventListener("keydown",e=>{if(e.key==="Enter")startWithNames(mode);});
    });
    if($("n1")) $("n1").focus();
  },60);
}
function esc(s){return String(s||"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));}
function cleanName(v,fallback){
  const s=String(v||"").toUpperCase().replace(/[^A-Z0-9 '\-]/g,"").replace(/\s+/g," ").trim().slice(0,10);
  return s||fallback;
}
function startWithNames(mode){
  const two=(mode==="pvp");
  NAMES.p1=cleanName($("n1")?$("n1").value:"","");
  if(two) NAMES.p2=cleanName($("n2")?$("n2").value:"","");
  const a=NAMES.p1||(two?"PLAYER 1":"YOU"), b=NAMES.p2||"PLAYER 2";
  if(two && a===b){                                // keep the two players distinguishable
    const base=a.slice(0,8);
    NAMES.p1=base+" 1"; NAMES.p2=base+" 2";
  }
  closeOverlay(); newGame(mode);
}

/* ============ CPU ============ */
function cpuTurn(){
  if(S.over)return;
  const p=cur(); if(!p.cpu)return;
  const ratio=revealRatio();
  if(ratio>0.55 && Math.random()<ratio*0.55){
    setHint(p.n+" is thinking…");
    setTimeout(()=>{
      toast(p.n+" solves it!");
      setTimeout(()=>roundWon(p,"solved the puzzle"),700);
    },1200);
    return;
  }
  if(p.round>=250 && ratio>0.35 && lettersLeft(new Set(VOWELS))>0 && Math.random()<0.3){
    S.phase="vowel"; render();
    const v=[...VOWELS].filter(c=>!S.used.has(c));
    setTimeout(()=>pickLetter(v[Math.floor(Math.random()*v.length)]),900);
    return;
  }
  setHint(p.n+" spins the wheel…");
  setTimeout(doSpin,700);
}
function cpuGuess(){
  const avail=FREQ.split("").filter(c=>!S.used.has(c));
  if(!avail.length){nextTurn("");return;}
  const pool=avail.slice(0,Math.min(7,avail.length));
  const ch=pool[Math.floor(Math.random()*pool.length)];
  setHint(cur().n+" picks "+ch+"…");
  setTimeout(()=>pickLetter(ch),600);
}
function revealRatio(){
  const ls=S.puzzle.t.split("").filter(c=>/[A-Z]/.test(c));
  const shown=ls.filter(c=>S.revealed.has(c)).length;
  return shown/ls.length;
}

/* ============ OVERLAY ============ */
function overlay(title,body,buttons){
  const c=$("card");
  c.innerHTML="<h2>"+title+"</h2><p>"+body+"</p>";
  const row=document.createElement("div"); row.className="crow";
  buttons.forEach(b=>{
    const el=document.createElement("button");
    el.className="btn "+(b.c||"b-spin"); el.textContent=b.l;
    el.addEventListener("click",b.f); row.appendChild(el);
  });
  c.appendChild(row);
  $("ovl").classList.add("on");
}
function closeOverlay(){$("ovl").classList.remove("on");}

function askSolve(){
  const c=$("card");
  c.innerHTML="<h2>"+(S.mode==="pvp"?cur().n+" solves":"Solve the puzzle")+"</h2>"+
              "<p>Category: <b>"+S.puzzle.c+"</b></p>"+
              '<input id="ans" placeholder="Type your answer" autocomplete="off" autocapitalize="characters">';
  const row=document.createElement("div"); row.className="crow";
  const cancel=document.createElement("button");
  cancel.className="btn b-vowel"; cancel.textContent="CANCEL";
  cancel.addEventListener("click",closeOverlay);
  const go=document.createElement("button");
  go.className="btn b-solve"; go.textContent="SOLVE";
  go.addEventListener("click",submitSolve);
  row.appendChild(cancel); row.appendChild(go); c.appendChild(row);
  $("ovl").classList.add("on");
  setTimeout(()=>{const i=$("ans"); if(i){i.focus();
    i.addEventListener("keydown",e=>{if(e.key==="Enter")submitSolve();});}},60);
}
function submitSolve(){
  const i=$("ans"); if(!i)return;
  const guess=i.value.toUpperCase().replace(/[^A-Z]/g,"");
  const real=S.puzzle.t.replace(/[^A-Z]/g,"");
  closeOverlay();
  const p=cur();
  if(guess===real){
    S.revealed=new Set("ABCDEFGHIJKLMNOPQRSTUVWXYZ".split(""));
    render(); toast("CORRECT!");
    setTimeout(()=>roundWon(p,"solved the puzzle"),900);
  }else{
    toast("Not quite…");
    setTimeout(()=>nextTurn("Wrong solve."),800);
  }
}

/* ============ EVENTS ============ */
$("bSpin").addEventListener("click",()=>{if(!$("bSpin").disabled)doSpin();});
$("bSolve").addEventListener("click",()=>{if(!$("bSolve").disabled)askSolve();});
$("bVowel").addEventListener("click",()=>{
  if($("bVowel").disabled)return;
  S.phase="vowel"; render(); setHint("Choose a vowel (£250).");
});
document.addEventListener("keydown",e=>{
  if($("ovl").classList.contains("on"))return;
  const ch=e.key.toUpperCase();
  if(/^[A-Z]$/.test(ch)){
    const b=[...$("keys").children].find(x=>x.dataset.ch===ch);
    if(b&&!b.disabled)pickLetter(ch);
  }
});
window.addEventListener("resize",()=>{if(S.puzzle)render();});

/* ============ START ============ */
newGame("cpu");
showMenu();
})();
</script>
</body>
