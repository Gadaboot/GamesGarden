<style>

  .rules{text-align:left;font-size:13px;line-height:1.7;color:#5a7ab5;margin:11px 2px}

  .st .sv{font-size:16px;font-weight:900;font-variant-numeric:tabular-nums;color:#3a6ad0}

  .lv{aspect-ratio:1;border-radius:10px;background:#eef3ff;border:1.5px solid #d8e3fa;

<script>
/* Loose Ends - runtime helpers.
   The same solver that verified every level offline ships inside the game and
   powers the hint.  In play it only ever has to FIND a solution (stopAt 1), not
   exhaust the search, so it returns in a few hundred nodes. */
function makeLoose(){
  "use strict";

  function neighbours(W,H){
    var NB=[], i, r, c, out;
    for(i=0;i<W*H;i++){
      r=(i/W)|0; c=i%W; out=[];
      if(r>0) out.push(i-W);
      if(r<H-1) out.push(i+W);
      if(c>0) out.push(i-1);
      if(c<W-1) out.push(i+1);
      NB.push(out);
    }
    return NB;
  }

  /* Count solutions up to stopAt and keep the first one.  Prunes, cheapest first:
       1. a pipe may not run alongside itself;
       2. every empty square needs two neighbours that could still join a pipe;
       3. every unfinished colour must still reach its own far end;
       4. every empty square must be reachable by somebody. */
  function solve(W,H,NB,pairs,stopAt,budget){
    var N=W*H, K=pairs.length, k, i;
    var cell=new Int32Array(N), target=new Int32Array(K), head=new Int32Array(K);
    for(i=0;i<N;i++) cell[i]=-1;
    for(k=0;k<K;k++){
      cell[pairs[k][0]]=k; cell[pairs[k][1]]=k;
      head[k]=pairs[k][0]; target[k]=pairs[k][1];
    }
    var solutions=0, nodes=0, blown=false, snapshot=null;
    var seen=new Int32Array(N), stack=new Int32Array(N), reach=new Int32Array(N);
    var live=new Uint8Array(N), stamp=0, rstamp=0;

    function touchOk(k,v){
      var nb=NB[v], n=0, j, u;
      for(j=0;j<nb.length;j++){
        u=nb[j];
        if(u===target[k]) continue;
        if(cell[u]===k) n++;
      }
      return n===1;
    }
    function besideTarget(k,v){
      var nb=NB[v], j;
      for(j=0;j<nb.length;j++) if(nb[j]===target[k]) return true;
      return false;
    }
    function degreeOk(from){
      var i,j,v,d,nb,q;
      for(i=0;i<N;i++) live[i]=0;
      for(q=from;q<K;q++){ live[head[q]]=1; live[target[q]]=1; }
      for(i=0;i<N;i++){
        if(cell[i]!==-1) continue;
        nb=NB[i]; d=0;
        for(j=0;j<nb.length;j++){ v=nb[j]; if(cell[v]===-1||live[v]) d++; }
        if(d<2) return false;
      }
      return true;
    }
    function feasible(from){
      var i,j,v,q,top,cur,nb,hit,anyFree=false;
      rstamp++;
      for(i=0;i<N;i++) if(cell[i]===-1){ anyFree=true; break; }
      for(q=from;q<K;q++){
        stamp++; top=0;
        stack[top++]=head[q]; seen[head[q]]=stamp; hit=false;
        while(top>0){
          cur=stack[--top]; nb=NB[cur];
          for(j=0;j<nb.length;j++){
            v=nb[j];
            if(seen[v]===stamp) continue;
            if(v===target[q]){ hit=true; seen[v]=stamp; continue; }
            if(cell[v]!==-1) continue;
            seen[v]=stamp; reach[v]=rstamp; stack[top++]=v;
          }
        }
        if(!hit) return false;
      }
      if(anyFree) for(i=0;i<N;i++) if(cell[i]===-1 && reach[i]!==rstamp) return false;
      return true;
    }
    function full(){ for(var i=0;i<N;i++) if(cell[i]===-1) return false; return true; }

    function go(k){
      if(blown||solutions>=stopAt) return;
      if(++nodes>budget){ blown=true; return; }
      if(k===K){
        if(full()){
          solutions++;
          if(!snapshot){ snapshot=new Int32Array(N); for(var z=0;z<N;z++) snapshot[z]=cell[z]; }
        }
        return;
      }
      var cur=head[k], nb=NB[cur], j, v, forced=besideTarget(k,cur);
      for(j=0;j<nb.length;j++){
        v=nb[j];
        if(v===target[k]){
          head[k]=v;
          if(degreeOk(k+1)&&feasible(k+1)) go(k+1);
          head[k]=cur;
          if(solutions>=stopAt||blown) return;
          continue;
        }
        if(forced) continue;                 /* beside our own end: finish or nothing */
        if(cell[v]!==-1) continue;
        cell[v]=k;
        if(!touchOk(k,v)){ cell[v]=-1; continue; }
        head[k]=v;
        if(degreeOk(k)&&feasible(k)) go(k);
        cell[v]=-1; head[k]=cur;
        if(solutions>=stopAt||blown) return;
      }
    }

    if(degreeOk(0)&&feasible(0)) go(0);
    return {solutions:solutions, blown:blown, nodes:nodes, snapshot:snapshot};
  }

  /* One route per colour, read straight off the solved board.  A pipe never
     runs alongside itself, so each square has exactly one unvisited same-colour
     neighbour and the walk is never ambiguous. */
  function routesFor(W,H,NB,pairs,budget){
    var res=solve(W,H,NB,pairs,1,budget||500000);
    if(!res.snapshot) return null;
    var own=res.snapshot, N=W*H, K=pairs.length;
    var seen=new Uint8Array(N), routes=[], k, j;
    for(k=0;k<K;k++){
      var a=pairs[k][0], b=pairs[k][1], route=[a], cur=a, guard=0;
      seen[a]=1;
      while(cur!==b && guard++<=N){
        var nb=NB[cur], moved=false;
        for(j=0;j<nb.length;j++){
          var v=nb[j];
          if(seen[v]||own[v]!==k) continue;
          seen[v]=1; route.push(v); cur=v; moved=true;
          break;
        }
        if(!moved) break;
      }
      if(cur!==b) return null;
      routes.push(route);
    }
    return routes;
  }

  return { neighbours:neighbours, solve:solve, routesFor:routesFor };
}
if(typeof module!=='undefined') module.exports = makeLoose;
</script>

<script>
(function(){
"use strict";
var LE=makeLoose();
var LS="gg_looseends_";
function load(k,fb){ try{ var v=localStorage.getItem(LS+k); return v==null?fb:JSON.parse(v);}catch(e){return fb;} }
function save(k,v){ try{ localStorage.setItem(LS+k, JSON.stringify(v)); }catch(e){} }

var BOARDS=[
  {id:"easy", name:"Gentle",   cls:"z-a", tag:"6 &times; 6 &middot; 5 to 7 pipes"},
  {id:"med",  name:"Tricky",   cls:"z-b", tag:"8 &times; 8 &middot; 7 to 9 pipes"},
  {id:"hard", name:"Fiendish", cls:"z-c", tag:"9 &times; 9 &middot; 9 to 11 pipes"}
];
function boardOf(id){ for(var i=0;i<BOARDS.length;i++) if(BOARDS[i].id===id) return BOARDS[i]; return BOARDS[0]; }
var COUNT=60;

var COL=["#e63946","#1d7fe8","#f97316","#16a34a","#9333ea","#ec4899",
         "#06b6d4","#84cc16","#8b5e34","#eab308","#0f766e"];

/* ---------------- state ---------------- */
var bId, W, H, N, K, lvl, EP, EPOF, route, owner, NB, moves, started, won, helps, solCache;

function parseLevel(str){
  var pairs=[];
  for(var i=0;i<str.length;i+=4){
    pairs.push([parseInt(str.substr(i,2),36), parseInt(str.substr(i+2,2),36)]);
  }
  return pairs;
}
function doneStr(id){
  var s=load("done_"+id,"");
  while(s.length<COUNT) s+="0";
  return s;
}
function doneCount(id){
  var s=doneStr(id), n=0;
  for(var i=0;i<s.length;i++) if(s.charAt(i)==="1") n++;
  return n;
}
function markDone(id,i){
  var s=doneStr(id);
  s=s.substr(0,i)+"1"+s.substr(i+1);
  save("done_"+id,s);
}

function init(id, level){
  bId=id; lvl=level;
  save("board",id); save("lvl_"+id, level);
  var pack=LEVELS[id];
  W=pack.w; H=pack.h; N=W*H;
  NB=LE.neighbours(W,H);
  EP=parseLevel(pack.levels[level]);
  K=EP.length;
  EPOF=new Int32Array(N); for(var i=0;i<N;i++) EPOF[i]=-1;
  owner=new Int32Array(N); for(i=0;i<N;i++) owner[i]=-1;
  route=[];
  for(var c=0;c<K;c++){
    EPOF[EP[c][0]]=c; EPOF[EP[c][1]]=c;
    owner[EP[c][0]]=c; owner[EP[c][1]]=c;
    route.push([]);
  }
  moves=0; won=false; helps=0; solCache=null; drawC=-1;
  layout(); paintHUD();
  /* does not persist - boot calls this before the title screen reads the save */
}

/* ---------------- routes ---------------- */
function isEp(c,i){ return EP[c][0]===i || EP[c][1]===i; }
function otherEnd(c,i){ return EP[c][0]===i ? EP[c][1] : EP[c][0]; }
function truncate(c, keep){
  var r=route[c];
  for(var k=keep;k<r.length;k++) if(!isEp(c,r[k])) owner[r[k]]=-1;
  r.length=keep;
}
function clearRoute(c){ truncate(c,0); }
function connected(c){
  var r=route[c];
  return r.length>=2 && isEp(c,r[0]) && isEp(c,r[r.length-1]) && r[0]!==r[r.length-1];
}
function joinedCount(){ var n=0; for(var c=0;c<K;c++) if(connected(c)) n++; return n; }
function filled(){ var n=0; for(var i=0;i<N;i++) if(owner[i]>=0) n++; return n; }

/* ---------------- audio ---------------- */
var AC=null;
function muted(){ try{ return localStorage.getItem("gg_muted")==="1"; }catch(e){ return false; } }
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=false; } } return AC; }
function beep(f,dur,type,vol,slide){
  if(muted()) return; var a=ac(); if(!a) return;
  try{
    var o=a.createOscillator(), g=a.createGain();
    o.type=type||"sine"; o.frequency.setValueAtTime(f,a.currentTime);
    if(slide) o.frequency.exponentialRampToValueAtTime(slide,a.currentTime+dur);
    g.gain.setValueAtTime(.0001,a.currentTime);
    g.gain.exponentialRampToValueAtTime(vol||.05,a.currentTime+.012);
    g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+dur);
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+dur+.02);
  }catch(e){}
}

/* ---------------- layout ---------------- */
var cv=document.getElementById("cv"), ctx=cv.getContext("2d");
var DPR=Math.min(window.devicePixelRatio||1,3);
var VW=0,VH=0,CS=0,OX=0,OY=0;
function layout(){
  var st=document.getElementById("stage");
  var aw=st.clientWidth, ah=st.clientHeight;
  if(aw<40||ah<40||!N) return;
  VW=aw; VH=ah;
  cv.style.width=aw+"px"; cv.style.height=ah+"px";
  cv.width=Math.round(aw*DPR); cv.height=Math.round(ah*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  CS=Math.max(8, Math.floor(Math.min((aw-10)/W, (ah-10)/H)));
  OX=Math.round((aw-CS*W)/2); OY=Math.round((ah-CS*H)/2);
}
window.addEventListener("resize", function(){ layout(); });

function rr(x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function mid(i){ return { x:OX+(i%W)*CS+CS/2, y:OY+((i/W)|0)*CS+CS/2 }; }

function frame(){
  requestAnimationFrame(frame);
  if(!N||!CS){ layout(); if(!CS) return; }
  ctx.clearRect(0,0,VW,VH);
  var GW=CS*W, GH=CS*H;

  ctx.fillStyle="rgba(255,255,255,.95)";
  rr(OX-4, OY-4, GW+8, GH+8, Math.max(10,CS*0.30)); ctx.fill();

  ctx.strokeStyle="#dde6f7"; ctx.lineWidth=1;
  for(var g=1;g<W;g++){ ctx.beginPath(); ctx.moveTo(OX+g*CS,OY); ctx.lineTo(OX+g*CS,OY+GH); ctx.stroke(); }
  for(g=1;g<H;g++){ ctx.beginPath(); ctx.moveTo(OX,OY+g*CS); ctx.lineTo(OX+GW,OY+g*CS); ctx.stroke(); }

  /* pipes */
  ctx.lineCap="round"; ctx.lineJoin="round";
  for(var c=0;c<K;c++){
    var r=route[c];
    if(r.length<2) continue;
    ctx.strokeStyle=COL[c%COL.length];
    ctx.lineWidth=CS*(c===drawC?0.46:0.40);
    ctx.beginPath();
    var p0=mid(r[0]); ctx.moveTo(p0.x,p0.y);
    for(var k=1;k<r.length;k++){ var p=mid(r[k]); ctx.lineTo(p.x,p.y); }
    ctx.stroke();
  }

  /* endpoints */
  for(c=0;c<K;c++){
    for(var e=0;e<2;e++){
      var m=mid(EP[c][e]);
      ctx.fillStyle=COL[c%COL.length];
      ctx.beginPath(); ctx.arc(m.x,m.y,CS*0.31,0,6.284); ctx.fill();
      if(connected(c)){
        ctx.strokeStyle="rgba(255,255,255,.92)"; ctx.lineWidth=Math.max(1.6,CS*0.075);
        ctx.beginPath(); ctx.arc(m.x,m.y,CS*0.17,0,6.284); ctx.stroke();
      }
    }
  }

  /* the head you are dragging */
  if(drawC>=0 && route[drawC].length){
    var h=mid(route[drawC][route[drawC].length-1]);
    ctx.strokeStyle="rgba(255,255,255,.9)"; ctx.lineWidth=Math.max(2,CS*0.09);
    ctx.beginPath(); ctx.arc(h.x,h.y,CS*0.20,0,6.284); ctx.stroke();
  }
}

/* ---------------- play ---------------- */
var drawC=-1;
function cellAt(x,y){
  var c=Math.floor((x-OX)/CS), r=Math.floor((y-OY)/CS);
  if(c<0||r<0||c>=W||r>=H) return -1;
  return r*W+c;
}
function pos(e){
  var b=cv.getBoundingClientRect();
  var t=(e.touches&&e.touches.length)?e.touches[0]:((e.changedTouches&&e.changedTouches.length)?e.changedTouches[0]:e);
  return {x:t.clientX-b.left, y:t.clientY-b.top};
}
function head(){ var r=route[drawC]; return r.length?r[r.length-1]:-1; }
function adjacent(a,b){
  var ar=(a/W)|0, ac=a%W, br=(b/W)|0, bc=b%W;
  return Math.abs(ar-br)+Math.abs(ac-bc)===1;
}

/* try to move the drawn pipe one square onto v */
function step(v){
  var c=drawC, r=route[c], h=r[r.length-1];
  if(!adjacent(h,v)) return false;
  var idx=r.indexOf(v);
  if(idx>=0){ truncate(c, idx+1); return true; }        /* retrace back along yourself */
  if(isEp(c,h) && r.length>1) return false;             /* already home - nothing past it */
  if(EPOF[v]>=0 && EPOF[v]!==c) return false;           /* never through another pipe's end */
  if(v===otherEnd(c,r[0])){
    r.push(v); owner[v]=c;
    beep(720,.07,"triangle",.05,980);
    if(window.GGA) GGA.haptic("light");
    return true;
  }
  if(owner[v]>=0 && owner[v]!==c){                      /* cut the pipe that was here */
    var d=owner[v], di=route[d].indexOf(v);
    if(di<0) return false;
    truncate(d, di);
  }
  r.push(v); owner[v]=c;
  return true;
}
function walkTo(t){
  var guard=0;
  while(head()!==t && guard++<24){
    var h=head();
    var hr=(h/W)|0, hc=h%W, tr=(t/W)|0, tc=t%W;
    var dr=tr-hr, dc=tc-hc;
    if(!dr && !dc) break;
    var first, second;
    if(Math.abs(dr)>=Math.abs(dc)){
      first = dr>0 ? h+W : h-W;
      second = dc===0 ? -1 : (dc>0 ? h+1 : h-1);
    }else{
      first = dc>0 ? h+1 : h-1;
      second = dr===0 ? -1 : (dr>0 ? h+W : h-W);
    }
    if(step(first)) continue;
    if(second>=0 && step(second)) continue;
    break;
  }
}

function onDown(e){
  if(won||!started) return;
  e.preventDefault();
  var p=pos(e), i=cellAt(p.x,p.y);
  if(i<0) return;
  if(EPOF[i]>=0){
    drawC=EPOF[i];
    clearRoute(drawC);
    route[drawC]=[i]; owner[i]=drawC;
    moves++;
    if(window.GGA) GGA.haptic("light");
    beep(430,.05,"sine",.04);
    return;
  }
  if(owner[i]>=0){
    var c=owner[i], idx=route[c].indexOf(i);
    if(idx<0) return;
    drawC=c;
    truncate(c, idx+1);
    moves++;
    beep(430,.05,"sine",.04);
  }
}
function onMove(e){
  if(drawC<0||won) return;
  if(e.cancelable) e.preventDefault();
  var p=pos(e);
  var c=Math.max(0,Math.min(W-1,Math.floor((p.x-OX)/CS)));
  var r=Math.max(0,Math.min(H-1,Math.floor((p.y-OY)/CS)));
  walkTo(r*W+c);
  paintHUD();
}
function onUp(){
  if(drawC<0) return;
  drawC=-1;
  paintHUD(); persist(); checkEnd();
}
cv.addEventListener("touchstart",onDown,{passive:false});
cv.addEventListener("touchmove",onMove,{passive:false});
cv.addEventListener("touchend",onUp);
cv.addEventListener("touchcancel",function(){ drawC=-1; });
cv.addEventListener("mousedown",onDown);
window.addEventListener("mousemove",onMove);
window.addEventListener("mouseup",onUp);
cv.addEventListener("contextmenu",function(e){ e.preventDefault(); });

function paintHUD(){
  document.getElementById("vLevel").textContent=(lvl+1)+"/"+COUNT;
  document.getElementById("vPipes").textContent=joinedCount()+"/"+K;
  document.getElementById("vFill").textContent=Math.round(filled()*100/N)+"%";
}

function checkEnd(){
  if(won) return;
  if(joinedCount()<K || filled()<N) return;
  won=true;
  save("cur",null);
  markDone(bId,lvl);
  var perfect=(moves===K && helps===0);
  var total=load("wins_total",0)+1; save("wins_total",total);
  if(window.GGA){
    GGA.award("le_first");
    if(total>=10) GGA.award("le_l10");
    if(total>=30) GGA.award("le_l30");
    if(perfect) GGA.award("le_perfect");
    if(bId==="hard") GGA.award("le_hard");
    if(doneCount(bId)>=COUNT) GGA.award("le_board");
    var all=true;
    for(var i=0;i<BOARDS.length;i++) if(!doneCount(BOARDS[i].id)) all=false;
    if(all) GGA.award("le_allsizes");
    GGA.haptic("success");
  }
  beep(660,.12,"triangle",.08);
  setTimeout(function(){ beep(880,.12,"triangle",.08); },120);
  setTimeout(function(){ beep(1170,.28,"triangle",.09); },250);
  paintHUD();
  setTimeout(function(){ winScreen(perfect); },520);
}

/* ---------------- save ---------------- */
function persist(){
  /* Before the player has started, this page owns nothing: pagehide and
     visibilitychange both fire while the title screen is up, and clearing here
     would eat the save that CARRY ON is about to offer. */
  if(!started) return;
  if(won){ save("cur",null); return; }
  var any=false;
  for(var c=0;c<K;c++) if(route[c].length>1) any=true;
  if(!any){ save("cur",null); return; }
  save("cur", {b:bId, l:lvl, m:moves, h:helps, r:route.map(function(x){ return x.slice(); })});
}
function restore(){
  var s=load("cur",null);
  if(!s||!s.r) return false;
  if(!LEVELS[s.b] || s.l<0 || s.l>=COUNT) return false;
  init(s.b, s.l);
  if(s.r.length!==K) return false;
  for(var c=0;c<K;c++){
    var r=s.r[c];
    if(!r||r.length<2) continue;
    if(!isEp(c,r[0])) continue;
    var okr=true;
    for(var k=0;k<r.length;k++){
      if(r[k]<0||r[k]>=N){ okr=false; break; }
      if(k>0 && !adjacent(r[k-1],r[k])){ okr=false; break; }
      if(owner[r[k]]>=0 && owner[r[k]]!==c){ okr=false; break; }
    }
    if(!okr) continue;
    route[c]=r.slice();
    for(k=0;k<r.length;k++) owner[r[k]]=c;
  }
  moves=s.m|0; helps=s.h|0;
  paintHUD();
  return true;
}

/* ---------------- tools ---------------- */
function solution(){
  if(solCache) return solCache;
  solCache=LE.routesFor(W,H,NB,EP,600000);
  return solCache;
}
document.getElementById("tHint").onclick=function(){
  if(won||!started) return;
  var sol=solution();
  if(!sol){ beep(240,.1,"sine",.04); return; }
  /* the first pipe that is not already sitting exactly where it belongs */
  var pick=-1;
  for(var c=0;c<K;c++){
    var same = route[c].length===sol[c].length;
    if(same) for(var k=0;k<sol[c].length;k++) if(route[c][k]!==sol[c][k]){ same=false; break; }
    if(!same){ pick=c; break; }
  }
  if(pick<0){ beep(240,.1,"sine",.04); return; }
  clearRoute(pick);
  var path=sol[pick];
  for(k=0;k<path.length;k++){
    var v=path[k], d=owner[v];
    if(d>=0 && d!==pick){
      var di=route[d].indexOf(v);
      if(di>=0) truncate(d, di);
    }
  }
  route[pick]=path.slice();
  for(k=0;k<path.length;k++) owner[path[k]]=pick;
  helps++; moves++;
  beep(760,.13,"sine",.06,1050);
  if(window.GGA) GGA.haptic("light");
  paintHUD(); persist(); checkEnd();
};
document.getElementById("tClear").onclick=function(){
  if(won||!started) return;
  for(var c=0;c<K;c++) clearRoute(c);
  beep(300,.09,"sine",.04);
  if(window.GGA) GGA.haptic("medium");
  paintHUD(); persist();
};
document.getElementById("tLevels").onclick=function(){ if(started) levelScreen(); };

/* ---------------- screens ---------------- */
var ovl=document.getElementById("ovl"), card=document.getElementById("card");
function openOvl(h){ card.innerHTML=h; ovl.classList.add("on"); }
function closeOvl(){ ovl.classList.remove("on"); }

function titleScreen(){
  var cur=load("cur",null);
  var h='<h2>LOOSE ENDS</h2><p>Join every pair of dots and fill every square. Pipes may not cross.</p><div class="sizes">';
  for(var i=0;i<BOARDS.length;i++){
    var b=BOARDS[i];
    h+='<div class="sz '+b.cls+'" data-b="'+b.id+'"><div style="text-align:left">'+
       '<div class="sn">'+b.name+'</div><div class="stg">'+b.tag+'</div></div>'+
       '<div style="font-size:12px;font-weight:900">'+doneCount(b.id)+'/'+COUNT+'</div></div>';
  }
  h+='</div>';
  if(cur&&cur.r) h+='<button class="btn btn-go" id="bResume">CARRY ON &middot; '+
    boardOf(cur.b).name+' '+((cur.l|0)+1)+'</button>';
  h+='<button class="btn btn-alt" id="bRules">HOW TO PLAY</button>';
  openOvl(h);
  Array.prototype.forEach.call(card.querySelectorAll(".sz"), function(el){
    el.onclick=function(){
      var id=el.getAttribute("data-b");
      started=true;
      init(id, Math.min(COUNT-1, load("lvl_"+id,0)|0));
      persist(); closeOvl(); layout();
    };
  });
  var br=card.querySelector("#bResume");
  if(br) br.onclick=function(){
    started=true;
    if(!restore()) init(load("board","easy"), 0);
    persist(); closeOvl(); layout();
  };
  card.querySelector("#bRules").onclick=rulesScreen;
}
function rulesScreen(){
  openOvl('<h2>HOW TO PLAY</h2><div class="rules">'+
    '&#9642; Each colour has <b>two dots</b>. Drag from one to the other to lay a pipe between them.<br><br>'+
    '&#9642; A level is done when every pair is joined <b>and every square is covered</b>. Joining them all up is the easy half.<br><br>'+
    '&#9642; Drag across a pipe and you <b>cut it</b> where you crossed. Drag back along your own pipe to reel it in.<br><br>'+
    '&#9642; A pipe never runs alongside itself, and never passes through another colour\'s dot.<br><br>'+
    '&#9642; Every board has <b>exactly one</b> solution, checked before it shipped. Stuck is never the board\'s fault.<br><br>'+
    '&#9642; <b>Hint</b> lays one pipe correctly. <b>Clear</b> wipes the board. <b>Levels</b> jumps to any of the 60.'+
    '</div><button class="btn btn-go" id="bBack">GOT IT</button>');
  card.querySelector("#bBack").onclick=titleScreen;
}
function levelScreen(){
  var s=doneStr(bId);
  var h='<h2>'+boardOf(bId).name.toUpperCase()+'</h2><p>'+doneCount(bId)+' of '+COUNT+' done.</p><div class="lvgrid">';
  for(var i=0;i<COUNT;i++){
    h+='<button class="lv'+(s.charAt(i)==="1"?" done":"")+(i===lvl?" at":"")+'" data-l="'+i+'">'+(i+1)+'</button>';
  }
  h+='</div><button class="btn btn-alt" id="bBack2">BACK</button>';
  openOvl(h);
  Array.prototype.forEach.call(card.querySelectorAll(".lv"), function(el){
    el.onclick=function(){
      started=true;
      init(bId, parseInt(el.getAttribute("data-l"),10));
      persist(); closeOvl(); layout();
    };
  });
  card.querySelector("#bBack2").onclick=function(){ closeOvl(); };
}
function winScreen(perfect){
  var last=(lvl>=COUNT-1);
  openOvl('<h2>'+(perfect?"STRAIGHT OFF!":"ALL JOINED UP!")+'</h2>'+
    '<p>'+boardOf(bId).name+' level '+(lvl+1)+' is done.</p>'+
    '<div class="stats">'+
      '<div class="st"><div class="sk">PIPES</div><div class="sv">'+K+'</div></div>'+
      '<div class="st"><div class="sk">DRAWN</div><div class="sv">'+moves+'</div></div>'+
      '<div class="st"><div class="sk">DONE</div><div class="sv">'+doneCount(bId)+'/'+COUNT+'</div></div>'+
    '</div>'+
    (last?'<button class="btn btn-go" id="bList">LEVEL LIST</button>'
        :'<button class="btn btn-go" id="bNext">NEXT LEVEL</button>')+
    '<button class="btn btn-alt" id="bMenu">CHANGE BOARD</button>');
  var bn=card.querySelector("#bNext");
  if(bn) bn.onclick=function(){ init(bId, lvl+1); persist(); closeOvl(); layout(); };
  var bl=card.querySelector("#bList");
  if(bl) bl.onclick=levelScreen;
  card.querySelector("#bMenu").onclick=titleScreen;
}
document.getElementById("bPause").onclick=function(){
  if(won||!started){ titleScreen(); return; }
  openOvl('<h2>PAUSED</h2>'+
    '<div class="stats">'+
      '<div class="st"><div class="sk">BOARD</div><div class="sv" style="font-size:13px">'+boardOf(bId).name+'</div></div>'+
      '<div class="st"><div class="sk">LEVEL</div><div class="sv">'+(lvl+1)+'</div></div>'+
      '<div class="st"><div class="sk">JOINED</div><div class="sv">'+joinedCount()+'/'+K+'</div></div>'+
    '</div>'+
    '<button class="btn btn-go" id="bGo">BACK TO IT</button>'+
    '<button class="btn btn-alt" id="bLv">LEVEL LIST</button>'+
    '<button class="btn btn-alt" id="bMenu2">CHANGE BOARD</button>');
  card.querySelector("#bGo").onclick=closeOvl;
  card.querySelector("#bLv").onclick=levelScreen;
  card.querySelector("#bMenu2").onclick=titleScreen;
};

/* ---------------- boot ---------------- */
var bootBoard=load("board","easy");
if(!LEVELS[bootBoard]) bootBoard="easy";
init(bootBoard, Math.min(COUNT-1, load("lvl_"+bootBoard,0)|0));
started=false;
titleScreen();
requestAnimationFrame(frame);
setTimeout(function(){ layout(); },50);
window.addEventListener("orientationchange", function(){ setTimeout(layout,220); });
document.addEventListener("visibilitychange", function(){ if(document.hidden) persist(); });
window.addEventListener("pagehide", persist);


})();
</script>
