<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Five Dice</title>
<style>
  /* ---- Five Dice, re-skinned to the arcade house style, teal / salmon ----
     The game logic underneath is the original, untouched: same scoring, same
     computer, same save key, same two badges.  Everything here is chrome. */
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    background:
      radial-gradient(115% 80% at 4% -8%, #b8f5ec 0%, transparent 55%),
      radial-gradient(120% 80% at 98% 106%, #ffd3c4 0%, transparent 58%),
      linear-gradient(162deg, #0f8a90 0%, #3fbdb4 47%, #eafbf8 100%);
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    user-select:none;-webkit-user-select:none;
    display:flex;flex-direction:column;align-items:center;
    padding:calc(env(safe-area-inset-top) + 6px) 8px calc(env(safe-area-inset-bottom) + 6px);
  }
  #shell{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column}
  .bar{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .pill{display:inline-flex;align-items:center;gap:5px;text-decoration:none;color:#0a5c63;
    background:rgba(255,255,255,.95);border:1.5px solid #fff;padding:6px 12px;border-radius:999px;
    font-size:12.5px;font-weight:800;box-shadow:0 3px 9px rgba(8,70,72,.28);cursor:pointer;white-space:nowrap}
  .pill:active{transform:scale(.95)}
  .title{flex:1;text-align:center;font-weight:900;letter-spacing:1.4px;line-height:1;
    font-size:clamp(14px,4.4vw,20px);text-shadow:0 2px 0 #0b6a70,0 4px 12px rgba(6,55,58,.45)}
  .strip{display:flex;gap:6px;margin-bottom:7px}
  .chip{flex:1;text-align:center;padding:6px 2px;border-radius:13px;
    background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4)}
  .chip.me{background:rgba(255,255,255,.34)}
  .chip .k{font-size:8px;letter-spacing:1.1px;font-weight:900;opacity:.9;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chip .v{font-size:clamp(13px,4.2vw,17px);font-weight:900;font-variant-numeric:tabular-nums}

  #stage{flex:1;position:relative;min-height:0;display:flex;flex-direction:column}
  /* "safe center" centres the dice and the sheet in the slack a tall phone
     leaves, but falls back to top-aligned when the sheet is taller than the
     space - plain "center" would clip the top of it out of reach. */
  #play{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;
    justify-content:safe center;overflow-y:auto;-webkit-overflow-scrolling:touch}

  /* ---------- dice ---------- */
  .dice-row{display:flex;gap:7px;margin:2px 0 12px;flex:0 0 auto}
  .die{
    width:57px;height:57px;flex:0 0 auto;
    background:linear-gradient(150deg,#fffdf6,#efe7d6);
    border-radius:13px;
    box-shadow:0 4px 0 rgba(8,70,72,.28),0 6px 14px rgba(6,55,58,.3),inset 0 -3px 0 rgba(0,0,0,.07);
    position:relative;cursor:pointer;
    transition:transform .15s,box-shadow .15s;
    border:2px solid #fff;
  }
  /* Held dice press DOWN into the table and wear a salmon ring - the arcade's
     accent colour doing the job the old gold outline did. */
  .die.held{
    transform:translateY(5px);
    border-color:#ff8a72;
    box-shadow:0 1px 0 rgba(8,70,72,.28),0 0 0 3px rgba(255,138,114,.45),0 3px 9px rgba(6,55,58,.3);
  }
  .die.rolling{animation:tumble .45s ease}
  @keyframes tumble{
    0%{transform:rotate(0) scale(1)}
    30%{transform:rotate(140deg) scale(.82)}
    60%{transform:rotate(260deg) scale(1.08)}
    100%{transform:rotate(360deg) scale(1)}
  }
  .die.blank{opacity:.42}
  .pip{position:absolute;width:11px;height:11px;border-radius:50%;
    background:radial-gradient(circle at 34% 28%,#4b6b6d,#0c3d41);
    transform:translate(-50%,-50%)}
  .hold-label{position:absolute;bottom:-15px;left:50%;transform:translateX(-50%);
    font-size:8.5px;font-weight:900;letter-spacing:1px;color:#fff;opacity:0;transition:opacity .15s;
    text-shadow:0 1px 3px rgba(6,55,58,.7)}
  .die.held .hold-label{opacity:1}

  /* ---------- roll ---------- */
  .rollbtn{
    flex:0 0 auto;border:none;border-radius:16px;font-family:inherit;
    background:linear-gradient(180deg,#ff8a72,#e04a30);color:#fff;
    font-size:16px;font-weight:900;letter-spacing:1.2px;padding:12px 44px;cursor:pointer;
    box-shadow:0 5px 0 #ab3220,0 8px 18px rgba(170,50,32,.34);
    transition:transform .1s,box-shadow .1s,opacity .2s;
  }
  .rollbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #ab3220}
  .rollbtn:disabled{opacity:.4;box-shadow:0 5px 0 #ab3220;cursor:default}
  .hint{font-size:11.5px;font-weight:700;min-height:15px;margin:7px 4px 8px;text-align:center;
    text-shadow:0 1px 4px rgba(6,55,58,.45)}

  /* ---------- scorecard ---------- */
  .sheet{width:100%;background:#fffdf6;color:#0a5c63;border-radius:17px;border:2px solid #fff;
    box-shadow:0 8px 22px rgba(6,55,58,.32);overflow:hidden;flex:0 0 auto;margin-bottom:4px}
  .sheet:empty{display:none}
  .cols{display:flex}
  .col{flex:1;min-width:0}
  .col+.col{border-left:2px dashed #d6ece8}
  .sec{background:#0f8a90;color:#fff;font-size:9.5px;font-weight:900;letter-spacing:1.6px;
    text-align:center;padding:5px 0}
  .phead{display:grid;grid-template-columns:1fr 52px 52px;gap:4px;background:#0b7076;padding:5px 9px}
  .pname{text-align:center;font-size:11px;font-weight:900;border-radius:7px;padding:3px 0;
    color:#a8e0dd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pname.on{background:#ff8a72;color:#fff}
  .row{display:grid;grid-template-columns:1fr 48px;gap:4px;align-items:center;padding:5px 9px;
    border-bottom:1px solid #eef4f1;font-size:13px;font-weight:700;cursor:pointer}
  .row.wide{grid-template-columns:1fr 52px 52px;padding:2px 9px;font-size:11.8px}
  .row.wide .mini{display:none}
  .row:active{background:#f2fbf9}
  .lbl{display:flex;align-items:baseline;gap:5px;min-width:0}
  .lbl>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mini{font-size:9.5px;color:#93b6b4;font-weight:600;flex:0 0 auto}
  .val{text-align:center;font-weight:900;font-size:14px;border-radius:8px;padding:3px 2px;
    font-variant-numeric:tabular-nums}
  .val.open{color:#b9cfcd}
  .val.dim{opacity:.4}
  /* An available score is the one thing the eye must find, so it is the accent
     colour and it moves.  A zero is shown just as plainly - taking a zero is a
     real choice and hiding it would be dishonest. */
  .val.avail{background:#ff8a72;color:#fff;box-shadow:0 2px 6px rgba(224,74,48,.4);
    animation:pulse 1.2s infinite}
  .val.avail.zero{background:#ffe2da;color:#d8412a;animation:none;box-shadow:none}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.11)}}
  .val.taken{color:#0a5c63}
  .val.taken.zeroed{color:#d8412a}
  .trow{display:grid;grid-template-columns:1fr 48px;gap:4px;align-items:center;padding:5px 9px;
    font-size:11px;font-weight:800;background:#eefaf7;border-bottom:1px solid #dcefeb;color:#4f8b8c}
  .trow.wide{grid-template-columns:1fr 52px 52px;padding:2px 9px;font-size:10.5px}
  /* Two full columns of thirteen boxes cannot fit a 375 phone - it is 180px too
     tall however hard you squeeze - so the sheet scrolls, and this says so.
     A score you cannot see is a score you will not take. */
  .more{position:absolute;left:50%;bottom:2px;transform:translateX(-50%);
    background:rgba(255,255,255,.96);color:#0a5c63;font-size:9.5px;font-weight:900;
    letter-spacing:1px;padding:4px 12px;border-radius:999px;pointer-events:none;
    box-shadow:0 3px 10px rgba(6,55,58,.3);opacity:0;transition:opacity .2s;z-index:20}
  .more.on{opacity:1}
  .tval{text-align:center;font-weight:900;color:#0a5c63;font-variant-numeric:tabular-nums}
  .grand{background:#0f8a90;color:#fff;font-size:13.5px;font-weight:900;padding:8px;
    text-align:center;letter-spacing:.8px}

  /* ---------- tools ---------- */
  #tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:7px}
  .tool{background:rgba(255,255,255,.96);border:1.5px solid #fff;border-radius:15px;
    padding:9px 2px 8px;text-align:center;cursor:pointer;color:#0a5c63;
    box-shadow:0 4px 0 rgba(10,80,82,.35),0 6px 14px rgba(6,55,58,.24)}
  .tool:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(10,80,82,.35)}
  .tool.off{opacity:.42}
  .tool .ti{font-size:19px;line-height:1}
  .tool .tl{font-size:9px;font-weight:900;letter-spacing:.5px;margin-top:2px;opacity:.75}

  /* ---------- overlay cards ---------- */
  .ovl{position:absolute;inset:0;z-index:40;display:none;align-items:center;justify-content:center;
    background:rgba(8,80,84,.45);backdrop-filter:blur(6px);padding:12px}
  .ovl.on{display:flex}
  .card{width:100%;max-width:352px;background:linear-gradient(180deg,#fff,#e9fbf8);
    border:2px solid #fff;border-radius:22px;padding:18px 16px 14px;text-align:center;
    color:#74a6a6;box-shadow:0 20px 50px rgba(6,55,58,.45);max-height:100%;overflow:auto}
  .card h2{font-size:23px;font-weight:900;letter-spacing:1px;color:#e2553c;margin-bottom:3px}
  .card p{font-size:13.5px;line-height:1.5;color:#7fabab;margin:7px 0}
  .card .big{font-size:42px;font-weight:900;color:#e2553c;margin:6px 0 2px;
    font-variant-numeric:tabular-nums}
  .sizes{display:grid;grid-template-columns:1fr;gap:8px;margin-top:11px}
  .sz{border-radius:16px;padding:11px;cursor:pointer;color:#fff;font-weight:900;
    box-shadow:0 4px 0 rgba(0,0,0,.14);display:flex;align-items:center;justify-content:space-between;
    text-align:left}
  .sz:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.14)}
  .sz .sn{font-size:14.5px}
  .sz .stg{font-size:10px;opacity:.93;font-weight:800;margin-top:2px}
  .z-a{background:linear-gradient(180deg,#8fe0c4,#2fae8b)}
  .z-b{background:linear-gradient(180deg,#ffd166,#f0a020)}
  .z-c{background:linear-gradient(180deg,#ff8a72,#d9422b)}
  .btn{display:block;width:100%;margin-top:8px;padding:12px;border:none;border-radius:15px;
    font-size:14.5px;font-weight:900;cursor:pointer;letter-spacing:.4px;font-family:inherit}
  .btn-go{background:linear-gradient(180deg,#ff8a72,#dd4229);color:#fff;
    box-shadow:0 5px 0 #a91d16,0 8px 18px rgba(180,45,35,.34)}
  .btn-go:active{transform:translateY(3px);box-shadow:0 2px 0 #a91d16}
  .btn-alt{background:#e4f8f5;color:#0a5c63;border:1.5px solid #c4ece6}
  .rules{text-align:left;font-size:12.6px;line-height:1.65;color:#7fabab;margin:10px 2px}
  .rules b{color:#e2553c}
  .stats{display:flex;gap:8px;margin-top:11px}
  .st{flex:1;background:#e4f8f5;border-radius:13px;padding:8px 4px}
  .st .sk{font-size:8.5px;letter-spacing:1.1px;font-weight:900;color:#9dcac6}
  .st .sv{font-size:16px;font-weight:900;font-variant-numeric:tabular-nums;color:#0a5c63}

  /* ---------- toast ---------- */
  .toast{position:absolute;top:12%;left:50%;transform:translateX(-50%) scale(.6);
    background:linear-gradient(180deg,#ff8a72,#e04a30);color:#fff;font-weight:900;font-size:17px;
    letter-spacing:1.2px;padding:12px 22px;border-radius:15px;border:2px solid #fff;
    box-shadow:0 10px 30px rgba(6,55,58,.5);opacity:0;pointer-events:none;z-index:45;
    transition:all .35s cubic-bezier(.2,1.6,.4,1);text-align:center;max-width:90%}
  .toast.show{opacity:1;transform:translateX(-50%) scale(1)}

  @media (max-width:370px){
    .die{width:50px;height:50px}
    .pip{width:9.5px;height:9.5px}
    .dice-row{gap:6px}
    /* On a 320 phone the two solo columns squeeze "3 of a Kind" down to
       "3 of a ...". Dropping the little hint and narrowing the value box buys
       back the room, and the hint is repeated in HOW TO PLAY anyway. */
    .row .mini{display:none}
    .row{grid-template-columns:1fr 42px;font-size:12.2px;padding:5px 7px}
    .trow{grid-template-columns:1fr 42px;padding:5px 7px}
    .row.wide{grid-template-columns:1fr 46px 46px;padding:2px 7px}
    .trow.wide{grid-template-columns:1fr 46px 46px;padding:2px 7px}
    .phead{grid-template-columns:1fr 46px 46px;padding:5px 7px}
  }
  @media (max-height:700px){
    .card{padding:13px 13px 10px}.card h2{font-size:19px}
    .card p{font-size:12px;margin:5px 0}
    .rules{font-size:11.4px;line-height:1.45}
    .btn{padding:10px;font-size:13.5px;margin-top:6px}
    .sz{padding:9px}.sz .sn{font-size:13.5px}.sizes{gap:7px;margin-top:9px}
    .rollbtn{padding:10px 40px;font-size:15px}
    .dice-row{margin:0 0 11px}
  }
</style>
</head>
<body>
<div id="shell">
  <div class="bar">
    <a class="pill" href="index.html">&#9776; Menu</a>
    <div class="title">FIVE DICE</div>
    <button class="pill" id="bPause">&#10074;&#10074;</button>
  </div>
  <div class="strip" id="strip"></div>
  <div id="stage">
    <div id="play">
      <div class="dice-row" id="diceRow"></div>
      <button class="rollbtn" id="rollBtn">ROLL</button>
      <div class="hint" id="status"></div>
      <div class="sheet" id="card"></div>
    </div>
    <div class="more" id="more">&#9660; MORE BELOW</div>
    <div class="ovl" id="ovl"><div class="card" id="ovlCard"></div></div>
    <div class="toast" id="toast"></div>
  </div>
  <div id="tools">
    <div class="tool" id="tNew"><div class="ti">&#8635;</div><div class="tl">NEW GAME</div></div>
    <div class="tool" id="tMode"><div class="ti">&#8646;</div><div class="tl">CHANGE MODE</div></div>
    <div class="tool" id="tRules"><div class="ti">?</div><div class="tl">HOW TO PLAY</div></div>
  </div>
</div>

<script src="achievements.js"></script>
<script>
"use strict";
/* ============================================================
   Everything from here down is the original Five Dice logic.
   Only the presentation layer (buildStrip, the overlay cards and
   the tool row wiring) is new; the scoring, the computer, the save
   format and the two badge awards are byte-for-byte the old game.
   ============================================================ */
const PIPS = {
  1: [[50,50]],
  2: [[28,28],[72,72]],
  3: [[28,28],[50,50],[72,72]],
  4: [[28,28],[72,28],[28,72],[72,72]],
  5: [[28,28],[72,28],[50,50],[28,72],[72,72]],
  6: [[28,28],[72,28],[28,50],[72,50],[28,72],[72,72]]
};
const UPPER = [
  { id:"ones",   name:"Aces",   mini:"1s", face:1 },
  { id:"twos",   name:"Twos",   mini:"2s", face:2 },
  { id:"threes", name:"Threes", mini:"3s", face:3 },
  { id:"fours",  name:"Fours",  mini:"4s", face:4 },
  { id:"fives",  name:"Fives",  mini:"5s", face:5 },
  { id:"sixes",  name:"Sixes",  mini:"6s", face:6 }
];
const LOWER = [
  { id:"threeKind", name:"3 of a Kind", mini:"sum" },
  { id:"fourKind",  name:"4 of a Kind", mini:"sum" },
  { id:"fullHouse", name:"Full House",  mini:"25" },
  { id:"smStraight",name:"Sm Straight", mini:"30" },
  { id:"lgStraight",name:"Lg Straight", mini:"40" },
  { id:"fiveKind",  name:"FIVE OF A KIND", mini:"50" },
  { id:"chance",    name:"Chance",      mini:"sum" }
];
const ALL = [...UPPER, ...LOWER];
const MODES = [
  { id:"solo", cls:"z-a", name:"1 Player",        tag:"Just you and the scorecard" },
  { id:"two",  cls:"z-b", name:"2 Players",       tag:"Pass the phone" },
  { id:"cpu",  cls:"z-c", name:"Vs the Computer", tag:"Head to head, thirteen rounds" }
];
let TEMPO = 1;
const wait = ms => new Promise(r => setTimeout(r, ms * TEMPO));

let mode = null, players = null, cur = 0;
let dice, held, rollsLeft, rolling = false, gameOver = false, cpuBusy = false;
let rollDone = null, gameSeq = 0;

// ---------- save / resume ----------
/* Save key unchanged from the original build on purpose: a game in progress on
   somebody's phone survives this re-skin instead of being thrown away. */
const SAVE_KEY = "gg-save-five-dice";
function saveGame() {
  if (!players || gameOver || cpuBusy) return;
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      mode, players, cur, dice, held, rollsLeft
    }));
  } catch (e) {}
}
function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }
function loadSave() {
  try { return JSON.parse(localStorage.getItem(SAVE_KEY) || "null"); } catch (e) { return null; }
}

function resetTurn() {
  dice = [0,0,0,0,0];
  held = [false,false,false,false,false];
  rollsLeft = 3;
}

// ---------- overlay plumbing ----------
const ovl = document.getElementById("ovl");
const ovlCard = document.getElementById("ovlCard");
function openOvl(html) { ovlCard.innerHTML = html; ovl.classList.add("on"); updateMore(); }
function closeOvl() { ovl.classList.remove("on"); updateMore(); }
function ovlOpen() { return ovl.classList.contains("on"); }

function startGame(m) {
  mode = m;
  const names = m === "solo" ? ["You"] : m === "two" ? ["Player 1","Player 2"] : ["You","Computer"];
  players = names.map(n => ({
    name: n,
    scores: Object.fromEntries(ALL.map(c => [c.id, null])),
    yb: 0
  }));
  cur = 0; gameOver = false; rolling = false; cpuBusy = false;
  gameSeq++;
  resetTurn();
  closeOvl();
  buildStrip();
  buildBoard();
  render();
  saveGame();
}

// ---------- scoring ----------
function counts(d) { const c = [0,0,0,0,0,0,0]; d.forEach(v => c[v]++); return c; }
function sum(d) { return d.reduce((a,b) => a+b, 0); }

function potential(id, d) {
  const c = counts(d);
  const max = Math.max(...c);
  const str = [1,2,3,4,5,6].map(f => c[f] > 0 ? "1" : "0").join("");
  switch (id) {
    case "ones":   return c[1]*1;
    case "twos":   return c[2]*2;
    case "threes": return c[3]*3;
    case "fours":  return c[4]*4;
    case "fives":  return c[5]*5;
    case "sixes":  return c[6]*6;
    case "threeKind": return max >= 3 ? sum(d) : 0;
    case "fourKind":  return max >= 4 ? sum(d) : 0;
    case "fullHouse": {
      const has3 = c.some(n => n === 3), has2 = c.some(n => n === 2);
      return (has3 && has2) || max === 5 ? 25 : 0;
    }
    case "smStraight": return /1111/.test(str) ? 30 : 0;
    case "lgStraight": return /11111/.test(str) ? 40 : 0;
    case "fiveKind": return max === 5 ? 50 : 0;
    case "chance":  return sum(d);
  }
}
const upperRaw = p => UPPER.reduce((a,c) => a + (p.scores[c.id] ?? 0), 0);
const bonusOf  = p => upperRaw(p) >= 63 ? 35 : 0;
const lowerOf  = p => LOWER.reduce((a,c) => a + (p.scores[c.id] ?? 0), 0) + p.yb;
const grandOf  = p => upperRaw(p) + bonusOf(p) + lowerOf(p);
const playerDone = p => ALL.every(c => p.scores[c.id] !== null);
const roundOf = p => ALL.filter(c => p.scores[c.id] !== null).length + 1;

// ---------- actions ----------
function humanCanAct() {
  return players && !gameOver && !rolling && !cpuBusy && !ovlOpen() && !(mode === "cpu" && cur === 1);
}

function roll() {
  if (!players || rollsLeft <= 0 || gameOver || rolling) return;
  rolling = true;
  rollsLeft--;
  document.getElementById("rollBtn").disabled = true;
  const dieEls = document.querySelectorAll(".die");
  dice.forEach((_, i) => { if (!held[i]) dieEls[i].classList.add("rolling"); });
  let ticks = 0;
  const iv = setInterval(() => {
    ticks++;
    dice.forEach((_, i) => {
      if (!held[i]) dice[i] = 1 + Math.floor(Math.random() * 6);
    });
    renderDice();
    if (ticks >= 6) {
      clearInterval(iv);
      document.querySelectorAll(".die").forEach(el => el.classList.remove("rolling"));
      afterRoll();
    }
  }, Math.max(8, 75 * TEMPO));
}

function afterRoll() {
  rolling = false;
  if (!players) { rollDone = null; return; }
  const P = players[cur];
  if (Math.max(...counts(dice)) === 5 && (P.scores.fiveKind === null || P.scores.fiveKind === 50)) {
    const nm = players.length > 1 ? P.name + " - " : "";
    showToast(nm + (P.scores.fiveKind === 50 ? "FIVE OF A KIND! +100" : "FIVE OF A KIND!"));
    if (window.GGA && !(mode === "cpu" && cur === 1)){ GGA.award('dice_five'); GGA.haptic('success'); }
  }
  render();
  saveGame();
  if (rollDone) { const f = rollDone; rollDone = null; f(); }
}

function rollAsync() { return new Promise(res => { rollDone = res; roll(); }); }

function toggleHold(i) {
  if (!humanCanAct() || dice[i] === 0) return;
  held[i] = !held[i];
  if (window.GGA) GGA.haptic('light');
  render();
  saveGame();
}

function take(id) {
  const P = players[cur];
  if (!players || gameOver || rolling || P.scores[id] !== null || dice[0] === 0 || rollsLeft === 3) return;
  if (Math.max(...counts(dice)) === 5 && P.scores.fiveKind === 50) P.yb += 100;
  P.scores[id] = potential(id, dice);
  if (window.GGA) GGA.haptic('medium');
  resetTurn();
  if (players.every(playerDone)) {
    gameOver = true;
    clearSave();
    render();
    endGame();
    return;
  }
  do { cur = (cur + 1) % players.length; } while (playerDone(players[cur]));
  render();
  saveGame();
  if (mode === "cpu" && cur === 1) cpuTurn();
}

// ---------- CPU AI ----------
const SAC = { fiveKind:10, lgStraight:8, smStraight:6, fullHouse:6, fourKind:5,
  threeKind:3, chance:5, sixes:5, fives:4, fours:3, threes:2, twos:1, ones:.5 };

function chooseCategory() {
  const p = players[cur].scores;
  let bestId = null, bestVal = -1e9;
  ALL.forEach(cat => {
    if (p[cat.id] !== null) return;
    const s = potential(cat.id, dice);
    let v = s;
    if (cat.face && s >= cat.face * 3) v += 4;   // good bonus progress
    if (cat.id === "chance") v -= 6;             // save chance as fallback
    if (s === 0) v -= SAC[cat.id];
    if (v > bestVal) { bestVal = v; bestId = cat.id; }
  });
  return bestId;
}

function decideHolds() {
  const p = players[cur].scores;
  const c = counts(dice);
  const hold = [false,false,false,false,false];
  // longest run of consecutive faces
  let bestRun = [], run = [];
  for (let f = 1; f <= 6; f++) {
    if (c[f] > 0) { run.push(f); if (run.length > bestRun.length) bestRun = [...run]; }
    else run = [];
  }
  const maxCount = Math.max(...c);
  const strOpen = p.lgStraight === null || p.smStraight === null;
  if (strOpen && bestRun.length >= 4 && maxCount < 3) {
    const need = new Set(bestRun.slice(-5));
    dice.forEach((v, i) => { if (need.has(v)) { hold[i] = true; need.delete(v); } });
    return hold;
  }
  // two pairs with full house open
  const pairs = [];
  for (let f = 6; f >= 1; f--) if (c[f] >= 2) pairs.push(f);
  if (p.fullHouse === null && pairs.length >= 2 && maxCount < 4) {
    let a = 0, b = 0;
    dice.forEach((v, i) => {
      if (v === pairs[0] && a < 2) { hold[i] = true; a++; }
      else if (v === pairs[1] && b < 2) { hold[i] = true; b++; }
    });
    return hold;
  }
  // hold most frequent face (ties -> higher face)
  let best = 0, bc = 0;
  for (let f = 1; f <= 6; f++) if (c[f] >= bc) { bc = c[f]; best = f; }
  if (bc >= 2) {
    dice.forEach((v, i) => { if (v === best) hold[i] = true; });
    return hold;
  }
  // all singles: keep high dice whose upper slot is open
  dice.forEach((v, i) => {
    if (v >= 5 && p[UPPER[v-1].id] === null) hold[i] = true;
  });
  return hold;
}

function cpuShouldStop() {
  const p = players[cur].scores;
  const checks = [["fiveKind",50],["lgStraight",40],["fullHouse",25]];
  for (const [id, maxv] of checks)
    if (p[id] === null && potential(id, dice) === maxv) return true;
  if (p.smStraight === null && p.lgStraight !== null && potential("smStraight", dice) === 30) return true;
  if (p.fourKind === null && potential("fourKind", dice) >= 20) return true;
  return false;
}

async function cpuTurn() {
  const seq = gameSeq;
  cpuBusy = true;
  render();
  await wait(700);
  for (let r = 0; r < 3; r++) {
    if (seq !== gameSeq) return;
    await rollAsync();
    if (seq !== gameSeq) return;
    await wait(700);
    if (rollsLeft === 0 || cpuShouldStop()) break;
    held = decideHolds();
    render();
    await wait(700);
    if (seq !== gameSeq) return;
    if (held.every(h => h)) break;
  }
  if (seq !== gameSeq) return;
  const id = chooseCategory();
  cpuBusy = false;
  take(id);
}

// ---------- end game ----------
function ratingText(g) {
  if (g >= 300) return "Legendary rolling.";
  if (g >= 250) return "An excellent game.";
  if (g >= 200) return "Nicely done.";
  if (g >= 150) return "Not bad at all.";
  return "The dice were cruel. Have another go.";
}

function endGame() {
  const totals = players.map(grandOf);
  if (window.GGA && totals[0] >= 250) GGA.award('dice_250');
  if (window.GGA) GGA.haptic('success');
  const best = Math.max(bestScore, totals[0]);
  if (best > bestScore) { bestScore = best; saveBest(best); }
  let head, big, sub;
  if (players.length === 1) {
    head = "ROUND OVER";
    big = String(totals[0]);
    sub = ratingText(totals[0]);
  } else {
    head = totals[0] === totals[1] ? "A DEAD HEAT"
         : (totals[0] > totals[1] ? players[0].name : players[1].name).toUpperCase() + " WINS";
    big = totals[0] + " - " + totals[1];
    sub = totals[0] === totals[1] ? "Nothing in it." : "Thirteen rounds, all done.";
  }
  setTimeout(() => {
    openOvl('<h2>' + head + '</h2>' +
      '<div class="big">' + big + '</div>' +
      '<p>' + sub + '</p>' +
      '<div class="stats">' +
        '<div class="st"><div class="sk">UPPER</div><div class="sv">' + (upperRaw(players[0]) + bonusOf(players[0])) + '</div></div>' +
        '<div class="st"><div class="sk">LOWER</div><div class="sv">' + lowerOf(players[0]) + '</div></div>' +
        '<div class="st"><div class="sk">BEST</div><div class="sv">' + bestScore + '</div></div>' +
      '</div>' +
      '<button class="btn btn-go" id="bAgain">PLAY AGAIN</button>' +
      '<button class="btn btn-alt" id="bModes">CHANGE MODE</button>');
    document.getElementById("bAgain").onclick = () => startGame(mode);
    document.getElementById("bModes").onclick = () => titleScreen();
  }, 600 * TEMPO);
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}

// ---------- best score ----------
const BEST_KEY = "gg_fivedice_best";
let bestScore = 0;
try { bestScore = parseInt(localStorage.getItem(BEST_KEY) || "0", 10) || 0; } catch (e) {}
function saveBest(v) { try { localStorage.setItem(BEST_KEY, String(v)); } catch (e) {} }

// ---------- screens ----------
function titleScreen() {
  gameSeq++;                 // cancels any in-flight computer turn
  const sv = loadSave();
  let h = '<h2>FIVE DICE</h2>' +
    '<p>Five dice, three rolls a turn, thirteen boxes to fill. Take the best score you can and never leave a box empty by accident.</p>' +
    '<div class="sizes">';
  MODES.forEach(m => {
    h += '<div class="sz ' + m.cls + '" data-m="' + m.id + '"><div>' +
         '<div class="sn">' + m.name + '</div><div class="stg">' + m.tag + '</div></div></div>';
  });
  h += '</div>';
  if (sv && sv.players && sv.players.length) {
    const rd = Math.min(ALL.filter(c => sv.players[sv.cur].scores[c.id] !== null).length + 1, 13);
    h += '<button class="btn btn-go" id="bResume">CARRY ON &middot; ROUND ' + rd + '/13</button>';
  }
  h += '<button class="btn btn-alt" id="bRules">HOW TO PLAY</button>';
  openOvl(h);
  Array.prototype.forEach.call(ovlCard.querySelectorAll(".sz"), el => {
    el.onclick = () => startGame(el.getAttribute("data-m"));
  });
  const br = ovlCard.querySelector("#bResume");
  if (br) br.onclick = () => resumeGame(loadSave());
  ovlCard.querySelector("#bRules").onclick = () => rulesScreen(false);
}

function rulesScreen(fromGame) {
  openOvl('<h2>HOW TO PLAY</h2><div class="rules">' +
    '&#9642; Roll all five dice, then <b>tap any dice you want to keep</b> and roll the rest. You get <b>three rolls</b> a turn.<br><br>' +
    '&#9642; When you are happy, <b>tap a box on the scorecard</b> to take that score. The boxes you can still take show what they would be worth right now.<br><br>' +
    '&#9642; The <b>upper section</b> counts only that number: four fives in the Fives box is 20. Reach <b>63 or more</b> up there and you get a <b>35 bonus</b>.<br><br>' +
    '&#9642; The <b>lower section</b> pays for hands: a full house is 25, a small straight 30, a large straight 40 and <b>five of a kind is 50</b>.<br><br>' +
    '&#9642; Roll five of a kind again after taking the 50 and you get <b>100 more</b> every time.<br><br>' +
    '&#9642; Thirteen boxes, thirteen rounds. A box you cannot fill has to be taken as a zero, so pick your moment.' +
    '</div><button class="btn btn-go" id="bBack">GOT IT</button>');
  ovlCard.querySelector("#bBack").onclick = () => { if (fromGame) closeOvl(); else titleScreen(); };
}

function pauseScreen() {
  openOvl('<h2>PAUSED</h2>' +
    '<button class="btn btn-go" id="bResume2">CARRY ON</button>' +
    '<button class="btn btn-alt" id="bRestart">START THIS MODE AGAIN</button>' +
    '<button class="btn btn-alt" id="bModes2">CHANGE MODE</button>' +
    '<a class="btn btn-alt" href="index.html" style="text-decoration:none">BACK TO THE ARCADE</a>');
  ovlCard.querySelector("#bResume2").onclick = closeOvl;
  ovlCard.querySelector("#bRestart").onclick = () => startGame(mode);
  ovlCard.querySelector("#bModes2").onclick = () => titleScreen();
}

// ---------- board building ----------
function el(tag, cls, txt) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (txt !== undefined) e.textContent = txt;
  return e;
}

function buildStrip() {
  const s = document.getElementById("strip");
  s.innerHTML = "";
  const N = players ? players.length : 1;
  function chip(id, key) {
    const c = el("div", "chip");
    c.id = "chip-" + id;
    c.appendChild(el("div", "k", key));
    const v = el("div", "v", "0"); v.id = "cv-" + id;
    c.appendChild(v);
    s.appendChild(c);
  }
  if (N === 1) { chip("round", "ROUND"); chip("total", "TOTAL"); chip("rolls", "ROLLS LEFT"); }
  else { chip("p0", players[0].name.toUpperCase()); chip("round", "ROUND"); chip("p1", players[1].name.toUpperCase()); }
  /* sensible values behind the title card, before a game exists */
  if (!players) { setChip("round", "1/13"); setChip("total", "0"); setChip("rolls", "3"); }
}

/* the sheet scrolls in two-player; say so while there is more below it */
const playEl = document.getElementById("play");
const moreEl = document.getElementById("more");
function updateMore() {
  const hidden = playEl.scrollHeight - playEl.clientHeight - playEl.scrollTop;
  moreEl.classList.toggle("on", !!players && !ovlOpen() && hidden > 6);
}
playEl.addEventListener("scroll", updateMore);
window.addEventListener("resize", updateMore);

function makeRow(cat, N) {
  const r = el("div", "row" + (N > 1 ? " wide" : ""));
  const lbl = el("span", "lbl");
  lbl.appendChild(el("span", "", cat.name));
  lbl.appendChild(el("span", "mini", cat.mini));
  r.appendChild(lbl);
  for (let pi = 0; pi < N; pi++) {
    const v = el("span", "val open", "-");
    v.id = "val-" + pi + "-" + cat.id;
    r.appendChild(v);
  }
  r.addEventListener("click", () => { if (humanCanAct()) take(cat.id); });
  return r;
}

function makeTRow(label, key, N) {
  const r = el("div", "trow" + (N > 1 ? " wide" : ""));
  r.appendChild(el("span", "", label));
  for (let pi = 0; pi < N; pi++) {
    const v = el("span", "tval", "0");
    v.id = "t-" + key + "-" + pi;
    r.appendChild(v);
  }
  return r;
}

function buildBoard() {
  const card = document.getElementById("card");
  card.innerHTML = "";
  const N = players.length;
  if (N === 1) {
    const cols = el("div", "cols");
    const a = el("div", "col"), b = el("div", "col");
    a.appendChild(el("div", "sec", "UPPER"));
    UPPER.forEach(c => a.appendChild(makeRow(c, 1)));
    a.appendChild(makeTRow("Bonus 63+", "bonus", 1));
    a.appendChild(makeTRow("Upper", "upper", 1));
    b.appendChild(el("div", "sec", "LOWER"));
    LOWER.forEach(c => b.appendChild(makeRow(c, 1)));
    b.appendChild(makeTRow("Extra fives", "yb", 1));
    b.appendChild(makeTRow("Lower", "lower", 1));
    cols.appendChild(a);
    cols.appendChild(b);
    card.appendChild(cols);
  } else {
    const ph = el("div", "phead");
    ph.appendChild(el("span", "", ""));
    players.forEach((p, pi) => {
      const s = el("span", "pname", p.name);
      s.id = "pname-" + pi;
      ph.appendChild(s);
    });
    card.appendChild(ph);
    card.appendChild(el("div", "sec", "UPPER"));
    UPPER.forEach(c => card.appendChild(makeRow(c, N)));
    card.appendChild(makeTRow("Bonus 63+", "bonus", N));
    card.appendChild(makeTRow("Upper", "upper", N));
    card.appendChild(el("div", "sec", "LOWER"));
    LOWER.forEach(c => card.appendChild(makeRow(c, N)));
    card.appendChild(makeTRow("Extra fives", "yb", N));
    card.appendChild(makeTRow("Lower", "lower", N));
  }
  const g = el("div", "grand");
  g.id = "grandBar";
  card.appendChild(g);
}

// ---------- render ----------
function renderDice() {
  const rowEl = document.getElementById("diceRow");
  dice.forEach((v, i) => {
    const d = rowEl.children[i];
    d.classList.toggle("held", held[i]);
    d.classList.toggle("blank", v === 0);
    d.querySelectorAll(".pip").forEach(p => p.remove());
    if (v > 0) {
      PIPS[v].forEach(([x, y]) => {
        const p = document.createElement("div");
        p.className = "pip";
        p.style.left = x + "%";
        p.style.top = y + "%";
        d.appendChild(p);
      });
    }
  });
}

function setT(key, pi, val) {
  const e = document.getElementById("t-" + key + "-" + pi);
  if (e) e.textContent = val;
}
function setChip(id, val) {
  const e = document.getElementById("cv-" + id);
  if (e) e.textContent = val;
}

function render() {
  if (!players) return;
  renderDice();
  const rolled = dice[0] !== 0;
  const N = players.length;
  players.forEach((pl, pi) => {
    ALL.forEach(cat => {
      const v = document.getElementById("val-" + pi + "-" + cat.id);
      if (!v) return;
      v.className = "val";
      const s = pl.scores[cat.id];
      if (s !== null) {
        v.classList.add("taken");
        if (s === 0) v.classList.add("zeroed");
        v.textContent = s;
      } else if (pi === cur && rolled && !gameOver) {
        const p = potential(cat.id, dice);
        v.classList.add("avail");
        if (p === 0) v.classList.add("zero");
        v.textContent = p;
      } else {
        v.classList.add("open");
        if (N > 1 && pi !== cur) v.classList.add("dim");
        v.textContent = "-";
      }
    });
    setT("bonus", pi, bonusOf(pl));
    setT("upper", pi, upperRaw(pl) + bonusOf(pl));
    setT("yb", pi, pl.yb);
    setT("lower", pi, lowerOf(pl));
    const nm = document.getElementById("pname-" + pi);
    if (nm) nm.className = "pname" + (pi === cur && !gameOver ? " on" : "");
  });

  const round = Math.min(roundOf(players[cur]), 13);
  if (N === 1) {
    setChip("round", round + "/13");
    setChip("total", grandOf(players[0]));
    setChip("rolls", rollsLeft);
  } else {
    setChip("p0", grandOf(players[0]));
    setChip("round", round + "/13");
    setChip("p1", grandOf(players[1]));
    const c0 = document.getElementById("chip-p0"), c1 = document.getElementById("chip-p1");
    if (c0) c0.className = "chip" + (cur === 0 && !gameOver ? " me" : "");
    if (c1) c1.className = "chip" + (cur === 1 && !gameOver ? " me" : "");
  }

  const gbar = document.getElementById("grandBar");
  if (gbar) gbar.textContent = N === 1
    ? "TOTAL " + grandOf(players[0])
    : players.map(p => p.name + " " + grandOf(p)).join("   /   ");

  const cpuNow = mode === "cpu" && cur === 1;
  const btn = document.getElementById("rollBtn");
  btn.disabled = gameOver || rolling || rollsLeft === 0 || cpuNow;
  btn.textContent = rollsLeft === 3 ? "ROLL" : "ROLL AGAIN (" + rollsLeft + ")";

  const st = document.getElementById("status");
  if (gameOver) st.textContent = "Game over.";
  else if (cpuNow) st.textContent = "The computer is thinking...";
  else {
    const who = N > 1 ? players[cur].name + " - " : "";
    if (!rolled) st.textContent = who + "roll the dice to start your turn.";
    else if (rollsLeft > 0) st.textContent = who + "tap dice to keep them, or tap a score to take it.";
    else st.textContent = who + "no rolls left - take a score.";
  }
  updateMore();
}

// ---------- init ----------
function buildDice() {
  const rowEl = document.getElementById("diceRow");
  rowEl.innerHTML = "";
  for (let i = 0; i < 5; i++) {
    const d = document.createElement("div");
    d.className = "die blank";
    d.addEventListener("click", () => toggleHold(i));
    const lbl = document.createElement("div");
    lbl.className = "hold-label";
    lbl.textContent = "KEEP";
    d.appendChild(lbl);
    rowEl.appendChild(d);
  }
}

function resumeGame(sv) {
  if (!sv || !sv.players) { titleScreen(); return; }
  mode = sv.mode;
  players = sv.players;
  cur = sv.cur;
  dice = sv.dice; held = sv.held; rollsLeft = sv.rollsLeft;
  gameOver = false; rolling = false; cpuBusy = false;
  gameSeq++;
  closeOvl();
  buildStrip();
  buildBoard();
  render();
  if (mode === "cpu" && cur === 1) cpuTurn();
}

document.getElementById("rollBtn").addEventListener("click", () => { if (humanCanAct()) roll(); });
document.getElementById("bPause").addEventListener("click", () => {
  if (players && !gameOver) pauseScreen(); else titleScreen();
});
document.getElementById("tNew").addEventListener("click", () => { if (mode) startGame(mode); else titleScreen(); });
document.getElementById("tMode").addEventListener("click", () => titleScreen());
document.getElementById("tRules").addEventListener("click", () => rulesScreen(!!players));

/* Boot: lay out an empty board so there is something behind the title card,
   then show the card.  Nothing here writes to the save - doing so would eat
   the saved game before CARRY ON could offer it. */
buildDice();
resetTurn();
buildStrip();
titleScreen();
</script>
