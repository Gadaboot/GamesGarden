<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Word Guess</title>
<style>
  /* ---- Word Guess, re-skinned to the arcade house style, bluebell/buttercup ----
     The game underneath is the original, untouched: the same word lists, the
     same deck, the same stats and the same two badges.  It never sets a colour
     itself - everything is classes and ids - so the whole re-skin is this style
     block and the markup below it.

     The board colours are still the first thing in the file.  Two changes worth
     knowing about: "correct" is now green rather than cyan, which is what
     everyone expects from a word game and what the icon always showed, and
     "absent" is a soft grey instead of a dark slate, because on a bright page a
     dark tile reads as the important one when it is the opposite. */
  :root{
    --correct:#2fae6b;        /* found, right place  - green  */
    --present:#f0a020;        /* found, wrong place  - amber  */
    --absent:#97a2ba;         /* not in the word     - grey   */
    --edge:#c9d3f0;           /* empty tile edge              */
    --edge-live:#7b8fd4;      /* edge once a letter is typed  */
    --key:#eef2fc;
    --key-ink:#2a3566;
    --ink:#2a3566;
    --dim:#8f9bc4;
    --panel:#ffffff;
    --t: clamp(34px, min(16.2vw, 8.1vh), 58px);   /* tile size */
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:
      radial-gradient(115% 80% at 4% -8%, #cfe0ff 0%, transparent 55%),
      radial-gradient(120% 80% at 98% 106%, #ffe9ae 0%, transparent 58%),
      linear-gradient(162deg, #4a63c8 0%, #8ea4ea 46%, #eef2fc 100%);
    color:#fff;
    display:flex;flex-direction:column;align-items:center;
    touch-action:manipulation;
    padding:calc(env(safe-area-inset-top) + 6px) 8px calc(env(safe-area-inset-bottom) + 6px);
  }
  #shell{width:100%;max-width:520px;height:100%;display:flex;flex-direction:column}
  .bar{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .pill,.hbtn{display:inline-flex;align-items:center;justify-content:center;gap:5px;
    text-decoration:none;color:#33407a;
    background:rgba(255,255,255,.95);border:1.5px solid #fff;padding:6px 12px;border-radius:999px;
    font-size:12.5px;font-weight:800;box-shadow:0 3px 9px rgba(30,45,110,.26);cursor:pointer;
    white-space:nowrap;font-family:inherit}
  .pill:active,.hbtn:active{transform:scale(.94)}
  .title{flex:1;text-align:center;font-weight:900;letter-spacing:1.4px;line-height:1;
    font-size:clamp(14px,4.4vw,20px);text-shadow:0 2px 0 #3a4fa8,0 4px 12px rgba(25,40,100,.45)}
  .strip{display:flex;gap:6px;margin-bottom:6px}
  .chip{flex:1;min-width:0;text-align:center;padding:5px 2px;border-radius:13px;
    background:rgba(255,255,255,.26);border:1px solid rgba(255,255,255,.5)}
  .chip .k{font-size:8px;letter-spacing:1.1px;font-weight:900;opacity:.9}
  .chip .v{font-size:clamp(11px,3.5vw,15px);font-weight:900;font-variant-numeric:tabular-nums;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 3px}
  /* "Word 137 of 2237" is the longest thing in the strip, so it gets the room */
  .chip.wideChip{flex:1.55}

  #stage{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
  #board-wrap{flex:1;display:flex;align-items:center;justify-content:center;width:100%;min-height:0}
  #board{display:grid;grid-template-rows:repeat(6,auto);gap:6px}
  .row{display:grid;grid-template-columns:repeat(5,auto);gap:6px}
  .tile{
    width:var(--t);height:var(--t);border-radius:14px;
    display:flex;align-items:center;justify-content:center;
    font-size:calc(var(--t)*0.50);font-weight:900;color:var(--ink);
    text-transform:uppercase;letter-spacing:0;
    background:rgba(255,255,255,.72);border:2px solid var(--edge);
    box-shadow:0 2px 5px rgba(30,45,110,.14);
    transition:transform .1s;
  }
  .tile.filled{border-color:var(--edge-live);background:#fff;animation:pop .12s ease}
  .tile.correct{background:var(--correct);border-color:var(--correct);color:#fff;
    box-shadow:0 3px 0 #1d7a48,0 5px 12px rgba(25,110,70,.3)}
  .tile.present{background:var(--present);border-color:var(--present);color:#fff;
    box-shadow:0 3px 0 #b06f06,0 5px 12px rgba(150,100,10,.28)}
  .tile.absent{background:var(--absent);border-color:var(--absent);color:#fff;
    box-shadow:0 2px 0 #7f8ba6}
  .tile.flip{animation:flip .55s ease forwards}
  @keyframes pop{50%{transform:scale(1.14)}}
  @keyframes flip{
    0%{transform:rotateX(0)}
    45%{transform:rotateX(90deg)}
    100%{transform:rotateX(0)}
  }
  .row.shake{animation:shake .5s}
  @keyframes shake{
    10%,90%{transform:translateX(-2px)}
    20%,80%{transform:translateX(4px)}
    30%,50%,70%{transform:translateX(-7px)}
    40%,60%{transform:translateX(7px)}
  }
  .row.bounce .tile{animation:bounce .85s}
  @keyframes bounce{
    0%,20%{transform:translateY(0)}
    40%{transform:translateY(-24px)}
    50%{transform:translateY(4px)}
    60%{transform:translateY(-10px)}
    80%,100%{transform:translateY(0)}
  }

  #keyboard{width:100%;max-width:520px;padding:4px 2px 0}
  .krow{display:flex;justify-content:center;gap:5px;margin-bottom:5px}
  .key{
    flex:1;max-width:42px;height:clamp(38px,6.2vh,50px);
    border:none;border-radius:12px;
    background:var(--key);color:var(--key-ink);
    font:900 15px -apple-system,BlinkMacSystemFont,sans-serif;
    text-transform:uppercase;
    box-shadow:0 3px 0 #c4ccea;cursor:pointer;font-family:inherit;
  }
  .key.wide{max-width:70px;flex:1.7;font-size:11px;border-radius:14px}
  .key.correct{background:var(--correct);color:#fff;box-shadow:0 3px 0 #1d7a48}
  .key.present{background:var(--present);color:#fff;box-shadow:0 3px 0 #b06f06}
  .key.absent{background:#aeb8cc;color:#f2f5fb;box-shadow:0 3px 0 #96a1b8}
  .key:active{transform:translateY(3px);box-shadow:none}

  /* ---------- tools ---------- */
  #tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
  .tool{background:rgba(255,255,255,.96);border:1.5px solid #fff;border-radius:15px;
    padding:8px 2px 7px;text-align:center;cursor:pointer;color:#33407a;
    box-shadow:0 4px 0 rgba(45,60,130,.32),0 6px 14px rgba(30,45,110,.22)}
  .tool:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(45,60,130,.32)}
  .tool .ti{font-size:18px;line-height:1}
  .tool .tl{font-size:9px;font-weight:900;letter-spacing:.5px;margin-top:2px;opacity:.75}

  #toast{
    position:absolute;top:12%;left:50%;transform:translateX(-50%);
    background:linear-gradient(180deg,#fff,#eef2fc);color:#33407a;border:2px solid #fff;
    font-size:14px;font-weight:900;padding:11px 20px;border-radius:15px;
    box-shadow:0 10px 30px rgba(30,45,110,.4);
    opacity:0;pointer-events:none;transition:opacity .25s;z-index:60;white-space:nowrap
  }
  #toast.show{opacity:1}

  /* ---------- modals ---------- */
  .modal{position:fixed;inset:0;background:rgba(45,60,130,.45);backdrop-filter:blur(6px);
    display:none;align-items:center;justify-content:center;z-index:70;padding:12px}
  .modal.show{display:flex}
  .modal-card{
    position:relative;width:100%;max-width:352px;
    background:linear-gradient(180deg,#fff,#eef2fc);
    border:2px solid #fff;border-radius:22px;padding:20px 16px 14px;text-align:center;
    color:var(--ink);box-shadow:0 20px 50px rgba(30,45,110,.45);
    max-height:100%;overflow:auto;
    animation:pin .3s cubic-bezier(.2,1.5,.4,1);
  }
  @keyframes pin{from{transform:scale(.75);opacity:0}to{transform:scale(1);opacity:1}}
  .modal-card h2{margin-bottom:8px;letter-spacing:.6px;font-size:21px;font-weight:900;color:#3a4fa8}
  .modal-card .word{
    font-size:30px;font-weight:900;letter-spacing:5px;margin:10px 0 4px;color:#2fae6b;
    text-transform:uppercase}
  .close-x{position:absolute;top:9px;right:12px;background:none;border:none;
    font-size:24px;line-height:1;color:#a9b2d0;cursor:pointer;font-family:inherit}
  .sub{color:var(--dim);font-size:13.2px;line-height:1.5}
  .rules{text-align:left;font-size:12.4px;line-height:1.6;color:#8f9bc4;margin:10px 2px}
  .rules b{color:#3a4fa8}
  .stats-grid{display:flex;justify-content:space-around;margin:14px 0 4px}
  .stat{display:flex;flex-direction:column}
  .stat b{font-size:26px;font-weight:900;color:#3a4fa8}
  .stat span{font-size:9.5px;color:var(--dim);letter-spacing:.6px;margin-top:2px;font-weight:800}
  #dist{margin:12px 0 4px;text-align:left}
  .dist-row{display:flex;align-items:center;gap:7px;margin:4px 0;font-size:12.5px;font-weight:800}
  .dist-bar{background:#dfe5f4;color:#6b769e;min-width:24px;padding:2px 7px;text-align:right;
    border-radius:6px;font-size:11.5px;font-weight:900}
  .dist-bar.hl{background:var(--correct);color:#fff}
  .big-btn{
    display:block;width:100%;margin-top:9px;padding:12px;border:none;border-radius:15px;
    font:900 14.5px -apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:.4px;
    background:linear-gradient(180deg,#7f95e6,#3f56be);color:#fff;cursor:pointer;
    box-shadow:0 5px 0 #2c3f95,0 8px 18px rgba(45,60,130,.3);font-family:inherit}
  .big-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #2c3f95}
  .big-btn.alt{background:#eef2fc;color:#33407a;border:1.5px solid #d7dff5;
    box-shadow:none}
  .big-btn.alt:active{transform:translateY(2px)}

  @media (max-height:700px){
    .modal-card{padding:14px 13px 10px}.modal-card h2{font-size:18px}
    .rules{font-size:11.4px;line-height:1.45}
    .big-btn{padding:10px;font-size:13.5px;margin-top:7px}
    .stat b{font-size:22px}
  }
</style>
</head>
<body>
<div id="shell">
  <div class="bar">
    <button class="hbtn" id="exitBtn" title="Back to the arcade">&#9776; Menu</button>
    <div class="title">WORD GUESS</div>
    <button class="pill" id="bPause">&#10074;&#10074;</button>
  </div>
  <div class="strip">
    <div class="chip"><div class="k">ON A RUN</div><div class="v" id="cRun">0</div></div>
    <div class="chip wideChip"><div class="k">WORD</div><div class="v" id="progress">-</div></div>
    <div class="chip"><div class="k">BEST RUN</div><div class="v" id="cBest">0</div></div>
  </div>

  <div id="stage">
    <div id="board-wrap"><div id="board"></div></div>
    <div id="keyboard"></div>
    <div id="toast"></div>
  </div>

  <div id="tools">
    <div class="tool" id="statsBtn"><div class="ti">&#9673;</div><div class="tl">YOUR RECORD</div></div>
    <div class="tool" id="newBtn"><div class="ti">&#8635;</div><div class="tl">NEW WORD</div></div>
    <div class="tool" id="tRules"><div class="ti">?</div><div class="tl">HOW TO PLAY</div></div>
  </div>
</div>

<div class="modal" id="endModal">
  <div class="modal-card">
    <button class="close-x" data-close="endModal">&times;</button>
    <h2 id="endTitle"></h2>
    <div class="sub" id="endMsg"></div>
    <div class="word" id="endWord"></div>
    <button class="big-btn" id="playAgain">NEXT WORD</button>
  </div>
</div>

<div class="modal" id="confirmModal">
  <div class="modal-card">
    <h2>SKIP THIS ONE?</h2>
    <div class="sub" style="margin:8px 0 14px;">You will be given a fresh word, but this puzzle counts as a loss and your run resets to zero.</div>
    <button class="big-btn" id="confirmYes">SKIP IT</button>
    <button class="big-btn alt" id="confirmNo">KEEP GOING</button>
  </div>
</div>

<div class="modal" id="resumeModal">
  <div class="modal-card">
    <h2>STILL IN PROGRESS</h2>
    <div class="sub" id="resumeInfo" style="margin-bottom:12px;"></div>
    <button class="big-btn" id="btnResume">CARRY ON</button>
    <button class="big-btn alt" id="btnFresh">FRESH WORD</button>
  </div>
</div>

<div class="modal" id="statsModal">
  <div class="modal-card">
    <button class="close-x" data-close="statsModal">&times;</button>
    <h2>YOUR RECORD</h2>
    <div class="stats-grid">
      <div class="stat"><b id="sPlayed">0</b><span>PLAYED</span></div>
      <div class="stat"><b id="sWin">0</b><span>WIN %</span></div>
      <div class="stat"><b id="sCur">0</b><span>ON A RUN</span></div>
      <div class="stat"><b id="sMax">0</b><span>BEST RUN</span></div>
    </div>
    <h2 style="font-size:12.5px;letter-spacing:1px;margin-top:14px;">WHERE YOU FINISH</h2>
    <div id="dist"></div>
    <div class="sub" id="deckInfo" style="font-size:11.5px;margin-top:10px;"></div>
  </div>
</div>

<div class="modal" id="ovl">
  <div class="modal-card" id="ovlCard"></div>
</div>

<script src="achievements.js"></script>

<script>
"use strict";

/* ---------- word lists (inlined above) ---------- */
var ANSWERS = WG_ANSWERS.split(" ");
var VALID   = new Set(WG_GUESS.split(" "));
ANSWERS.forEach(function(w){ VALID.add(w); });

/* ---------- storage, with a fallback if it's unavailable ---------- */
var mem = {};
var store = {
  get:function(k){ try{ return localStorage.getItem(k); }catch(e){ return (k in mem)?mem[k]:null; } },
  set:function(k,v){ try{ localStorage.setItem(k,v); }catch(e){ mem[k]=v; } },
  del:function(k){ try{ localStorage.removeItem(k); }catch(e){ delete mem[k]; } }
};
var LS = "gg_wordguess_";
/* carry a player's record over from the earlier build (stats only - the old
   deck indexed a different, shorter answer list, so it has to be rebuilt) */
(function migrate(){
  try{
    if(!localStorage.getItem(LS+"stats")){
      var old = localStorage.getItem("gg_wordle_stats");
      if(old) localStorage.setItem(LS+"stats", old);
    }
  }catch(e){}
})();

/* ---------- answer deck: every word once before any repeats ---------- */
function shuffled(){
  var a=[],i,j,t;
  for(i=0;i<ANSWERS.length;i++) a.push(i);
  for(i=a.length-1;i>0;i--){ j=Math.floor(Math.random()*(i+1)); t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function loadDeck(){
  var deck,ptr;
  try{
    deck=JSON.parse(store.get(LS+"deck"));
    ptr=parseInt(store.get(LS+"ptr"),10);
    if(!Array.isArray(deck)||deck.length!==ANSWERS.length||isNaN(ptr)) throw 0;
  }catch(e){ deck=shuffled(); ptr=0; saveDeck(deck,ptr); }
  return {deck:deck,ptr:ptr};
}
function saveDeck(deck,ptr){ store.set(LS+"deck",JSON.stringify(deck)); store.set(LS+"ptr",String(ptr)); }
function nextWord(){
  var d=loadDeck(), deck=d.deck, ptr=d.ptr, cycled=false;
  if(ptr>=deck.length){ deck=shuffled(); ptr=0; cycled=true; }
  var w=ANSWERS[deck[ptr]];
  saveDeck(deck,ptr+1);
  return {word:w, used:ptr+1, total:deck.length, cycled:cycled};
}

/* ---------- record ---------- */
function loadStats(){
  try{ var s=JSON.parse(store.get(LS+"stats")); if(s&&typeof s.played==="number") return s; }catch(e){}
  return {played:0,wins:0,cur:0,max:0,dist:[0,0,0,0,0,0]};
}
function saveStats(s){ store.set(LS+"stats",JSON.stringify(s)); }

/* ---------- state ---------- */
var answer="", row=0, col=0, grid=null, over=false, animating=false;
var SAVE_KEY = LS+"save";
function saveGame(){
  if(over) return;
  var rows=[];
  if(grid) for(var i=0;i<row;i++) rows.push(grid[i].join(""));
  store.set(SAVE_KEY, JSON.stringify({
    answer:answer, rows:rows, progress:document.getElementById("progress").textContent
  }));
}
function clearSave(){ store.del(SAVE_KEY); }
function loadSaveGame(){
  try{ var v=store.get(SAVE_KEY); return v?JSON.parse(v):null; }catch(e){ return null; }
}

var boardEl=document.getElementById("board"), keyEls={};

function buildBoard(){
  boardEl.innerHTML="";
  for(var r=0;r<6;r++){
    var rowEl=document.createElement("div"); rowEl.className="row";
    for(var c=0;c<5;c++){
      var t=document.createElement("div"); t.className="tile"; rowEl.appendChild(t);
    }
    boardEl.appendChild(rowEl);
  }
}
function buildKeyboard(){
  var rows=[["q","w","e","r","t","y","u","i","o","p"],
            ["a","s","d","f","g","h","j","k","l"],
            ["enter","z","x","c","v","b","n","m","back"]];
  var kb=document.getElementById("keyboard"); kb.innerHTML=""; keyEls={};
  rows.forEach(function(r){
    var re=document.createElement("div"); re.className="krow";
    r.forEach(function(k){
      var b=document.createElement("button"); b.className="key";
      if(k==="enter"||k==="back"){ b.classList.add("wide"); b.innerHTML = k==="back"?"&#9003;":"ENTER"; }
      else b.textContent=k;
      b.addEventListener("click",function(){ press(k); });
      keyEls[k]=b; re.appendChild(b);
    });
    kb.appendChild(re);
  });
}
function tile(r,c){ return boardEl.children[r].children[c]; }

function newGame(){
  var n=nextWord();
  answer=n.word; row=0; col=0; over=false; animating=false;
  grid=[]; for(var i=0;i<6;i++) grid.push(["","","","",""]);
  buildBoard(); buildKeyboard();
  document.getElementById("progress").textContent = "Word "+n.used+" of "+n.total;
  if(n.cycled) toast("That's all "+n.total+" words - reshuffling the deck!",2600);
  hide("endModal"); hide("statsModal");
  saveGame();
}

function press(k){
  if(over||animating) return;
  if(k==="back"){
    if(col>0){ col--; grid[row][col]=""; var t=tile(row,col); t.textContent=""; t.classList.remove("filled"); }
    return;
  }
  if(k==="enter"){ submit(); return; }
  if(!/^[a-z]$/.test(k)) return;
  if(col<5){ grid[row][col]=k; var el=tile(row,col); el.textContent=k; el.classList.add("filled"); col++; }
}

function submit(){
  if(col<5){ shakeRow(); toast("Five letters needed"); return; }
  var guess=grid[row].join("");
  if(!VALID.has(guess)){ shakeRow(); toast("That one's not in our dictionary"); return; }
  var res=score(guess,answer), r=row, c;
  animating=true;
  for(c=0;c<5;c++){
    (function(c){
      var t=tile(r,c);
      setTimeout(function(){
        t.classList.add("flip");
        setTimeout(function(){ t.classList.add(res[c]); updateKey(guess[c],res[c]); },260);
      }, c*300);
    })(c);
  }
  setTimeout(function(){
    animating=false;
    if(guess===answer) win(r);
    else if(r===5) lose();
    else { row++; col=0; saveGame(); }
  }, 5*300+320);
}

/* two passes, so repeated letters are marked correctly */
function score(guess,ans){
  var res=["absent","absent","absent","absent","absent"], left={}, i;
  for(i=0;i<5;i++){
    if(guess[i]===ans[i]) res[i]="correct";
    else left[ans[i]]=(left[ans[i]]||0)+1;
  }
  for(i=0;i<5;i++){
    if(res[i]==="correct") continue;
    if(left[guess[i]]>0){ res[i]="present"; left[guess[i]]--; }
  }
  return res;
}
var RANK={absent:0,present:1,correct:2};
function updateKey(ch,state){
  var el=keyEls[ch]; if(!el) return;
  var cur=el.dataset.state;
  if(!cur||RANK[state]>RANK[cur]){
    el.dataset.state=state;
    el.classList.remove("absent","present","correct");
    el.classList.add(state);
  }
}
function shakeRow(){
  var re=boardEl.children[row];
  re.classList.add("shake"); setTimeout(function(){ re.classList.remove("shake"); },500);
}
function toast(msg,ms){
  var t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  clearTimeout(t._h); t._h=setTimeout(function(){ t.classList.remove("show"); }, ms||1500);
}

var PRAISE=["Uncanny!","Blistering!","Very sharp!","Nicely done!","Got there!","By a whisker!"];
function win(r){
  over=true; clearSave();
  if(window.GGA){ GGA.award("word_win"); if(r<=1) GGA.award("word_two"); GGA.haptic("success"); }
  var s=loadStats();
  s.played++; s.wins++; s.cur++; s.max=Math.max(s.max,s.cur); s.dist[r]++;
  saveStats(s);
  boardEl.children[r].classList.add("bounce");
  setTimeout(function(){
    document.getElementById("endTitle").textContent=PRAISE[r];
    document.getElementById("endMsg").textContent="Cracked it in "+(r+1)+(r===0?" guess":" guesses");
    document.getElementById("endWord").textContent=answer;
    show("endModal");
  },950);
}
function lose(){
  over=true; clearSave();
  if(window.GGA) GGA.haptic("error");
  var s=loadStats(); s.played++; s.cur=0; saveStats(s);
  setTimeout(function(){
    document.getElementById("endTitle").textContent="Out of guesses";
    document.getElementById("endMsg").textContent="It was:";
    document.getElementById("endWord").textContent=answer;
    show("endModal");
  },420);
}

function show(id){ document.getElementById(id).classList.add("show"); }
function hide(id){ document.getElementById(id).classList.remove("show"); }

function renderStats(){
  var s=loadStats(), i;
  document.getElementById("sPlayed").textContent=s.played;
  document.getElementById("sWin").textContent=s.played?Math.round(100*s.wins/s.played):0;
  document.getElementById("sCur").textContent=s.cur;
  document.getElementById("sMax").textContent=s.max;
  var maxD=1;
  for(i=0;i<6;i++) if(s.dist[i]>maxD) maxD=s.dist[i];
  var dist=document.getElementById("dist"); dist.innerHTML="";
  var justWon = over && grid && grid[row] && grid[row].join("")===answer;
  for(i=0;i<6;i++){
    var rowD=document.createElement("div"); rowD.className="dist-row";
    var bar=document.createElement("div"); bar.className="dist-bar";
    if(justWon && row===i) bar.classList.add("hl");
    bar.style.width=Math.max(9,Math.round(100*s.dist[i]/maxD))+"%";
    bar.textContent=s.dist[i];
    rowD.appendChild(document.createTextNode(String(i+1)));
    rowD.appendChild(bar);
    dist.appendChild(rowD);
  }
  document.getElementById("deckInfo").textContent =
    loadDeck().ptr+" of "+ANSWERS.length+" words played this time round";
}

/* ---------- events ---------- */
document.getElementById("newBtn").addEventListener("click",function(){
  if(!over && row>0){ show("confirmModal"); return; }
  if(!over && col>0){ var s=loadStats(); s.cur=0; saveStats(s); }
  newGame();
});
document.getElementById("confirmYes").addEventListener("click",function(){
  hide("confirmModal");
  var s=loadStats(); s.cur=0; saveStats(s);
  newGame();
});
document.getElementById("confirmNo").addEventListener("click",function(){ hide("confirmModal"); });
document.getElementById("playAgain").addEventListener("click",newGame);
document.getElementById("statsBtn").addEventListener("click",function(){ renderStats(); show("statsModal"); });
document.getElementById("exitBtn").addEventListener("click",function(){ window.location.href="index.html"; });
Array.prototype.forEach.call(document.querySelectorAll(".close-x"),function(b){
  b.addEventListener("click",function(){ hide(b.dataset.close); });
});
Array.prototype.forEach.call(document.querySelectorAll(".modal"),function(m){
  m.addEventListener("click",function(e){ if(e.target===m) m.classList.remove("show"); });
});
window.addEventListener("keydown",function(e){
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  var k=e.key.toLowerCase();
  if(k==="enter") press("enter");
  else if(k==="backspace") press("back");
  else if(/^[a-z]$/.test(k)) press(k);
});

function resumeGame(sv){
  answer=sv.answer; row=0; col=0; over=false; animating=false;
  grid=[]; for(var i=0;i<6;i++) grid.push(["","","","",""]);
  buildBoard(); buildKeyboard();
  document.getElementById("progress").textContent=sv.progress||"";
  (sv.rows||[]).forEach(function(g){
    var res=score(g,answer);
    for(var c=0;c<5;c++){
      grid[row][c]=g[c];
      var t=tile(row,c);
      t.textContent=g[c];
      t.classList.add(res[c]);
      updateKey(g[c],res[c]);
    }
    row++;
  });
  hide("endModal"); hide("statsModal");
}
document.getElementById("btnResume").addEventListener("click",function(){ hide("resumeModal"); });
document.getElementById("btnFresh").addEventListener("click",function(){ hide("resumeModal"); newGame(); });

(function boot(){
  var sv=loadSaveGame();
  if(sv&&sv.answer&&VALID.has(sv.answer)&&(sv.rows||[]).length>0){
    resumeGame(sv);
    document.getElementById("resumeInfo").textContent =
      sv.rows.length+" of 6 guesses used on this word.";
    show("resumeModal");
  } else if(sv&&sv.answer&&VALID.has(sv.answer)){
    resumeGame(sv);
  } else {
    clearSave();
    newGame();
  }
})();
</script>

<script>
/* =========================================================
   Added by the re-skin: the pause card, the rules card, and
   the two chips in the strip.  The game above is untouched -
   it is all globals, so this can simply reach in.
   ========================================================= */
(function(){
"use strict";
function $id(id){ return document.getElementById(id); }
function openOvl(html){ $id("ovlCard").innerHTML=html; $id("ovl").classList.add("show"); }
function closeOvl(){ $id("ovl").classList.remove("show"); }
function ovlOpen(){ return $id("ovl").classList.contains("show"); }

/* ON A RUN and BEST RUN, read from the same record the stats card shows */
function syncChips(){
  var s;
  try{ s=JSON.parse(store.get(LS+"stats")||"null"); }catch(e){ s=null; }
  if(!s) s={cur:0,max:0};
  $id("cRun").textContent = s.cur||0;
  $id("cBest").textContent = s.max||0;
}
/* renderStats runs whenever the record changes or is looked at, so hang the
   chips off it rather than polling */
var _renderStats = window.renderStats;
window.renderStats = function(){ _renderStats.apply(null, arguments); syncChips(); };
var _saveStats = window.saveStats;
if(typeof _saveStats === "function")
  window.saveStats = function(s){ _saveStats(s); syncChips(); };

function rulesScreen(){
  openOvl('<h2>HOW TO PLAY</h2><div class="rules">'+
    '&#9642; Guess the <b>five letter word</b>. You get six tries.<br><br>'+
    '&#9642; After each guess the tiles tell you how you did:<br>'+
    '&nbsp;&nbsp;<b style="color:#2fae6b">Green</b> - right letter, right place.<br>'+
    '&nbsp;&nbsp;<b style="color:#f0a020">Amber</b> - that letter is in the word, but somewhere else.<br>'+
    '&nbsp;&nbsp;<b style="color:#98a0b4">Grey</b> - not in the word at all.<br><br>'+
    '&#9642; The keyboard keeps score for you, so a letter you have ruled out goes grey down there too.<br><br>'+
    '&#9642; A guess has to be a <b>real word</b> - anything else is handed straight back to you and does not cost a try.<br><br>'+
    '&#9642; Win and your <b>run</b> goes up by one; lose, or skip a word, and it goes back to zero. YOUR RECORD keeps the tally.<br><br>'+
    '&#9642; The game <b>saves itself</b>, so a word you are part way through is waiting when you come back.'+
    '</div><button class="big-btn" id="bBack">GOT IT</button>');
  $id("bBack").onclick=closeOvl;
}

function pauseScreen(){
  openOvl('<h2>PAUSED</h2>'+
    '<p class="sub">Your word is saved as you go.</p>'+
    '<button class="big-btn" id="bResume2">CARRY ON</button>'+
    '<button class="big-btn alt" id="bRules2">HOW TO PLAY</button>'+
    '<button class="big-btn alt" id="bStats2">YOUR RECORD</button>'+
    '<a class="big-btn alt" href="index.html" style="text-decoration:none;display:block">BACK TO THE ARCADE</a>');
  $id("bResume2").onclick=closeOvl;
  $id("bRules2").onclick=rulesScreen;
  $id("bStats2").onclick=function(){ closeOvl(); $id("statsBtn").click(); };
}

function anyModalOpen(){
  var m=document.querySelectorAll(".modal.show");
  return m.length>0;
}
$id("bPause").addEventListener("click", function(){
  if(anyModalOpen()) return;
  pauseScreen();
});
$id("tRules").addEventListener("click", function(){
  if(anyModalOpen()) return;
  rulesScreen();
});

syncChips();
})();
</script>
