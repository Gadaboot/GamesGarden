<!DOCTYPE html>
<html lang="en">
<head>

<title>Backgammon</title>
<style>

    background:
      radial-gradient(120% 85% at 8% -8%, #9a9aff 0%, transparent 55%),

    user-select:none;-webkit-user-select:none;touch-action:none;
    display:flex;flex-direction:column;align-items:center;
    padding:calc(env(safe-area-inset-top) + 6px) 8px calc(env(safe-area-inset-bottom) + 6px);
  }
  #shell{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column}
  .bar{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .pill{display:inline-flex;align-items:center;gap:5px;text-decoration:none;color:#4a3fc0;
    background:rgba(255,255,255,.94);border:1.5px solid #fff;padding:6px 12px;border-radius:999px;

  .ovl{position:absolute;inset:0;z-index:40;display:none;align-items:center;justify-content:center;

<body>
<div id="shell">
  <div class="bar">
    <a class="pill" href="index.html">&#9776; Menu</a>
    <div class="title">BACKGAMMON</div>

  </div>
  <div class="strip">
    <div class="chip"><div class="k">WHITE OFF</div><div class="v" id="vWhite">0</div></div>
    <div class="chip"><div class="k">TO PLAY</div><div class="v" id="vTurn">WHITE</div></div>

  </div>
  <div id="tools">
    <div class="tool" id="tUndo"><div class="ti">&#8630;</div><div class="tl">TAKE BACK</div></div>
    <div class="tool" id="tNew"><div class="ti">&#8635;</div><div class="tl">NEW GAME</div></div>
    <div class="tool" id="tRules"><div class="ti">&#63;</div><div class="tl">HOW TO PLAY</div></div>
  </div>

<script src="achievements.js"></script>
<script>
/* Backgammon - the rules and the computer opponent, with no drawing and no
   input in them.  Every move goes through apply(), so the same code that runs
   on screen can be run headless for thousands of games in Node - and the
   computer picks its play through this very same code.

   The twenty-four points are numbered 0..23.
     Player 0 moves DOWNWARDS, 23 towards 0, and bears off past 0.
     Player 1 moves UPWARDS,   0 towards 23, and bears off past 23.
   pt[i] holds a signed count: positive is player 0's checkers, negative is
   player 1's.  Zero is an empty point. */
function makeBackgammon(){
  "use strict";

  var NP=24, CHECKERS=15;

  function rng(seed){
    var s=seed>>>0||1;
    return function(){ s^=s<<13; s>>>=0; s^=s>>17; s^=s<<5; s>>>=0; return s/4294967296; };
  }

  function countAt(st,i,p){ var v=st.pt[i]; return p===0 ? (v>0?v:0) : (v<0?-v:0); }
  function ownerAt(st,i){ var v=st.pt[i]; return v>0?0:(v<0?1:-1); }
  /* how far a checker on point i still has to travel to bear off */
  function pipOf(p,i){ return p===0 ? i+1 : 24-i; }
  function homeLo(p){ return p===0?0:18; }
  function homeHi(p){ return p===0?5:23; }
  /* where a checker coming off the bar lands for this die */
  function enterPoint(p,d){ return p===0 ? 24-d : d-1; }

  function create(cfg){
    cfg=cfg||{};
    var st={
      pt:new Array(NP), bar:[0,0], off:[0,0],
      turn:cfg.first===1?1:0, first:cfg.first===1?1:0,
      dice:[], rolled:[], plays:[],
      moves:0, turns:0,
      over:false, winner:-1, result:"",
      rand:rng(cfg.seed||((Math.random()*1e9)|0))
    };
    for(var i=0;i<NP;i++) st.pt[i]=0;
    /* the standard opening position, and its mirror image for the other side */
    st.pt[23]=2;  st.pt[12]=5;  st.pt[7]=3;   st.pt[5]=5;
    st.pt[0]=-2;  st.pt[11]=-5; st.pt[16]=-3; st.pt[18]=-5;
    return st;
  }

  function pipCount(st,p){
    var n=st.bar[p]*25, i;
    for(i=0;i<NP;i++) n+=countAt(st,i,p)*pipOf(p,i);
    return n;
  }
  function allHome(st,p){
    if(st.bar[p]>0) return false;
    var lo=homeLo(p), hi=homeHi(p), i;
    for(i=0;i<NP;i++){
      if(countAt(st,i,p)>0 && (i<lo||i>hi)) return false;
    }
    return true;
  }
  /* the furthest checker from home, in pips - 25 while any are on the bar */
  function maxPip(st,p){
    if(st.bar[p]>0) return 25;
    var m=0, i;
    for(i=0;i<NP;i++) if(countAt(st,i,p)>0) m=Math.max(m, pipOf(p,i));
    return m;
  }
  function blocked(st,i,p){ return countAt(st,i,1-p)>=2; }

  /* every single move `p` could make with one die of value d */
  function singleMoves(st, p, d){
    var out=[], i, to;
    if(st.bar[p]>0){
      to=enterPoint(p,d);
      if(!blocked(st,to,p)) out.push({ from:-1, die:d, to:to, hit:countAt(st,to,1-p)===1 });
      return out;                       /* nothing else may move while you are on the bar */
    }
    var home=allHome(st,p), mp=maxPip(st,p);
    for(i=0;i<NP;i++){
      if(countAt(st,i,p)<=0) continue;
      to = p===0 ? i-d : i+d;
      if(to>=0 && to<NP){
        if(!blocked(st,to,p)) out.push({ from:i, die:d, to:to, hit:countAt(st,to,1-p)===1 });
      }else if(home){
        /* bearing off: exactly right, or the furthest checker back with a
           bigger number than it needs */
        var pip=pipOf(p,i);
        if(pip===d || (d>pip && pip===mp)) out.push({ from:i, die:d, to:-1, hit:false });
      }
    }
    return out;
  }

  function clone(st){
    return { pt:st.pt.slice(), bar:[st.bar[0],st.bar[1]], off:[st.off[0],st.off[1]],
             turn:st.turn, first:st.first, dice:st.dice.slice(), rolled:st.rolled.slice(),
             plays:[], moves:st.moves, turns:st.turns,
             over:st.over, winner:st.winner, result:st.result, rand:rng(1) };
  }

  /* put one checker where the move says, taking a hit if there is one */
  function applyMove(st, mv){
    var p=st.turn, sign = p===0 ? 1 : -1;
    if(mv.from<0) st.bar[p]--;
    else st.pt[mv.from]-=sign;
    if(mv.to<0){
      st.off[p]++;
    }else{
      if(countAt(st,mv.to,1-p)===1){
        st.pt[mv.to]=0;
        st.bar[1-p]++;
      }
      st.pt[mv.to]+=sign;
    }
  }

  /* Every complete play of this roll, keeping only those that use as many dice
     as possible.  This is the rule everybody forgets: you do not get to stop
     early because stopping suits you. */
  function sequences(st, dice){
    var results=[], bestLen=-1;
    function rec(state, remaining, path){
      var any=false, tried={}, k;
      for(k=0;k<remaining.length;k++){
        var d=remaining[k];
        if(tried[d]) continue;
        tried[d]=1;
        var moves=singleMoves(state, state.turn, d);
        for(var m=0;m<moves.length;m++){
          any=true;
          var next=clone(state);
          next.turn=state.turn;
          applyMove(next, moves[m]);
          var rest=remaining.slice(); rest.splice(k,1);
          rec(next, rest, path.concat([moves[m]]));
        }
      }
      if(!any){
        if(path.length>bestLen){ bestLen=path.length; results=[]; }
        if(path.length===bestLen && path.length>0) results.push(path);
      }
    }
    rec(st, dice.slice(), []);
    if(bestLen<=0) return [];
    /* If only one die can be played and the two are different, the rule is that
       you must play the HIGHER one if that is possible at all. */
    if(bestLen===1 && dice.length===2 && dice[0]!==dice[1]){
      var hi=Math.max(dice[0],dice[1]), found=false, k2;
      for(k2=0;k2<results.length;k2++) if(results[k2][0].die===hi) found=true;
      if(found) results=results.filter(function(s){ return s[0].die===hi; });
    }
    return results;
  }

  /* ---- turns ---- */
  function roll(st, a, b){
    if(st.over) return null;
    var d1 = a || (1+Math.floor(st.rand()*6));
    var d2 = b || (1+Math.floor(st.rand()*6));
    st.rolled=[d1,d2];
    st.dice = d1===d2 ? [d1,d1,d1,d1] : [d1,d2];
    st.plays = sequences(st, st.dice);
    st.turns++;
    return { d1:d1, d2:d2, doubles:d1===d2, stuck:st.plays.length===0 };
  }
  /* the single moves that are legal right now, given what must still be played */
  function legalMoves(st){
    var out=[], seen={}, i;
    for(i=0;i<st.plays.length;i++){
      var mv=st.plays[i][0];
      var key=mv.from+"/"+mv.die+"/"+mv.to;
      if(seen[key]) continue;
      seen[key]=1;
      out.push(mv);
    }
    return out;
  }
  function legalFrom(st, from){
    return legalMoves(st).filter(function(m){ return m.from===from; });
  }
  function canMove(st){ return st.plays.length>0; }

  function checkOver(st){
    var p;
    for(p=0;p<2;p++){
      if(st.off[p]===CHECKERS){
        st.over=true; st.winner=p;
        var loser=1-p;
        if(st.off[loser]>0) st.result="single";
        else{
          /* borne off none: a gammon, and a backgammon if they still have a
             checker on the bar or stuck in the winner's home board */
          var back=st.bar[loser]>0, i, lo=homeLo(p), hi=homeHi(p);
          for(i=lo;i<=hi;i++) if(countAt(st,i,loser)>0) back=true;
          st.result = back ? "backgammon" : "gammon";
        }
        return true;
      }
    }
    return false;
  }

  /* play one of the moves legalMoves() offered */
  function move(st, mv){
    if(st.over) return { ok:false };
    var i, keep=[];
    for(i=0;i<st.plays.length;i++){
      var f=st.plays[i][0];
      if(f.from===mv.from && f.die===mv.die && f.to===mv.to) keep.push(st.plays[i].slice(1));
    }
    if(!keep.length) return { ok:false };
    var hit=(mv.to>=0 && countAt(st,mv.to,1-st.turn)===1);
    applyMove(st, mv);
    st.moves++;
    /* drop the die that was just used */
    var k=st.dice.indexOf(mv.die);
    if(k>=0) st.dice.splice(k,1);
    st.plays=keep.filter(function(s){ return s.length>0; });
    var ev={ ok:true, by:st.turn, from:mv.from, to:mv.to, die:mv.die, hit:hit,
             done:st.plays.length===0, over:false };
    if(checkOver(st)){ ev.over=true; ev.done=true; }
    return ev;
  }
  function endTurn(st){
    if(st.over) return false;
    st.turn = st.turn===0 ? 1 : 0;
    st.dice=[]; st.rolled=[]; st.plays=[];
    return true;
  }

  /* ---- the computer ---- */
  /* the position each complete play would leave behind, without duplicates */
  function candidates(st){
    var out=[], seen={}, i, k;
    for(i=0;i<st.plays.length;i++){
      var c=clone(st);
      c.turn=st.turn;
      for(k=0;k<st.plays[i].length;k++) applyMove(c, st.plays[i][k]);
      var key=c.pt.join(",")+"|"+c.bar.join(",")+"|"+c.off.join(",");
      if(seen[key]) continue;
      seen[key]=1;
      out.push({ seq:st.plays[i], state:c, key:key });
    }
    return out;
  }

  /* the five-point and the bar point, the two most useful points to hold */
  function keyPoints(p){ return p===0 ? [4,7] : [19,16]; }

  function evaluate(st, p){
    var them=1-p, i, s=0;
    s += (pipCount(st,them)-pipCount(st,p)) * 1.0;
    s += (st.off[p]-st.off[them]) * 14;
    s -= st.bar[p]*26;
    s += st.bar[them]*20;
    var kp=keyPoints(p), lo=homeLo(p), hi=homeHi(p);
    var run=0, bestRun=0;
    for(i=0;i<NP;i++){
      var mine=countAt(st,i,p);
      if(mine>=2){
        s+=4;
        if(i>=lo&&i<=hi) s+=5;
        if(kp.indexOf(i)>=0) s+=8;
        run++; if(run>bestRun) bestRun=run;
        if(mine>4) s-=(mine-4)*3;         /* checkers piled up do nothing */
      }else{
        run=0;
        if(mine===1){
          /* a blot: count how many ways it could be hit next roll */
          var shots=0, d;
          for(d=1;d<=6;d++){
            var srcs = p===0 ? i-d : i+d;   /* where an opponent checker would be */
            if(srcs<0||srcs>=NP) continue;
            if(countAt(st,srcs,them)>0) shots++;
          }
          if(st.bar[them]>0){
            var ent = p===0 ? 24-i : i+1;    /* could they hit it straight off the bar? */
            if(ent>=1&&ent<=6) shots+=2;
          }
          s -= 3 + shots*4;
          if(i>=lo&&i<=hi) s-=5;            /* a blot in your own home is worse */
        }
      }
    }
    s += bestRun*bestRun*1.5;               /* a wall of points in a row */
    /* an anchor in their home board is worth holding on to */
    for(i=homeLo(them);i<=homeHi(them);i++) if(countAt(st,i,p)>=2) s+=10;
    return s;
  }

  /* all twenty-one distinct rolls, with how likely each is */
  var ROLLS=(function(){
    var out=[], a, b;
    for(a=1;a<=6;a++) for(b=a;b<=6;b++) out.push({ a:a, b:b, w:(a===b?1:2) });
    return out;
  })();

  /* what the other side would make of this position, on average over the dice */
  function replyValue(state, me){
    var them=1-me, total=0, weight=0, r;
    for(r=0;r<ROLLS.length;r++){
      var g=clone(state);
      g.turn=them;
      g.dice = ROLLS[r].a===ROLLS[r].b ? [ROLLS[r].a,ROLLS[r].a,ROLLS[r].a,ROLLS[r].a]
                                       : [ROLLS[r].a,ROLLS[r].b];
      g.plays=sequences(g, g.dice);
      var best=-1e9;
      if(!g.plays.length){
        best=evaluate(g, them);
      }else{
        var cs=candidates(g);
        for(var c=0;c<cs.length;c++){
          var v=evaluate(cs[c].state, them);
          if(v>best) best=v;
        }
      }
      total += best*ROLLS[r].w;
      weight += ROLLS[r].w;
    }
    return total/weight;
  }

  /* Levels are a depth and a `slip` - the chance of settling for something
     other than the best play.  Backgammon has dice in it, so even a strong
     opponent loses often; the numbers were still measured, not guessed. */
  var LEVELS=[{look:0, rnd:0.20, slip:0.30},{look:1, rnd:0, slip:0.12},{look:2, rnd:0, slip:0.02}];

  function think(st, level, opts){
    if(st.over||!st.plays.length) return null;
    var cfg = opts || LEVELS[Math.min(LEVELS.length-1, Math.max(0, level|0))];
    var me=st.turn;
    var cs=candidates(st);
    if(!cs.length) return null;
    var i;
    for(i=0;i<cs.length;i++) cs[i].score=evaluate(cs[i].state, me);
    cs.sort(function(a,b){ return b.score-a.score; });

    if(cfg.look>=2){
      /* look at what the other side can do about the best few, and pick the
         one they can do least about */
      var top=cs.slice(0, Math.min(cs.length, 6));
      for(i=0;i<top.length;i++){
        top[i].score = top[i].score*0.35 - replyValue(top[i].state, me)*0.65;
      }
      top.sort(function(a,b){ return b.score-a.score; });
      cs=top.concat(cs.slice(top.length));
    }
    if(cs.length>1 && cfg.rnd && st.rand()<cfg.rnd){
      /* barely looks: sometimes just takes a play at random */
      return cs[Math.floor(st.rand()*cs.length)%cs.length].seq;
    }
    if(cs.length>1 && st.rand()<cfg.slip){
      var k=1+Math.floor(st.rand()*(cs.length-1));
      if(k>=cs.length) k=cs.length-1;
      return cs[k].seq;
    }
    return cs[0].seq;
  }
  function hint(st){
    var s=think(st, 1, {look:1, slip:0});
    return s && s.length ? s[0] : null;
  }

  /* every promise the game makes, checked from the outside */
  function audit(st){
    var i, n=[0,0];
    for(i=0;i<NP;i++){
      var v=st.pt[i];
      if(typeof v!=="number"||!isFinite(v)||v!==Math.floor(v)) return "point "+i+" holds nonsense ("+v+")";
      if(v>0) n[0]+=v; else if(v<0) n[1]+=-v;
    }
    for(i=0;i<2;i++){
      if(st.bar[i]<0||st.off[i]<0) return "a negative pile";
      n[i]+=st.bar[i]+st.off[i];
      if(n[i]!==CHECKERS) return "player "+i+" has "+n[i]+" checkers, not "+CHECKERS;
      if(st.off[i]>CHECKERS) return "player "+i+" has borne off too many";
    }
    if(st.turn!==0&&st.turn!==1) return "nobody's turn";
    if(st.dice.length>4) return "too many dice left to play";
    for(i=0;i<st.dice.length;i++)
      if(st.dice[i]<1||st.dice[i]>6) return "a die showing "+st.dice[i];
    /* while somebody is on the bar, nothing else of theirs may move */
    if(st.bar[st.turn]>0){
      var ms=legalMoves(st);
      for(i=0;i<ms.length;i++) if(ms[i].from>=0) return "a move was offered while a checker sits on the bar";
    }
    if(st.over){
      if(st.winner!==0&&st.winner!==1) return "the game is over with no winner";
      if(st.off[st.winner]!==CHECKERS) return "the winner has not borne off everything";
      if(["single","gammon","backgammon"].indexOf(st.result)<0) return "an odd result ("+st.result+")";
    }else{
      if(st.off[0]===CHECKERS||st.off[1]===CHECKERS) return "somebody is home but the game is not over";
    }
    return null;
  }

  return { NP:NP, CHECKERS:CHECKERS, LEVELS:LEVELS, ROLLS:ROLLS,
           rng:rng, create:create, clone:clone,
           countAt:countAt, ownerAt:ownerAt, pipOf:pipOf, pipCount:pipCount,
           homeLo:homeLo, homeHi:homeHi, enterPoint:enterPoint,
           allHome:allHome, maxPip:maxPip, blocked:blocked,
           singleMoves:singleMoves, sequences:sequences,
           roll:roll, legalMoves:legalMoves, legalFrom:legalFrom, canMove:canMove,
           move:move, endTurn:endTurn, applyMove:applyMove, candidates:candidates,
           evaluate:evaluate, think:think, hint:hint, audit:audit };
}
if(typeof module!=='undefined') module.exports = makeBackgammon;
</script>
<script>
(function(){
"use strict";
var BG=makeBackgammon();
var LS="gg_backgammon_";
function load(k,fb){ try{ var v=localStorage.getItem(LS+k); return v==null?fb:JSON.parse(v);}catch(e){return fb;} }
function save(k,v){ try{ localStorage.setItem(LS+k, JSON.stringify(v)); }catch(e){} }

var MODES=[
  {id:"two",  name:"Two Players", cls:"z-p", tag:"Share the phone &middot; take turns", ai:null},
  {id:"easy", name:"Gentle",      cls:"z-a", tag:"Against the computer &middot; plays what it fancies", ai:0},
  {id:"med",  name:"Tricky",      cls:"z-b", tag:"Against the computer &middot; an even contest", ai:1},
  {id:"hard", name:"Fiendish",    cls:"z-c", tag:"Against the computer &middot; thinks about your reply", ai:2}
];
function modeOf(id){ for(var i=0;i<MODES.length;i++) if(MODES[i].id===id) return MODES[i]; return MODES[0]; }
var STARTS=[{id:"white",lab:"WHITE"},{id:"black",lab:"BLACK"},{id:"swap",lab:"SWAP"}];
function startsOf(id){ for(var i=0;i<STARTS.length;i++) if(STARTS[i].id===id) return STARTS[i]; return STARTS[0]; }

var FRAME="#6b3f1e", FRAME_L="#8a5a30", FELT="#e8d0a8", FELT_D="#dcc094";
var PT_A="#c8452f", PT_B="#f7ead0", BARC="#7a4a26";
var WHITE="#fdf6e6", WHITE_E="#c8b898", BLACK="#3a3038", BLACK_E="#1d171f";
function colOf(p){ return p===0?WHITE:BLACK; }
function edgeOf(p){ return p===0?WHITE_E:BLACK_E; }

/* ---------------- state ---------------- */
var mId, S, started, startId, lastStarter, thinking, aiTimer=null, turnTimer=null;
var sel=-1, history=[], msg="", msgUntil=0, lastT=0, rollAnim=0;
var wins=[0,0];
/* Only the test hook ever sets this. It stops the clock and the computer's
   timers, so a test can step the game itself instead of racing them.  With the
   hook stripped out it stays false for good. */
var frozen=false;

function firstFor(){
  if(startId==="white") return 0;
  if(startId==="black") return 1;
  return lastStarter===0 ? 1 : 0;
}
function clearTimers(){
  if(aiTimer){ clearTimeout(aiTimer); aiTimer=null; }
  if(turnTimer){ clearTimeout(turnTimer); turnTimer=null; }
}
function newGame(id){
  mId=id; save("mode",id);
  var f=firstFor();
  lastStarter=f; save("lastStarter",f);
  S=BG.create({first:f});
  started=started||false;
  thinking=false; sel=-1; history=[]; msg=""; msgUntil=0; rollAnim=0;
  clearTimers();
  layout(); paintHUD();
  /* does not persist - boot calls this before the title screen reads the save */
}

/* ---------------- audio ---------------- */
var AC=null;
function muted(){ try{ return localStorage.getItem("gg_muted")==="1"; }catch(e){ return false; } }
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=false; } } return AC; }
function beep(f,dur,type,vol,slide){
  if(muted()) return; var a=ac(); if(!a) return;
  try{
    var o=a.createOscillator(), g=a.createGain();
    o.type=type||"sine"; o.frequency.setValueAtTime(f,a.currentTime);
    if(slide) o.frequency.exponentialRampToValueAtTime(slide,a.currentTime+dur);
    g.gain.setValueAtTime(.0001,a.currentTime);
    g.gain.exponentialRampToValueAtTime(vol||.05,a.currentTime+.012);
    g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+dur);
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+dur+.02);
  }catch(e){}
}

/* ---------------- layout ----------------
   The board is laid out the traditional way: points 1 to 12 along the bottom
   running right to left, 13 to 24 along the top running left to right, with the
   bar between the two halves and the trays down the right-hand side. */
var cv=document.getElementById("cv"), ctx=cv.getContext("2d");
var DPR=Math.min(window.devicePixelRatio||1,3);
var VW=0,VH=0,SC=0,OX=0,OY=0;
var EDGE=0.34, BARW=1.2, TRAYW=0.86, PLEN=6.3, MIDGAP=2.4;
var BW=EDGE*2+12+BARW+TRAYW;
var BH=EDGE*2+PLEN*2+MIDGAP;
function layout(){
  var st=document.getElementById("stage");
  var aw=st.clientWidth, ah=st.clientHeight;
  if(aw<40||ah<40||!S) return;
  VW=aw; VH=ah;
  cv.style.width=aw+"px"; cv.style.height=ah+"px";
  cv.width=Math.round(aw*DPR); cv.height=Math.round(ah*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  SC=Math.min((aw-4)/BW, (ah-4)/BH);
  OX=Math.round((aw-SC*BW)/2);
  OY=Math.round((ah-SC*BH)/2);
}
window.addEventListener("resize", function(){ layout(); });
function px(u){ return OX+u*SC; }
function py(u){ return OY+u*SC; }
function rr(x,y,w,h,rad){
  if(rad>w/2) rad=w/2; if(rad>h/2) rad=h/2;
  ctx.beginPath(); ctx.moveTo(x+rad,y);
  ctx.arcTo(x+w,y,x+w,y+h,rad); ctx.arcTo(x+w,y+h,x,y+h,rad);
  ctx.arcTo(x,y+h,x,y,rad); ctx.arcTo(x,y,x+w,y,rad); ctx.closePath();
}

/* which of the twelve columns, and which row, a point sits in */
function slotOf(i){
  return i<12 ? { row:1, col:11-i } : { row:0, col:i-12 };
}
/* the left edge of a column, in units */
function colX(c){ return EDGE + c + (c>=6 ? BARW : 0); }
function barX(){ return EDGE+6; }
function trayX(){ return EDGE+12+BARW; }
var CHR=0.42, STACK=0.80;             /* checker radius and stack spacing */

/* where the nth checker on point i sits */
function checkerPos(i, n){
  var s=slotOf(i);
  var x=colX(s.col)+0.5;
  var y = s.row===1
    ? EDGE+PLEN*2+MIDGAP-CHR-n*STACK
    : EDGE+CHR+n*STACK;
  return { x:x, y:y };
}
function barPos(p, n){
  var x=barX()+BARW/2;
  var y = p===0 ? EDGE+PLEN+MIDGAP/2+0.55+n*STACK*0.8
                : EDGE+PLEN+MIDGAP/2-0.55-n*STACK*0.8;
  return { x:x, y:y };
}
function trayPos(p, n){
  var x=trayX()+TRAYW/2;
  var y = p===0 ? EDGE+PLEN*2+MIDGAP-0.30-n*0.36
                : EDGE+0.30+n*0.36;
  return { x:x, y:y };
}

function checker(ux, uy, p, ring){
  var x=px(ux), y=py(uy), r=CHR*SC;
  ctx.fillStyle="rgba(60,30,10,.35)";
  ctx.beginPath(); ctx.arc(x, y+r*0.16, r, 0, 6.284); ctx.fill();
  ctx.fillStyle=colOf(p);
  ctx.beginPath(); ctx.arc(x, y, r, 0, 6.284); ctx.fill();
  ctx.strokeStyle=edgeOf(p); ctx.lineWidth=Math.max(1,r*0.16);
  ctx.beginPath(); ctx.arc(x, y, r*0.80, 0, 6.284); ctx.stroke();
  ctx.fillStyle = p===0 ? "rgba(255,255,255,.7)" : "rgba(255,255,255,.14)";
  ctx.beginPath(); ctx.arc(x-r*0.26, y-r*0.28, r*0.2, 0, 6.284); ctx.fill();
  if(ring){
    ctx.strokeStyle="rgba(255,225,120,.98)"; ctx.lineWidth=Math.max(2,r*0.30);
    ctx.beginPath(); ctx.arc(x, y, r*1.1, 0, 6.284); ctx.stroke();
  }
}
function pip(x, y, r){ ctx.beginPath(); ctx.arc(x, y, r, 0, 6.284); ctx.fill(); }
function die(ux, uy, v, size, spent){
  var s=size*SC, x=px(ux)-s/2, y=py(uy)-s/2;
  ctx.fillStyle= spent ? "rgba(255,255,255,.35)" : "#fffdf8";
  rr(x, y, s, s, s*0.22); ctx.fill();
  ctx.strokeStyle="rgba(60,30,10,.35)"; ctx.lineWidth=Math.max(1,s*0.05);
  rr(x, y, s, s, s*0.22); ctx.stroke();
  ctx.fillStyle= spent ? "rgba(90,60,40,.45)" : "#3a3038";
  var r=s*0.09, a=x+s*0.28, b=x+s*0.5, c=x+s*0.72;
  var t=y+s*0.28, m=y+s*0.5, u=y+s*0.72;
  if(v%2===1) pip(b,m,r);
  if(v>=2){ pip(a,t,r); pip(c,u,r); }
  if(v>=4){ pip(c,t,r); pip(a,u,r); }
  if(v>=6){ pip(a,m,r); pip(c,m,r); }
}

function frame(ts){
  requestAnimationFrame(frame);
  if(!SC){ layout(); if(!SC) return; }
  if(!S) return;
  var now=ts||0;
  var dt=lastT?Math.min(120,now-lastT):0;
  lastT=now;
  if(!frozen && rollAnim>0) rollAnim-=dt;

  ctx.clearRect(0,0,VW,VH);
  var i, k;

  /* the board */
  ctx.fillStyle="rgba(40,30,120,.30)";
  rr(px(0), py(0)+5, SC*BW, SC*BH, Math.max(8,SC*0.3)); ctx.fill();
  ctx.fillStyle=FRAME;
  rr(px(0), py(0), SC*BW, SC*BH, Math.max(8,SC*0.3)); ctx.fill();
  ctx.fillStyle=FELT;
  rr(px(EDGE), py(EDGE), SC*(BW-EDGE*2), SC*(BH-EDGE*2), Math.max(3,SC*0.1)); ctx.fill();

  /* the points */
  for(i=0;i<24;i++){
    var s=slotOf(i);
    var x0=px(colX(s.col)), x1=px(colX(s.col)+1);
    var base = s.row===1 ? py(EDGE+PLEN*2+MIDGAP) : py(EDGE);
    var apex = s.row===1 ? py(EDGE+PLEN+MIDGAP)   : py(EDGE+PLEN);
    ctx.fillStyle = (i%2===0) ? PT_A : PT_B;
    ctx.beginPath();
    ctx.moveTo(x0, base); ctx.lineTo(x1, base);
    ctx.lineTo((x0+x1)/2, apex); ctx.closePath(); ctx.fill();
    ctx.strokeStyle="rgba(90,55,20,.20)"; ctx.lineWidth=1;
    ctx.stroke();
  }

  /* the bar and the trays */
  ctx.fillStyle=BARC;
  rr(px(barX()), py(EDGE), SC*BARW, SC*(BH-EDGE*2), Math.max(2,SC*0.08)); ctx.fill();
  ctx.fillStyle=FELT_D;
  rr(px(trayX()), py(EDGE), SC*TRAYW, SC*(PLEN*2+MIDGAP)/2-SC*0.06, Math.max(2,SC*0.08)); ctx.fill();
  rr(px(trayX()), py(EDGE+(PLEN*2+MIDGAP)/2+0.06), SC*TRAYW, SC*(PLEN*2+MIDGAP)/2-SC*0.06, Math.max(2,SC*0.08)); ctx.fill();

  /* where a selected checker could go */
  var myMove = started && !S.over && !thinking && rollAnim<=0 && myTurn();
  var dests = (myMove && sel!==-2) ? BG.legalFrom(S, sel) : [];
  if(myMove && sel===-2) dests=[];
  for(k=0;k<dests.length;k++){
    var d=dests[k];
    if(d.to<0){
      ctx.fillStyle="rgba(255,225,120,.42)";
      rr(px(trayX())+2, py(S.turn===0?EDGE+(PLEN*2+MIDGAP)/2+0.06:EDGE)+2,
         SC*TRAYW-4, SC*(PLEN*2+MIDGAP)/2-SC*0.06-4, Math.max(2,SC*0.08)); ctx.fill();
    }else{
      var sd=slotOf(d.to);
      ctx.fillStyle="rgba(255,225,120,.34)";
      var by = sd.row===1 ? py(EDGE+PLEN+MIDGAP) : py(EDGE);
      rr(px(colX(sd.col))+1, by, SC-2, SC*PLEN, Math.max(2,SC*0.1)); ctx.fill();
      /* the number that gets you there */
      var cpos=checkerPos(d.to, Math.max(0, BG.countAt(S,d.to,S.turn)));
      ctx.save();
      ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.font="900 "+Math.round(SC*0.5)+"px -apple-system,Helvetica,Arial";
      ctx.fillStyle="rgba(70,40,10,.85)";
      ctx.fillText(String(d.die), px(cpos.x), py(cpos.y));
      ctx.restore();
    }
  }

  /* the checkers */
  for(i=0;i<24;i++){
    var n0=BG.countAt(S,i,0), n1=BG.countAt(S,i,1);
    var p = n0>0 ? 0 : (n1>0 ? 1 : -1);
    var n = n0>0 ? n0 : n1;
    if(p<0) continue;
    var show=Math.min(n, 6);
    for(k=0;k<show;k++){
      var cp=checkerPos(i, k);
      checker(cp.x, cp.y, p, myMove && sel===i && k===show-1);
    }
    if(n>show){
      var lp=checkerPos(i, show-1);
      ctx.save();
      ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.font="900 "+Math.round(SC*0.42)+"px -apple-system,Helvetica,Arial";
      ctx.fillStyle = p===0 ? "#6b3f1e" : "#ffffff";
      ctx.fillText("+"+(n-show), px(lp.x), py(lp.y));
      ctx.restore();
    }
  }
  /* the bar */
  for(p=0;p<2;p++){
    for(k=0;k<Math.min(S.bar[p],4);k++){
      var bp=barPos(p,k);
      checker(bp.x, bp.y, p, myMove && sel===-1 && S.turn===p && k===Math.min(S.bar[p],4)-1);
    }
    if(S.bar[p]>4){
      var bl=barPos(p,3);
      ctx.save();
      ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.font="900 "+Math.round(SC*0.4)+"px -apple-system,Helvetica,Arial";
      ctx.fillStyle = p===0 ? "#6b3f1e" : "#ffffff";
      ctx.fillText("+"+(S.bar[p]-4), px(bl.x), py(bl.y));
      ctx.restore();
    }
  }
  /* the trays */
  for(p=0;p<2;p++){
    for(k=0;k<S.off[p];k++){
      var tp=trayPos(p,k);
      ctx.fillStyle=colOf(p);
      rr(px(tp.x)-SC*CHR*0.86, py(tp.y)-SC*0.13, SC*CHR*1.72, SC*0.26, SC*0.1); ctx.fill();
      ctx.strokeStyle=edgeOf(p); ctx.lineWidth=1;
      rr(px(tp.x)-SC*CHR*0.86, py(tp.y)-SC*0.13, SC*CHR*1.72, SC*0.26, SC*0.1); ctx.stroke();
    }
  }

  /* the dice, in the middle */
  if(started && S.rolled.length && !S.over){
    var midY=EDGE+PLEN+MIDGAP/2;
    var shown=S.rolled;
    var dsz=Math.min(1.0, MIDGAP*0.72);
    if(rollAnim>0){
      /* a quick tumble before they settle */
      shown=[1+Math.floor(Math.random()*6), 1+Math.floor(Math.random()*6)];
    }
    var isD=S.rolled[0]===S.rolled[1];
    var list = isD ? [S.rolled[0],S.rolled[0],S.rolled[0],S.rolled[0]] : shown;
    var left = trayX()/2 - (list.length*dsz*1.18)/2 + dsz*0.59;
    for(k=0;k<list.length;k++){
      var spent = rollAnim<=0 && k>=S.dice.length;
      die(left + k*dsz*1.18, midY, rollAnim>0?shown[k%2]:list[k], dsz, spent);
    }
  }

  /* a word about what is going on */
  var say=null;
  if(thinking) say="THINKING";
  else if(now<msgUntil) say=msg;
  if(started && say){
    ctx.save();
    ctx.translate(px(BW/2), py(EDGE+PLEN+MIDGAP/2));
    if(S.turn===1 && modeOf(mId).ai===null) ctx.rotate(Math.PI);
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.font="900 "+Math.round(Math.min(22,SC*0.62))+"px -apple-system,Helvetica,Arial";
    var tw=ctx.measureText(say).width, ph=Math.min(32,SC*0.9);
    ctx.fillStyle="rgba(50,28,8,.92)";
    rr(-tw/2-SC*0.3, -ph/2, tw+SC*0.6, ph, ph/2); ctx.fill();
    ctx.fillStyle="#ffffff";
    ctx.fillText(say, 0, 1);
    ctx.restore();
  }
}

/* ---------------- turns ---------------- */
function myTurn(){
  var m=modeOf(mId);
  return m.ai===null || S.turn===0;
}
function busy(){ return thinking || rollAnim>0; }

function beginTurn(){
  if(S.over) return;
  sel=-1; history=[];
  var r=BG.roll(S);
  rollAnim=frozen?0:520;
  beep(300,.07,"square",.05);
  paintHUD();
  persist();
  var wait=frozen?0:620;
  if(r.stuck){
    msg="NO MOVE"; msgUntil=lastT+wait+900;
    if(turnTimer) clearTimeout(turnTimer);
    if(!frozen) turnTimer=setTimeout(function(){ turnTimer=null; passTurn(); }, wait+900);
  }else if(!myTurn()){
    scheduleAI(wait+260);
  }
}
function passTurn(){
  if(S.over) return;
  BG.endTurn(S);
  sel=-1; history=[];
  paintHUD(); persist();
  beginTurn();
}
function scheduleAI(delay){
  var m=modeOf(mId);
  if(m.ai===null || S.turn!==1 || S.over || frozen) return;
  if(aiTimer) clearTimeout(aiTimer);
  thinking=true;
  paintHUD();
  aiTimer=setTimeout(function(){
    aiTimer=null;
    if(!S || S.over || S.turn!==1){ thinking=false; paintHUD(); return; }
    var seq=BG.think(S, m.ai);
    thinking=false;
    if(!seq||!seq.length){ paintHUD(); passTurn(); return; }
    playSequence(seq, 0);
  }, delay==null?420:delay);
}
/* the computer plays its checkers one at a time, so you can follow it */
function playSequence(seq, k){
  if(!S || S.over || k>=seq.length){
    if(!S.over && !S.plays.length) finishTurn();
    return;
  }
  doMove(seq[k], true);
  if(S.over) return;
  if(frozen){ playSequence(seq, k+1); return; }
  turnTimer=setTimeout(function(){ turnTimer=null; playSequence(seq, k+1); }, 380);
}
function finishTurn(){
  if(S.over) return;
  if(frozen){ passTurn(); return; }
  if(turnTimer) clearTimeout(turnTimer);
  turnTimer=setTimeout(function(){ turnTimer=null; passTurn(); }, 420);
}

function snapshot(){
  return { pt:S.pt.slice(), bar:[S.bar[0],S.bar[1]], off:[S.off[0],S.off[1]],
           dice:S.dice.slice(), plays:S.plays.map(function(s){ return s.slice(); }),
           moves:S.moves };
}
function restoreSnap(sn){
  S.pt=sn.pt.slice(); S.bar=[sn.bar[0],sn.bar[1]]; S.off=[sn.off[0],sn.off[1]];
  S.dice=sn.dice.slice(); S.plays=sn.plays.map(function(s){ return s.slice(); });
  S.moves=sn.moves;
}

function doMove(mv, byAI){
  if(S.over) return false;
  var sn=snapshot();
  var ev=BG.move(S, mv);
  if(!ev.ok) return false;
  history.push(sn);
  sel=-1;
  if(ev.hit){
    beep(220,.14,"sawtooth",.06);
    msg="HIT"; msgUntil=lastT+900;
    if(window.GGA) GGA.haptic("medium");
  }else{
    beep(mv.to<0?720:420,.06,"triangle",.05);
    if(window.GGA) GGA.haptic("light");
  }
  if(window.GGA && ev.by===0){
    if(mv.to<0) GGA.award("bg_off");
    if(longestPrime(0)>=6) GGA.award("bg_prime");
  }
  paintHUD();
  persist();
  if(ev.over){ finish(); return true; }
  if(!S.plays.length){
    if(window.GGA && ev.by===0 && S.rolled[0]===S.rolled[1] && S.moves>=4) GGA.award("bg_double");
    if(!byAI) finishTurn();
  }
  return true;
}
function longestPrime(p){
  var run=0, best=0, i;
  for(i=0;i<24;i++){
    if(BG.countAt(S,i,p)>=2){ run++; if(run>best) best=run; }
    else run=0;
  }
  return best;
}

function finish(){
  save("cur",null);
  clearTimers();
  var m=modeOf(mId);
  var played=load("played",0)+1; save("played",played);
  if(S.winner>=0){ wins[S.winner]++; save("wins",wins); }
  msg = S.winner===0 ? "WHITE WINS" : "BLACK WINS";
  msgUntil=lastT+2400;
  if(window.GGA){
    if(m.ai===null) GGA.award("bg_2p");
    if(played>=10) GGA.award("bg_10");
    if(S.winner===0){
      GGA.award("bg_first");
      if(mId==="hard") GGA.award("bg_hard");
      if(S.result==="gammon"||S.result==="backgammon") GGA.award("bg_gammon");
    }
    GGA.haptic(S.winner===0?"success":"error");
  }
  beep(660,.12,"triangle",.08);
  setTimeout(function(){ beep(880,.12,"triangle",.08); },120);
  setTimeout(function(){ beep(1170,.28,"triangle",.09); },250);
  setTimeout(function(){ winScreen(); },1200);
}

function paintHUD(){
  document.getElementById("vWhite").textContent=S.off[0];
  document.getElementById("vBlack").textContent=S.off[1];
  var t=document.getElementById("vTurn");
  if(S.over) t.textContent = S.winner===0 ? "WHITE" : "BLACK";
  else if(thinking) t.textContent="...";
  else t.textContent = S.turn===0 ? "WHITE" : "BLACK";
  var u=document.getElementById("tUndo");
  if(started && !S.over && history.length && myTurn() && !busy()) u.classList.remove("off");
  else u.classList.add("off");
}

/* ---------------- save ---------------- */
function persist(){
  /* Before the player has started, this page owns nothing: pagehide and
     visibilitychange both fire while the title screen is up, and clearing here
     would eat the save that CARRY ON is about to offer. */
  if(!started) return;
  if(S.over || (S.turns<=1 && S.moves===0)){ save("cur",null); return; }
  save("cur",{ m:mId, f:S.first, t:S.turn, pt:S.pt.slice(),
    b:[S.bar[0],S.bar[1]], o:[S.off[0],S.off[1]], tn:S.turns });
}
function restore(){
  var c=load("cur",null);
  if(!c||!c.pt||c.pt.length!==24||!c.b||!c.o) return false;
  newGame(c.m);
  S=BG.create({first:c.f===1?1:0});
  S.pt=c.pt.map(function(v){ return v|0; });
  S.bar=[c.b[0]|0, c.b[1]|0];
  S.off=[c.o[0]|0, c.o[1]|0];
  S.turn=(c.t===1)?1:0;
  S.turns=c.tn|0;
  S.dice=[]; S.rolled=[]; S.plays=[];
  if(BG.audit(S)){ newGame(c.m); return false; }
  sel=-1; history=[];
  paintHUD();
  return true;
}

/* ---------------- input ---------------- */
function hitTest(clientX, clientY){
  var b=cv.getBoundingClientRect();
  var ux=(clientX-b.left-OX)/SC, uy=(clientY-b.top-OY)/SC;
  if(ux>=trayX() && ux<=trayX()+TRAYW) return -3;         /* a tray: bearing off */
  if(ux>=barX() && ux<=barX()+BARW) return -1;            /* the bar */
  var c=-1, k;
  for(k=0;k<12;k++){ if(ux>=colX(k) && ux<colX(k)+1){ c=k; break; } }
  if(c<0) return -2;
  var row = uy < EDGE+PLEN+MIDGAP/2 ? 0 : 1;
  return row===1 ? (11-c) : (c+12);
}
function pt(e){
  return (e.touches&&e.touches.length)?e.touches[0]
       :((e.changedTouches&&e.changedTouches.length)?e.changedTouches[0]:e);
}
function onTap(e){
  if(!started||S.over||busy()||!myTurn()) return;
  if(e.cancelable) e.preventDefault();
  var t=hitTest(pt(e).clientX, pt(e).clientY);
  if(t===-2){ sel=-1; return; }

  /* a tap on somewhere the selected checker can go plays the move */
  if(sel!==-1 || S.bar[S.turn]>0){
    var opts=BG.legalFrom(S, sel);
    var m2, k2;
    for(k2=0;k2<opts.length;k2++){
      m2=opts[k2];
      if((t===-3 && m2.to<0) || (t>=0 && m2.to===t)){ doMove(m2); return; }
    }
  }
  /* otherwise pick a checker up */
  if(S.bar[S.turn]>0){
    sel = t===-1 ? -1 : sel;
    if(t===-1) beep(520,.05,"sine",.04);
    return;
  }
  if(t>=0 && BG.countAt(S,t,S.turn)>0 && BG.legalFrom(S,t).length){
    sel=t; beep(520,.05,"sine",.04);
  }else if(t>=0){
    sel=-1;
  }
}
cv.addEventListener("touchend", onTap, {passive:false});
cv.addEventListener("touchstart", function(e){ if(e.cancelable) e.preventDefault(); }, {passive:false});
cv.addEventListener("mouseup", onTap);
cv.addEventListener("contextmenu", function(e){ e.preventDefault(); });

document.getElementById("tUndo").onclick=function(){
  if(!started||S.over||busy()||!myTurn()||!history.length) return;
  restoreSnap(history.pop());
  sel=-1;
  beep(260,.07,"sine",.04);
  paintHUD(); persist();
};
document.getElementById("tRules").onclick=function(){ rulesScreen(true); };
document.getElementById("tNew").onclick=function(){
  if(!started) return;
  if(S.over){ newGame(mId); persist(); closeOvl(); started=true; beginTurn(); return; }
  openOvl('<h2>START AGAIN?</h2><p>This game will be lost.</p>'+
    '<button class="btn btn-go" id="y">YES, NEW GAME</button>'+
    '<button class="btn btn-alt" id="n">KEEP PLAYING</button>');
  card.querySelector("#y").onclick=function(){ newGame(mId); persist(); closeOvl(); started=true; beginTurn(); };
  card.querySelector("#n").onclick=closeOvl;
};

/* ---------------- screens ---------------- */
var ovl=document.getElementById("ovl"), card=document.getElementById("card");
function openOvl(h){ card.innerHTML=h; ovl.classList.add("on"); }
function closeOvl(){ ovl.classList.remove("on"); }

function titleScreen(){
  var cur=load("cur",null);
  var h='<h2>BACKGAMMON</h2><p>Race your fifteen checkers all the way round and off the board.</p><div class="sizes">';
  for(var i=0;i<MODES.length;i++){
    var m=MODES[i];
    h+='<div class="sz '+m.cls+'" data-m="'+m.id+'"><div style="text-align:left">'+
       '<div class="sn">'+m.name+'</div><div class="stg">'+m.tag+'</div></div></div>';
  }
  h+='</div>';
  h+='<button class="btn btn-alt" id="bStart">FIRST GO &middot; '+startsOf(startId).lab+'</button>';
  if(cur&&cur.pt) h+='<button class="btn btn-go" id="bResume">CARRY ON &middot; '+
    (cur.o[0]|0)+' &ndash; '+(cur.o[1]|0)+' off</button>';
  h+='<button class="btn btn-alt" id="bRules">HOW TO PLAY</button>';
  openOvl(h);
  Array.prototype.forEach.call(card.querySelectorAll(".sz"), function(el){
    el.onclick=function(){
      started=true; newGame(el.getAttribute("data-m"));
      closeOvl(); layout(); beginTurn();
    };
  });
  card.querySelector("#bStart").onclick=function(){
    var k=0;
    for(var j=0;j<STARTS.length;j++) if(STARTS[j].id===startId) k=j;
    startId=STARTS[(k+1)%STARTS.length].id;
    save("starts",startId);
    /* textContent, not innerHTML, so the entity would show up literally - and
       the source stays ASCII, which is the rule for every file here */
    this.textContent="FIRST GO \u00B7 "+startsOf(startId).lab;
  };
  var br=card.querySelector("#bResume");
  if(br) br.onclick=function(){
    started=true;
    if(!restore()) newGame(load("mode","two"));
    closeOvl(); layout(); beginTurn();
  };
  card.querySelector("#bRules").onclick=function(){ rulesScreen(false); };
}
function rulesScreen(fromGame){
  openOvl('<h2>HOW TO PLAY</h2><div class="rules">'+
    '&#9642; White runs from the top left round to the bottom right and off; black goes the other way. Your <b>dice roll for you</b> at the start of your turn.<br><br>'+
    '&#9642; <b>Tap one of your checkers, then tap where it should go.</b> The squares that light up are the only legal ones, and each shows the number that gets you there.<br><br>'+
    '&#9642; A point with <b>two or more</b> of your opponent\'s checkers is shut. Land on a <b>lone</b> one and it goes to the bar.<br><br>'+
    '&#9642; A checker on the bar must come back on before you may move anything else.<br><br>'+
    '&#9642; You must play <b>as many of your numbers as you can</b>, and if only one will go it has to be the higher one. Doubles give you the number four times.<br><br>'+
    '&#9642; Once all fifteen are home you can start <b>bearing off</b>. First to take them all off wins.'+
    '</div><button class="btn btn-go" id="bBack">GOT IT</button>');
  card.querySelector("#bBack").onclick=function(){
    if(fromGame){ closeOvl(); } else { titleScreen(); }
  };
}
function winScreen(){
  var m=modeOf(mId);
  var head;
  if(m.ai===null) head = S.winner===0 ? "WHITE WINS!" : "BLACK WINS!";
  else head = S.winner===0 ? "YOU WIN!" : "COMPUTER WINS";
  var kind = S.result==="backgammon" ? "A backgammon" : (S.result==="gammon" ? "A gammon" : "A single game");
  openOvl('<h2>'+head+'</h2>'+
    '<p>'+kind+' &middot; '+(m.ai===null?"two players":m.name.toLowerCase())+'.</p>'+
    '<div class="stats">'+
      '<div class="st"><div class="sk">WHITE</div><div class="sv">'+wins[0]+'</div></div>'+
      '<div class="st"><div class="sk">BLACK</div><div class="sv">'+wins[1]+'</div></div>'+
      '<div class="st"><div class="sk">PLAYED</div><div class="sv">'+load("played",0)+'</div></div>'+
    '</div>'+
    '<button class="btn btn-go" id="bAgain">ANOTHER GAME</button>'+
    '<button class="btn btn-alt" id="bMenu">CHANGE OPPONENT</button>');
  card.querySelector("#bAgain").onclick=function(){ newGame(mId); closeOvl(); layout(); started=true; beginTurn(); };
  card.querySelector("#bMenu").onclick=titleScreen;
}
document.getElementById("bPause").onclick=function(){
  if(!started||S.over){ titleScreen(); return; }
  persist();
  openOvl('<h2>PAUSED</h2>'+
    '<div class="stats">'+
      '<div class="st"><div class="sk">WHITE OFF</div><div class="sv">'+S.off[0]+'</div></div>'+
      '<div class="st"><div class="sk">BLACK OFF</div><div class="sv">'+S.off[1]+'</div></div>'+
      '<div class="st"><div class="sk">TURNS</div><div class="sv">'+S.turns+'</div></div>'+
    '</div>'+
    '<button class="btn btn-go" id="bGo">BACK TO IT</button>'+
    '<button class="btn btn-alt" id="bMenu2">CHANGE OPPONENT</button>');
  card.querySelector("#bGo").onclick=function(){ lastT=0; closeOvl(); };
  card.querySelector("#bMenu2").onclick=titleScreen;
};

/* ---------------- boot ---------------- */
startId=load("starts","white");
if(startsOf(startId).id!==startId) startId="white";
lastStarter=load("lastStarter",1);
wins=load("wins",[0,0]);
if(!wins||wins.length!==2) wins=[0,0];
newGame(load("mode","two"));
started=false;
titleScreen();
requestAnimationFrame(frame);
setTimeout(function(){ layout(); },50);
window.addEventListener("orientationchange", function(){ setTimeout(layout,220); });
document.addEventListener("visibilitychange", function(){ if(document.hidden) persist(); });
window.addEventListener("pagehide", persist);


})();
</script>
