<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Bubble Shooter</title>
<style>
  /* ---- Bubble Shooter, re-skinned to the arcade house style ----
     The game underneath is the original, untouched: the same hundred levels
     across ten worlds, Hard Mode, gems, bombs, rainbows, cages, chests, the
     shop, the stars and the same two badges.  Everything here is chrome.

     There is no single palette for this one, and there should not be: the ten
     worlds each have their own identity and the game changes colour as you
     travel.  What the re-skin does is LIFT them - every world's page went from
     near-black to a bright wash, and its playfield from a murky near-black to a
     lit, saturated field.  The playfield stops short of white on purpose: the
     shots counter, the goal and the marks are all drawn in white on the canvas,
     and a pale field would erase them.

     Every class name from the original build is kept, because the level select,
     the shop and the star rows are built in JavaScript that names them. */
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:linear-gradient(162deg,#7fd98f 0%,#bff0c4 46%,#f2fdf1 100%);
    color:#fff;
    display:flex;flex-direction:column;align-items:center;
    touch-action:manipulation;
    transition:background 1s;
    padding:calc(env(safe-area-inset-top) + 6px) 8px calc(env(safe-area-inset-bottom) + 6px);
  }
  #shell{width:100%;max-width:520px;height:100%;display:flex;flex-direction:column}
  .bar{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .pill{display:inline-flex;align-items:center;gap:5px;text-decoration:none;color:#1f5a33;
    background:rgba(255,255,255,.95);border:1.5px solid #fff;padding:6px 12px;border-radius:999px;
    font-size:12.5px;font-weight:800;box-shadow:0 3px 9px rgba(20,60,35,.25);cursor:pointer;white-space:nowrap}
  .pill:active{transform:scale(.95)}
  .title{flex:1;text-align:center;font-weight:900;letter-spacing:1.2px;line-height:1;
    font-size:clamp(13px,4.2vw,19px);text-shadow:0 2px 6px rgba(20,50,30,.45);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .strip{display:flex;gap:6px;margin-bottom:7px}
  .chip{flex:1;min-width:0;text-align:center;padding:6px 2px;border-radius:13px;
    background:rgba(255,255,255,.28);border:1px solid rgba(255,255,255,.5)}
  .chip .k{font-size:8px;letter-spacing:1.1px;font-weight:900;opacity:.85;color:#14361f}
  .chip .v{font-size:clamp(13px,4.2vw,17px);font-weight:900;font-variant-numeric:tabular-nums;
    color:#123019;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  #stage{position:relative;flex:1;min-height:0;display:flex;align-items:flex-start;
    justify-content:center;width:100%}
  canvas{display:block;touch-action:none;cursor:crosshair;border-radius:16px;
    border:3px solid #fff;box-shadow:0 8px 22px rgba(20,50,30,.32)}

  /* ---------- tools ---------- */
  #tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:7px}
  .tool{background:rgba(255,255,255,.96);border:1.5px solid #fff;border-radius:15px;
    padding:9px 2px 8px;text-align:center;cursor:pointer;color:#1f5a33;
    box-shadow:0 4px 0 rgba(30,80,50,.32),0 6px 14px rgba(20,50,30,.22)}
  .tool:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(30,80,50,.32)}
  .tool .ti{font-size:19px;line-height:1}
  .tool .tl{font-size:9px;font-weight:900;letter-spacing:.5px;margin-top:2px;opacity:.75}

  /* ---------- overlay cards ---------- */
  .overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    z-index:50;background:rgba(30,60,45,.4);backdrop-filter:blur(6px);padding:10px}
  .overlay.show{display:flex}
  .panel{
    background:linear-gradient(180deg,#fff,#f4fbf4);
    border:2px solid #fff;border-radius:22px;
    padding:18px 16px 14px;text-align:center;width:min(96%,400px);
    color:#7fa78d;box-shadow:0 20px 50px rgba(20,50,30,.42);
    max-height:100%;overflow:auto;
    animation:pin .35s cubic-bezier(.2,1.5,.4,1);
  }
  @keyframes pin{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
  .panel h2{font-size:22px;font-weight:900;letter-spacing:.8px;color:#1f8f4d;margin-bottom:3px}
  .panel p{font-size:13px;color:#7fa78d;margin:5px 0;line-height:1.45}
  .panel .big{
    display:block;width:100%;margin-top:10px;padding:12px;border:none;border-radius:15px;
    font:900 14.5px -apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:.4px;
    background:linear-gradient(180deg,#5fd97f,#1f8f4d);color:#fff;cursor:pointer;
    box-shadow:0 5px 0 #146633,0 8px 18px rgba(25,110,60,.32)}
  .panel .big:active{transform:translateY(3px);box-shadow:0 2px 0 #146633}
  .panel .quiet{
    display:block;width:100%;margin-top:8px;padding:11px;border-radius:15px;
    font:900 13.5px -apple-system,BlinkMacSystemFont,sans-serif;
    background:#eaf7ec;color:#1f5a33;border:1.5px solid #cfeed6;cursor:pointer}
  .rules{text-align:left;font-size:12.4px;line-height:1.6;color:#7fa78d;margin:10px 2px}
  .rules b{color:#1f8f4d}

  #starRow{font-size:34px;letter-spacing:6px;margin:8px 0 2px 0}
  #starRow .on{color:#f5b921;text-shadow:0 0 12px rgba(245,185,33,.55)}
  #starRow .off{color:#d8e6da}

  #shopRow{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
  .shopBtn{font:900 12px -apple-system,sans-serif;color:#a06a00;
    background:#fff6e0;border:1.5px solid #f0d79a;border-radius:12px;padding:9px 12px;cursor:pointer}
  .shopBtn:active{background:#ffeec4}
  .shopBtn.owned{color:#1f8f4d;border-color:#bfe6c9;background:#eaf7ec}
  .shopBtn.poor{opacity:.42;cursor:default}

  #lvlScroll{max-height:48vh;overflow-y:auto;margin-top:10px;-webkit-overflow-scrolling:touch}
  .worldHead{display:flex;align-items:center;gap:8px;margin:12px 2px 6px 2px;
    font:900 13.5px -apple-system,sans-serif;letter-spacing:.4px;color:#1f5a33}
  .worldHead .bar{flex:1;height:2px;background:#d8ecdd;border-radius:2px;margin-bottom:0}
  .worldHead .mech{font-size:10px;font-weight:800;color:#9dc3a8}
  .hardHead{margin:18px 2px 4px 2px;text-align:center;
    font:900 15px -apple-system,sans-serif;letter-spacing:1px;color:#e0642c}
  .lvlGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:2px}
  .lvlBtn{background:#f0f9f2;border:1.5px solid #d3ebd9;border-radius:13px;
    padding:8px 2px 6px 2px;color:#1f5a33;cursor:pointer;
    font:900 16px -apple-system,sans-serif;position:relative}
  .lvlBtn:active{background:#dcf1e1}
  .lvlBtn.hard{border-color:#f6c9a8;background:#fff4ec}
  .lvlBtn .st{display:block;font-size:10px;letter-spacing:1px;margin-top:2px;font-weight:800}
  .lvlBtn .st .on{color:#f5b921}
  .lvlBtn .st .off{color:#cfe2d4}
  .lvlBtn .tbadge{position:absolute;top:-7px;right:-5px;font-size:11px;
    background:#f5b921;color:#4a3208;border-radius:8px;padding:1px 4px;font-weight:900}
  .lvlBtn.locked{opacity:.4;cursor:default;font-size:13px}

  #toast{position:absolute;top:32%;left:50%;transform:translate(-50%,-50%) scale(.8);
    background:linear-gradient(180deg,#fff,#f4fbf4);border:2px solid #fff;color:#1f8f4d;
    font-size:17px;font-weight:900;padding:12px 20px;border-radius:16px;
    box-shadow:0 10px 30px rgba(20,50,30,.4);
    opacity:0;pointer-events:none;transition:all .25s;z-index:60;white-space:nowrap}
  #toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

  @media (max-height:700px){
    .panel{padding:13px 13px 10px}.panel h2{font-size:19px}
    .panel p{font-size:12px;margin:4px 0}
    .rules{font-size:11.4px;line-height:1.45}
    .panel .big{padding:10px;font-size:13.5px;margin-top:8px}
    .panel .quiet{padding:9px;font-size:12.5px}
    #lvlScroll{max-height:42vh}
    #starRow{font-size:28px}
  }
</style>
</head>
<body>
<div id="shell">
  <div class="bar">
    <a class="pill" href="index.html">&#9776; Menu</a>
    <div class="title" id="hTitle">BUBBLE SHOOTER</div>
    <button class="pill" id="bPause">&#10074;&#10074;</button>
  </div>
  <div class="strip">
    <div class="chip"><div class="k">SCORE</div><div class="v" id="stScore">0</div></div>
    <div class="chip"><div class="k">LEVEL</div><div class="v" id="stLevel">-</div></div>
    <div class="chip"><div class="k">BEST</div><div class="v" id="stBest">0</div></div>
  </div>

  <div id="stage">
    <canvas id="cv" width="480" height="680"></canvas>

    <div class="overlay show" id="selOv">
      <div class="panel">
        <h2>BUBBLE SHOOTER</h2>
        <p id="selStats"></p>
        <div id="shopRow"></div>
        <div id="lvlScroll"></div>
      </div>
    </div>

    <div class="overlay" id="winOv">
      <div class="panel">
        <h2 id="winTitle">LEVEL CLEARED</h2>
        <div id="starRow"></div>
        <p id="winStats"></p>
        <p id="winBest"></p>
        <div>
          <button class="big" id="btnNext">NEXT LEVEL</button>
          <button class="quiet" id="btnReplay">PLAY IT AGAIN</button>
          <button class="quiet" id="btnWinLevels">ALL LEVELS</button>
        </div>
      </div>
    </div>

    <div class="overlay" id="loseOv">
      <div class="panel">
        <h2 style="color:#e0642c;">OUT OF SHOTS</h2>
        <p id="loseStats"></p>
        <div>
          <button class="big" id="btnLoseRetry">TRY AGAIN</button>
          <button class="quiet" id="btnLoseLevels">ALL LEVELS</button>
        </div>
      </div>
    </div>

    <div class="overlay" id="ovl"><div class="panel" id="ovlCard"></div></div>

    <div id="toast"></div>
  </div>

  <div id="tools">
    <div class="tool" id="btnSwap"><div class="ti">&#8646;</div><div class="tl">SWAP</div></div>
    <div class="tool" id="btnRetry"><div class="ti">&#8635;</div><div class="tl">RETRY</div></div>
    <div class="tool" id="btnLevels"><div class="ti">&#9776;</div><div class="tl">ALL LEVELS</div></div>
  </div>
</div>

<script src="achievements.js"></script>
<script>
(function(){
'use strict';
/* ---------- constants ---------- */
var W=480, H=680, R=20, COLS=12;
var ROWH = R*1.732;
var TOP = 26;
var ROWS_MAX = 16;
var SHOOT_X = W/2, SHOOT_Y = 604;
var DEAD_Y = SHOOT_Y - 2*R - 14;
var BALL_SPEED = 15;
var MAX_BASE = 100;              /* levels in one run of the campaign */
var MAX_LEVEL = 200;             /* 101-200 = Hard Mode second run   */
var STONE = 6, GEM = 7, BOMB = 8, RAINBOW = 9, CHEST = 10;

function baseOf(L){ return ((L-1)%MAX_BASE)+1; }
function isHard(L){ return L>MAX_BASE; }
function lvlName(L){ return (isHard(L)?'Hard ':'Level ')+baseOf(L); }

/* light, base, dark, deep */
var PAL = [
  ['#ff9e9d','#E24B4A','#A32D2D','#6e1717'],
  ['#8fc6f5','#378ADD','#185FA5','#0a3a66'],
  ['#ffd58a','#EF9F27','#a86508','#6b3f03'],
  ['#a9f0d6','#35b98c','#0F6E56','#07422f'],
  ['#c6c1f7','#7F77DD','#534AB7','#2e2775'],
  ['#f7b6cd','#D4537E','#993556','#5c1c33'],
  ['#e3e3e3','#a8a8a8','#6e6e6e','#3a3a3a']
];

/* ---------- worlds (10 x 10 levels) ---------- */
var WORLDS = [
  null,
  { name:'Meadow',        icon:'\ud83c\udf3f', body:['#8fe0a0','#c6f2cd','#f2fdf1'], cv:['#2f9c5a','#1f7a45'], mech:'Learn the ropes' },
  { name:'Ocean',         icon:'\ud83c\udf0a', body:['#7fd4ef','#bfe9f8','#eef9fd'], cv:['#2b8fc4','#1c6c9b'], mech:'New: \ud83d\udc8e trapped gems' },
  { name:'Volcano',       icon:'\ud83c\udf0b', body:['#ffb98f','#ffd9c2','#fff2e9'], cv:['#d4622a','#a9431a'], mech:'New: \ud83d\udca3 bombs \u00b7 \ud83c\udf08 rainbows \u00b7 \u27162 multiplier' },
  { name:'Crystal Caves', icon:'\ud83d\udc9c', body:['#c9a9f0','#e0cef7','#f5eefd'], cv:['#7b4fbe','#5a3595'], mech:'New: \ud83d\udd17 cages \u00b7 \ud83d\udc80 cursed balls' },
  { name:'Galaxy',        icon:'\ud83c\udf0c', body:['#9fb0ef','#c7d1f6','#eef1fd'], cv:['#6274d6','#4a58ad'], mech:'New: \ud83d\udddd keys & chests' },
  { name:'Desert',        icon:'\ud83c\udfdc', body:['#f5cf8c','#ffe6bb','#fff7ea'], cv:['#c08a3e','#96682a'], mech:'New: \u2753 mystery shots' },
  { name:'Arctic',        icon:'\u2744\ufe0f', body:['#9fdcef','#c9ecf7','#eefaff'], cv:['#3f9ec4','#2b7899'], mech:'More colours' },
  { name:'Jungle',        icon:'\ud83c\udf34', body:['#94dc8f','#c4eebd','#eefbe9'], cv:['#3f9a44','#2b7330'], mech:'New: \ud83c\udf2b fog levels' },
  { name:'Neon City',     icon:'\ud83c\udf06', body:['#f0a3dd','#f7c8ec','#fdeef8'], cv:['#a8419b','#7d2c76'], mech:'Chaos combos' },
  { name:'Deep Space',    icon:'\ud83d\ude80', body:['#a3abe0','#c9cfef','#eff1fb'], cv:['#5a63c4','#454c9c'], mech:'The final stretch' }
];
function worldOf(L){ return Math.ceil(baseOf(L)/10); }

/* ---------- level definitions ----------
   No timers in the main campaign. Hard Mode (after level 100) re-runs
   all 100 levels tougher AND adds the timed row push.                 */
function D(pat,rows,colors,shots,goal,extra){
  var d={ pat:pat, rows:rows, colors:colors, shots:shots, goal:goal||'clear',
          gems:0, bombs:0, cages:0, stones:0, timed:false, drop:0,
          target:0, boss:false };
  if(extra) for(var k in extra) d[k]=extra[k];
  return d;
}
var LV = [ null,
  /* World 1 \u2014 Meadow: learn the game */
  D('full',    4,3,30), D('checker', 5,3,28), D('pillars', 5,3,26),
  D('zigzag',  5,3,26), D('triangle',6,4,28), D('sides',   6,4,24),
  D('diamond', 6,4,26), D('holes',   6,4,24), D('arch',    7,4,26),
  D('full',    7,4,30,'clear',{boss:true}),
  /* World 2 \u2014 Ocean: gems */
  D('checker', 5,4,24,'gems',{gems:2}), D('pillars',6,4,24,'gems',{gems:2}),
  D('full',    5,4,22),                 D('diamond',6,4,24,'gems',{gems:3}),
  D('zigzag',  6,5,26),                 D('sides',  6,5,24,'gems',{gems:3}),
  D('holes',   7,5,24,'clear',{stones:2}), D('arch', 7,5,26,'gems',{gems:3,stones:2}),
  D('triangle',7,5,26,'clear',{stones:3}),
  D('full',    8,5,30,'gems',{gems:4,stones:3,boss:true}),
  /* World 3 \u2014 Volcano: bombs + rainbow shots */
  D('checker', 6,4,22,'clear',{bombs:2}), D('pillars',6,5,22,'clear',{bombs:2}),
  D('full',    6,5,24,'clear',{bombs:3}), D('diamond',6,5,26,'score',{target:1500}),
  D('holes',   7,5,24,'gems',{gems:3,bombs:2}), D('zigzag',7,5,24,'clear',{bombs:3,stones:2}),
  D('sides',   7,5,26,'score',{target:1800}),   D('arch',  7,5,26,'gems',{gems:3,bombs:3}),
  D('triangle',8,5,26,'clear',{bombs:2,stones:3}),
  D('full',    8,6,30,'clear',{bombs:4,boss:true}),
  /* World 4 \u2014 Crystal Caves: cages */
  D('checker', 6,5,24,'clear',{cages:4}), D('pillars',7,5,24,'clear',{cages:5}),
  D('diamond', 7,5,26,'gems',{gems:3,cages:4}), D('full',7,5,26,'clear',{cages:6,stones:2}),
  D('holes',   7,6,24,'clear',{cages:5}), D('arch',7,6,26,'gems',{gems:3,cages:6,stones:2}),
  D('zigzag',  8,6,26,'clear',{cages:6}), D('sides',8,6,26,'clear',{cages:5,bombs:2}),
  D('triangle',8,6,28,'clear',{cages:8,stones:3}),
  D('full',    8,6,32,'gems',{gems:4,cages:8,boss:true}),
  /* World 5 \u2014 Galaxy: everything combined */
  D('checker', 6,5,26,'clear',{bombs:2,cages:3}), D('holes',7,5,24,'gems',{gems:3,bombs:2}),
  D('full',    7,6,26,'clear',{bombs:3,cages:4}), D('diamond',7,6,26,'gems',{gems:4,stones:2}),
  D('zigzag',  7,6,26,'score',{target:2000}),     D('holes',8,6,26,'clear',{bombs:3,stones:3}),
  D('zigzag',  8,6,28,'gems',{gems:4,cages:6}),   D('arch',8,6,26,'clear',{cages:5,bombs:2}),
  D('sides',   8,6,28,'score',{target:2400,stones:2}),
  D('full',    9,6,34,'clear',{bombs:4,cages:6,stones:3,boss:true})
];
/* Worlds 6-10 (levels 51-100): generated recipe, steadily tougher */
(function(){
  var pats=['checker','pillars','zigzag','triangle','diamond','sides','arch','holes'];
  for(var L=51;L<=100;L++){
    var i=L-51;
    if(L%10===0){
      LV[L]=D('full',9,6,32+Math.floor(i/12),'clear',
        { bombs:3+(L>=80?1:0), cages:5+(L>=70?2:0), stones:2+(L>=90?1:0), boss:true });
      continue;
    }
    var pat=pats[(i*5+L)%8];
    var rows=Math.min(9, 6+Math.floor(i/14));
    var colors=(i<20)?5:6;
    var shots=22+((i%3)*2);
    var goal='clear', x={};
    if(i%9===2){ goal='gems'; x.gems=3+Math.floor(i/16); }
    else if(i%9===5){ goal='score'; x.target=1800+i*40; }
    if(i%4===1) x.bombs=2+Math.floor(i/20);
    if(i%4===3) x.cages=4+Math.floor(i/12);
    if(i%5===4) x.stones=2+Math.floor(i/18);
    LV[L]=D(pat,rows,colors,shots,goal,x);
  }
})();
/* the def actually played: adds per-level extras, Hard Mode toughening */
function levelDef(L){
  var b=baseOf(L), w=worldOf(L);
  var base=LV[b], d={}, k;
  for(k in base) d[k]=base[k];
  /* deterministic extras by world */
  d.mult  = w>=3 && b%3===1;                       /* \u27162 multiplier ball  */
  d.bad   = w>=4 && b%4===2;                       /* \ud83d\udc80 cursed ball      */
  d.chest = w>=5 && b%4===0;                       /* \ud83d\udddd key + \ud83d\udce6 chest   */
  d.fog   = w>=8 && (b%10===3 || b%10===7);        /* \ud83c\udf2b fog level        */
  if(isHard(L)){
    d.rows   = Math.min(9, d.rows+1);
    d.colors = Math.min(6, d.colors+1);
    d.shots  = Math.max(14, Math.round(d.shots*0.85));
    d.timed  = true;
    d.drop   = Math.max(9, Math.round(26 - b*0.12));
    if(d.stones) d.stones = Math.min(8, d.stones+1);
    if(d.target) d.target = Math.round(d.target*1.2);
  }
  return d;
}

/* ---------- board shape patterns ---------- */
var PATTERNS = {
  full:    function(){ return true; },
  checker: function(r,c){ return (r+c)%2===0; },
  pillars: function(r,c){ return c%4!==3; },
  zigzag:  function(r,c){ return (r%4<2) ? (c%6<4) : (c%6>=2); },
  triangle:function(r,c,C,Rw){ return Math.abs(c-(C-1)/2) <= 1 + r*(C/(2*Rw)); },
  diamond: function(r,c,C,Rw){ var m=(Rw-1)/2; return Math.abs(c-(C-1)/2) <= (m-Math.abs(r-m))*(C/(Rw+1))+1.2; },
  sides:   function(r,c,C){ return c < C*0.34 || c > C*0.66-1; },
  arch:    function(r,c,C,Rw){ return !(r>=Rw-3 && Math.abs(c-(C-1)/2)<2.6); }
};

var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');

/* ---------- seeded rng (levels are reproducible) ---------- */
function mulberry32(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ---------- progress ---------- */
function loadProg(){
  var p=null;
  try { p = JSON.parse(localStorage.getItem('bubbleCampaign')||'null'); } catch(e){}
  if(!(p && p.unlocked)) p = { unlocked:1, stars:{}, best:{} };
  p.coins = p.coins||0;
  p.boostShots = !!p.boostShots;
  p.boostFire = !!p.boostFire;
  return p;
}
function saveProg(){
  try { localStorage.setItem('bubbleCampaign', JSON.stringify(prog)); } catch(e){}
}
var prog = loadProg();

/* current-level pointer: lets the player jump back into the level they were on */
var SAVE_KEY = 'gg-save-bubbleshooter';
function saveCurLevel(L){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify({level:L})); }catch(e){} }
function clearCurLevel(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }
function loadCurLevel(){
  try{ return JSON.parse(localStorage.getItem(SAVE_KEY)||'null'); }catch(e){ return null; }
}

/* ---------- state ---------- */
var state = 'select';            // 'select' | 'play' | 'won' | 'lost'
var level = 1, def = null;
var grid, cageG, markG, shift, score, shotsUsed, shotsLeft, gemsLeft;
var markPend = [];               /* special balls waiting to fire their effect */
var keyCollected=false, multUntil=0, coinsEarned=0;
var curC, nextC, ball;
var curMyst=false, nextMyst=false;
var fireArmed=false;             /* \ud83d\udd25 booster: next shot explodes */
var particles = [], fallers = [];
var aimAngle = -Math.PI/2, aiming = false;
var dropLeft;
var lastT = 0;

/* ---------- grid helpers ---------- */
function parity(r){ return (r+shift)%2; }
function colsAt(r){ return parity(r)===1 ? COLS-1 : COLS; }
function cx(r,c){ return c*2*R + R + parity(r)*R; }
function cy(r){ return TOP + r*ROWH; }
function nbrs(r,c){
  var o = parity(r)===1 ? [0,1] : [-1,0];
  var raw = [[r,c-1],[r,c+1],[r-1,c+o[0]],[r-1,c+o[1]],[r+1,c+o[0]],[r+1,c+o[1]]];
  var out=[];
  for(var i=0;i<raw.length;i++){
    var p=raw[i];
    if(p[0]>=0 && p[0]<ROWS_MAX && p[1]>=0 && p[1]<colsAt(p[0])) out.push(p);
  }
  return out;
}
function emptyGrid(){
  shift = 0;
  grid = []; cageG = []; markG = [];
  for(var r=0;r<ROWS_MAX;r++){
    grid[r]=[]; cageG[r]=[]; markG[r]=[];
    for(var c=0;c<colsAt(r);c++){ grid[r][c]=-1; cageG[r][c]=false; markG[r][c]=null; }
  }
}
function coloredLeft(){
  var n=0;
  for(var r=0;r<ROWS_MAX;r++)
    for(var c=0;c<colsAt(r);c++)
      if(grid[r][c]>=0 && grid[r][c]<STONE) n++;
  return n;
}
function colorsOnBoard(){
  var s={};
  for(var r=0;r<ROWS_MAX;r++)
    for(var c=0;c<colsAt(r);c++)
      if(grid[r][c]>=0 && grid[r][c]<STONE) s[grid[r][c]]=1;
  var a=Object.keys(s).map(Number);
  return a.length?a:[0,1,2];
}
function pickColor(){
  /* rainbow shots appear from World 3 onward (always in Hard Mode) */
  if((worldOf(level)>=3 || isHard(level)) && Math.random()<0.10) return RAINBOW;
  var a=colorsOnBoard();
  return a[Math.floor(Math.random()*a.length)];
}
function mystRoll(){
  /* \u2753 mystery shots from World 6 onward (always in Hard Mode) */
  return (worldOf(level)>=6 || isHard(level)) && Math.random()<0.12;
}
function lowestY(){
  var y=-1;
  for(var r=0;r<ROWS_MAX;r++)
    for(var c=0;c<colsAt(r);c++)
      if(grid[r][c]>=0) y=Math.max(y, cy(r));
  return y;
}
function lowestRow(){
  var lr=-1;
  for(var r=0;r<ROWS_MAX;r++)
    for(var c=0;c<colsAt(r);c++)
      if(grid[r][c]>=0){ lr=r; break; }
  /* need the max, redo properly */
  lr=-1;
  for(var r2=0;r2<ROWS_MAX;r2++)
    for(var c2=0;c2<colsAt(r2);c2++)
      if(grid[r2][c2]>=0) lr=Math.max(lr,r2);
  return lr;
}

/* ---------- level setup ---------- */
function startLevel(L){
  level = L;
  def = levelDef(L);
  applyTheme(worldOf(L));
  var rnd = mulberry32(L*7919 + 13);
  emptyGrid();
  var r,c;
  var mask = PATTERNS[def.pat];
  for(r=0;r<def.rows;r++)
    for(c=0;c<colsAt(r);c++){
      var on = def.pat==='holes' ? rnd()<0.8 : mask(r,c,colsAt(r),def.rows);
      if(on) grid[r][c] = Math.floor(rnd()*def.colors);
    }
  /* place specials on existing colored cells (never row 0, so they can drop) */
  function place(val, count, minRow){
    var placed=0, guard=0;
    while(placed<count && guard++<400){
      var rr = minRow + Math.floor(rnd()*(def.rows-minRow));
      var cc = Math.floor(rnd()*colsAt(rr));
      if(grid[rr][cc]>=0 && grid[rr][cc]<STONE && !cageG[rr][cc] && !markG[rr][cc]){
        if(val==='cage'){ cageG[rr][cc]=true; }
        else grid[rr][cc]=val;
        placed++;
      }
    }
    return placed;
  }
  function mark(type){
    var guard=0;
    while(guard++<400){
      var rr = 1 + Math.floor(rnd()*(def.rows-1));
      var cc = Math.floor(rnd()*colsAt(rr));
      if(grid[rr][cc]>=0 && grid[rr][cc]<STONE && !cageG[rr][cc] && !markG[rr][cc]){
        markG[rr][cc]=type;
        return true;
      }
    }
    return false;
  }
  gemsLeft = place(GEM, def.gems, Math.max(1,def.rows-3));
  place(BOMB, def.bombs, 1);
  place(STONE, def.stones, 1);
  place('cage', def.cages, 0);
  mark('star');                                   /* \u2b50 one per level */
  if(def.mult) mark('mult');                      /* \u27162 */
  if(def.bad)  mark('bad');                       /* \ud83d\udc80 */
  keyCollected=false;
  if(def.chest && mark('key'))                    /* \ud83d\udddd + \ud83d\udce6 */
    place(CHEST, 1, Math.max(1,def.rows-3));

  score=0; shotsUsed=0; markPend=[]; multUntil=0; coinsEarned=0;
  shotsLeft = def.shots;
  ball=null; particles=[]; fallers=[];
  dropLeft = def.drop || 0;
  curC = pickColor(); nextC = pickColor();
  curMyst = mystRoll(); nextMyst = mystRoll();
  /* \ud83e\ude99 boosters bought in the shop */
  fireArmed=false;
  var boosterMsg=null;
  if(prog.boostShots){ shotsLeft+=10; prog.boostShots=false; boosterMsg='\ud83e\ude99 +10 booster shots!'; }
  if(prog.boostFire){ fireArmed=true; prog.boostFire=false; boosterMsg='\ud83d\udd25 Fireball loaded \u2014 next shot explodes!'; }
  saveProg();
  state='play';
  saveCurLevel(L);
  document.getElementById('selOv').classList.remove('show');
  document.getElementById('winOv').classList.remove('show');
  document.getElementById('loseOv').classList.remove('show');
  hud();
  toast(goalToast());
  var intro = mechIntro(L);
  if(intro) setTimeout(function(){ toast(intro); }, 1700);
  if(boosterMsg) setTimeout(function(){ toast(boosterMsg); }, intro?3400:1700);
  lastT = performance.now();
}
function mechIntro(L){
  if(L===1)   return '\u2b50 Pop or drop the star ball for a bonus!';
  if(L===11)  return '\ud83d\udc8e Drop the gems to free them!';
  if(L===21)  return '\ud83d\udca3 Land next to a bomb to blow it!';
  if(L===22)  return '\u27162 ball doubles points for 30s!';
  if(L===31)  return '\ud83d\udd17 Caged bubbles need 2 matches!';
  if(L===34)  return '\ud83d\udc80 Beware the cursed ball\u2026';
  if(L===44)  return '\ud83d\udddd Grab the key BEFORE the chest!';
  if(L===51)  return '\ud83c\udfdc Halfway \u2014 watch for \u2753 mystery shots!';
  if(L===73)  return '\ud83c\udf2b Fog! Clear bubbles to reveal the top!';
  if(L===101) return '\ud83d\udd25 Hard Mode: rows push on a timer!';
  return null;
}
function goalToast(){
  var pre = def.boss ? '\ud83d\udc51 Boss level \u2014 ' : (isHard(level) ? '\ud83d\udd25 ' : '');
  if(def.goal==='gems')  return pre+'\ud83d\udc8e Free '+def.gems+' gems!';
  if(def.goal==='score') return pre+'\ud83c\udfaf Score '+def.target+' points!';
  return pre+'Clear the board!';
}
function applyTheme(w){
  var t = WORLDS[w];
  /* a bright wash rather than the old radial into near-black */
  document.body.style.background =
    'linear-gradient(162deg, '+t.body[0]+' 0%, '+t.body[1]+' 46%, '+t.body[2]+' 100%)';
  document.getElementById('hTitle').textContent = t.icon+' '+t.name;
}

/* ---------- push row ---------- */
function pushRow(){
  var last = grid[ROWS_MAX-1];
  for(var c=0;c<last.length;c++) if(last[c]>=0){ loseLevel('The bubbles crossed the line!'); return; }
  grid.pop(); cageG.pop(); markG.pop();
  shift++;
  var row=[], crow=[], mrow=[];
  for(var c2=0;c2<colsAt(0);c2++){ row.push(Math.floor(Math.random()*def.colors)); crow.push(false); mrow.push(null); }
  grid.unshift(row); cageG.unshift(crow); markG.unshift(mrow);
  if(lowestY()+R > DEAD_Y) loseLevel('The bubbles crossed the line!');
}

/* ---------- flood ---------- */
function flood(r,c,sameColor){
  var col=grid[r][c], seen={}, st=[[r,c]], out=[];
  while(st.length){
    var p=st.pop(), k=p[0]+','+p[1];
    if(seen[k]) continue;
    seen[k]=1;
    var g=grid[p[0]][p[1]];
    if(g<0) continue;
    if(sameColor && g!==col) continue;
    out.push(p);
    var nb=nbrs(p[0],p[1]);
    for(var i=0;i<nb.length;i++) st.push(nb[i]);
  }
  return out;
}

/* ---------- fx ---------- */
function fxIdx(ci){ return ci===GEM ? 3 : ci===BOMB ? 6 : ci===CHEST ? 2 : Math.min(ci,6); }
function popFx(x,y,ci){
  for(var i=0;i<9;i++){
    var a=Math.random()*Math.PI*2, sp=1.5+Math.random()*3.5;
    particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1,r:2.5+Math.random()*3.5,ci:fxIdx(ci),life:1});
  }
}
function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h=setTimeout(function(){ t.classList.remove('show'); }, 1700);
}

/* ---------- removing cells ---------- */
function removeCell(r,c,viaExplosion){
  var v = grid[r][c];
  if(v<0) return 0;
  var pts = 0;
  if(v===GEM){
    fallers.push({x:cx(r,c), y:cy(r), vx:(Math.random()-.5)*2, vy:-2, ci:GEM});
    gemsLeft--; pts=60;
  } else if(v===STONE){
    popFx(cx(r,c),cy(r),STONE); pts=20;
  } else if(v===BOMB){
    popFx(cx(r,c),cy(r),BOMB); pts=30;
  } else if(v===CHEST){
    fallers.push({x:cx(r,c), y:cy(r), vx:(Math.random()-.5)*2, vy:-2, ci:CHEST});
    pts=20;
    markPend.push({type:'chest', col:-1, r:r, c:c});
  } else {
    popFx(cx(r,c),cy(r),v); pts = viaExplosion?15:10;
    if(markG[r][c]) markPend.push({type:markG[r][c], col:v, r:r, c:c});
  }
  grid[r][c]=-1; cageG[r][c]=false; markG[r][c]=null;
  return pts;
}

/* ---------- special ball effects ---------- */
function starRing(r,c,cap){
  var out=[], seen={}, i, j;
  var first=nbrs(r,c), second=[];
  for(i=0;i<first.length;i++){
    var p=first[i], k=p[0]+','+p[1];
    if(seen[k]) continue; seen[k]=1;
    if(grid[p[0]][p[1]]>=0 && out.length<cap) out.push(p);
    var nb2=nbrs(p[0],p[1]);
    for(j=0;j<nb2.length;j++) second.push(nb2[j]);
  }
  for(i=0;i<second.length && out.length<cap;i++){
    var p2=second[i], k2=p2[0]+','+p2[1];
    if(seen[k2] || (p2[0]===r && p2[1]===c)) continue; seen[k2]=1;
    if(grid[p2[0]][p2[1]]>=0) out.push(p2);
  }
  return out;
}
function processMarks(){
  var gained=0, i;
  while(markPend.length){
    var m=markPend.shift();
    if(m.type==='star'){
      prog.coins+=3; coinsEarned+=3; saveProg();
      var roll=Math.random();
      if(roll<0.75){                       /* 75%: +5 shots */
        if(def.shots) shotsLeft+=5;
        toast('\u2b50 +5 shots!');
      } else if(roll<0.80){                /* 5%: wipe every ball of that colour */
        toast('\u2b50 Colour wipe!');
        for(var r=0;r<ROWS_MAX;r++)
          for(var c=0;c<colsAt(r);c++)
            if(grid[r][c]===m.col) gained+=removeCell(r,c,true);
      } else {                             /* 20%: blast the 8 surrounding balls */
        toast('\u2b50 Star blast!');
        var ring=starRing(m.r,m.c,8);
        for(i=0;i<ring.length;i++) gained+=removeCell(ring[i][0],ring[i][1],true);
      }
    } else if(m.type==='mult'){            /* \u27162 double points for 30s */
      multUntil = Date.now()+30000;
      toast('\u27162 Double points for 30s!');
    } else if(m.type==='bad'){             /* \ud83d\udc80 cursed */
      if(Math.random()<0.5 && def.shots){
        shotsLeft = Math.max(1, shotsLeft-3);
        toast('\ud83d\udc80 Cursed! Lost 3 shots!');
      } else {
        toast('\ud83d\udc80 Cursed! 3 bubbles turn to stone!');
        var cand=[];
        for(var r2=0;r2<ROWS_MAX;r2++)
          for(var c2=0;c2<colsAt(r2);c2++)
            if(grid[r2][c2]>=0 && grid[r2][c2]<STONE && !markG[r2][c2]) cand.push([r2,c2]);
        for(i=0;i<3 && cand.length;i++){
          var pick=cand.splice(Math.floor(Math.random()*cand.length),1)[0];
          grid[pick[0]][pick[1]]=STONE;
          cageG[pick[0]][pick[1]]=false;
          popFx(cx(pick[0],pick[1]), cy(pick[0]), STONE);
        }
      }
    } else if(m.type==='key'){             /* \ud83d\udddd */
      keyCollected=true;
      toast('\ud83d\udddd Key collected!');
    } else if(m.type==='chest'){           /* \ud83d\udce6 */
      if(keyCollected){
        gained+=500;
        prog.coins+=25; coinsEarned+=25; saveProg();
        toast('\ud83d\udce6 Chest opened! +500 \u00b7 +25\ud83e\ude99');
      } else {
        toast('\ud83d\udce6 The chest was locked\u2026');
      }
    }
  }
  return gained;
}

/* ---------- bombs ---------- */
function explode(startBombs){
  var gained=0, queue=startBombs.slice(), done={};
  while(queue.length){
    var b=queue.shift(), bk=b[0]+','+b[1];
    if(done[bk]) continue;
    done[bk]=1;
    grid[b[0]][b[1]] = -1;
    popFx(cx(b[0],b[1]), cy(b[0]), BOMB);
    gained += 30;
    /* blast radius: neighbours + their neighbours */
    var zone={}, nb1=nbrs(b[0],b[1]), i, j;
    for(i=0;i<nb1.length;i++){
      zone[nb1[i][0]+','+nb1[i][1]] = nb1[i];
      var nb2=nbrs(nb1[i][0],nb1[i][1]);
      for(j=0;j<nb2.length;j++) zone[nb2[j][0]+','+nb2[j][1]] = nb2[j];
    }
    for(var k in zone){
      var p=zone[k];
      if(grid[p[0]][p[1]]===BOMB && !done[p[0]+','+p[1]]) queue.push(p);
      else gained += removeCell(p[0],p[1],true);
    }
  }
  if(gained) toast('\ud83d\udca5 +'+gained);
  return gained;
}
/* \ud83d\udd25 fireball booster blast, centred on the landed shot */
function fireBlast(r,c){
  var gained=removeCell(r,c,true);
  var zone={}, nb1=nbrs(r,c), i, j, bombs=[];
  for(i=0;i<nb1.length;i++){
    zone[nb1[i][0]+','+nb1[i][1]] = nb1[i];
    var nb2=nbrs(nb1[i][0],nb1[i][1]);
    for(j=0;j<nb2.length;j++) zone[nb2[j][0]+','+nb2[j][1]] = nb2[j];
  }
  for(var k in zone){
    var p=zone[k];
    if(grid[p[0]][p[1]]===BOMB) bombs.push(p);
    else gained += removeCell(p[0],p[1],true);
  }
  if(bombs.length) gained += explode(bombs);
  return gained;
}

/* ---------- rainbow ---------- */
function bestNeighborColor(r,c){
  var nb=nbrs(r,c), bestCol=-1, bestN=0, i;
  for(i=0;i<nb.length;i++){
    var v=grid[nb[i][0]][nb[i][1]];
    if(v<0 || v>=STONE) continue;
    var n=flood(nb[i][0],nb[i][1],true).length;
    if(n>bestN){ bestN=n; bestCol=v; }
  }
  if(bestCol>=0) return bestCol;
  var a=colorsOnBoard();
  return a[Math.floor(Math.random()*a.length)];
}

/* if a colour has been wiped off the board, the shooter must not offer it */
function ensureShooterColors(){
  var a=colorsOnBoard(), s={}, i;
  for(i=0;i<a.length;i++) s[a[i]]=1;
  if(curC!==RAINBOW && !s[curC])  curC  = a[Math.floor(Math.random()*a.length)];
  if(nextC!==RAINBOW && !s[nextC]) nextC = a[Math.floor(Math.random()*a.length)];
}

/* anything not connected to the top row falls; returns points gained */
function dropUnanchored(){
  var anchored={}, i, gained=0, dropped=0;
  for(var c0=0;c0<colsAt(0);c0++)
    if(grid[0][c0]>=0){
      var f=flood(0,c0,false);
      for(i=0;i<f.length;i++) anchored[f[i][0]+','+f[i][1]]=1;
    }
  for(var r2=0;r2<ROWS_MAX;r2++)
    for(var c2=0;c2<colsAt(r2);c2++)
      if(grid[r2][c2]>=0 && !anchored[r2+','+c2]){
        var v=grid[r2][c2];
        if(v===GEM){ gemsLeft--; gained+=60; }
        else if(v===CHEST){ gained+=20; markPend.push({type:'chest', col:-1, r:r2, c:c2}); }
        else if(v<STONE){
          gained+=20; dropped++;
          if(markG[r2][c2]) markPend.push({type:markG[r2][c2], col:v, r:r2, c:c2});
        }
        else gained+=10;
        fallers.push({x:cx(r2,c2), y:cy(r2), vx:(Math.random()-.5)*2, vy:-1.5, ci:v});
        grid[r2][c2]=-1; cageG[r2][c2]=false; markG[r2][c2]=null;
      }
  if(dropped>=4) toast('+'+(dropped*20)+' drop bonus!');
  return gained;
}

/* ---------- settle ---------- */
function settle(r,c){
  var wasFire = !!ball.fire;
  var col = ball.c===RAINBOW ? bestNeighborColor(r,c) : ball.c;
  grid[r][c]=col; cageG[r][c]=false; markG[r][c]=null;
  ball=null;
  var gained=0, i;

  if(wasFire){
    toast('\ud83d\udd25 Fireball!');
    gained += fireBlast(r,c);
  } else {
    /* bombs: landing beside one detonates it */
    var nb=nbrs(r,c), bombs=[];
    for(i=0;i<nb.length;i++)
      if(grid[nb[i][0]][nb[i][1]]===BOMB) bombs.push(nb[i]);
    if(bombs.length) gained += explode(bombs);

    /* colour match (our bubble may have been destroyed by the blast) */
    if(grid[r][c]===col){
      var m=flood(r,c,true);
      if(m.length>=3){
        for(i=0;i<m.length;i++){
          var p=m[i];
          if(cageG[p[0]][p[1]]){
            /* cage absorbs this match: break the cage, bubble stays */
            cageG[p[0]][p[1]]=false;
            popFx(cx(p[0],p[1]), cy(p[0]), STONE);
            gained += 15;
          } else {
            gained += removeCell(p[0],p[1],false);
          }
        }
      }
    }
  }

  /* drop everything no longer anchored to the top row */
  gained += dropUnanchored();

  /* special balls popped or dropped fire their effects now */
  if(markPend.length){
    gained += processMarks();
    gained += dropUnanchored();   /* effects may have cut more loose */
  }

  if(gained){
    var mul = (Date.now()<multUntil) ? 2 : 1;
    score += gained*mul;
    hud();
  }
  if(state!=='play') return;
  ensureShooterColors();

  /* ----- win checks ----- */
  if(coloredLeft()===0){
    /* free any stragglers hanging by stones/gems, then win */
    for(var r3=0;r3<ROWS_MAX;r3++)
      for(var c3=0;c3<colsAt(r3);c3++)
        if(grid[r3][c3]>=0) removeCell(r3,c3,true);
    winLevel(); return;
  }
  if(def.goal==='gems' && gemsLeft<=0){ winLevel(); return; }
  if(def.goal==='score' && score>=def.target){ winLevel(); return; }

  /* ----- out of shots? ----- */
  if(def.shots && shotsLeft<=0){ loseLevel('Out of bubbles!'); return; }
}
function snapBall(){
  var best=null, bd=1e9;
  for(var r=0;r<ROWS_MAX;r++)
    for(var c=0;c<colsAt(r);c++){
      if(grid[r][c]>=0) continue;
      var ok = r===0, nb=nbrs(r,c);
      for(var i=0;i<nb.length && !ok;i++)
        if(grid[nb[i][0]][nb[i][1]]>=0) ok=true;
      if(!ok) continue;
      var dx=cx(r,c)-ball.x, dy=cy(r)-ball.y, d=dx*dx+dy*dy;
      if(d<bd){ bd=d; best=[r,c]; }
    }
  if(best){
    if(cy(best[0])+R > DEAD_Y){ ball=null; loseLevel('The bubbles crossed the line!'); return; }
    settle(best[0],best[1]);
  } else ball=null;
}

/* ---------- win / lose ---------- */
function starsEarned(){
  if(!def.shots) return 2;
  var f = shotsLeft/def.shots;
  return f>=0.35 ? 3 : f>=0.12 ? 2 : 1;
}
function winLevel(){
  state='won';
  clearCurLevel();
  var stars = starsEarned();
  if(window.GGA){
    if(stars===3) GGA.award('bub_3star');
    if(level>=10) GGA.award('bub_l10');
    GGA.haptic('success');
  }
  score += 300 + stars*100 + (def.boss?250:0) + (isHard(level)?150:0);
  var coinWin = stars + (def.boss?10:0);
  prog.coins += coinWin; coinsEarned += coinWin;
  hud();
  var prevStars = prog.stars[level]||0;
  var prevBest = prog.best[level]||0;
  var isBest = score>prevBest;
  if(stars>prevStars) prog.stars[level]=stars;
  if(isBest) prog.best[level]=score;
  if(level<MAX_LEVEL) prog.unlocked = Math.max(prog.unlocked, level+1);
  saveProg();
  document.getElementById('winTitle').textContent =
    level===MAX_BASE ? '\ud83c\udfc6 Campaign Complete!' :
    (def.boss?'\ud83d\udc51 Boss beaten! ':'')+lvlName(level)+' Cleared!';
  var sr='';
  for(var i=1;i<=3;i++) sr += '<span class="'+(i<=stars?'on':'off')+'">\u2605</span>';
  document.getElementById('starRow').innerHTML = sr;
  document.getElementById('winStats').textContent =
    'Score '+score+'  \u00b7  '+shotsUsed+' shots' +
    (def.shots ? '  \u00b7  '+shotsLeft+' spare' : '') +
    '  \u00b7  +'+coinsEarned+'\ud83e\ude99';
  document.getElementById('winBest').textContent =
    level===MAX_BASE ? '\ud83d\udd25 Hard Mode unlocked \u2014 all 100 levels, tougher, with timed rows!' :
    (isBest ? '\ud83c\udf89 New level best!' : 'Level best: '+prevBest);
  document.getElementById('btnNext').style.display = level<MAX_LEVEL ? 'inline-block' : 'none';
  document.getElementById('winOv').classList.add('show');
}
function loseLevel(why){
  if(state!=='play') return;
  state='lost';
  document.getElementById('loseStats').textContent =
    lvlName(level)+'  \u00b7  Score '+score+'  \u00b7  '+(why||'');
  document.getElementById('loseOv').classList.add('show');
}

/* ---------- level select + shop ---------- */
function totalStars(){
  var n=0;
  for(var k in prog.stars) n+=prog.stars[k];
  return n;
}
function totalBest(){
  var n=0;
  for(var k in prog.best) n+=prog.best[k];
  return n;
}
function lvlBadge(L){
  var d=levelDef(L);
  if(d.boss) return '\ud83d\udc51';
  if(d.goal==='gems') return '\ud83d\udc8e';
  if(d.goal==='score') return '\ud83c\udfaf';
  if(d.fog) return '\ud83c\udf2b';
  if(d.chest) return '\ud83d\udddd';
  if(d.bombs) return '\ud83d\udca3';
  if(d.cages) return '\ud83d\udd17';
  return null;
}
function buildShop(){
  var row=document.getElementById('shopRow');
  row.innerHTML='';
  function item(label, cost, owned, buy){
    var b=document.createElement('button');
    b.className='shopBtn'+(owned?' owned':(prog.coins<cost?' poor':''));
    b.textContent = owned ? '\u2713 '+label+' queued' : label+' \u2014 '+cost+'\ud83e\ude99';
    if(!owned && prog.coins>=cost) b.addEventListener('click', buy);
    row.appendChild(b);
  }
  item('+10 shots next level', 30, prog.boostShots, function(){
    prog.coins-=30; prog.boostShots=true; saveProg(); showSelect();
  });
  item('\ud83d\udd25 Fireball next level', 50, prog.boostFire, function(){
    prog.coins-=50; prog.boostFire=true; saveProg(); showSelect();
  });
}
function buildWorldRows(scroll, offset){
  for(var w=1;w<=10;w++){
    var head=document.createElement('div');
    head.className='worldHead';
    head.innerHTML = '<span>'+WORLDS[w].icon+' World '+w+' \u00b7 '+WORLDS[w].name+'</span>'+
      '<span class="bar"></span><span class="mech">'+WORLDS[w].mech+'</span>';
    scroll.appendChild(head);
    var gridEl=document.createElement('div');
    gridEl.className='lvlGrid';
    for(var L=offset+(w-1)*10+1; L<=offset+w*10; L++){
      var b=document.createElement('button');
      var locked = L>prog.unlocked;
      b.className='lvlBtn'+(locked?' locked':'')+(isHard(L)?' hard':'');
      var st = prog.stars[L]||0, sr='';
      for(var i=1;i<=3;i++) sr += '<span class="'+(i<=st?'on':'off')+'">\u2605</span>';
      var badge = lvlBadge(L);
      b.innerHTML = (locked?'\ud83d\udd12':baseOf(L)) + '<span class="st">'+sr+'</span>' +
        (badge && !locked ? '<span class="tbadge">'+badge+'</span>' : '');
      if(!locked){
        (function(lv){ b.addEventListener('click', function(){ startLevel(lv); }); })(L);
      }
      gridEl.appendChild(b);
    }
    scroll.appendChild(gridEl);
  }
}
function showSelect(){
  state='select';
  document.getElementById('winOv').classList.remove('show');
  document.getElementById('loseOv').classList.remove('show');
  var maxStars = (prog.unlocked>MAX_BASE ? MAX_LEVEL : MAX_BASE)*3;
  document.getElementById('selStats').textContent =
    '\u2605 '+totalStars()+' / '+maxStars+'   \u00b7   \ud83e\ude99 '+prog.coins+'   \u00b7   Total score: '+totalBest();
  buildShop();
  var scroll = document.getElementById('lvlScroll');
  scroll.innerHTML='';
  buildWorldRows(scroll, 0);
  if(prog.unlocked>MAX_BASE){
    var hh=document.createElement('div');
    hh.className='hardHead';
    hh.textContent='\ud83d\udd25 HARD MODE \u2014 timed rows, tougher boards \ud83d\udd25';
    scroll.appendChild(hh);
    buildWorldRows(scroll, MAX_BASE);
  }
  document.getElementById('selOv').classList.add('show');
  applyTheme(worldOf(Math.min(prog.unlocked,MAX_LEVEL)));
  document.getElementById('hTitle').textContent='BUBBLE SHOOTER';
  hud();
}

function hud(){
  document.getElementById('stScore').textContent = score||0;
  document.getElementById('stLevel').textContent =
    state==='select' ? '-' : baseOf(level)+(isHard(level)?'\ud83d\udd25':'');
  document.getElementById('stBest').textContent =
    state==='select' ? totalBest() : (prog.best[level]||0);
}

/* ---------- drawing ---------- */
function drawBubble(x,y,ci,r){
  if(ci===GEM){ drawGem(x,y,r); return; }
  if(ci===BOMB){ drawBomb(x,y,r); return; }
  if(ci===RAINBOW){ drawRainbow(x,y,r); return; }
  if(ci===CHEST){ drawChest(x,y,r); return; }
  var p=PAL[ci];
  var g=ctx.createRadialGradient(x-r*0.35, y-r*0.42, r*0.12, x, y, r);
  g.addColorStop(0, p[0]);
  g.addColorStop(0.45, p[1]);
  g.addColorStop(0.85, p[2]);
  g.addColorStop(1, p[3]);
  ctx.beginPath();
  ctx.arc(x,y,r,0,7);
  ctx.fillStyle=g;
  ctx.fill();
  if(ci===STONE){
    ctx.strokeStyle='rgba(0,0,0,0.3)';
    ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.moveTo(x-r*0.5,y-r*0.15); ctx.lineTo(x-r*0.1,y+r*0.05); ctx.lineTo(x+r*0.15,y-r*0.3);
    ctx.moveTo(x-r*0.05,y+r*0.5); ctx.lineTo(x+r*0.2,y+r*0.2); ctx.lineTo(x+r*0.55,y+r*0.35);
    ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.ellipse(x-r*0.38, y-r*0.45, r*0.24, r*0.15, -0.6, 0, 7);
    ctx.fillStyle='rgba(255,255,255,0.75)';
    ctx.fill();
  }
  ctx.beginPath();
  ctx.arc(x,y,r,0.35*Math.PI,0.85*Math.PI);
  ctx.strokeStyle='rgba(0,0,0,0.22)';
  ctx.lineWidth=r*0.14;
  ctx.stroke();
}
function drawGem(x,y,r){
  ctx.save();
  var g=ctx.createLinearGradient(x-r,y-r,x+r,y+r);
  g.addColorStop(0,'#c8fff6');
  g.addColorStop(0.5,'#3fd9c4');
  g.addColorStop(1,'#0e7f70');
  ctx.beginPath();
  ctx.moveTo(x,y-r*0.95);
  ctx.lineTo(x+r*0.85,y-r*0.15);
  ctx.lineTo(x,y+r*0.95);
  ctx.lineTo(x-r*0.85,y-r*0.15);
  ctx.closePath();
  ctx.fillStyle=g;
  ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.8)';
  ctx.lineWidth=1.5;
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x-r*0.4,y-r*0.15); ctx.lineTo(x+r*0.4,y-r*0.15);
  ctx.moveTo(x,y-r*0.95); ctx.lineTo(x,y+r*0.95);
  ctx.strokeStyle='rgba(255,255,255,0.45)';
  ctx.lineWidth=1;
  ctx.stroke();
  ctx.restore();
}
function drawBomb(x,y,r){
  var g=ctx.createRadialGradient(x-r*0.3,y-r*0.35,r*0.1,x,y,r);
  g.addColorStop(0,'#5a5a66');
  g.addColorStop(0.6,'#26262e');
  g.addColorStop(1,'#0c0c12');
  ctx.beginPath();
  ctx.arc(x,y,r*0.92,0,7);
  ctx.fillStyle=g;
  ctx.fill();
  ctx.strokeStyle='#c8a866';
  ctx.lineWidth=2.5;
  ctx.beginPath();
  ctx.moveTo(x+r*0.25,y-r*0.75);
  ctx.quadraticCurveTo(x+r*0.6,y-r*1.05,x+r*0.42,y-r*1.25);
  ctx.stroke();
  ctx.fillStyle = (Math.floor(Date.now()/180)%2===0)?'#ffd75e':'#ff8d4d';
  ctx.beginPath();
  ctx.arc(x+r*0.42,y-r*1.25,3.4,0,7);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(x-r*0.3, y-r*0.38, r*0.2, r*0.12, -0.6, 0, 7);
  ctx.fillStyle='rgba(255,255,255,0.35)';
  ctx.fill();
}
function drawChest(x,y,r){
  ctx.fillStyle='#8a5a2a';
  ctx.strokeStyle='#5d3a17';
  ctx.lineWidth=2;
  var w=r*1.7, h=r*1.35;
  ctx.beginPath();
  ctx.rect(x-w/2, y-h/2, w, h);
  ctx.fill(); ctx.stroke();
  /* lid line */
  ctx.beginPath();
  ctx.moveTo(x-w/2, y-h/2+h*0.35);
  ctx.lineTo(x+w/2, y-h/2+h*0.35);
  ctx.stroke();
  /* bands */
  ctx.strokeStyle='#c8a866';
  ctx.lineWidth=2.5;
  ctx.beginPath();
  ctx.moveTo(x-w*0.28, y-h/2); ctx.lineTo(x-w*0.28, y+h/2);
  ctx.moveTo(x+w*0.28, y-h/2); ctx.lineTo(x+w*0.28, y+h/2);
  ctx.stroke();
  /* lock */
  ctx.fillStyle='#ffd75e';
  ctx.beginPath();
  ctx.arc(x, y-h/2+h*0.35, r*0.24, 0, 7);
  ctx.fill();
  ctx.fillStyle='#5d3a17';
  ctx.fillRect(x-1.5, y-h/2+h*0.35-1, 3, r*0.22);
}
function drawRainbow(x,y,r){
  var cols=[0,1,2,3];
  for(var i=0;i<4;i++){
    ctx.beginPath();
    ctx.moveTo(x,y);
    ctx.arc(x,y,r,i*Math.PI/2, (i+1)*Math.PI/2);
    ctx.closePath();
    ctx.fillStyle=PAL[cols[i]][1];
    ctx.fill();
  }
  ctx.beginPath();
  ctx.arc(x,y,r,0,7);
  ctx.strokeStyle='rgba(255,255,255,0.8)';
  ctx.lineWidth=2;
  ctx.stroke();
  ctx.fillStyle='#fff';
  ctx.font='700 '+Math.round(r)+'px -apple-system,sans-serif';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText('\u2605',x,y+1);
  ctx.textBaseline='alphabetic';
}
function drawMystery(x,y,r){
  var g=ctx.createRadialGradient(x-r*0.3,y-r*0.35,r*0.1,x,y,r);
  g.addColorStop(0,'#9a9aad');
  g.addColorStop(0.6,'#5c5c72');
  g.addColorStop(1,'#33334a');
  ctx.beginPath();
  ctx.arc(x,y,r,0,7);
  ctx.fillStyle=g;
  ctx.fill();
  ctx.fillStyle='#fff';
  ctx.font='800 '+Math.round(r*1.1)+'px -apple-system,sans-serif';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText('?',x,y+1);
  ctx.textBaseline='alphabetic';
}
function drawStarMark(x,y,r){
  var pulse = 0.6 + 0.4*Math.abs(Math.sin(Date.now()/300));
  ctx.globalAlpha = pulse;
  ctx.beginPath();
  ctx.arc(x,y,r*0.99,0,7);
  ctx.strokeStyle='#ffd75e';
  ctx.lineWidth=3;
  ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.fillStyle='#fff';
  ctx.strokeStyle='rgba(0,0,0,0.5)';
  ctx.lineWidth=3;
  ctx.font='700 '+Math.round(r*1.05)+'px -apple-system,sans-serif';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.strokeText('\u2605',x,y+1);
  ctx.fillText('\u2605',x,y+1);
  ctx.textBaseline='alphabetic';
}
function drawMark(x,y,r,type){
  if(type==='star'){ drawStarMark(x,y,r); return; }
  var col = type==='bad' ? '#d0d0e0' : type==='mult' ? '#ff9d5e' : '#ffd75e';
  var pulse = 0.55 + 0.35*Math.abs(Math.sin(Date.now()/300));
  ctx.globalAlpha = pulse;
  ctx.beginPath();
  ctx.arc(x,y,r*0.99,0,7);
  ctx.strokeStyle=col;
  ctx.lineWidth=3;
  ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  if(type==='mult'){
    ctx.fillStyle='#fff';
    ctx.strokeStyle='rgba(0,0,0,0.55)';
    ctx.lineWidth=3;
    ctx.font='800 '+Math.round(r*0.9)+'px -apple-system,sans-serif';
    ctx.strokeText('\u00d72',x,y+1);
    ctx.fillText('\u00d72',x,y+1);
  } else {
    ctx.font=Math.round(r*1.1)+'px -apple-system,sans-serif';
    ctx.fillText(type==='bad' ? '\ud83d\udc80' : '\ud83d\udddd', x, y+1);
  }
  ctx.textBaseline='alphabetic';
}
function drawCage(x,y,r){
  ctx.strokeStyle='rgba(230,238,255,0.85)';
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.arc(x,y,r*0.98,0,7);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x-r*0.95,y-r*0.35); ctx.lineTo(x+r*0.95,y-r*0.35);
  ctx.moveTo(x-r*0.95,y+r*0.35); ctx.lineTo(x+r*0.95,y+r*0.35);
  ctx.moveTo(x-r*0.35,y-r*0.93); ctx.lineTo(x-r*0.35,y+r*0.93);
  ctx.moveTo(x+r*0.35,y-r*0.93); ctx.lineTo(x+r*0.35,y+r*0.93);
  ctx.stroke();
}
function drawAim(){
  var x=SHOOT_X, y=SHOOT_Y, dx=Math.cos(aimAngle), dy=Math.sin(aimAngle);
  ctx.setLineDash([3,9]);
  ctx.lineWidth=3;
  ctx.strokeStyle='rgba(255,255,255,0.65)';
  ctx.beginPath();
  ctx.moveTo(x,y);
  var remaining=240;
  for(var b=0;b<2 && remaining>0;b++){
    var tWall = dx>0 ? (W-R-x)/dx : dx<0 ? (R-x)/dx : 1e9;
    var t = Math.min(tWall, remaining);
    x+=dx*t; y+=dy*t;
    ctx.lineTo(x,y);
    remaining-=t;
    dx=-dx;
  }
  ctx.stroke();
  ctx.setLineDash([]);
}
function goalHudText(){
  if(def.goal==='gems')  return '\ud83d\udc8e '+Math.max(0,gemsLeft)+' gem'+(gemsLeft===1?'':'s')+' left';
  if(def.goal==='score') return '\ud83c\udfaf '+score+' / '+def.target;
  return 'Clear all bubbles';
}
function draw(){
  var wt = WORLDS[state==='select' ? worldOf(Math.min(prog.unlocked,MAX_LEVEL)) : worldOf(level)];
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,wt.cv[0]);
  g.addColorStop(1,wt.cv[1]);
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);

  ctx.setLineDash([5,7]);
  ctx.strokeStyle='rgba(255,255,255,0.75)';
  ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(0,DEAD_Y); ctx.lineTo(W,DEAD_Y); ctx.stroke();
  ctx.setLineDash([]);

  var r,c,i;
  /* \ud83c\udf2b fog: rows well above the lowest bubble are hidden */
  var fogAbove = -1;
  if(def && def.fog && state==='play'){
    var lr=lowestRow();
    if(lr>4) fogAbove = lr-5;   /* rows 0..fogAbove hidden */
  }
  if(grid)
    for(r=0;r<ROWS_MAX;r++)
      for(c=0;c<colsAt(r);c++)
        if(grid[r]&&grid[r][c]>=0){
          if(r<=fogAbove){
            ctx.beginPath();
            ctx.arc(cx(r,c),cy(r),R-3,0,7);
            ctx.fillStyle='rgba(190,200,220,0.16)';
            ctx.fill();
            ctx.strokeStyle='rgba(190,200,220,0.25)';
            ctx.lineWidth=1.5;
            ctx.stroke();
          } else {
            drawBubble(cx(r,c),cy(r),grid[r][c],R-1);
            if(cageG[r][c]) drawCage(cx(r,c),cy(r),R-1);
            if(markG[r][c]) drawMark(cx(r,c),cy(r),R-1,markG[r][c]);
          }
        }
  if(fogAbove>=0){
    var fy=cy(fogAbove)+R;
    var fg=ctx.createLinearGradient(0,0,0,fy+18);
    fg.addColorStop(0,'rgba(200,210,230,0.30)');
    fg.addColorStop(1,'rgba(200,210,230,0)');
    ctx.fillStyle=fg;
    ctx.fillRect(0,0,W,fy+18);
    ctx.fillStyle='rgba(255,255,255,0.5)';
    ctx.font='600 11px -apple-system,sans-serif';
    ctx.textAlign='center';
    ctx.fillText('\ud83c\udf2b fog', W/2, 16);
  }

  for(i=fallers.length-1;i>=0;i--){
    var f=fallers[i];
    f.vy+=0.45; f.x+=f.vx; f.y+=f.vy;
    if(f.y>H+30) fallers.splice(i,1);
    else drawBubble(f.x,f.y,f.ci,R-1);
  }
  for(i=particles.length-1;i>=0;i--){
    var p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.18; p.life-=0.03;
    if(p.life<=0){ particles.splice(i,1); continue; }
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r*p.life,0,7);
    ctx.fillStyle=PAL[p.ci][1]; ctx.fill();
    ctx.globalAlpha=1;
  }

  if(state==='play'){
    drawAim();
    /* shooter ball (mystery = hidden colour, fireball ring if armed) */
    if(curMyst) drawMystery(SHOOT_X,SHOOT_Y,R);
    else drawBubble(SHOOT_X,SHOOT_Y,curC,R);
    if(fireArmed){
      var fp = 0.5+0.5*Math.abs(Math.sin(Date.now()/220));
      ctx.globalAlpha=fp;
      ctx.beginPath();
      ctx.arc(SHOOT_X,SHOOT_Y,R+4,0,7);
      ctx.strokeStyle='#ff8d4d';
      ctx.lineWidth=3.5;
      ctx.stroke();
      ctx.globalAlpha=1;
      ctx.font='14px -apple-system,sans-serif';
      ctx.textAlign='center';
      ctx.fillText('\ud83d\udd25', SHOOT_X, SHOOT_Y-R-9);
    }
    ctx.font='600 12px -apple-system,sans-serif';
    ctx.fillStyle='rgba(255,255,255,0.65)';
    ctx.textAlign='center';
    ctx.fillText('NEXT', SHOOT_X+72, SHOOT_Y-16);
    if(nextMyst) drawMystery(SHOOT_X+72, SHOOT_Y+4, R*0.68);
    else drawBubble(SHOOT_X+72, SHOOT_Y+4, nextC, R*0.68);

    /* shots left, next to the shooter */
    if(def.shots){
      ctx.textAlign='center';
      ctx.font='800 20px -apple-system,sans-serif';
      ctx.fillStyle = shotsLeft<=5 ? '#ff9d94' : 'rgba(255,255,255,0.9)';
      ctx.fillText('\u00d7'+shotsLeft, SHOOT_X-72, SHOOT_Y+7);
      ctx.font='600 10.5px -apple-system,sans-serif';
      ctx.fillStyle='rgba(255,255,255,0.55)';
      ctx.fillText('SHOTS', SHOOT_X-72, SHOOT_Y+22);
    }

    /* goal, bottom left */
    ctx.textAlign='left';
    ctx.fillStyle='#ffd75e';
    ctx.font='700 14px -apple-system,sans-serif';
    ctx.fillText(goalHudText(), 20, H-40);

    /* \u27162 multiplier countdown */
    if(Date.now()<multUntil){
      ctx.fillStyle='#ff9d5e';
      ctx.font='800 14px -apple-system,sans-serif';
      ctx.fillText('\u27162  '+Math.ceil((multUntil-Date.now())/1000)+'s', 20, H-58);
    }

    if(def.timed){
      var bw=W-40, frac=Math.max(0,dropLeft/def.drop);
      ctx.fillStyle='rgba(255,255,255,0.15)';
      ctx.fillRect(20,H-26,bw,10);
      ctx.fillStyle = frac<0.25 ? '#E24B4A' : '#e8b33b';
      ctx.fillRect(20,H-26,bw*frac,10);
      ctx.fillStyle='rgba(255,255,255,0.75)';
      ctx.font='600 11px -apple-system,sans-serif';
      ctx.textAlign='right';
      ctx.fillText('\u23f1 next row '+Math.ceil(dropLeft)+'s', W-20, H-32);
    }
  }
  if(ball) drawBubble(ball.x,ball.y,ball.c,R-1);
}

/* ---------- loop ---------- */
function loop(t){
  var dt=Math.min(0.05,(t-lastT)/1000);
  lastT=t;
  if(state==='play'){
    /* the timed row push only exists in Hard Mode */
    if(def.timed && !document.hidden){
      dropLeft-=dt;
      if(dropLeft<=0){
        pushRow();
        if(state==='play') dropLeft=def.drop;
      }
    }
    if(ball){
      var steps=2;
      for(var s=0;s<steps && ball;s++){
        ball.x+=ball.vx/steps; ball.y+=ball.vy/steps;
        if(ball.x<R){ ball.x=R; ball.vx*=-1; }
        if(ball.x>W-R){ ball.x=W-R; ball.vx*=-1; }
        if(ball.y<=TOP){ snapBall(); break; }
        for(var r=0;r<ROWS_MAX && ball;r++){
          if(cy(r) - ball.y > 2.2*R) break;
          for(var c=0;c<colsAt(r);c++){
            if(grid[r][c]<0) continue;
            var dx=cx(r,c)-ball.x, dy=cy(r)-ball.y;
            if(dx*dx+dy*dy < (2*R-6)*(2*R-6)){ snapBall(); break; }
          }
        }
      }
    }
  }
  draw();
  requestAnimationFrame(loop);
}

/* ---------- input ---------- */
function canvasPos(e){
  var b=cv.getBoundingClientRect();
  return { x:(e.clientX-b.left)*W/b.width, y:(e.clientY-b.top)*H/b.height };
}
function setAim(e){
  var p=canvasPos(e);
  var a=Math.atan2(p.y-SHOOT_Y, p.x-SHOOT_X);
  aimAngle=Math.max(-Math.PI+0.22, Math.min(-0.22, a));
}
cv.addEventListener('pointerdown', function(e){
  if(state!=='play') return;
  aiming=true; setAim(e); e.preventDefault();
}, {passive:false});
cv.addEventListener('pointermove', function(e){
  if(state!=='play') return;
  setAim(e);
  if(aiming) e.preventDefault();
}, {passive:false});
cv.addEventListener('pointerup', function(e){
  if(state!=='play' || !aiming) return;
  aiming=false; setAim(e);
  if(!ball){
    ball={ x:SHOOT_X, y:SHOOT_Y,
           vx:Math.cos(aimAngle)*BALL_SPEED, vy:Math.sin(aimAngle)*BALL_SPEED,
           c:curC, fire:fireArmed };
    fireArmed=false;
    curC=nextC; curMyst=nextMyst;
    nextC=pickColor(); nextMyst=mystRoll();
    shotsUsed++;
    if(def.shots) shotsLeft--;
    hud();
  }
});
cv.addEventListener('pointercancel', function(){ aiming=false; });

/* ---------- buttons ---------- */
document.getElementById('btnLevels').addEventListener('click', showSelect);
document.getElementById('btnRetry').addEventListener('click', function(){
  if(state==='play'||state==='lost'||state==='won') startLevel(level);
});
document.getElementById('btnSwap').addEventListener('click', function(){
  if(state==='play' && !ball){
    var t=curC; curC=nextC; nextC=t;
    var tm=curMyst; curMyst=nextMyst; nextMyst=tm;
  }
});
document.getElementById('btnNext').addEventListener('click', function(){ startLevel(level+1); });
document.getElementById('btnReplay').addEventListener('click', function(){ startLevel(level); });
document.getElementById('btnWinLevels').addEventListener('click', showSelect);
document.getElementById('btnLoseRetry').addEventListener('click', function(){ startLevel(level); });
document.getElementById('btnLoseLevels').addEventListener('click', showSelect);


/* =========================================================
   UI added by the re-skin: the pause card, the rules card,
   and the boot that offers a game in progress.
   ========================================================= */
function $id(id){ return document.getElementById(id); }
function openOvl(html){ $id('ovlCard').innerHTML=html; $id('ovl').classList.add('show'); }
function closeOvl(){ $id('ovl').classList.remove('show'); }
function ovlOpen(){ return $id('ovl').classList.contains('show'); }
function anyPanelOpen(){
  return ovlOpen() || $id('selOv').classList.contains('show') ||
         $id('winOv').classList.contains('show') || $id('loseOv').classList.contains('show');
}

function rulesScreen(){
  openOvl('<h2>HOW TO PLAY</h2><div class="rules">'+
    '&#9642; <b>Drag to aim, let go to fire.</b> The dotted line shows where the bubble is going, walls included.<br><br>'+
    '&#9642; Land <b>three or more of a colour together</b> and they pop. Anything left hanging with nothing above it falls too, and falling bubbles are worth more than popped ones.<br><br>'+
    '&#9642; <b>SWAP</b> trades the bubble you are holding for the next one. It is free and it does not use a shot.<br><br>'+
    '&#9642; You have a <b>set number of shots</b>, counted beside the shooter, and every level has a <b>goal</b> shown bottom left. Run out before the goal is done and the level is lost.<br><br>'+
    '&#9642; <b>Stars</b> are for finishing with shots to spare - three stars needs a tidy round.<br><br>'+
    '&#9642; Each world brings something new - gems, bombs, rainbows, cages, keys - and the game tells you when one turns up. Your progress <b>saves itself</b>.'+
    '</div><button class="big" id="bBack">GOT IT</button>');
  $id('bBack').onclick=closeOvl;
}

function pauseScreen(){
  openOvl('<h2>PAUSED</h2>'+
    '<p>Your progress is saved as you go.</p>'+
    '<button class="big" id="bResume2">CARRY ON</button>'+
    '<button class="quiet" id="bRules2">HOW TO PLAY</button>'+
    '<button class="quiet" id="bLevels2">ALL LEVELS</button>'+
    '<a class="quiet" href="index.html" style="text-decoration:none;display:block">BACK TO THE ARCADE</a>');
  $id('bResume2').onclick=closeOvl;
  $id('bRules2').onclick=rulesScreen;
  $id('bLevels2').onclick=function(){ closeOvl(); showSelect(); };
}

/* The pause pill works from the level select too - that is the only way in to
   HOW TO PLAY from the front page.  It is blocked only by its own card. */
$id('bPause').addEventListener('click', function(){
  if(ovlOpen()) return;
  pauseScreen();
});

/* ---------- sizing ---------- */
function fit(){
  var stage=document.getElementById('stage');
  var aw=stage.clientWidth-6;
  var ah=stage.clientHeight-6;
  var s=Math.min(aw/W, ah/H, 1.1);
  cv.style.width=(W*s)+'px';
  cv.style.height=(H*s)+'px';
}
window.addEventListener('resize', fit);

/* ---------- go ---------- */
emptyGrid();
score=0;
def = levelDef(1);
showSelect();

(function bootResume(){
  var sv = loadCurLevel();
  if(!(sv && sv.level && sv.level<=prog.unlocked && sv.level<=MAX_LEVEL)) return;
  openOvl('<h2>WELCOME BACK</h2>'+
    '<p>You were part way through <b>'+lvlName(sv.level)+'</b>.</p>'+
    '<button class="big" id="bsResume">CARRY ON</button>'+
    '<button class="quiet" id="bsFresh">ALL LEVELS</button>');
  $id('bsResume').onclick=function(){
    closeOvl();
    document.getElementById('selOv').classList.remove('show');
    startLevel(sv.level);
  };
  $id('bsFresh').onclick=function(){ closeOvl(); clearCurLevel(); showSelect(); };
})();

fit();
/* The original's very last line, and it is load-bearing: without it nothing
   ever paints and the canvas sits there transparent, showing the page through
   it.  Dropped once already when this boot section was rewritten - the tests
   all passed and the screenshots showed an empty table. */
requestAnimationFrame(function(t){ lastT=t; requestAnimationFrame(loop); });

})();
</script>
