<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Trivia Quest — Board Concept</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(ellipse at 50% 30%, #223a63 0%, #14213d 75%);
    color: #f5efdd;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: max(20px, calc(env(safe-area-inset-top) + 8px)) 10px calc(30px + env(safe-area-inset-bottom));
    user-select: none;
    -webkit-user-select: none;
  }
  h1 { font-size: 24px; letter-spacing: 3px; color: #f2c744; margin-bottom: 2px; font-weight: 800; }
  .sub { font-size: 12px; opacity: .75; margin-bottom: 10px; }
  /* ---------- TOP BAR ---------- */
  .topbar {
    width: min(96vw, 640px);
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .mbtn {
    width: 42px; height: 42px;
    border: none; border-radius: 10px;
    background: rgba(255,255,255,.08);
    color: #f2c744;
    font-size: 19px; font-weight: 800;
    cursor: pointer;
  }
  .turnpill {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,.08);
    border-radius: 10px;
    padding: 6px 10px;
    font-size: 12px; font-weight: 700;
    margin-right: auto;
  }
  .turnpill .pdot { width: 13px; height: 13px; border-radius: 50%; border: 2px solid #fff; }
  .diebox {
    width: 58px; height: 58px;
    background: linear-gradient(145deg, #ffffff, #e8e4d8);
    border-radius: 6px;
    position: relative;
    box-shadow: 0 3px 8px rgba(0,0,0,.45);
  }
  .diebox .pip {
    position: absolute;
    width: 11px; height: 11px;
    background: #191919;
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }
  .diebox.spin { animation: dspin .5s ease; }
  @keyframes dspin { 50% { transform: rotate(180deg) scale(.85); } }
  .rollbtn {
    border: none; border-radius: 9px;
    background: linear-gradient(180deg, #f2c744, #d9a821);
    color: #22302a;
    font-size: 12px; font-weight: 800; letter-spacing: 1px;
    padding: 10px 12px;
    box-shadow: 0 3px 0 #a67f14;
    cursor: pointer;
  }
  .rollbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 #a67f14; }
  .rollbtn:disabled { opacity: .5; }
  .hint { font-size: 12px; opacity: .8; min-height: 16px; margin-bottom: 6px; }
  #board { width: min(96vw, 640px); }
  /* highlight pulses */
  .hl { animation: hlp 1s infinite; cursor: pointer; }
  .halo { animation: hlp 1.3s infinite; }
  @keyframes hlp { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  .legend {
    display: flex; flex-wrap: wrap;
    gap: 8px 14px;
    justify-content: center;
    margin-top: 12px;
    max-width: 640px;
  }
  .chip { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; }
  .dot { width: 14px; height: 14px; border-radius: 4px; border: 1.5px solid rgba(255,255,255,.5); }
  .players { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
  .player { text-align: center; font-size: 11px; font-weight: 700; opacity: .75; }
  .player.on { opacity: 1; }
  .player.on .pname { color: #f2c744; }
  .player svg { display: block; margin: 0 auto 3px; }
  /* menu overlay */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.78);
    display: none;
    align-items: center; justify-content: center;
    z-index: 50;
  }
  .overlay.show { display: flex; }
  .modal {
    background: #fdf8ec; color: #22302a;
    border-radius: 18px;
    padding: 26px 30px;
    width: min(300px, 88vw);
    text-align: center;
    box-shadow: 0 12px 40px rgba(0,0,0,.6);
  }
  .modal h2 { color: #2e3c5e; font-size: 20px; margin-bottom: 14px; letter-spacing: 1px; }
  .modal button {
    display: block; width: 100%;
    margin: 9px 0; padding: 13px;
    border: none; border-radius: 12px;
    font-size: 15px; font-weight: 800;
    color: #fff; cursor: pointer;
  }
  /* setup screen */
  .sub2 { font-size: 13px; font-weight: 700; color: #6b6552; margin: 8px 0 4px; }
  .countrow { display: flex; gap: 6px; justify-content: center; margin: 8px 0 12px; }
  .cbtn {
    width: 38px; height: 38px;
    border-radius: 10px;
    border: 2px solid #ddd3ba;
    background: #fff;
    font-weight: 800; font-size: 16px;
    cursor: pointer; color: #22302a;
  }
  .cbtn.on { background: #f2c744; border-color: #d9a821; }
  .nfield { display: flex; align-items: center; gap: 8px; margin: 7px 0; }
  .nfield .pdot2 { flex-shrink: 0; width: 15px; height: 15px; border-radius: 50%; border: 2px solid #999; }
  .nfield input {
    flex: 1; min-width: 0;
    padding: 9px 10px;
    border: 2px solid #ddd3ba;
    border-radius: 10px;
    font-size: 14px; font-weight: 600;
    font-family: inherit;
    color: #22302a;
    background: #fff;
  }
  .nfield input:focus { outline: none; border-color: #d9a821; }
  /* question window */
  .qcard {
    background: #fdf8ec; color: #22302a;
    border-radius: 16px;
    overflow: hidden;
    width: min(430px, 92vw);
    box-shadow: 0 12px 40px rgba(0,0,0,.6);
    text-align: left;
  }
  .qhead {
    padding: 12px 16px;
    color: #fff; font-weight: 800;
    letter-spacing: 1px; font-size: 13px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .qbody { padding: 16px; }
  .qtext { font-size: 16px; font-weight: 700; line-height: 1.4; margin-bottom: 12px; }
  .qa-btn {
    display: flex; align-items: center; gap: 10px;
    width: 100%; margin: 5px 0; padding: 11px 12px;
    border: 2px solid #ddd3ba; border-radius: 12px;
    background: #fff;
    cursor: pointer;
    font-size: 14px; font-weight: 600; color: #22302a;
    text-align: left;
  }
  .qa-btn .lt {
    flex-shrink: 0;
    width: 26px; height: 26px;
    border-radius: 8px;
    background: #efe9d6;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 13px;
  }
  .qa-btn.correct { background: #2eae60; border-color: #2eae60; color: #fff; }
  .qa-btn.correct .lt { background: rgba(255,255,255,.25); color: #fff; }
  .qa-btn.wrong { background: #d64545; border-color: #d64545; color: #fff; }
  .qa-btn.wrong .lt { background: rgba(255,255,255,.25); color: #fff; }
  .qa-btn.reveal { animation: qrev .7s infinite; }
  @keyframes qrev { 0%,100% { box-shadow: 0 0 0 0 rgba(46,174,96,0); } 50% { box-shadow: 0 0 0 6px rgba(46,174,96,.4); } }
  .qfb { min-height: 22px; margin-top: 8px; font-size: 14px; font-weight: 800; text-align: center; }
  .b-resume { background: linear-gradient(180deg,#3fa06a,#2b7c4e); box-shadow: 0 4px 0 #1d5c38; }
  .b-save   { background: linear-gradient(180deg,#4a7fd6,#3560ab); box-shadow: 0 4px 0 #244680; }
  .b-quit   { background: linear-gradient(180deg,#e85b5b,#c23434); box-shadow: 0 4px 0 #8f2323; }
  .modal button:active { transform: translateY(2px); box-shadow: none; }
</style>
</head>
<body>
  <h1>TRIVIA QUEST</h1>

  <div class="topbar">
    <button class="mbtn" id="menuBtn">☰</button>
    <div class="turnpill"><span class="pdot" id="turnDot"></span><span id="turnName"></span></div>
    <div class="diebox" id="die"></div>
    <button class="rollbtn" id="rollBtn">ROLL</button>
  </div>
  <div class="hint" id="hint"></div>

  <div id="board"></div>
  <div class="legend" id="legend"></div>
  <div class="players" id="players"></div>

  <div class="overlay show" id="setupOverlay">
    <div class="modal">
      <h2>NEW GAME</h2>
      <div class="sub2">How many players?</div>
      <div class="countrow" id="countRow"></div>
      <div class="sub2">Names</div>
      <div id="nameFields"></div>
      <button class="b-resume" id="continueBtn" style="display:none;margin-top:14px;background:linear-gradient(180deg,#f2c744,#d9a821);box-shadow:0 4px 0 #a67f14;color:#22302a;">▶ CONTINUE GAME</button>
      <button class="b-resume" id="startBtn" style="margin-top:14px;">START GAME</button>
    </div>
  </div>

  <div class="overlay" id="qOverlay">
    <div class="qcard">
      <div class="qhead" id="qHead">
        <span id="qCat"></span>
        <span style="display:flex;gap:6px;align-items:center;">
          <span id="qDiff" style="font-size:10px;font-weight:800;padding:3px 7px;border-radius:8px;background:rgba(0,0,0,.28);"></span>
          <span id="qTag" style="font-size:11px;opacity:.95;">★ WEDGE</span>
        </span>
      </div>
      <div class="qbody">
        <div class="qtext" id="qText"></div>
        <div id="qAnswers"></div>
        <div class="qfb" id="qFb"></div>
      </div>
    </div>
  </div>

  <div class="overlay" id="menuOverlay">
    <div class="modal">
      <h2>GAME MENU</h2>
      <button class="b-resume" id="mResume">Resume</button>
      <button class="b-save" id="mRestart">Restart</button>
      <button class="b-quit" id="mExit">Exit</button>
    </div>
  </div>

  <div class="overlay" id="winOverlay">
    <div class="modal">
      <h2>🏆 WINNER!</h2>
      <div style="font-size:26px;font-weight:900;color:#2e3c5e;margin:6px 0 14px;" id="winName"></div>
      <button class="b-resume" id="wAgain">Play Again</button>
      <button class="b-quit" id="wExit">Exit</button>
    </div>
  </div>

<script>
"use strict";
const CATS = [
  { id: "geo", name: "Geography",         color: "#4a90d9" },
  { id: "ent", name: "Entertainment",     color: "#e84f8a" },
  { id: "his", name: "History",           color: "#f2c744" },
  { id: "art", name: "Arts & Literature", color: "#9b59b6" },
  { id: "sci", name: "Science & Nature",  color: "#2eae60" },
  { id: "spo", name: "Sports & Leisure",  color: "#e67e22" }
];
const CX = 500, CY = 500;
const R_OUT = 445, R_IN = 375, HQ_OUT = 472, HUB_R = 122;
const SEG = 360 / 42, R_MID = (R_IN + R_OUT) / 2, SPACE_R = 25;
const STEP = (R_IN - HUB_R) / 5;

function polar(r, aDeg) {
  const a = aDeg * Math.PI / 180;
  return [CX + r * Math.cos(a), CY + r * Math.sin(a)];
}
function annSeg(r1, r2, a1, a2) {
  const [x1,y1] = polar(r2,a1), [x2,y2] = polar(r2,a2);
  const [x3,y3] = polar(r1,a2), [x4,y4] = polar(r1,a1);
  return `M${x1.toFixed(1)},${y1.toFixed(1)} A${r2},${r2} 0 0 1 ${x2.toFixed(1)},${y2.toFixed(1)} ` +
         `L${x3.toFixed(1)},${y3.toFixed(1)} A${r1},${r1} 0 0 0 ${x4.toFixed(1)},${y4.toFixed(1)} Z`;
}

// ---------- board graph ----------
const NODES = {};   // id -> { x, y, type: hq|cat|roll|hub, cat }
const ADJ = {};
function addNode(id, x, y, type, cat) { NODES[id] = { x, y, type, cat }; ADJ[id] = []; }
function addEdge(a, b) { ADJ[a].push(b); ADJ[b].push(a); }

const SPOKE_COLORS = s => [(s+1)%6, (s+4)%6, (s+2)%6, (s+5)%6, (s+3)%6];

(function buildGraph() {
  // ring: sextant s spaces 7s..7s+6 — pattern [hq, +2, +4, roll, +1, +5, +3]
  for (let s = 0; s < 6; s++) {
    const pat = [
      ["hq",   s],
      ["cat",  (s + 2) % 6],
      ["cat",  (s + 4) % 6],
      ["roll", null],
      ["cat",  (s + 1) % 6],
      ["cat",  (s + 5) % 6],
      ["cat",  (s + 3) % 6]
    ];
    pat.forEach(([type, cat], k) => {
      const idx = s * 7 + k;
      const [x, y] = polar(R_MID, -90 + idx * SEG);
      addNode("R" + idx, x, y, type, cat);
    });
  }
  for (let i = 0; i < 42; i++) addEdge("R" + i, "R" + ((i + 1) % 42));
  // spokes + hub
  addNode("HUB", CX, CY, "hub", null);
  for (let s = 0; s < 6; s++) {
    const cols = SPOKE_COLORS(s);
    for (let k = 0; k < 5; k++) {
      const [x, y] = polar(R_IN - (k + 0.5) * STEP, -90 + s * 60);
      addNode(`S${s}-${k}`, x, y, "cat", cols[k]);
    }
    addEdge("R" + s * 7, `S${s}-0`);
    for (let k = 0; k < 4; k++) addEdge(`S${s}-${k}`, `S${s}-${k+1}`);
    addEdge(`S${s}-4`, "HUB");
  }
})();

// exactly-n-steps reachability, no immediate backtracking
function reachable(start, n) {
  let frontier = [[start, null]];
  for (let step = 0; step < n; step++) {
    const next = [], seen = new Set();
    frontier.forEach(([node, from]) => {
      ADJ[node].forEach(nb => {
        if (nb === from) return;
        const key = nb + "|" + node;
        if (!seen.has(key)) { seen.add(key); next.push([nb, node]); }
      });
    });
    frontier = next;
  }
  return [...new Set(frontier.map(f => f[0]))];
}
function findPath(start, n, target) {
  const path = [start];
  function dfs(node, from, depth) {
    if (depth === n) return node === target;
    for (const nb of ADJ[node]) {
      if (nb === from) continue;
      path.push(nb);
      if (dfs(nb, node, depth + 1)) return true;
      path.pop();
    }
    return false;
  }
  return dfs(start, null, 0) ? path : null;
}

// ---------- game state (demo) ----------
const RINGS = ["#d64545", "#29c5e6", "#ffffff", "#16a085", "#8e44ad", "#f39c12"];
let players = [];
let cur = 0, moves = [], moving = false, trail = [];

// ---------- save / resume ----------
const SAVE_KEY = "gg-save-trivia";
function saveGame() {
  if (!players.length) return;
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({ players, cur, decks }));
  } catch (e) {}
}
function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }
function loadSave() {
  try { return JSON.parse(localStorage.getItem(SAVE_KEY) || "null"); } catch (e) { return null; }
}

// ---------- rendering ----------
function boardSVG() {
  let svg = "";
  svg += `<circle cx="${CX}" cy="${CY}" r="486" fill="#1a2130" stroke="#0b101c" stroke-width="6"/>`;
  svg += `<circle cx="${CX}" cy="${CY}" r="480" fill="none" stroke="#39445c" stroke-width="1.5"/>`;
  svg += `<circle cx="${CX}" cy="${CY}" r="${R_MID}" fill="none" stroke="#39445c" stroke-width="5"/>`;
  // ring spaces
  for (let i = 0; i < 42; i++) {
    const id = "R" + i, nd = NODES[id];
    const a1 = -90 - SEG / 2 + i * SEG, a2 = a1 + SEG, mid = (a1 + a2) / 2;
    if (nd.type === "hq") {
      svg += `<path data-node="${id}" d="${annSeg(R_IN, HQ_OUT, a1 + 0.7, a2 - 0.7)}" fill="${CATS[nd.cat].color}" stroke="#0b101c" stroke-width="3"/>`;
      svg += `<circle cx="${nd.x.toFixed(1)}" cy="${nd.y.toFixed(1)}" r="${SPACE_R + 2}" fill="none" stroke="#0b101c" stroke-width="2" opacity="0.5" pointer-events="none"/>`;
      const [tx, ty] = polar((R_IN + HQ_OUT) / 2, mid);
      svg += `<text x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="middle" dominant-baseline="central" font-size="30" fill="#fff" font-weight="800" pointer-events="none">★</text>`;
    } else if (nd.type === "roll") {
      svg += `<circle data-node="${id}" cx="${nd.x.toFixed(1)}" cy="${nd.y.toFixed(1)}" r="${SPACE_R}" fill="#fdf8ec" stroke="#0b101c" stroke-width="2.5"/>`;
      svg += `<text x="${nd.x.toFixed(1)}" y="${nd.y.toFixed(1)}" text-anchor="middle" dominant-baseline="central" font-size="22" pointer-events="none">🎲</text>`;
    } else {
      svg += `<circle data-node="${id}" cx="${nd.x.toFixed(1)}" cy="${nd.y.toFixed(1)}" r="${SPACE_R}" fill="${CATS[nd.cat].color}" stroke="#0b101c" stroke-width="2.5"/>`;
    }
  }
  // spokes
  for (let s = 0; s < 6; s++) {
    const ang = -90 + s * 60;
    for (let k = 0; k < 5; k++) {
      const id = `S${s}-${k}`, nd = NODES[id];
      const rO = R_IN - k * STEP, rI = rO - STEP;
      svg += `<path data-node="${id}" d="${annSeg(rI, rO, ang - 8, ang + 8)}" fill="${CATS[nd.cat].color}" stroke="#0b101c" stroke-width="2"/>`;
    }
  }
  // hub
  for (let i = 0; i < 6; i++) {
    const a1 = -90 + i * 60 - 30, a2 = a1 + 60;
    const [x1, y1] = polar(HUB_R, a1), [x2, y2] = polar(HUB_R, a2);
    svg += `<path data-node="HUB" d="M${CX},${CY} L${x1.toFixed(1)},${y1.toFixed(1)} A${HUB_R},${HUB_R} 0 0 1 ${x2.toFixed(1)},${y2.toFixed(1)} Z" fill="${CATS[i].color}" stroke="#0b101c" stroke-width="2.5"/>`;
  }
  svg += `<circle data-node="HUB" cx="${CX}" cy="${CY}" r="56" fill="#fdf8ec" stroke="#0b101c" stroke-width="3"/>`;
  svg += `<text x="${CX}" y="${CY - 8}" text-anchor="middle" font-size="26" pointer-events="none">🏆</text>`;
  svg += `<text x="${CX}" y="${CY + 26}" text-anchor="middle" font-size="16" font-weight="800" fill="#22302a" pointer-events="none">FINAL</text>`;
  return svg;
}

function highlightSVG() {
  let svg = "";
  moves.forEach(id => {
    const nd = NODES[id];
    const r = id === "HUB" ? 62 : SPACE_R + 8;
    svg += `<circle class="hl" data-node="${id}" cx="${nd.x.toFixed(1)}" cy="${nd.y.toFixed(1)}" r="${r}" fill="none" stroke="#ffffff" stroke-width="5"/>`;
  });
  return svg;
}

function trailSVG() {
  return trail.map(id => {
    const nd = NODES[id];
    return `<circle cx="${nd.x.toFixed(1)}" cy="${nd.y.toFixed(1)}" r="8" fill="#f2c744" opacity="0.85" pointer-events="none"/>`;
  }).join("");
}

function pieToken(cx, cy, r, fills, ring) {
  let s = `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${r + 5}" fill="#fdf8ec" stroke="${ring}" stroke-width="6" pointer-events="none"/>`;
  for (let i = 0; i < 6; i++) {
    const a1 = (-90 + i * 60) * Math.PI / 180, a2 = (-30 + i * 60) * Math.PI / 180;
    const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
    const x2 = cx + r * Math.cos(a2), y2 = cy + r * Math.sin(a2);
    s += `<path d="M${cx.toFixed(1)},${cy.toFixed(1)} L${x1.toFixed(1)},${y1.toFixed(1)} A${r},${r} 0 0 1 ${x2.toFixed(1)},${y2.toFixed(1)} Z" ` +
         `fill="${fills[i] ? CATS[i].color : "#e3dccb"}" stroke="#fff" stroke-width="1.2" pointer-events="none"/>`;
  }
  return s;
}

const OFFSETS = [[0,0],[13,-10],[-13,10],[14,10],[-14,-10],[0,17]];
function tokensSVG() {
  let s = "";
  // group by node so stacked tokens fan out
  const byNode = {};
  players.forEach((p, i) => { (byNode[p.pos] = byNode[p.pos] || []).push(i); });
  players.forEach((p, i) => {
    const nd = NODES[p.pos];
    const stack = byNode[p.pos];
    const [ox, oy] = stack.length > 1 ? OFFSETS[stack.indexOf(i)] : [0, 0];
    const x = nd.x + ox, y = nd.y + oy;
    if (i === cur) {
      s += `<circle class="halo" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="33" fill="none" stroke="#f2c744" stroke-width="5" pointer-events="none"/>`;
    }
    s += pieToken(x, y, 20, p.fills, RINGS[i]);
  });
  return s;
}

function render() {
  if (!players.length) return;
  document.getElementById("board").innerHTML =
    `<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">${boardSVG()}${highlightSVG()}${trailSVG()}${tokensSVG()}</svg>`;
  document.getElementById("turnDot").style.background = RINGS[cur];
  document.getElementById("turnName").textContent = players[cur].name + "'s turn";
  document.getElementById("players").innerHTML = players.map((p, i) => {
    const n = p.fills.filter(Boolean).length;
    return `<div class="player${i === cur ? " on" : ""}"><svg width="52" height="52" viewBox="0 0 56 56">${pieToken(28, 28, 20, p.fills, RINGS[i])}</svg><span class="pname">${p.name}</span> · ${n}/6</div>`;
  }).join("");
  document.getElementById("hint").textContent =
    moves.length ? "Tap a glowing space to move" : (moving ? "" : "Roll the die to see where " + players[cur].name + " can go");
}

// ---------- die + turn flow ----------
const DIE_PIPS = {
  1: [[50,50]], 2: [[28,28],[72,72]], 3: [[28,28],[50,50],[72,72]],
  4: [[28,28],[72,28],[28,72],[72,72]], 5: [[28,28],[72,28],[50,50],[28,72],[72,72]],
  6: [[28,28],[72,28],[28,50],[72,50],[28,72],[72,72]]
};
let lastRoll = 3;
function showDie(v) {
  const d = document.getElementById("die");
  d.querySelectorAll(".pip").forEach(p => p.remove());
  DIE_PIPS[v].forEach(([x, y]) => {
    const p = document.createElement("div");
    p.className = "pip";
    p.style.left = x + "%";
    p.style.top = y + "%";
    d.appendChild(p);
  });
}

document.getElementById("rollBtn").addEventListener("click", () => {
  if (!players.length || moving || moves.length) return;
  trail = [];
  const btn = document.getElementById("rollBtn");
  const d = document.getElementById("die");
  btn.disabled = true;
  d.classList.add("spin");
  let t = 0;
  const iv = setInterval(() => {
    lastRoll = 1 + Math.floor(Math.random() * 6);
    showDie(lastRoll);
    if (++t >= 8) {
      clearInterval(iv);
      d.classList.remove("spin");
      moves = reachable(players[cur].pos, lastRoll);
      render();
    }
  }, 70);
});

document.getElementById("board").addEventListener("click", e => {
  const t = e.target.closest("[data-node]");
  if (!t || moving) return;
  const id = t.getAttribute("data-node");
  if (!moves.includes(id)) return;
  const path = findPath(players[cur].pos, lastRoll, id);
  if (!path) return;
  moves = [];
  moving = true;
  trail = [players[cur].pos];
  render();
  let step = 1;
  const iv = setInterval(() => {
    players[cur].pos = path[step];
    trail.push(path[step]);
    render();
    if (++step >= path.length) {
      clearInterval(iv);
      moving = false;
      onLand();
    }
  }, 220);
});

}
function drawQuestion(c) {
  if (!decks[c] || decks[c].ptr >= decks[c].order.length) resetDeck(c);
  return QUESTIONS[c][decks[c].order[decks[c].ptr++]];
}

function nextPlayer() {
  cur = (cur + 1) % players.length;
  document.getElementById("rollBtn").disabled = false;
  render();
  saveGame();
}
function sameAgain(msg) {
  document.getElementById("rollBtn").disabled = false;
  render();
  if (msg) document.getElementById("hint").textContent = msg;
  saveGame();
}
const DIFF_NAMES = ["EASY", "MEDIUM", "HARD", "IMPOSSIBLE"];

function el(tag, cls, txt) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (txt !== undefined) e.textContent = txt;
  return e;
}

function onLand() {
  const nd = NODES[players[cur].pos];
  if (nd.type === "roll") { sameAgain("Roll again! 🎲"); return; }
  if (nd.type === "hub") {
    if (players[cur].fills.every(f => f)) {
      askQuestion(Math.floor(Math.random() * 6), false, true);
    } else {
      sameAgain("Reach the hub with a full pie to win — roll again!");
    }
    return;
  }
  askQuestion(nd.cat, nd.type === "hq", false);
}

function askQuestion(catIdx, isHQ, isFinal) {
  const qd = drawQuestion(catIdx);
  // shuffle displayed answer order so the correct letter never follows a pattern
  const order = shuffle([0, 1, 2, 3, 4]);
  const shown = order.map(i => qd.a[i]);
  const correctShown = order.indexOf(qd.c);
  qLock = false;
  document.getElementById("qHead").style.background = CATS[catIdx].color;
  document.getElementById("qCat").textContent = (isFinal ? "FINAL · " : "") + CATS[catIdx].name.toUpperCase();
  document.getElementById("qDiff").textContent = DIFF_NAMES[qd.d];
  document.getElementById("qTag").style.display = isHQ ? "inline" : "none";
  document.getElementById("qText").textContent = qd.q;
  document.getElementById("qFb").textContent = "";
  const ansBox = document.getElementById("qAnswers");
  ansBox.innerHTML = "";
  shown.forEach((t, i) => {
    const b = el("button", "qa-btn");
    b.setAttribute("data-i", i);
    b.appendChild(el("span", "lt", LETTERS[i]));
    b.appendChild(el("span", "", t));
    ansBox.appendChild(b);
  });
  const ov = document.getElementById("qOverlay");
  ov.classList.add("show");
  document.getElementById("qAnswers").onclick = e => {
    const b = e.target.closest(".qa-btn");
    if (!b || qLock) return;
    qLock = true;
    const i = Number(b.getAttribute("data-i"));
    const btns = [...document.querySelectorAll("#qAnswers .qa-btn")];
    btns.forEach(x => x.disabled = true);
    const fb = document.getElementById("qFb");
    if (i === correctShown) {
      b.classList.add("correct");
      if (isFinal) {
        fb.textContent = "CORRECT — " + players[cur].name + " WINS! 🏆";
        fb.style.color = "#2eae60";
        clearSave();
        setTimeout(() => {
          ov.classList.remove("show");
          document.getElementById("winName").textContent = players[cur].name;
          document.getElementById("winOverlay").classList.add("show");
        }, 1600);
      } else if (isHQ && !players[cur].fills[catIdx]) {
        players[cur].fills[catIdx] = 1;
        fb.textContent = "Correct! Wedge earned 🥧 — next player";
        fb.style.color = "#2eae60";
        setTimeout(() => { ov.classList.remove("show"); nextPlayer(); }, 1700);
      } else {
        fb.textContent = "Correct! Roll again 🎲";
        fb.style.color = "#2eae60";
        setTimeout(() => { ov.classList.remove("show"); sameAgain("Correct! Roll again 🎲"); }, 1400);
      }
    } else {
      b.classList.add("wrong");
      btns[correctShown].classList.add("correct", "reveal");
      fb.textContent = "Wrong — the answer was " + LETTERS[correctShown] + ". Next player!";
      fb.style.color = "#d64545";
      setTimeout(() => { ov.classList.remove("show"); nextPlayer(); }, 2200);
    }
  };
}

// ---------- setup screen ----------
let numPlayers = 2;
const savedNames = ["", "", "", "", "", ""];

function buildCountRow() {
  document.getElementById("countRow").innerHTML = [1,2,3,4,5,6].map(n =>
    `<button class="cbtn${n === numPlayers ? " on" : ""}" data-n="${n}">${n}</button>`
  ).join("");
}
function buildNameFields() {
  document.getElementById("nameFields").innerHTML = Array.from({ length: numPlayers }, (_, i) =>
    `<div class="nfield"><span class="pdot2" style="background:${RINGS[i]}"></span>` +
    `<input type="text" maxlength="12" placeholder="Player ${i + 1}" value="${savedNames[i]}" data-i="${i}"></div>`
  ).join("");
}
document.getElementById("countRow").addEventListener("click", e => {
  const b = e.target.closest(".cbtn");
  if (!b) return;
  // remember any typed names before rebuilding
  document.querySelectorAll("#nameFields input").forEach(inp =>
    savedNames[Number(inp.getAttribute("data-i"))] = inp.value.trim());
  numPlayers = Number(b.getAttribute("data-n"));
  buildCountRow();
  buildNameFields();
});
document.getElementById("startBtn").addEventListener("click", () => {
  const names = [];
  document.querySelectorAll("#nameFields input").forEach(inp => {
    const i = Number(inp.getAttribute("data-i"));
    names[i] = inp.value.trim() || "Player " + (i + 1);
  });
  players = names.map(n => ({ name: n, pos: "HUB", fills: [0,0,0,0,0,0] }));
  cur = 0; moves = []; moving = false;
  decks = [];
  document.getElementById("setupOverlay").classList.remove("show");
  document.getElementById("rollBtn").disabled = false;
  render();
  saveGame();
});
document.getElementById("continueBtn").addEventListener("click", () => {
  const sv = loadSave();
  if (!sv) return;
  players = sv.players;
  cur = sv.cur;
  decks = sv.decks || [];
  moves = []; moving = false; trail = [];
  document.getElementById("setupOverlay").classList.remove("show");
  document.getElementById("rollBtn").disabled = false;
  render();
});

// ---------- menu ----------
const mo = document.getElementById("menuOverlay");
document.getElementById("menuBtn").addEventListener("click", () => {
  if (players.length) mo.classList.add("show");
});
document.getElementById("mResume").addEventListener("click", () => mo.classList.remove("show"));
document.getElementById("mRestart").addEventListener("click", () => {
  mo.classList.remove("show");
  restartGame();
});
document.getElementById("mExit").addEventListener("click", () => {
  mo.classList.remove("show");
  exitGame();
});
document.getElementById("wAgain").addEventListener("click", () => {
  document.getElementById("winOverlay").classList.remove("show");
  restartGame();
});
document.getElementById("wExit").addEventListener("click", () => {
  document.getElementById("winOverlay").classList.remove("show");
  exitGame();
});
function restartGame() {
  players = players.map(p => ({ name: p.name, pos: "HUB", fills: [0,0,0,0,0,0] }));
  cur = 0; moves = []; moving = false;
  decks = [];
  document.getElementById("qOverlay").classList.remove("show");
  document.getElementById("rollBtn").disabled = false;
  render();
  saveGame();
}
function exitGame() {
  if (EXIT_URL) { window.location.href = EXIT_URL; return; }
  backToSetup();
}
function backToSetup() {
  players = [];
  moves = []; moving = false;
  document.getElementById("board").innerHTML = "";
  document.getElementById("players").innerHTML = "";
  document.getElementById("turnName").textContent = "";
  document.getElementById("turnDot").style.background = "transparent";
  document.getElementById("hint").textContent = "";
  document.getElementById("qOverlay").classList.remove("show");
  document.getElementById("setupOverlay").classList.add("show");
}

document.getElementById("legend").innerHTML = CATS.map(c =>
  `<span class="chip"><span class="dot" style="background:${c.color}"></span>${c.name}</span>`
).join("");
showDie(lastRoll);
buildCountRow();
buildNameFields();
(function bootResume() {
  const sv = loadSave();
  if (sv && sv.players && sv.players.length) {
    const b = document.getElementById("continueBtn");
    b.textContent = "▶ CONTINUE (" + sv.players.map(p => p.name).join(", ") + ")";
    b.style.display = "block";
  }
})();
</script>
