<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Cup Glory</title>
<style>
  :root{
    --bg:#0d1321; --panel:#171f33; --panel2:#1e2942; --line:#2b3a5c;
    --gold:#f5c542; --green:#37c871; --red:#e6534f; --text:#e8edf7; --dim:#8fa0bf;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;align-items:center;
    user-select:none;-webkit-user-select:none;overscroll-behavior:none;
  }
  #wrap{width:100%;max-width:520px;min-height:100%;display:flex;flex-direction:column;padding:10px 12px 24px;}
  /* Top bar */
  #topbar{display:flex;align-items:center;justify-content:space-between;padding:6px 0 10px;}
  #topbar .title{font-weight:800;font-size:18px;letter-spacing:1px;color:var(--gold);}
  .menu-btn{
    background:var(--panel2);border:1px solid var(--line);color:var(--text);
    padding:8px 14px;border-radius:10px;font-size:14px;font-weight:700;text-decoration:none;cursor:pointer;
  }
  .menu-btn:active{transform:scale(.96);}
  /* Generic */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;}
  h2{font-size:17px;margin-bottom:10px;} h3{font-size:14px;color:var(--dim);margin-bottom:8px;font-weight:600;}
  .btn{
    display:block;width:100%;text-align:center;background:var(--gold);color:#1a1a1a;border:none;
    padding:14px;border-radius:12px;font-size:16px;font-weight:800;cursor:pointer;margin-top:10px;
  }
  .btn.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line);}
  .btn.danger{background:var(--red);color:#fff;}
  .btn:disabled{opacity:.4;}
  .txt{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;color:var(--text);
    padding:14px;font-size:17px;font-weight:700;text-align:center;outline:none;margin-top:8px;}
  .txt:focus{border-color:var(--gold);}
  .btn:active:not(:disabled){transform:scale(.98);}
  .row{display:flex;gap:10px;} .row .btn{margin-top:10px;}
  .small{font-size:12px;color:var(--dim);}
  .center{text-align:center;}
  .badge{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-size:12px;color:var(--dim);}
  .gold{color:var(--gold);} .green{color:var(--green);} .red{color:var(--red);}
  /* Tournament select */
  .tour-btn{display:flex;align-items:center;justify-content:center;text-align:center;gap:12px;background:var(--panel);border:1px solid var(--line);
    border-radius:14px;padding:16px;margin-bottom:10px;width:100%;cursor:pointer;color:var(--text);}
  .tour-btn:active{transform:scale(.98);}
  .tour-btn .emoji{font-size:28px;} .tour-btn .name{font-size:16px;font-weight:800;}
  .tour-btn .sub{font-size:12px;color:var(--dim);margin-top:2px;}
  /* Pitch */
  #pitch{background:linear-gradient(180deg,#14532d,#166534 45%,#14532d);border:2px solid #1e7a45;border-radius:14px;
    padding:14px 6px;display:flex;flex-direction:column;gap:10px;margin-bottom:10px;}
  .pitch-row{display:flex;justify-content:space-evenly;}
  .slot{width:74px;min-height:64px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(0,0,0,.28);border:1.5px dashed rgba(255,255,255,.35);padding:4px 2px;cursor:pointer;}
  .slot .pos{font-size:11px;font-weight:800;color:rgba(255,255,255,.75);}
  .slot.filled{border-style:solid;border-color:rgba(255,255,255,.25);background:rgba(0,0,0,.45);}
  .slot .nm{font-size:10.5px;font-weight:700;text-align:center;line-height:1.15;margin-top:2px;}
  .slot .rt{font-size:11px;font-weight:800;color:var(--gold);}
  .slot.glow{border-color:var(--gold);border-style:solid;box-shadow:0 0 10px rgba(245,197,66,.65);animation:pulse 1s infinite;}
  @keyframes pulse{50%{box-shadow:0 0 18px rgba(245,197,66,.9);}}
  /* Scout */
  .scout-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .scout-team{font-weight:900;font-size:24px;letter-spacing:.5px;line-height:1.15;}
  .player-card{display:flex;justify-content:space-between;align-items:center;background:var(--panel2);
    border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:6px;cursor:pointer;}
  .player-card.disabled{opacity:.35;pointer-events:none;}
  .player-card.selected{border-color:var(--gold);box-shadow:0 0 8px rgba(245,197,66,.5);}
  .player-card:active{transform:scale(.98);}
  .pc-pos{font-size:11px;font-weight:800;width:34px;color:var(--dim);}
  .pc-name{flex:1;font-size:14px;font-weight:700;padding:0 6px;}
  .pc-rat{font-size:15px;font-weight:800;color:var(--gold);}
  /* Fixtures / tables */
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--line);}
  th{color:var(--dim);font-size:11px;font-weight:600;}
  td.tn{text-align:left;font-weight:700;} tr.me td{color:var(--gold);}
  .fixture{display:flex;justify-content:space-between;align-items:center;padding:9px 6px;border-bottom:1px solid var(--line);font-size:13px;}
  .fixture .fr{color:var(--dim);font-size:11px;width:88px;}
  .fixture .fs{font-weight:800;}
  .fixture.next{background:rgba(245,197,66,.08);border-radius:8px;}
  /* Match */
  #scoreboard{display:flex;justify-content:space-between;align-items:center;padding:8px 4px;}
  #scoreboard .team{width:38%;text-align:center;font-weight:800;font-size:14px;line-height:1.2;}
  #scoreboard .score{font-size:34px;font-weight:900;color:var(--gold);}
  #matchclock{text-align:center;font-size:28px;font-weight:900;color:var(--green);margin:4px 0 10px;letter-spacing:1px;}
  #matchclock .mc-round{display:block;font-size:12px;font-weight:600;color:var(--dim);letter-spacing:0;}
  #matchclock.injury{color:var(--red);}
  #ticker{background:var(--panel2);border:1px solid var(--line);border-radius:10px;min-height:150px;max-height:230px;
    overflow-y:auto;padding:10px;font-size:13px;display:flex;flex-direction:column-reverse;}
  #ticker div{padding:3px 0;border-bottom:1px dashed rgba(255,255,255,.07);}
  .ev-goal{color:var(--gold);font-weight:800;} .ev-opp{color:var(--red);font-weight:800;} .ev-info{color:var(--dim);}
  /* Modal */
  #modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
  #modal-bg.show{display:flex;}
  #modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;width:100%;max-width:400px;max-height:82vh;overflow-y:auto;}
  #modal h2{color:var(--gold);}
  /* Title celebration */
  #celebrate{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden;opacity:1;transition:opacity 1.2s ease;}
  .confetti{position:absolute;top:-24px;width:10px;height:16px;border-radius:2px;animation:confall linear forwards;}
  @keyframes confall{to{transform:translateY(112vh) rotate(720deg);}}
  .big-cup{position:absolute;top:38%;left:50%;font-size:120px;transform:translate(-50%,-50%) scale(0);
    animation:cupin .7s cubic-bezier(.2,1.6,.4,1) forwards;filter:drop-shadow(0 0 30px rgba(245,197,66,.8));}
  @keyframes cupin{to{transform:translate(-50%,-50%) scale(1);}}
  /* Trophy banner */
  .trophy-line{font-size:13px;color:var(--dim);margin-top:6px;}
  .bigresult{font-size:26px;font-weight:900;text-align:center;margin:14px 0;}
</style>
</head>

// opponent pools derived from squad data (tier by starting-XI average)
function derivePool(squads){
  const seen = {}, out = [];
  squads.forEach(s=>{
    if(seen[s.team]) return; seen[s.team] = 1;
    out.push([s.team, s.avg>=88.5?3 : s.avg>=85.5?2 : 1]);
  });
  return out;
}

// A slot accepts a player if any of his positions fit.
// Wingers may play wide midfield (RW→RM, LW→LM) since pure RM/LM are rare.
function slotAccepts(slotPos, playerPositions){
  if(playerPositions.indexOf(slotPos) !== -1) return true;
  if(slotPos==="RM" && playerPositions.indexOf("RW") !== -1) return true;
  if(slotPos==="LM" && playerPositions.indexOf("LW") !== -1) return true;
  return false;
}

// helpers
function rnd(a,b){ return a + Math.random()*(b-a); }
function ri(a,b){ return Math.floor(rnd(a,b+1)); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function el(id){ return document.getElementById(id); }
function stopMatchTimer(){ if(matchTimer){ clearInterval(matchTimer); matchTimer = null; } }

// ============================================================
// TEAM RATING + CHEMISTRY
// ============================================================
function myPlayers(){ return S.slots.filter(s=>s.player).map(s=>s.player); }
function teamRating(){
  const ps = myPlayers();
  if(!ps.length) return 0;
  const avg = ps.reduce((a,b)=>a+b.r,0)/ps.length;
  return Math.round((avg + chemBonus(ps)) * 10)/10;
}
function chemBonus(ps){
  let chem = 0;
  for(let i=0;i<ps.length;i++) for(let j=i+1;j<ps.length;j++){
    if(ps[i].team===ps[j].team && ps[i].year===ps[j].year) chem += 0.4;
    else if(Math.floor(ps[i].year/10)===Math.floor(ps[j].year/10)) chem += 0.1;
  }
  return Math.min(chem, 6);
}

// ============================================================
// OPPONENT GENERATION — strength scales AGAINST your rating
// ============================================================
// progress: 0 (first game) → 1 (final). Early games sit below your level,
// the final sits at/above it. Tier adds flavour, plus small randomness.
function oppRating(tierName, progress, lower){
  const mine = teamRating();
  const base = mine - 10 + progress*9.5;        // -10 early → -0.5 at the final
  const tier = lower ? -5 : (tierName-2)*1.5;   // tier 1:-1.5  2:0  3:+1.5
  return Math.round(Math.max(55, Math.min(99, base + tier + rnd(-2.5,2.5)))*10)/10;
}
function drawOpponents(cfg, count, exclude, useLower){
  const pool = (useLower && cfg.lowerOpps ? cfg.lowerOpps : cfg.opps).filter(o=>!exclude.includes(o[0]));
  return shuffle(pool).slice(0,count);
}

    for(let i=0;i<cfg.groupGames;i++)
      c.fixtures.push({ round:"Group "+(i+1), opp:g[i][0], tier:g[i][1], prog:i*0.08, played:false });
    cfg.koRounds.forEach((r,i)=>{
      c.fixtures.push({ round:r, opp:null, tier:2, prog:0.4 + 0.6*(i/(cfg.koRounds.length-1||1)), ko:true, played:false });
    });

    cfg.koRounds.forEach((r,i)=>{
      const prog = i/(cfg.koRounds.length-1);

    });

    // 19 distinct clubs from the 64-squad data (random season variant for each)
    const byClub = {};
    CLUB_SQUADS.forEach(s=>{ (byClub[s.team] = byClub[s.team]||[]).push(s); });
    const clubs = shuffle(Object.keys(byClub)).slice(0, 19);
    const others = clubs.map(cn=>{ const v = pick(byClub[cn]); return { name:cn, disp:v.disp, avg:v.avg, pts:0, gf:0, ga:0, pl:0 }; });
    const meanAvg = others.reduce((a,t)=>a+t.avg,0)/others.length;
    c.league = { teams:others, meanAvg:Math.round(meanAvg*10)/10, myPts:0, myGf:0, myGa:0, myPl:0 };
    const sched = leagueSchedule(20); // 38 rounds of pairs [home,away], team 0 = me
    sched.forEach((round,mdi)=>{
      round.forEach(pair=>{
        if(pair[0]===0 || pair[1]===0){
          const oid = (pair[0]===0? pair[1] : pair[0]) - 1;
          c.fixtures.push({ round:"Matchday "+(mdi+1), opp:others[oid].name, oppAvg:others[oid].avg, oppDisp:others[oid].disp,
                            home:pair[0]===0, prog:mdi/37, played:false, md:mdi,
                            aiPairs:round.filter(pr=>pr[0]!==0&&pr[1]!==0) });
        }
      });
    });
  }
  return c;
}
// circle method double round robin for n teams (n even) → array of rounds, each round = [[a,b],...]
function leagueSchedule(n){
  const ids = []; for(let i=0;i<n;i++) ids.push(i);
  const rounds = [];
  const arr = ids.slice(1);
  for(let r=0;r<n-1;r++){
    let round = [[ids[0], arr[0]]];
    for(let i=1;i<n/2;i++) round.push([arr[i], arr[arr.length-i]]);
    if(r%2===1) round = round.map(pr=>[pr[1],pr[0]]); // alternate home/away
    rounds.push(round);
    arr.push(arr.shift());
  }
  const second = rounds.map(rd=>rd.map(pr=>[pr[1],pr[0]]));
  return rounds.concat(second);
}

// quick sim for AI vs AI results
function quickSim(rA, rB){
  const d = rA - rB;
  const xa = Math.max(0.3, 1.35 + d*0.09), xb = Math.max(0.3, 1.35 - d*0.09);
  return [poisson(xa), poisson(xb)];
}
function poisson(x){
  let L = Math.exp(-x), k = 0, pr = 1;
  do { k++; pr *= Math.random(); } while (pr > L);
  return k-1;
}

// ---------- DRAFT ----------
function poolFor(){
  const p = TOURNAMENTS[S.tour].pool;
  return p==="national" ? NATIONAL_SQUADS : p==="euro" ? EURO_SQUADS : p==="fa" ? FA_SQUADS : CLUB_SQUADS;
}
function newScout(){
  const pool = poolFor();
  if(!S.seen) S.seen = [];
  S.scoutN = (S.scoutN||0)+1;
  let squad = null;
  // guaranteed club due at this scout position (skipped if it already appeared naturally)
  const gclub = (S.guarAt||{})[S.scoutN];
  if(gclub && S.seen.indexOf(gclub)===-1){
    const cands = pool.filter(sq=>sq.team===gclub);
    if(cands.length) squad = pick(cands);
  }
  if(!squad){
    // never show a club that's already been offered this draft
    let cands = pool.filter(sq=>S.seen.indexOf(sq.team)===-1);
    if(!cands.length){ S.seen = []; cands = pool; } // pool exhausted — reset
    squad = pick(cands);
  }
  S.seen.push(squad.team);
  const picked = myPlayers().map(pl=>pl.n+"|"+pl.team+"|"+pl.year);
  const offer = squad.players.filter(pl=>!picked.includes(pl.n+"|"+squad.team+"|"+squad.year));
  S.scout = { team:squad.team, year:squad.year, disp:squad.disp, ach:squad.ach||null, players:offer };
  S.pickedIdx = null;
  save(); render();
}
function scoutPickable(pl){ return S.slots.some(s=>!s.player && slotAccepts(s.pos, pl.pos)); }
function pickPlayer(i){
  const pl = S.scout.players[i];
  if(!pl || !scoutPickable(pl)) return;
  S.pickedIdx = i; save(); render();
}
function placeInSlot(si){
  if(S.pickedIdx===null) return;
  const slot = S.slots[si], pl = S.scout.players[S.pickedIdx];
  if(slot.player || !slotAccepts(slot.pos, pl.pos)) return;
  slot.player = { n:pl.n, pos:pl.pos, r:pl.r, team:S.scout.team, year:S.scout.year };
  if(S.slots.every(s=>s.player)){
    S.campaign = buildCampaign();
    S.phase = "campaign";
    save(); render();
  } else newScout();
}
function reScout(){
  if(S.rescouts<=0) return;
  S.rescouts--; newScout();
}
function scoutIsDead(){ return !S.scout.players.some(pl=>scoutPickable(pl)); }

// ============================================================
// MATCH ENGINE — live ticker
// ============================================================
let M = null; // transient live-match object (not saved; fixture saved only when finished)

function kickOff(){
  const cfg = TOURNAMENTS[S.tour], f = nextFixture();
  if(!f) return;
  if(!f.opp){ // knockout draw happens now
    const used = S.campaign.fixtures.filter(x=>x.opp).map(x=>x.opp);
    const d = drawOpponents(cfg, 1, used, f.lower)[0] || pick(cfg.opps);
    f.opp = d[0]; f.tier = d[1];
  }
  let oppR;
  if(S.campaign.league){
    // real squad strength, scaled against YOUR rating (avg opponent sits below you
    // so a title charge is possible over 38 games), plus home/away swing
    oppR = teamRating() - 3.4 + (f.oppAvg - S.campaign.league.meanAvg)*0.9 + (f.home? -1.2 : 1.2) + rnd(-2,2);
    oppR = Math.round(Math.max(55, Math.min(99, oppR))*10)/10;
  } else {
    oppR = oppRating(f.tier, f.prog, f.lower);
  }
  const myR = teamRating();
  const d = myR - oppR;
  M = {
    f:f, oppR:oppR, myR:myR, min:0, gMe:0, gOpp:0, events:[],
    xgMe:Math.max(0.35, 1.45 + d*0.10), xgOpp:Math.max(0.30, 1.40 - d*0.10),
    period:"1H", stop:ri(1,5), et:false, pens:null, over:false, speed:1,
    goalsMe:[], goalsOpp:[], shotsMe:0, shotsOpp:0,
    cards:[], offMe:[], offOpp:[], bookedMe:{}, bookedOpp:{},
    note:null, resWon:false, resDrew:false, others:[]
  };
  const osq = resolveOppSquad(f);
  M.oppSquad = osq ? osq.players : null;
  M.oppDisp = f.oppDisp || (osq ? osq.disp : "");
  M.oppAch = (osq && osq.ach) ? String(osq.ach).split(";")[0].trim() : "";
  S.phase = "match"; save(); render();
  startTicker();
}

// find the real squad for the opponent so their scorers/cards use real names
function resolveOppSquad(f){
  const p = TOURNAMENTS[S.tour].pool;
  const pool = p==="fa" ? FA_SQUADS : p==="euro" ? EURO_SQUADS : p==="national" ? NATIONAL_SQUADS : CLUB_SQUADS;
  let cands = pool.filter(s=>s.team===f.opp);
  if(f.oppDisp){ const ex = cands.find(s=>s.disp===f.oppDisp); if(ex) cands = [ex]; }
  return cands.length ? pick(cands) : null; // full squad {team, disp, players}
}
const GENERIC_NAMES = ["Silva","Santos","Costa","Fernández","Rossi","Bianchi","Weber","Kovač","Larsen","Nielsen","Moreau","Okafor","Diallo","Sato","Tanaka","Kim","García","Hernández","Petrov","Ivanov","Yılmaz","Novák","Eriksen","Duarte"];

const SCORE_W = {ST:2.4, LW:1.7, RW:1.7, AM:1.6, LM:1.1, RM:1.1, CM:0.9, DM:0.4, CB:0.25, RB:0.3, LB:0.3, GK:0};
const CARD_W  = {DM:1.7, CB:1.5, CM:1.2, RB:1.2, LB:1.2, AM:0.8, LM:0.9, RM:0.9, LW:0.7, RW:0.7, ST:0.8, GK:0.15};
function weightedName(list, wmap, excl){
  const ps = list.filter(pl=>excl.indexOf(pl.n)===-1);
  if(!ps.length) return null;
  const w = ps.map(pl=> pl.r * Math.max.apply(null, pl.pos.map(x=>wmap[x]||0.3)));
  const sum = w.reduce((a,b)=>a+b,0);
  if(sum<=0) return ps[0].n;
  let t = rnd(0, sum);
  for(let i=0;i<ps.length;i++){ t -= w[i]; if(t<=0) return ps[i].n; }
  return ps[ps.length-1].n;
}
function scorerName(){
  return weightedName(myPlayers().filter(pl=>pl.pos.indexOf("GK")===-1), SCORE_W, M?M.offMe:[]) || "Your XI";
}
function oppScorerName(){
  if(M.oppSquad){
    const n = weightedName(M.oppSquad.filter(pl=>pl.pos.indexOf("GK")===-1), SCORE_W, M.offOpp);
    if(n) return n;
  }
  return pick(GENERIC_NAMES);
}
function cardName(mine){
  if(mine) return weightedName(myPlayers(), CARD_W, M.offMe);
  if(M.oppSquad){ const n = weightedName(M.oppSquad, CARD_W, M.offOpp); if(n) return n; }
  return pick(GENERIC_NAMES);
}
// bookings: ~2 per team per game; reds via straight red or second yellow.
// a card recalculates strength for the rest of the match.
function maybeCard(mine){
  if(Math.random() >= 0.021) return;
  const n = cardName(mine);
  if(!n) return;
  const booked = mine ? M.bookedMe : M.bookedOpp;
  const off = mine ? M.offMe : M.offOpp;
  if(off.indexOf(n)!==-1) return;
  const straightRed = Math.random() < 0.02;
  // a booked player usually stays out of trouble — second yellows are rare
  if(booked[n] && !straightRed && Math.random() < 0.78) return;
  if(!straightRed && !booked[n]){
    booked[n] = 1;
    M.cards.push({min:M.min, side:mine?'me':'opp', n:n, t:'Y'});
    addEv(M.min+"' 🟨 "+n+(mine?"":" ("+M.f.opp+")"), "ev-info");
    if(mine) M.xgMe *= 0.985; else M.xgOpp *= 0.985; // slight caution
  } else {
    const second = !straightRed;
    off.push(n);
    M.cards.push({min:M.min, side:mine?'me':'opp', n:n, t:second?'YR':'R'});
    addEv(M.min+"' 🟥 "+n+(second?" (second yellow)":"")+" — "+(mine?"you're down to 10 men!":M.f.opp+" down to 10 men!"), mine?"ev-opp":"ev-goal");
    if(mine){ M.xgMe *= 0.72; M.xgOpp *= 1.25; } // 10 men: big strength recalc
    else    { M.xgOpp *= 0.72; M.xgMe *= 1.25; }
  }
}
function addEv(txt, cls){ M.events.push({t:txt, c:cls||"ev-info"}); }

function startTicker(){
  stopMatchTimer();
  matchTimer = setInterval(tick, 320); // ~30s for a 90-minute match at speed x1
}
function tick(){
  if(!M || M.over){ stopMatchTimer(); return; }
  const steps = M.speed;
  for(let s=0;s<steps;s++){ if(!minuteStep()) break; }
  drawMatch();
}
function minuteStep(){
  M.min++;
  const perMin = 1/93;
  if(Math.random() < M.xgMe*perMin){
    M.gMe++; M.shotsMe++;
    const n = scorerName();
    M.goalsMe.push({n:n, min:M.min});
    addEv(M.min+"' ⚽ GOAL! "+n+" scores! "+M.gMe+"–"+M.gOpp, "ev-goal");
  } else if(Math.random() < M.xgMe*perMin*1.9){ M.shotsMe++; }
  if(Math.random() < M.xgOpp*perMin){
    M.gOpp++; M.shotsOpp++;
    const n = oppScorerName();
    M.goalsOpp.push({n:n, min:M.min});
    addEv(M.min+"' ⚽ "+M.f.opp+" score — "+n+". "+M.gMe+"–"+M.gOpp, "ev-opp");
  } else if(Math.random() < M.xgOpp*perMin*1.9){ M.shotsOpp++; }
  maybeCard(true); maybeCard(false);
  if(M.min===45 && M.period==="1H"){ M.period="2H"; addEv("Half-time: "+M.gMe+"–"+M.gOpp); }
  if(M.min===90+((M.period==="2H")?M.stop:0) && !M.et && M.period==="2H"){ endNinety(); return false; }
  if(M.min===90 && M.period==="2H" && M.stop>0){ addEv("+"+M.stop+" minutes of stoppage time"); }
  if(M.et && M.min>=120){ endExtraTime(); return false; }
  return true;
}
function endNinety(){
  if(M.gMe!==M.gOpp || !M.f.ko){ finishMatch(); return; }
  addEv("Full-time "+M.gMe+"–"+M.gOpp+" — EXTRA TIME!", "ev-info");
  M.et = true; M.min = 90; drawMatch();
}
function endExtraTime(){
  if(M.gMe!==M.gOpp){ finishMatch(); return; }
  addEv("Still level after 120' — PENALTIES!", "ev-info");
  stopMatchTimer(); runShootout();
}
function runShootout(){
  const meP = 0.76 + (M.myR-M.oppR)*0.006, opP = 0.76 - (M.myR-M.oppR)*0.006;
  M.pens = { me:0, opp:0, log:[] };
  let kick = 0;
  const iv = setInterval(()=>{
    kick++;
    const round = Math.ceil(kick/2), myTurn = (kick%2===1);
    if(myTurn){ const sc = Math.random()<meP; if(sc) M.pens.me++; M.pens.log.push((sc?"✅":"❌")+" "+scorerName()); }
    else { const sc = Math.random()<opP; if(sc) M.pens.opp++; M.pens.log.push((sc?"🔴✅":"🔴❌")+" "+M.f.opp); }
    addEv("Pens: "+M.pens.me+"–"+M.pens.opp, myTurn?"ev-goal":"ev-opp");
    drawMatch();
    const kicksEach = Math.ceil(kick/2), other = Math.floor(kick/2);
    let decided = false;
    if(round<=5){
      const remMe = 5-Math.ceil(kick/2)+(myTurn?0:0);
      if(kick>=4){ // possible early decision
        const meKicks = Math.ceil(kick/2), opKicks = Math.floor(kick/2);
        if(M.pens.me > M.pens.opp + (5-opKicks)) decided = true;
        if(M.pens.opp > M.pens.me + (5-meKicks)) decided = true;
      }
      if(round===5 && kick%2===0 && M.pens.me!==M.pens.opp) decided = true;
    } else if(kick%2===0 && M.pens.me!==M.pens.opp) decided = true; // sudden death
    if(decided){ clearInterval(iv); finishMatch(true); }
  }, 650);
  matchTimer = iv;
}

function finishMatch(byPens){
  stopMatchTimer();
  M.over = true;
  const f = M.f, c = S.campaign;
  let won = M.gMe > M.gOpp, drew = M.gMe===M.gOpp;
  if(byPens){ won = M.pens.me > M.pens.opp; drew = false; }
  f.played = true;
  f.scoreTxt = M.gMe+"–"+M.gOpp + (byPens ? " ("+M.pens.me+"–"+M.pens.opp+"p)" : "");
  if(won) c.wins++; else if(!drew) c.losses++;
  M.resWon = won; M.resDrew = drew;

  // update tables + simulate AI results
  if(c.group && !f.ko){
    const g = c.group, oppT = g.teams.find(t=>t.name===f.opp);
    g.myGf += M.gMe; g.myGa += M.gOpp; oppT.gf += M.gOpp; oppT.ga += M.gMe;
    if(won) g.myPts += 3; else if(drew){ g.myPts++; oppT.pts++; } else oppT.pts += 3;
    const others = g.teams.filter(t=>t!==oppT);
    if(others.length===2){
      const r = quickSim(72+others[0].tier*6, 72+others[1].tier*6);
      others[0].gf+=r[0]; others[0].ga+=r[1]; others[1].gf+=r[1]; others[1].ga+=r[0];
      if(r[0]>r[1]) others[0].pts+=3; else if(r[1]>r[0]) others[1].pts+=3; else { others[0].pts++; others[1].pts++; }
      M.others.push({a:others[0].name, ga:r[0], gb:r[1], b:others[1].name});
    }
    g.played++;
    if(g.played===3 && !groupQualified()){
      c.done = true; c.won = false; S.phase = "finished"; M.note = "Knocked out in the group stage";
    }
  } else if(c.league){
    const L = c.league, oppT = L.teams.find(t=>t.name===f.opp);
    L.myGf += M.gMe; L.myGa += M.gOpp; L.myPl++; oppT.gf += M.gOpp; oppT.ga += M.gMe; oppT.pl++;
    if(won) L.myPts += 3; else if(drew){ L.myPts++; oppT.pts++; } else oppT.pts += 3;
    (f.aiPairs||[]).forEach(pr=>{
      const a = L.teams[pr[0]-1], b = L.teams[pr[1]-1]; // a at home
      const r = quickSim(a.avg+0.7, b.avg-0.7);
      a.gf+=r[0]; a.ga+=r[1]; a.pl++; b.gf+=r[1]; b.ga+=r[0]; b.pl++;
      if(r[0]>r[1]) a.pts+=3; else if(r[1]>r[0]) b.pts+=3; else { a.pts++; b.pts++; }
      M.others.push({a:a.name, ga:r[0], gb:r[1], b:b.name});
    });
  } else if(f.ko && !won){
    c.done = true; c.won = false; S.phase = "finished"; M.note = "Beaten in the "+f.round;
    if(f.round==="Final") addRecord(S.tour, "ru"); // lost the final = runner-up
  }

  // knockout bracket bookkeeping
  if(f.ko && c.bracket) advanceBracket(won);
  if(!c.done && !c.bracket){
    const rem = c.fixtures.filter(x=>!x.played && x.ko).length;
    if((c.group && c.group.played===3) || (TOURNAMENTS[S.tour].format==="knockout" && rem===3)) buildBracket();
  }

  // campaign complete?
  if(!c.done && !nextFixture()){
    c.done = true;
    if(c.league){
      const L = c.league;
      const best = Math.max.apply(null, L.teams.map(t=>t.pts));
      const bestGd = Math.max.apply(null, L.teams.filter(t=>t.pts===best).map(t=>t.gf-t.ga));
      c.won = L.myPts > best || (L.myPts===best && (L.myGf-L.myGa) >= bestGd);
    } else c.won = true;
    S.phase = "finished";
    if(c.won){
      M.note = "CHAMPIONS!";
      addRecord(S.tour, "w");
      celebrate();
    } else if(c.league){
      const pos = leaguePosition();
      M.note = "Finished "+ord(pos);
      if(pos===2) addRecord(S.tour, "ru");
    } else M.note = "So close — finished runner-up";
  }
  save();
  drawMatch();
  showSummary();
}

function leaguePosition(){
  const L = S.campaign.league;
  const rows = [{me:true, pts:L.myPts, gd:L.myGf-L.myGa, gf:L.myGf}]
    .concat(L.teams.map(t=>({pts:t.pts, gd:t.gf-t.ga, gf:t.gf})));
  rows.sort((a,b)=> b.pts-a.pts || b.gd-a.gd || b.gf-a.gf);
  return rows.findIndex(r=>r.me)+1;
}
function ord(n){ const s=["th","st","nd","rd"], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
function groupQualified(){
  const g = S.campaign.group;
  const rows = [{me:true, pts:g.myPts, gd:g.myGf-g.myGa, gf:g.myGf}]
    .concat(g.teams.map(t=>({pts:t.pts, gd:t.gf-t.ga, gf:t.gf})));
  rows.sort((a,b)=> b.pts-a.pts || b.gd-a.gd || b.gf-a.gf);
  return rows.findIndex(r=>r.me) < 2;
}

// ============================================================
// KNOCKOUT BRACKET — real draw; other ties are simulated,
// and your next opponent is the winner of the adjacent tie.
// ============================================================
function buildBracket(){
  const cfg = TOURNAMENTS[S.tour], c = S.campaign;
  const remaining = c.fixtures.filter(f=>!f.played && f.ko);
  const size = Math.pow(2, remaining.length);      // 16 (WC) or 8 (Euros / FA Cup)
  const used = c.fixtures.filter(f=>f.opp).map(f=>f.opp);
  let entrants = [];
  if(c.group){ // my group's runner-up also advances
    const rows = c.group.teams.slice().sort((a,b)=> b.pts-a.pts || (b.gf-b.ga)-(a.gf-a.ga));
    entrants.push([rows[0].name, rows[0].tier]);
  }
  const pool = shuffle(cfg.opps.filter(o=>used.indexOf(o[0])===-1 && !entrants.some(e=>e[0]===o[0])));
  while(entrants.length < size-1 && pool.length) entrants.push(pool.pop());
  entrants = shuffle(entrants);
  const rt = {}, tiers = {};
  entrants.forEach(e=>{ rt[e[0]] = 74 + e[1]*5 + rnd(-1.5,1.5); tiers[e[0]] = e[1]; });
  const names = entrants.map(e=>e[0]);
  const ties = [{a:"ME", b:names[0], ga:null, gb:null, pn:null, w:null, mine:true}];
  for(let i=1;i<size/2;i++) ties.push({a:names[2*i-1], b:names[2*i], ga:null, gb:null, pn:null, w:null, mine:false});
  c.bracket = { rt:rt, tiers:tiers, roundNames:remaining.map(f=>f.round), rounds:[ties], idx:0 };
  syncNextKO();
}
function syncNextKO(){
  const br = S.campaign.bracket; if(!br) return;
  const nf = S.campaign.fixtures.find(x=>!x.played && x.ko); if(!nf) return;
  const myTie = br.rounds[br.idx].find(t=>t.mine); if(!myTie) return;
  nf.opp = myTie.a==="ME" ? myTie.b : myTie.a;
  nf.tier = br.tiers[nf.opp] || 2;
}
function simTie(t, br){
  if(t.w) return;
  const ra = br.rt[t.a]||80, rb = br.rt[t.b]||80;
  const r = quickSim(ra, rb);
  t.ga = r[0]; t.gb = r[1];
  if(r[0]===r[1]){ // decided on penalties
    const aWins = Math.random() < 0.5 + (ra-rb)*0.02;
    const pw = ri(3,5), pl = pw - ri(1,2);
    t.pn = aWins ? pw+"–"+pl : pl+"–"+pw;
    t.w = aWins ? t.a : t.b;
  } else t.w = r[0]>r[1] ? t.a : t.b;
}
function advanceBracket(myWon){
  const c = S.campaign, br = c.bracket;
  const round = br.rounds[br.idx];
  const myTie = round.find(t=>t.mine);
  myTie.ga = M.gMe; myTie.gb = M.gOpp;
  myTie.pn = M.pens ? M.pens.me+"–"+M.pens.opp : null;
  myTie.w = myWon ? "ME" : myTie.b;
  round.forEach(t=>{ if(!t.mine) simTie(t, br); });
  M.others = round.filter(t=>!t.mine).map(t=>({a:t.a, ga:t.ga, gb:t.gb, b:t.b, pn:t.pn}));
  if(round.length > 1){
    const winners = round.map(t=>t.w);
    const next = [];
    for(let i=0;i<winners.length;i+=2){
      const a = winners[i], b = winners[i+1];
      const mine = (a==="ME" || b==="ME");
      next.push({a:mine?"ME":a, b:mine?(a==="ME"?b:a):b, ga:null, gb:null, pn:null, w:null, mine:mine});
    }
    br.rounds.push(next);
    br.idx++;
    if(myWon) syncNextKO();
    else finishBracketSim(br); // I'm out — play the rest of the bracket
  }
}
function finishBracketSim(br){
  let cur = br.rounds[br.rounds.length-1];
  while(true){
    cur.forEach(t=>simTie(t, br));
    if(cur.length===1) break;
    const winners = cur.map(t=>t.w);
    const next = [];
    for(let i=0;i<winners.length;i+=2) next.push({a:winners[i], b:winners[i+1], ga:null, gb:null, pn:null, w:null, mine:false});
    br.rounds.push(next);
    cur = next;
  }
}
function bracketHTML(){
  const br = S.campaign.bracket;
  let h = '<h3>Tournament Bracket</h3>';
  br.rounds.forEach((round,i)=>{
    h += '<div class="small" style="margin:10px 0 4px;font-weight:800;color:var(--gold);">'+esc(br.roundNames[i]||"")+'</div>';
    round.forEach(t=>{
      const an = t.a==="ME"?myName():t.a, bn = t.b==="ME"?myName():t.b;
      const done = t.w!==null, wA = t.w===t.a;
      h += '<div class="fixture'+(t.mine?' next':'')+'">'
         + '<span class="tn" style="width:38%;'+(done?(wA?'':'opacity:.55;'):'')+'">'+(t.a==="ME"?'<span class="gold">':'')+esc(an)+(t.a==="ME"?'</span>':'')+'</span>'
         + '<span class="fs">'+(done ? t.ga+'–'+t.gb+(t.pn?' <span class="small">('+t.pn+'p)</span>':'') : 'vs')+'</span>'
         + '<span class="tn" style="width:38%;text-align:right;'+(done?(wA?'opacity:.55;':''):'')+'">'+(t.b==="ME"?'<span class="gold">':'')+esc(bn)+(t.b==="ME"?'</span>':'')+'</span></div>';
    });
  });
  return h;
}

function toggleSpeed(){

function skipMatch(){
  if(!M || M.over || M.pens) return;
  stopMatchTimer();
  while(!M.over && !M.pens){ if(!minuteStep()){ break; } }
  if(!M.over && !M.pens && M.et){ while(!M.over && !M.pens){ if(!minuteStep()) break; } }
  drawMatch();
}
function backToCampaign(){
  M = null;
  if(S && S.phase==="match"){ S.phase = "campaign"; save(); }
  render();
}

window.addEventListener("load", function(){
  const saved = loadSave();
  if(saved && saved.phase && saved.phase!=="finished"){
    S = saved;
    if(S.phase==="match") S.phase = "campaign"; // mid-match resumes at fixture list
    const cfg = TOURNAMENTS[S.tour];
    render(); // show the game behind the modal
    showModal('<h2>Welcome back!</h2>'
      + '<p class="small" style="margin:8px 0 4px;">You have a '+cfg.emoji+' <b>'+cfg.name+'</b> run in progress'
      + (S.campaign ? ' ('+S.campaign.wins+'W–'+S.campaign.losses+'L)' : ' (building your XI)')+'.</p>'
      + '<button class="btn" onclick="resumeGame()">▶ Continue Game</button>'
      + '<button class="btn secondary" onclick="startNewFromModal()">Start New Game</button>');
  } else {
    if(saved) clearSave();
    render();
  }
});
function resumeGame(){ hideModal(); save(); render(); }
function startNewFromModal(){ hideModal(); clearSave(); render(); }
// keep state saved when leaving the page (e.g. tapping Menu)
window.addEventListener("pagehide", function(){ if(S) save(); });
</script>
</body>
</html>
