<head>

<style>
  :root{ --ink:#8a1240; --soft:#c76a90; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    background:
      radial-gradient(120% 85% at 10% -8%, #ffb3d0 0%, transparent 55%),
      radial-gradient(120% 80% at 92% 105%, #ffe3c9 0%, transparent 55%),
      linear-gradient(160deg, #e5326a 0%, #ff7ba6 46%, #ffd9ae 100%);
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    user-select:none;-webkit-user-select:none;touch-action:none;
    display:flex;flex-direction:column;align-items:center;
    padding:calc(env(safe-area-inset-top) + 6px) 8px calc(env(safe-area-inset-bottom) + 6px);
  }
  #shell{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column}
  .bar{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .pill{display:inline-flex;align-items:center;gap:5px;text-decoration:none;color:#c02255;
    background:rgba(255,255,255,.94);border:1.5px solid #fff;padding:6px 12px;border-radius:999px;
    font-size:12.5px;font-weight:800;box-shadow:0 3px 9px rgba(150,20,70,.28);cursor:pointer;white-space:nowrap}
  .pill:active{transform:scale(.95)}
  .title{flex:1;text-align:center;font-weight:900;letter-spacing:1.6px;line-height:1;
    font-size:clamp(15px,4.8vw,21px);text-shadow:0 2px 0 #cf2a60,0 4px 12px rgba(120,10,55,.4)}
  .strip{display:flex;gap:6px;margin-bottom:7px}
  .chip{flex:1;text-align:center;padding:6px 2px;border-radius:13px;
    background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.36)}
  .chip .k{font-size:8px;letter-spacing:1.1px;font-weight:900;opacity:.85}
  .chip .v{font-size:clamp(13px,4.2vw,17px);font-weight:900;font-variant-numeric:tabular-nums}
  #stage{flex:1;position:relative;min-height:0}
  #cv{display:block;position:absolute;inset:0;touch-action:none}
  #tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:7px}
  .tool{background:rgba(255,255,255,.95);border:1.5px solid #fff;border-radius:15px;
    padding:9px 2px 8px;text-align:center;cursor:pointer;color:#c02255;
    box-shadow:0 4px 0 rgba(175,35,90,.35),0 6px 14px rgba(150,20,70,.22)}
  .tool:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(175,35,90,.35)}
  .tool .ti{font-size:20px;line-height:1}
  .tool .tl{font-size:9px;font-weight:900;letter-spacing:.5px;margin-top:2px;opacity:.75}
  .ovl{position:absolute;inset:0;z-index:40;display:none;align-items:center;justify-content:center;
    background:rgba(150,25,75,.42);backdrop-filter:blur(6px);padding:12px}
  .ovl.on{display:flex}
  .card{width:100%;max-width:352px;background:linear-gradient(180deg,#fff,#fff5f8);
    border:2px solid #fff;border-radius:22px;padding:20px 18px 16px;text-align:center;
    color:#8a4a66;box-shadow:0 20px 50px rgba(120,10,55,.45);max-height:100%;overflow:auto}
  .card h2{font-size:24px;font-weight:900;letter-spacing:1px;color:#d92b6b;margin-bottom:3px}
  .card p{font-size:14px;line-height:1.55;color:#b0708c;margin:8px 0}
  .sizes{display:grid;grid-template-columns:1fr;gap:9px;margin-top:13px}
  .sz{border-radius:16px;padding:12px;cursor:pointer;color:#fff;font-weight:900;
    box-shadow:0 4px 0 rgba(0,0,0,.14);display:flex;align-items:center;justify-content:space-between}
  .sz:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.14)}
  .sz .sn{font-size:15px}
  .sz .stg{font-size:10.5px;opacity:.93;font-weight:800;margin-top:2px;text-align:left}
  .z-a{background:linear-gradient(180deg,#8fe3a8,#35b46b)}
  .z-b{background:linear-gradient(180deg,#ffcf7a,#f09420)}
  .z-c{background:linear-gradient(180deg,#ff8fb4,#d92b6b)}
  .btn{display:block;width:100%;margin-top:9px;padding:13px;border:none;border-radius:15px;
    font-size:15px;font-weight:900;cursor:pointer;letter-spacing:.4px;font-family:inherit}
  .btn-go{background:linear-gradient(180deg,#ff8fb4,#d92b6b);color:#fff;
    box-shadow:0 5px 0 #a81a52,0 8px 18px rgba(190,40,100,.32)}
  .btn-go:active{transform:translateY(3px);box-shadow:0 2px 0 #a81a52}
  .btn-alt{background:#fff0f5;color:#c02255;border:1.5px solid #fad8e4}
  .rules{text-align:left;font-size:13px;line-height:1.7;color:#a86b83;margin:11px 2px}
  .rules b{color:#d92b6b}
  .stats{display:flex;gap:8px;margin-top:12px}
  .st{flex:1;background:#fff0f5;border-radius:13px;padding:8px 4px}
  .st .sk{font-size:8.5px;letter-spacing:1.1px;font-weight:900;color:#d79bb4}
  .st .sv{font-size:16px;font-weight:900;font-variant-numeric:tabular-nums;color:#d92b6b}
  @media (max-height:700px){
    .card{padding:15px 15px 12px}.card h2{font-size:20px}
    .rules{font-size:11.7px;line-height:1.5}.btn{padding:11px;font-size:14px;margin-top:7px}
    .sz{padding:10px}.sz .sn{font-size:14px}
  }
</style>

<div id="shell">
  <div class="bar">

  </div>

<script src="achievements.js"></script>
<script>
/* Snake - the rules, with no drawing and no input in them.
   Everything the game does to the world happens in step(), so the same code
   that runs on screen can be hammered headlessly a few million steps in Node. */
function makeSnake(){
  "use strict";

  /* 0 up, 1 right, 2 down, 3 left */
  var DR=[-1,0,1,0], DC=[0,1,0,-1];
  var OPP=[2,3,0,1];
  var APPLE_GROW=1, BONUS_GROW=3, APPLE_SCORE=10, BONUS_SCORE=50;
  var BONUS_EVERY=5, BONUS_STEPS=45;

  function rng(seed){
    var s=seed>>>0||1;
    return function(){ s^=s<<13; s>>>=0; s^=s>>17; s^=s<<5; s>>>=0; return s/4294967296; };
  }

  function create(W,H,opts){
    var st={
      W:W, H:H,
      wrap: !!opts.wrap,
      body: [],            /* head first */
      dir: 1,
      queue: [],
      grow: 0,
      food: -1,
      bonus: -1,
      bonusLeft: 0,
      apples: 0,
      bonuses: 0,
      score: 0,
      steps: 0,
      alive: true,
      won: false,
      rand: rng(opts.seed || ((Math.random()*1e9)|0))
    };
    /* start in the middle, three long, pointing right */
    var r=(H/2)|0, c=(W/2)|0;
    st.body=[r*W+c, r*W+c-1, r*W+c-2];
    spawnFood(st);
    return st;
  }

  function onBody(st,cell,limit){
    var n=(limit==null)?st.body.length:limit;
    for(var i=0;i<n;i++) if(st.body[i]===cell) return true;
    return false;
  }
  function freeCells(st){
    var out=[], used={}, i;
    for(i=0;i<st.body.length;i++) used[st.body[i]]=1;
    if(st.food>=0) used[st.food]=1;
    if(st.bonus>=0) used[st.bonus]=1;
    for(i=0;i<st.W*st.H;i++) if(!used[i]) out.push(i);
    return out;
  }
  function spawnFood(st){
    var free=freeCells(st);
    /* the bonus can be sitting on the last empty square - clear it rather than
       leave the board with nothing to eat */
    if(!free.length && st.bonus>=0){ st.bonus=-1; st.bonusLeft=0; free=freeCells(st); }
    if(!free.length){ st.food=-1; return false; }
    st.food=free[(st.rand()*free.length)|0];
    return true;
  }
  function spawnBonus(st){
    var free=freeCells(st);
    if(!free.length) return false;
    st.bonus=free[(st.rand()*free.length)|0];
    st.bonusLeft=BONUS_STEPS;
    return true;
  }

  /* queue a turn; a straight reversal is never accepted, and at most two turns
     are held so a quick flick-flick still registers both */
  function turn(st,d){
    if(d<0||d>3) return false;
    var last = st.queue.length ? st.queue[st.queue.length-1] : st.dir;
    if(d===last || d===OPP[last]) return false;
    if(st.queue.length>=2) return false;
    st.queue.push(d);
    return true;
  }

  function ahead(st,cell,d){
    var r=(cell/st.W)|0, c=cell%st.W;
    r+=DR[d]; c+=DC[d];
    if(r<0||c<0||r>=st.H||c>=st.W){
      if(!st.wrap) return -1;
      if(r<0) r=st.H-1; else if(r>=st.H) r=0;
      if(c<0) c=st.W-1; else if(c>=st.W) c=0;
    }
    return r*st.W+c;
  }

  /* one tick of the world. Returns what happened so the page can react. */
  function step(st){
    var ev={ate:false, bonus:false, dead:false, won:false, turned:false};
    if(!st.alive||st.won) return ev;

    if(st.queue.length){ st.dir=st.queue.shift(); ev.turned=true; }

    var next=ahead(st,st.body[0],st.dir);
    if(next<0){ st.alive=false; ev.dead=true; return ev; }

    var eats = (next===st.food);
    var eatsBonus = (st.bonus>=0 && next===st.bonus);
    if(eats) st.grow+=APPLE_GROW;
    if(eatsBonus) st.grow+=BONUS_GROW;

    /* the tail square is vacated this tick unless something is still growing,
       so it is only a collision while the snake is lengthening */
    var keepsTail = st.grow>0;
    if(onBody(st,next, keepsTail ? st.body.length : st.body.length-1)){
      st.alive=false; ev.dead=true;
      if(eats) st.grow-=APPLE_GROW;
      if(eatsBonus) st.grow-=BONUS_GROW;
      return ev;
    }

    st.body.unshift(next);
    if(st.grow>0) st.grow--; else st.body.pop();
    st.steps++;

    if(eats){
      st.apples++; st.score+=APPLE_SCORE; ev.ate=true;
      if(st.body.length>=st.W*st.H){ st.won=true; ev.won=true; st.food=-1; return ev; }
      spawnFood(st);
      if(st.apples%BONUS_EVERY===0 && st.bonus<0) spawnBonus(st);
    }
    if(eatsBonus){
      st.bonuses++; st.score+=BONUS_SCORE; ev.bonus=true;
      st.bonus=-1; st.bonusLeft=0;
      if(st.body.length>=st.W*st.H){ st.won=true; ev.won=true; return ev; }
    }
    if(st.bonus>=0){
      st.bonusLeft--;
      if(st.bonusLeft<=0){ st.bonus=-1; st.bonusLeft=0; }
    }
    return ev;
  }

  /* every rule the game promises, checked from the outside */
  function audit(st){
    var i, seen={}, N=st.W*st.H;
    if(st.body.length<1) return "empty snake";
    if(st.body.length>N) return "snake longer than the board";
    for(i=0;i<st.body.length;i++){
      var v=st.body[i];
      if(v<0||v>=N) return "segment "+i+" off the board";
      if(seen[v]) return "snake overlaps itself at "+v;
      seen[v]=1;
    }
    for(i=1;i<st.body.length;i++){
      var a=st.body[i-1], b=st.body[i];
      var ar=(a/st.W)|0, ac=a%st.W, br=(b/st.W)|0, bc=b%st.W;
      var dr=Math.abs(ar-br), dc=Math.abs(ac-bc);
      if(st.wrap){
        if(dr===st.H-1) dr=1;
        if(dc===st.W-1) dc=1;
      }
      if(dr+dc!==1) return "gap between segments "+(i-1)+" and "+i;
    }
    if(st.food>=0){
      if(st.food>=N) return "food off the board";
      if(seen[st.food]) return "food inside the snake";
    }
    if(st.bonus>=0){
      if(st.bonus>=N) return "bonus off the board";
      if(seen[st.bonus]) return "bonus inside the snake";
      if(st.bonus===st.food) return "bonus on top of the food";
    }
    if(st.food<0 && st.alive && !st.won && st.body.length<N) return "no food on a board with room";
    if(st.score !== st.apples*APPLE_SCORE + st.bonuses*BONUS_SCORE) return "score does not match what was eaten";
    if(st.body.length !== 3 + st.apples*APPLE_GROW + st.bonuses*BONUS_GROW - st.grow)
      return "length does not match what was eaten";
    if(st.queue.length>2) return "turn queue too long";
    return null;
  }

  return { DR:DR, DC:DC, OPP:OPP, rng:rng, create:create, step:step, turn:turn,
           ahead:ahead, audit:audit, spawnFood:spawnFood, freeCells:freeCells,
           APPLE_SCORE:APPLE_SCORE, BONUS_SCORE:BONUS_SCORE,
           APPLE_GROW:APPLE_GROW, BONUS_GROW:BONUS_GROW,
           BONUS_EVERY:BONUS_EVERY, BONUS_STEPS:BONUS_STEPS };
}
if(typeof module!=='undefined') module.exports = makeSnake;
</script>
<script>
(function(){
"use strict";
var SN=makeSnake();
var LS="gg_snake_";
function load(k,fb){ try{ var v=localStorage.getItem(LS+k); return v==null?fb:JSON.parse(v);}catch(e){return fb;} }
function save(k,v){ try{ localStorage.setItem(LS+k, JSON.stringify(v)); }catch(e){} }

var COLS=15, ROWS=20;
var MODES=[
  {id:"easy", name:"Gentle",   cls:"z-a", ms:175, wrap:true,  tag:"Slow &middot; edges wrap around"},
  {id:"med",  name:"Tricky",   cls:"z-b", ms:120, wrap:true,  tag:"Brisk &middot; edges wrap around"},
  {id:"hard", name:"Fiendish", cls:"z-c", ms:85,  wrap:false, tag:"Fast &middot; the edges are walls"}
];
function modeOf(id){ for(var i=0;i<MODES.length;i++) if(MODES[i].id===id) return MODES[i]; return MODES[0]; }

/* ---------------- state ---------------- */
var mId, S, started, ready, running, dying, dieAt, acc, lastT, deathFlash, lastWasBest, bestAtStart;
/* Only the test hook ever sets this. It stops the clock and nothing else, so a
   test can advance the world a step at a time instead of racing the animation
   loop. With the hook stripped out it stays false for good. */
var frozen=false;

function stepMs(){
  /* it winds up as the snake grows, but only so far */
  var base=modeOf(mId).ms;
  return Math.max(base*0.68, base*(1 - S.apples*0.010));
}

function newRun(id){
  mId=id; save("mode",id);
  var m=modeOf(id);
  S=SN.create(COLS,ROWS,{wrap:m.wrap});
  ready=true; running=true; dying=false; dieAt=0; acc=0; deathFlash=0; lastWasBest=false;
  /* the best is banked as you go, so the run's own starting best is what the
     end screen has to beat - otherwise NEW BEST could never appear */
  bestAtStart=load("best_"+id,0);
  lastT=0;
  layout(); paintHUD();
  /* does not persist - boot calls this before the title screen reads the save */
}

/* ---------------- audio ---------------- */
var AC=null;
function muted(){ try{ return localStorage.getItem("gg_muted")==="1"; }catch(e){ return false; } }
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=false; } } return AC; }
function beep(f,dur,type,vol,slide){
  if(muted()) return; var a=ac(); if(!a) return;
  try{
    var o=a.createOscillator(), g=a.createGain();
    o.type=type||"sine"; o.frequency.setValueAtTime(f,a.currentTime);
    if(slide) o.frequency.exponentialRampToValueAtTime(slide,a.currentTime+dur);
    g.gain.setValueAtTime(.0001,a.currentTime);
    g.gain.exponentialRampToValueAtTime(vol||.05,a.currentTime+.012);
    g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+dur);
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+dur+.02);
  }catch(e){}
}

/* ---------------- layout ---------------- */
var cv=document.getElementById("cv"), ctx=cv.getContext("2d");
var DPR=Math.min(window.devicePixelRatio||1,3);
var VW=0,VH=0,CS=0,OX=0,OY=0;
function layout(){
  var st=document.getElementById("stage");
  var aw=st.clientWidth, ah=st.clientHeight;
  if(aw<40||ah<40) return;
  VW=aw; VH=ah;
  cv.style.width=aw+"px"; cv.style.height=ah+"px";
  cv.width=Math.round(aw*DPR); cv.height=Math.round(ah*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  CS=Math.max(6, Math.floor(Math.min((aw-8)/COLS, (ah-8)/ROWS)));
  OX=Math.round((aw-CS*COLS)/2); OY=Math.round((ah-CS*ROWS)/2);
}
window.addEventListener("resize", function(){ layout(); });

function rr(x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function mid(i){ return { x:OX+(i%COLS)*CS+CS/2, y:OY+((i/COLS)|0)*CS+CS/2 }; }
function touching(a,b){
  var ar=(a/COLS)|0, ac=a%COLS, br=(b/COLS)|0, bc=b%COLS;
  return Math.abs(ar-br)+Math.abs(ac-bc)===1;
}

/* ---------------- drawing ---------------- */
function drawApple(m,r,col,leaf){
  ctx.fillStyle=col;
  ctx.beginPath(); ctx.arc(m.x,m.y,r,0,6.284); ctx.fill();
  ctx.fillStyle="rgba(255,255,255,.55)";
  ctx.beginPath(); ctx.arc(m.x-r*0.32,m.y-r*0.34,r*0.26,0,6.284); ctx.fill();
  if(leaf){
    ctx.fillStyle="#2fbf4a";
    ctx.beginPath();
    ctx.ellipse(m.x+r*0.42,m.y-r*0.86,r*0.40,r*0.20,-0.7,0,6.284);
    ctx.fill();
  }
}

function frame(ts){
  requestAnimationFrame(frame);
  if(!CS){ layout(); if(!CS) return; }
  if(!S) return;

  /* --- clock --- */
  if(!lastT) lastT=ts||0;
  var dt=Math.min(64,(ts||0)-lastT); lastT=ts||0;
  if(started && running && !ready && !frozen && S.alive && !S.won && !dying){
    acc+=dt;
    var ms=stepMs(), guard=0;
    while(acc>=ms && guard++<4){ acc-=ms; advance(); ms=stepMs(); }
  }
  if(dying && (ts||0)>dieAt){ dying=false; loseScreen(); }

  var progress = (started && running && !ready && !frozen && S.alive && !S.won && !dying)
    ? Math.max(0,Math.min(1,acc/stepMs())) : 0;

  /* --- board --- */
  ctx.clearRect(0,0,VW,VH);
  var GW=CS*COLS, GH=CS*ROWS;
  ctx.fillStyle="#fff6ec";
  rr(OX-4,OY-4,GW+8,GH+8,Math.max(10,CS*0.6)); ctx.fill();
  if(!modeOf(mId).wrap){
    ctx.strokeStyle="#f0b9cd"; ctx.lineWidth=3;
    rr(OX-2,OY-2,GW+4,GH+4,Math.max(9,CS*0.55)); ctx.stroke();
  }
  ctx.strokeStyle="rgba(220,180,195,.30)"; ctx.lineWidth=1;
  for(var g=1;g<COLS;g++){ ctx.beginPath(); ctx.moveTo(OX+g*CS,OY); ctx.lineTo(OX+g*CS,OY+GH); ctx.stroke(); }
  for(g=1;g<ROWS;g++){ ctx.beginPath(); ctx.moveTo(OX,OY+g*CS); ctx.lineTo(OX+GW,OY+g*CS); ctx.stroke(); }

  /* --- food --- */
  if(S.food>=0) drawApple(mid(S.food), CS*0.30, "#e63946", true);
  if(S.bonus>=0){
    var bm=mid(S.bonus);
    var pulse=0.86+0.14*Math.sin((ts||0)/140);
    var left=S.bonusLeft/SN.BONUS_STEPS;
    ctx.strokeStyle="rgba(255,183,3,.75)"; ctx.lineWidth=Math.max(2,CS*0.09);
    ctx.beginPath(); ctx.arc(bm.x,bm.y,CS*0.42,-1.5708,-1.5708+6.283*left); ctx.stroke();
    drawApple(bm, CS*0.30*pulse, "#ffb703", false);
  }

  /* --- snake, split where it crosses the seam ---
     Each piece is also run half a square past the edge it left through, so a
     wrapping snake reads as one animal going off one side and coming back on
     the other rather than two stubs floating short of the border. */
  var body=S.body, runs=[], seams=[], cur=[body[0]], i;
  for(i=1;i<body.length;i++){
    if(touching(body[i-1],body[i])){ cur.push(body[i]); continue; }
    var a=body[i-1], b=body[i];
    var ar=(a/COLS)|0, ac=a%COLS, br=(b/COLS)|0, bc=b%COLS;
    /* a is the head side of the break, b the tail side: travel runs b -> a */
    var sdx = (ac===bc) ? 0 : (ac-bc>0 ? -1 : 1);
    var sdy = (ar===br) ? 0 : (ar-br>0 ? -1 : 1);
    runs.push(cur); seams.push({dx:sdx, dy:sdy}); cur=[b];
  }
  runs.push(cur);

  var pts=runs.map(function(run){ return run.map(mid); });
  /* a one-square piece needs a second point before it can be stretched twice */
  if(pts[0].length===1 && seams.length) pts[0].push({x:pts[0][0].x, y:pts[0][0].y});
  for(i=0;i<seams.length;i++){
    var out=pts[i][pts[i].length-1];
    pts[i][pts[i].length-1]={ x:out.x - seams[i].dx*CS*0.5, y:out.y - seams[i].dy*CS*0.5 };
    var inn=pts[i+1][0];
    pts[i+1][0]={ x:inn.x + seams[i].dx*CS*0.5, y:inn.y + seams[i].dy*CS*0.5 };
  }

  /* head slides forward, tail slides in behind it */
  if(progress>0 && pts[0].length){
    var nxt=SN.ahead(S, body[0], S.dir);
    if(nxt>=0 && touching(body[0],nxt)){
      var nm=mid(nxt), p0=pts[0][0];
      pts[0][0]={ x:p0.x+(nm.x-p0.x)*progress, y:p0.y+(nm.y-p0.y)*progress };
    }
    var lastRun=pts[pts.length-1];
    if(lastRun.length>=2){
      var a=lastRun[lastRun.length-1], b=lastRun[lastRun.length-2];
      lastRun[lastRun.length-1]={ x:a.x+(b.x-a.x)*progress, y:a.y+(b.y-a.y)*progress };
    }else if(pts.length>1 && progress>0.5){
      pts.pop();
    }
  }

  var green = deathFlash>0 ? (Math.floor(deathFlash/60)%2 ? "#ff6b6b" : "#2fbf4a") : "#2fbf4a";
  if(deathFlash>0) deathFlash-=dt;
  ctx.lineCap="round"; ctx.lineJoin="round";
  ctx.save();
  ctx.beginPath(); rr(OX,OY,GW,GH,Math.max(6,CS*0.35)); ctx.clip();
  ctx.strokeStyle=green; ctx.lineWidth=CS*0.76;
  for(i=0;i<pts.length;i++){
    var run=pts[i];
    ctx.beginPath();
    ctx.moveTo(run[0].x,run[0].y);
    for(var k=1;k<run.length;k++) ctx.lineTo(run[k].x,run[k].y);
    if(run.length===1) ctx.lineTo(run[0].x+0.01,run[0].y);
    ctx.stroke();
  }
  ctx.restore();

  /* head: a touch bigger, with eyes */
  var h=pts[0][0];
  ctx.fillStyle=green;
  ctx.beginPath(); ctx.arc(h.x,h.y,CS*0.42,0,6.284); ctx.fill();
  var dx=SN.DC[S.dir], dy=SN.DR[S.dir];
  var ex=-dy, ey=dx;
  ctx.fillStyle="#fff";
  for(var s=-1;s<=1;s+=2){
    ctx.beginPath();
    ctx.arc(h.x+dx*CS*0.13+ex*s*CS*0.16, h.y+dy*CS*0.13+ey*s*CS*0.16, CS*0.115, 0, 6.284);
    ctx.fill();
  }
  ctx.fillStyle="#173d22";
  for(s=-1;s<=1;s+=2){
    ctx.beginPath();
    ctx.arc(h.x+dx*CS*0.20+ex*s*CS*0.16, h.y+dy*CS*0.20+ey*s*CS*0.16, CS*0.055, 0, 6.284);
    ctx.fill();
  }

  /* --- waiting to go --- */
  if(started && ready && S.alive){
    ctx.fillStyle="rgba(217,43,107,.90)";
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.font="900 "+Math.round(Math.min(20,CS*0.85))+"px -apple-system,Helvetica,Arial";
    ctx.fillText("SWIPE TO GO", OX+GW/2, OY+GH*0.24);
    ctx.font="800 "+Math.round(Math.min(13,CS*0.58))+"px -apple-system,Helvetica,Arial";
    ctx.fillStyle="rgba(160,90,120,.85)";
    ctx.fillText("or use the turn buttons", OX+GW/2, OY+GH*0.24+Math.min(26,CS*1.1));
  }
}

/* ---------------- the one place the world moves ---------------- */
function advance(){
  var ev=SN.step(S);
  if(ev.ate){
    beep(660,.06,"triangle",.05,900);
    if(window.GGA){
      GGA.haptic("light");
      GGA.award("sk_first");
    }
  }
  if(ev.bonus){
    beep(880,.10,"triangle",.06,1320);
    setTimeout(function(){ beep(1170,.12,"triangle",.06); },90);
    if(window.GGA){ GGA.haptic("success"); GGA.award("sk_bonus"); }
  }
  if(ev.ate||ev.bonus){
    var best=load("best_"+mId,0);
    if(S.score>best) save("best_"+mId,S.score);
    if(window.GGA){
      if(S.score>=100) GGA.award("sk_100");
      if(S.score>=500) GGA.award("sk_500");
      if(S.body.length>=25) GGA.award("sk_len25");
      if(mId==="hard" && S.score>=200) GGA.award("sk_hard");
    }
    persist();
  }
  if(ev.won){ endRun(true); }
  else if(ev.dead){ endRun(false); }
  paintHUD();
  return ev;
}

function endRun(won){
  running=false;
  save("cur",null);
  var best=load("best_"+mId,0);
  lastWasBest = (S.score>bestAtStart && S.score>0);
  if(S.score>best) save("best_"+mId,S.score);
  var runs=load("runs_"+mId,0)+1; save("runs_"+mId,runs);
  if(window.GGA){
    var all=true;
    for(var i=0;i<MODES.length;i++) if(!load("runs_"+MODES[i].id,0)) all=false;
    if(all) GGA.award("sk_all");
  }
  paintHUD();
  if(won){
    beep(660,.12,"triangle",.08);
    setTimeout(function(){ beep(880,.12,"triangle",.08); },120);
    setTimeout(function(){ beep(1170,.28,"triangle",.09); },250);
    if(window.GGA) GGA.haptic("success");
    setTimeout(function(){ winScreen(); },520);
  }else{
    beep(300,.4,"sawtooth",.07,110);
    if(window.GGA) GGA.haptic("error");
    deathFlash=560;
    dying=true; dieAt=(performance.now?performance.now():Date.now())+680;
  }
}

function paintHUD(){
  document.getElementById("vScore").textContent=S.score;
  document.getElementById("vLen").textContent=S.body.length;
  document.getElementById("vBest").textContent=load("best_"+mId,0);
}

/* ---------------- save ---------------- */
function persist(){
  /* Before the player has started, this page owns nothing: pagehide and
     visibilitychange both fire while the title screen is up, and clearing here
     would eat the save that CARRY ON is about to offer. */
  if(!started) return;
  if(!S.alive || S.won || S.apples===0){ save("cur",null); return; }
  save("cur",{ m:mId, b:S.body.slice(), d:S.dir, f:S.food, bo:S.bonus, bl:S.bonusLeft,
               g:S.grow, sc:S.score, ap:S.apples, bn:S.bonuses, bs:bestAtStart });
}
function restore(){
  var c=load("cur",null);
  if(!c||!c.b||c.b.length<1) return false;
  if(!modeOf(c.m)) return false;
  newRun(c.m);
  var N=COLS*ROWS, i, seen={};
  for(i=0;i<c.b.length;i++){
    if(c.b[i]<0||c.b[i]>=N||seen[c.b[i]]) return false;
    seen[c.b[i]]=1;
  }
  S.body=c.b.slice(); S.dir=c.d|0; S.food=c.f; S.bonus=(c.bo==null?-1:c.bo);
  S.bonusLeft=c.bl|0; S.grow=c.g|0; S.score=c.sc|0; S.apples=c.ap|0; S.bonuses=c.bn|0;
  S.queue=[];
  if(c.bs!=null) bestAtStart=c.bs|0;
  if(SN.audit(S)){ newRun(c.m); return false; }
  ready=true; running=true;
  paintHUD();
  return true;
}

/* ---------------- input ---------------- */
function go(){ if(ready){ ready=false; acc=0; lastT=0; } }
function steer(d){
  if(!started||!S.alive||S.won||dying) return;
  if(!running) return;
  if(SN.turn(S,d)){ go(); if(window.GGA) GGA.haptic("light"); }
  else go();
}
function relative(side){          /* -1 left, +1 right */
  if(!started||!S.alive||S.won) return;
  var base = S.queue.length ? S.queue[S.queue.length-1] : S.dir;
  steer(((base + (side>0?1:3)) % 4));
}

var sx=0, sy=0, swiping=false;
var THRESH=18;
function pt(e){
  var b=cv.getBoundingClientRect();
  var t=(e.touches&&e.touches.length)?e.touches[0]:((e.changedTouches&&e.changedTouches.length)?e.changedTouches[0]:e);
  return {x:t.clientX-b.left, y:t.clientY-b.top};
}
function onDown(e){
  if(!started) return;
  e.preventDefault();
  var p=pt(e); sx=p.x; sy=p.y; swiping=true;
}
function onMove(e){
  if(!swiping) return;
  if(e.cancelable) e.preventDefault();
  var p=pt(e), dx=p.x-sx, dy=p.y-sy;
  if(Math.abs(dx)<THRESH && Math.abs(dy)<THRESH) return;
  if(Math.abs(dx)>Math.abs(dy)) steer(dx>0?1:3);
  else steer(dy>0?2:0);
  sx=p.x; sy=p.y;              /* let one long drag turn more than once */
}
function onUp(e){
  if(!swiping) return;
  var p=pt(e), dx=p.x-sx, dy=p.y-sy;
  if(Math.abs(dx)<THRESH && Math.abs(dy)<THRESH) go();   /* a tap just starts it */
  swiping=false;
}
cv.addEventListener("touchstart",onDown,{passive:false});
cv.addEventListener("touchmove",onMove,{passive:false});
cv.addEventListener("touchend",onUp);
cv.addEventListener("touchcancel",function(){ swiping=false; });
cv.addEventListener("mousedown",onDown);
window.addEventListener("mousemove",onMove);
window.addEventListener("mouseup",onUp);
cv.addEventListener("contextmenu",function(e){ e.preventDefault(); });
window.addEventListener("keydown",function(e){
  var k=e.key;
  if(k==="ArrowUp") steer(0); else if(k==="ArrowRight") steer(1);
  else if(k==="ArrowDown") steer(2); else if(k==="ArrowLeft") steer(3);
  else return;
  e.preventDefault();
});

document.getElementById("tLeft").onclick=function(){ relative(-1); };
document.getElementById("tRight").onclick=function(){ relative(1); };
document.getElementById("tNew").onclick=function(){
  if(!started) return;
  if(!S.alive||S.won){ newRun(mId); closeOvl(); return; }
  running=false;
  openOvl('<h2>START AGAIN?</h2><p>This run will be lost.</p>'+
    '<button class="btn btn-go" id="y">YES, NEW RUN</button>'+
    '<button class="btn btn-alt" id="n">KEEP GOING</button>');
  card.querySelector("#y").onclick=function(){ newRun(mId); persist(); closeOvl(); };
  card.querySelector("#n").onclick=function(){ running=true; lastT=0; closeOvl(); };
};

/* ---------------- screens ---------------- */
var ovl=document.getElementById("ovl"), card=document.getElementById("card");
function openOvl(h){ card.innerHTML=h; ovl.classList.add("on"); }
function closeOvl(){ ovl.classList.remove("on"); }

function titleScreen(){
  running=false;
  var cur=load("cur",null);
  var h='<h2>SNAKE</h2><p>Eat the apples, grow long, and do not tie yourself in a knot.</p><div class="sizes">';
  for(var i=0;i<MODES.length;i++){
    var m=MODES[i], b=load("best_"+m.id,0);
    h+='<div class="sz '+m.cls+'" data-m="'+m.id+'"><div style="text-align:left">'+
       '<div class="sn">'+m.name+'</div><div class="stg">'+m.tag+'</div></div>'+
       '<div style="font-size:12px;font-weight:900">'+(b?b:"")+'</div></div>';
  }
  h+='</div>';
  if(cur&&cur.b) h+='<button class="btn btn-go" id="bResume">CARRY ON &middot; '+
    modeOf(cur.m).name+' '+(cur.sc|0)+'</button>';
  h+='<button class="btn btn-alt" id="bRules">HOW TO PLAY</button>';
  openOvl(h);
  Array.prototype.forEach.call(card.querySelectorAll(".sz"), function(el){
    el.onclick=function(){
      started=true; newRun(el.getAttribute("data-m")); persist(); closeOvl(); layout();
    };
  });
  var br=card.querySelector("#bResume");
  if(br) br.onclick=function(){
    started=true;
    if(!restore()) newRun(load("mode","easy"));
    persist(); closeOvl(); layout();
  };
  card.querySelector("#bRules").onclick=rulesScreen;
}
function rulesScreen(){
  openOvl('<h2>HOW TO PLAY</h2><div class="rules">'+
    '&#9642; <b>Swipe anywhere on the board</b> to turn. One long drag can turn you more than once.<br><br>'+
    '&#9642; Or use <b>Turn Left</b> and <b>Turn Right</b> at the bottom &mdash; easier one-handed.<br><br>'+
    '&#9642; Every apple is 10 and adds a segment. A <b>golden apple</b> shows up every fifth one: 50 points and three segments, but it does not hang about.<br><br>'+
    '&#9642; You cannot double back on yourself, and running into your own body ends the run.<br><br>'+
    '&#9642; On <b>Gentle</b> and <b>Tricky</b> the edges wrap around. On <b>Fiendish</b> they are walls.<br><br>'+
    '&#9642; The snake speeds up as it grows. Nothing moves until you make the first turn, so take your time.'+
    '</div><button class="btn btn-go" id="bBack">GOT IT</button>');
  card.querySelector("#bBack").onclick=titleScreen;
}
function loseScreen(){
  var best=load("best_"+mId,0);
  openOvl('<h2>'+(lastWasBest?"NEW BEST!":"CAUGHT YOURSELF")+'</h2>'+
    '<p>'+(modeOf(mId).wrap?"You ran into yourself.":"Walls and your own tail &mdash; both count.")+'</p>'+
    '<div class="stats">'+
      '<div class="st"><div class="sk">SCORE</div><div class="sv">'+S.score+'</div></div>'+
      '<div class="st"><div class="sk">LENGTH</div><div class="sv">'+S.body.length+'</div></div>'+
      '<div class="st"><div class="sk">BEST</div><div class="sv">'+best+'</div></div>'+
    '</div>'+
    '<button class="btn btn-go" id="bAgain">ANOTHER GO</button>'+
    '<button class="btn btn-alt" id="bMenu">CHANGE SPEED</button>');
  card.querySelector("#bAgain").onclick=function(){ newRun(mId); persist(); closeOvl(); layout(); };
  card.querySelector("#bMenu").onclick=titleScreen;
}
function winScreen(){
  openOvl('<h2>THE WHOLE BOARD!</h2>'+
    '<p>Every single square. That should not be possible.</p>'+
    '<div class="stats">'+
      '<div class="st"><div class="sk">SCORE</div><div class="sv">'+S.score+'</div></div>'+
      '<div class="st"><div class="sk">LENGTH</div><div class="sv">'+S.body.length+'</div></div>'+
    '</div>'+
    '<button class="btn btn-go" id="bAgain2">ANOTHER GO</button>'+
    '<button class="btn btn-alt" id="bMenu4">CHANGE SPEED</button>');
  card.querySelector("#bAgain2").onclick=function(){ newRun(mId); persist(); closeOvl(); layout(); };
  card.querySelector("#bMenu4").onclick=titleScreen;
}
document.getElementById("bPause").onclick=function(){
  if(!started||!S.alive||S.won){ titleScreen(); return; }
  running=false; persist();
  openOvl('<h2>PAUSED</h2>'+
    '<div class="stats">'+
      '<div class="st"><div class="sk">SPEED</div><div class="sv" style="font-size:13px">'+modeOf(mId).name+'</div></div>'+
      '<div class="st"><div class="sk">SCORE</div><div class="sv">'+S.score+'</div></div>'+
      '<div class="st"><div class="sk">LENGTH</div><div class="sv">'+S.body.length+'</div></div>'+
    '</div>'+
    '<button class="btn btn-go" id="bGo">BACK TO IT</button>'+
    '<button class="btn btn-alt" id="bMenu2">CHANGE SPEED</button>');
  card.querySelector("#bGo").onclick=function(){ running=true; ready=true; lastT=0; acc=0; closeOvl(); };
  card.querySelector("#bMenu2").onclick=titleScreen;
};

/* ---------------- boot ---------------- */
newRun(load("mode","easy"));
started=false; running=false;
titleScreen();
requestAnimationFrame(frame);
setTimeout(function(){ layout(); },50);
window.addEventListener("orientationchange", function(){ setTimeout(layout,220); });
document.addEventListener("visibilitychange", function(){
  if(document.hidden){ running=false; persist(); }   /* never die in your pocket */
});
window.addEventListener("pagehide", persist);


})();
</script>
</body>
</html>
