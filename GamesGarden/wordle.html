<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Wordle</title>
<style>
  :root{
    --bg:#080840; --tile-border:#3a3a3c; --tile-border-active:#565758;
    --text:#ffffff; --key-bg:#818384; --absent:#3a3a3c; --present:#b59f3b; --correct:#538d4e;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    display:flex; flex-direction:column; align-items:center;
    user-select:none; -webkit-user-select:none; touch-action:manipulation;
    padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
  }
  header{
    width:100%; max-width:500px; display:flex; align-items:center; justify-content:space-between;
    padding:8px 12px; border-bottom:1px solid var(--tile-border);
  }
  header h1{font-size:26px; font-weight:800; letter-spacing:2px; text-transform:uppercase;}
  .hbtn{
    background:none; border:1px solid var(--tile-border); color:var(--text); border-radius:6px;
    padding:5px 10px; font-size:15px; cursor:pointer;
  }
  #progress{font-size:11px; color:#818384; margin-top:4px;}
  #board-wrap{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; width:100%;}
  #board{display:grid; grid-template-rows:repeat(6,1fr); gap:5px;}
  .row{display:grid; grid-template-columns:repeat(5,1fr); gap:5px;}
  .tile{
    width:58px; height:58px; border:2px solid var(--tile-border);
    display:flex; align-items:center; justify-content:center;
    font-size:30px; font-weight:800; text-transform:uppercase;
    transition:transform .1s;
  }
  @media (max-height:700px){ .tile{width:48px;height:48px;font-size:25px;} }
  @media (max-height:600px){ .tile{width:40px;height:40px;font-size:21px;} }
  .tile.filled{border-color:var(--tile-border-active); animation:pop .1s;}
  .tile.correct{background:var(--correct); border-color:var(--correct);}
  .tile.present{background:var(--present); border-color:var(--present);}
  .tile.absent{background:var(--absent); border-color:var(--absent);}
  .tile.flip{animation:flip .5s ease forwards;}
  @keyframes pop{50%{transform:scale(1.12);}}
  @keyframes flip{0%{transform:rotateX(0);}50%{transform:rotateX(90deg);}100%{transform:rotateX(0);}}
  .row.shake{animation:shake .5s;}
  @keyframes shake{
    10%,90%{transform:translateX(-2px);} 20%,80%{transform:translateX(4px);}
    30%,50%,70%{transform:translateX(-6px);} 40%,60%{transform:translateX(6px);}
  }
  .row.bounce .tile{animation:bounce .8s;}
  @keyframes bounce{0%,20%{transform:translateY(0);}40%{transform:translateY(-22px);}60%{transform:translateY(4px);}80%{transform:translateY(-8px);}100%{transform:translateY(0);}}

  #keyboard{width:100%; max-width:500px; padding:6px 4px 10px;}
  .krow{display:flex; justify-content:center; gap:5px; margin-bottom:6px;}
  .key{
    flex:1; max-width:44px; height:56px; border:none; border-radius:5px;
    background:var(--key-bg); color:var(--text); font-size:15px; font-weight:700;
    text-transform:uppercase; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .key.wide{max-width:70px; flex:1.6; font-size:12px;}
  .key.correct{background:var(--correct);} .key.present{background:var(--present);} .key.absent{background:var(--absent);}
  .key:active{opacity:.7;}

  #toast{
    position:fixed; top:12%; left:50%; transform:translateX(-50%);
    background:#fff; color:#121213; font-weight:700; padding:12px 18px; border-radius:8px;
    opacity:0; pointer-events:none; transition:opacity .25s; z-index:50; font-size:15px; white-space:nowrap;
  }
  #toast.show{opacity:1;}

  .modal{
    position:fixed; inset:0; background:rgba(0,0,0,.6); display:none;
    align-items:center; justify-content:center; z-index:100;
  }
  .modal.show{display:flex;}
  .modal-card{
    background:#1a1a1b; border:1px solid var(--tile-border); border-radius:12px;
    padding:24px; width:88%; max-width:380px; text-align:center; position:relative;
  }
  .modal-card h2{margin-bottom:12px; letter-spacing:1px;}
  .modal-card .word{font-size:28px; font-weight:800; letter-spacing:4px; color:var(--correct); text-transform:uppercase; margin:8px 0 16px;}
  .close-x{position:absolute; top:10px; right:14px; background:none; border:none; color:#818384; font-size:22px; cursor:pointer;}
  .stats-grid{display:flex; justify-content:space-around; margin:14px 0;}
  .stat{display:flex; flex-direction:column;}
  .stat b{font-size:30px; font-weight:800;}
  .stat span{font-size:11px; color:#818384;}
  #dist{margin:10px 0; text-align:left;}
  .dist-row{display:flex; align-items:center; gap:6px; margin:3px 0; font-size:13px;}
  .dist-bar{background:var(--absent); min-width:20px; padding:1px 6px; text-align:right; font-weight:700; border-radius:2px;}
  .dist-bar.hl{background:var(--correct);}
  .big-btn{
    background:var(--correct); color:#fff; border:none; border-radius:8px;
    padding:14px 30px; font-size:17px; font-weight:800; cursor:pointer; letter-spacing:1px; margin-top:8px;
  }
</style>
</head>
<body>
<header>
  <div style="display:flex;gap:6px;">
    <button class="hbtn" id="exitBtn" title="Back to menu">&#8962;</button>
    <button class="hbtn" id="statsBtn">&#128202;</button>
  </div>
  <div style="text-align:center">
    <h1>Wordle</h1>
    <div id="progress"></div>
  </div>
  <button class="hbtn" id="newBtn">New</button>
</header>

<div id="board-wrap"><div id="board"></div></div>
<div id="keyboard"></div>
<div id="toast"></div>

<div class="modal" id="endModal">
  <div class="modal-card">
    <button class="close-x" data-close="endModal">&times;</button>
    <h2 id="endTitle"></h2>
    <div id="endMsg" style="color:#818384;font-size:14px;"></div>
    <div class="word" id="endWord"></div>
    <button class="big-btn" id="playAgain">Play Again</button>
  </div>
</div>

<div class="modal" id="confirmModal">
  <div class="modal-card">
    <h2>Start a new word?</h2>
    <div style="color:#818384;font-size:14px;margin:8px 0 16px;">Your current puzzle will be abandoned and your streak reset.</div>
    <button class="big-btn" id="confirmYes">New Word</button>
    <button class="big-btn" id="confirmNo" style="background:#3a3a3c;margin-left:8px;">Keep Playing</button>
  </div>
</div>

<div class="modal" id="resumeModal">
  <div class="modal-card">
    <h2>Welcome back</h2>
    <div id="resumeInfo" style="color:#818384;font-size:14px;margin-bottom:12px;"></div>
    <button class="big-btn" id="btnResume">Continue Puzzle</button>
    <button class="big-btn" id="btnFresh" style="background:#3a3a3c;margin-left:8px;">New Word</button>
  </div>
</div>

<div class="modal" id="statsModal">
  <div class="modal-card">
    <button class="close-x" data-close="statsModal">&times;</button>
    <h2>Statistics</h2>
    <div class="stats-grid">
      <div class="stat"><b id="sPlayed">0</b><span>Played</span></div>
      <div class="stat"><b id="sWin">0</b><span>Win %</span></div>
      <div class="stat"><b id="sCur">0</b><span>Streak</span></div>
      <div class="stat"><b id="sMax">0</b><span>Max Streak</span></div>
    </div>
    <h2 style="font-size:14px;">Guess Distribution</h2>
    <div id="dist"></div>
    <div id="deckInfo" style="font-size:12px;color:#818384;margin-top:10px;"></div>
  </div>
</div>

<script src="achievements.js"></script>
<script src="wordle-words.js"></script>

const VALID = new Set(ANSWERS.concat(DICT_EXTRA));
/* merge in the full ~13.5k-word guess dictionary (wordle-words.js) */
if (typeof GUESS_WORDS !== "undefined") {
  GUESS_WORDS.split(" ").forEach(w => VALID.add(w));
}

/* ---------- persistence (localStorage with in-memory fallback) ---------- */
const mem = {};
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return (k in mem)? mem[k] : null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){ mem[k]=v; } }
};
const LS = "gg_wordle_";

/* ---------- word deck: shuffled 0..999, no repeats until exhausted ---------- */
function shuffled(){
  const a = [...Array(ANSWERS.length).keys()];
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function loadDeck(){
  let deck, ptr;
  try{
    deck = JSON.parse(store.get(LS+"deck"));
    ptr  = parseInt(store.get(LS+"ptr"),10);
    if(!Array.isArray(deck) || deck.length!==ANSWERS.length || isNaN(ptr)) throw 0;
  }catch(e){ deck = shuffled(); ptr = 0; saveDeck(deck,ptr); }
  return {deck,ptr};
}
function saveDeck(deck,ptr){ store.set(LS+"deck",JSON.stringify(deck)); store.set(LS+"ptr",String(ptr)); }
function nextWord(){
  let {deck,ptr} = loadDeck();
  let cycled = false;
  if(ptr >= deck.length){ deck = shuffled(); ptr = 0; cycled = true; }
  const w = ANSWERS[deck[ptr]];
  saveDeck(deck, ptr+1);
  return {word:w, used:ptr+1, total:deck.length, cycled};
}

/* ---------- stats ---------- */
function loadStats(){
  try{ const s = JSON.parse(store.get(LS+"stats")); if(s && typeof s.played==="number") return s; }catch(e){}
  return {played:0,wins:0,cur:0,max:0,dist:[0,0,0,0,0,0]};
}
function saveStats(s){ store.set(LS+"stats",JSON.stringify(s)); }

/* ---------- game state ---------- */
let answer="", row=0, col=0, grid, over=false, animating=false, wordsUsed=0;

/* ---------- save / resume ---------- */
const SAVE_KEY = LS+"save";
function saveGame(){
  if(over) return;
  const rows = grid ? grid.slice(0,row).map(r=>r.join("")) : [];
  store.set(SAVE_KEY, JSON.stringify({
    answer, rows, progress: document.getElementById("progress").textContent
  }));
}
function clearSave(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} store.set(SAVE_KEY,""); }
function loadSaveGame(){
  try{ const v = store.get(SAVE_KEY); return v ? JSON.parse(v) : null; }catch(e){ return null; }
}
const boardEl = document.getElementById("board");
const keyEls = {};

function buildBoard(){
  boardEl.innerHTML="";
  for(let r=0;r<6;r++){
    const rowEl = document.createElement("div"); rowEl.className="row";
    for(let c=0;c<5;c++){ const t=document.createElement("div"); t.className="tile"; rowEl.appendChild(t); }
    boardEl.appendChild(rowEl);
  }
}
function buildKeyboard(){
  const rows=[["q","w","e","r","t","y","u","i","o","p"],["a","s","d","f","g","h","j","k","l"],["enter","z","x","c","v","b","n","m","back"]];
  const kb=document.getElementById("keyboard"); kb.innerHTML="";
  rows.forEach(r=>{
    const re=document.createElement("div"); re.className="krow";
    r.forEach(k=>{
      const b=document.createElement("button"); b.className="key";
      if(k==="enter"||k==="back"){ b.classList.add("wide"); b.innerHTML = k==="back" ? "&#9003;" : "ENTER"; }
      else b.textContent=k;
      b.addEventListener("click",()=>press(k));
      keyEls[k]=b; re.appendChild(b);
    });
    kb.appendChild(re);
  });
}
function tile(r,c){ return boardEl.children[r].children[c]; }

function newGame(){
  const n = nextWord();
  answer = n.word; wordsUsed = n.used;
  row=0; col=0; over=false; animating=false;
  grid = Array.from({length:6},()=>Array(5).fill(""));
  buildBoard(); buildKeyboard();
  document.getElementById("progress").textContent = "Word "+n.used+" of "+n.total;
  if(n.cycled) toast("All "+n.total+" words used — deck reshuffled!", 2500);
  hide("endModal"); hide("statsModal");
  saveGame();
}

function press(k){
  if(over||animating) return;
  if(k==="back"){ if(col>0){ col--; grid[row][col]=""; const t=tile(row,col); t.textContent=""; t.classList.remove("filled"); } return; }
  if(k==="enter"){ submit(); return; }
  if(!/^[a-z]$/.test(k)) return;
  if(col<5){ grid[row][col]=k; const t=tile(row,col); t.textContent=k; t.classList.add("filled"); col++; }
}

function submit(){
  if(col<5){ shakeRow(); toast("Not enough letters"); return; }
  const guess = grid[row].join("");
  if(!VALID.has(guess)){ shakeRow(); toast("Not in word list"); return; }
  const res = score(guess, answer);
  animating = true;
  const r = row;
  for(let c=0;c<5;c++){
    const t = tile(r,c);
    setTimeout(()=>{
      t.classList.add("flip");
      setTimeout(()=>{ t.classList.add(res[c]); updateKey(guess[c],res[c]); },250);
    }, c*300);
  }
  setTimeout(()=>{
    animating = false;
    if(guess===answer){ win(r); }
    else if(r===5){ lose(); }
    else { row++; col=0; saveGame(); }
  }, 5*300+300);
}

/* two-pass scoring handles duplicate letters correctly */
function score(guess, ans){
  const res = Array(5).fill("absent");
  const remaining = {};
  for(let i=0;i<5;i++){
    if(guess[i]===ans[i]) res[i]="correct";
    else remaining[ans[i]] = (remaining[ans[i]]||0)+1;
  }
  for(let i=0;i<5;i++){
    if(res[i]==="correct") continue;
    if(remaining[guess[i]] > 0){ res[i]="present"; remaining[guess[i]]--; }
  }
  return res;
}
const RANK = {absent:0, present:1, correct:2};
function updateKey(ch, state){
  const el = keyEls[ch]; if(!el) return;
  const cur = el.dataset.state;
  if(!cur || RANK[state] > RANK[cur]){ el.dataset.state = state; el.classList.remove("absent","present","correct"); el.classList.add(state); }
}
function shakeRow(){
  const re = boardEl.children[row];
  re.classList.add("shake"); setTimeout(()=>re.classList.remove("shake"),500);
}
function toast(msg, ms){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("show"), ms||1400);
}

const PRAISE = ["Genius!","Magnificent!","Impressive!","Splendid!","Great!","Phew!"];
function win(r){
  over = true;
  clearSave();
  if(window.GGA){ GGA.award('word_win'); if(r<=1) GGA.award('word_two'); GGA.haptic('success'); }
  const s = loadStats();
  s.played++; s.wins++; s.cur++; s.max=Math.max(s.max,s.cur); s.dist[r]++;
  saveStats(s);
  const re = boardEl.children[r]; re.classList.add("bounce");
  setTimeout(()=>{
    document.getElementById("endTitle").textContent = PRAISE[r];
    document.getElementById("endMsg").textContent = "Solved in "+(r+1)+(r===0?" guess":" guesses");
    document.getElementById("endWord").textContent = answer;
    show("endModal");
  }, 900);
}
function lose(){
  over = true;
  clearSave();
  if(window.GGA) GGA.haptic('error');
  const s = loadStats();
  s.played++; s.cur=0; saveStats(s);
  setTimeout(()=>{
    document.getElementById("endTitle").textContent = "So close!";
    document.getElementById("endMsg").textContent = "The word was:";
    document.getElementById("endWord").textContent = answer;
    show("endModal");
  }, 400);
}

function show(id){ document.getElementById(id).classList.add("show"); }
function hide(id){ document.getElementById(id).classList.remove("show"); }

function renderStats(){
  const s = loadStats();
  document.getElementById("sPlayed").textContent = s.played;
  document.getElementById("sWin").textContent = s.played? Math.round(100*s.wins/s.played) : 0;
  document.getElementById("sCur").textContent = s.cur;
  document.getElementById("sMax").textContent = s.max;
  const maxD = Math.max(1, ...s.dist);
  const dist = document.getElementById("dist"); dist.innerHTML="";
  for(let i=0;i<6;i++){
    const rowD = document.createElement("div"); rowD.className="dist-row";
    const bar = document.createElement("div"); bar.className="dist-bar";
    if(over && grid && grid[row] && grid[row].join("")===answer && row===i) bar.classList.add("hl");
    bar.style.width = Math.max(8, Math.round(100*s.dist[i]/maxD)) + "%";
    bar.textContent = s.dist[i];
    rowD.append(String(i+1), bar); dist.appendChild(rowD);
  }
  const {ptr} = loadDeck();
  document.getElementById("deckInfo").textContent = ptr+" of "+ANSWERS.length+" words used this cycle";
}

document.getElementById("newBtn").addEventListener("click", ()=>{
  if(!over && row>0){ show("confirmModal"); return; }
  if(!over && col>0){ const s=loadStats(); s.cur=0; saveStats(s); }
  newGame();
});
document.getElementById("confirmYes").addEventListener("click", ()=>{
  hide("confirmModal");
  const s=loadStats(); s.cur=0; saveStats(s);
  newGame();
});
document.getElementById("confirmNo").addEventListener("click", ()=>hide("confirmModal"));
document.getElementById("playAgain").addEventListener("click", newGame);
document.getElementById("statsBtn").addEventListener("click", ()=>{ renderStats(); show("statsModal"); });
document.getElementById("exitBtn").addEventListener("click", ()=>{ window.location.href="index.html"; });
document.querySelectorAll(".close-x").forEach(b=>b.addEventListener("click",()=>hide(b.dataset.close)));
document.querySelectorAll(".modal").forEach(m=>m.addEventListener("click",e=>{ if(e.target===m) m.classList.remove("show"); }));

window.addEventListener("keydown", e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const k = e.key.toLowerCase();
  if(k==="enter") press("enter");
  else if(k==="backspace") press("back");
  else if(/^[a-z]$/.test(k)) press(k);
});

function resumeGame(sv){
  answer = sv.answer;
  row=0; col=0; over=false; animating=false;
  grid = Array.from({length:6},()=>Array(5).fill(""));
  buildBoard(); buildKeyboard();
  document.getElementById("progress").textContent = sv.progress || "";
  (sv.rows||[]).forEach(g=>{
    const res = score(g, answer);
    for(let c=0;c<5;c++){
      grid[row][c]=g[c];
      const t=tile(row,c);
      t.textContent=g[c];
      t.classList.add(res[c]);
      updateKey(g[c],res[c]);
    }
    row++;
  });
  hide("endModal"); hide("statsModal");
}

document.getElementById("btnResume").addEventListener("click", ()=>hide("resumeModal"));
document.getElementById("btnFresh").addEventListener("click", ()=>{ hide("resumeModal"); newGame(); });

(function boot(){
  const sv = loadSaveGame();
  if(sv && sv.answer && (sv.rows||[]).length>0){
    resumeGame(sv);
    document.getElementById("resumeInfo").textContent = sv.rows.length+" of 6 guesses used";
    show("resumeModal");
  } else if(sv && sv.answer){
    resumeGame(sv);   // same word, no guesses yet — no prompt needed
  } else {
    newGame();
  }
})();
</script>
