<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Food Sort Master</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html,body { height:100%; overflow:hidden; touch-action:none; }
  body {
    font-family:-apple-system, "Segoe UI", Roboto, sans-serif;
    background:linear-gradient(180deg,#2b1d3a 0%,#4a2f5c 45%,#6b4226 100%);
    color:#fff; display:flex; flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-left) env(safe-area-inset-bottom) env(safe-area-inset-right);
  }

  /* ---------- HUD ---------- */
  #hud { display:flex; align-items:center; justify-content:space-between; padding:10px 14px 4px; gap:8px; }
  .pill {
    background:rgba(0,0,0,.35); border:1px solid rgba(255,255,255,.15);
    border-radius:14px; padding:5px 12px; font-size:14px; font-weight:700; white-space:nowrap;
  }
  .pill small { display:block; font-size:9px; font-weight:600; opacity:.6; letter-spacing:1px; }
  #shuffleBtn {
    background:linear-gradient(180deg,#ffb347,#ff8c1a); border:none; border-radius:14px;
    color:#4a2600; font-size:14px; font-weight:800; padding:8px 14px;
    box-shadow:0 3px 0 #b35900; cursor:pointer;
  }
  #shuffleBtn:active { transform:translateY(2px); box-shadow:0 1px 0 #b35900; }
  #shuffleBtn.disabled { filter:grayscale(1); opacity:.5; pointer-events:none; }
  #homeBtn {
    background:linear-gradient(180deg,#6ec1ff,#2f8fe0); border:none; border-radius:14px;
    color:#fff; font-size:16px; font-weight:800; padding:8px 12px;
    box-shadow:0 3px 0 #1a5c99; cursor:pointer;
  }
  #homeBtn:active { transform:translateY(2px); box-shadow:0 1px 0 #1a5c99; }
  .menuLink {
    background:none; border:none; color:#9fd0ff; font-size:15px; font-weight:700;
    text-decoration:underline; cursor:pointer; padding:6px;
  }

  #timebarWrap { height:10px; margin:6px 14px; background:rgba(0,0,0,.4); border-radius:5px; overflow:hidden; }
  #timebar { height:100%; width:100%; border-radius:5px; background:linear-gradient(90deg,#4cd964,#a8e063); transition:width .5s linear; }
  #timebar.low { background:linear-gradient(90deg,#ff5f6d,#ffc371); }

  /* ---------- Cabinet ---------- */
  #cabinetWrap { flex:1; display:flex; align-items:center; justify-content:center; padding:8px 12px 16px; min-height:0; }
  #cabinet {
    width:100%; max-width:440px; height:100%; max-height:760px;
    background:linear-gradient(180deg,#8a5a33,#6e4525);
    border-radius:16px; padding:8px;
    box-shadow:0 12px 30px rgba(0,0,0,.55), inset 0 2px 3px rgba(255,255,255,.25), inset 0 -4px 8px rgba(0,0,0,.35);
    display:flex; flex-direction:column; gap:5px;
  }
  .row {
    flex:1; position:relative; display:flex; border-radius:10px; overflow:hidden; min-height:0;
    background:linear-gradient(180deg,#3d2415 0%,#54331d 70%,#452a17 100%); /* back panel */
    box-shadow:inset 0 6px 14px rgba(0,0,0,.6), inset 0 -2px 4px rgba(0,0,0,.4);
  }
  /* wooden shelf board = pseudo-3D front edge */
  .row::after {
    content:""; position:absolute; left:0; right:0; bottom:0; height:10px;
    background:linear-gradient(180deg,#c98d4f 0%,#a96f38 45%,#7c4d22 100%);
    border-top:1px solid #e8b87a; box-shadow:0 -3px 6px rgba(0,0,0,.35);
  }
  .block { flex:1; display:flex; position:relative; min-width:0; }
  .block + .block { border-left:4px solid #5e3a1c; box-shadow:inset 3px 0 3px rgba(0,0,0,.35); }
  .slot { flex:1; position:relative; display:flex; align-items:flex-end; justify-content:center; min-width:0; }
  .slot.droppable::before {
    content:""; position:absolute; inset:3px 2px 10px;
    border:2px dashed rgba(120,255,150,.75); border-radius:8px;
    background:rgba(120,255,150,.12); animation:pulse 1s infinite; z-index:1;
  }
  @keyframes pulse { 50% { opacity:.45; } }

  /* ---------- Items ---------- */
  .item {
    position:absolute; bottom:8px; left:50%; transform:translateX(-50%);
    font-size:var(--fs, 26px); line-height:1; z-index:3;
    filter:drop-shadow(0 3px 2px rgba(0,0,0,.45));
    transition:transform .15s ease;
  }
  .item::after { /* contact shadow ellipse */
    content:""; position:absolute; left:50%; bottom:-5px; transform:translateX(-50%);
    width:80%; height:7px; border-radius:50%;
    background:radial-gradient(ellipse at center, rgba(0,0,0,.45) 0%, transparent 70%);
    z-index:-1;
  }
  .item.behind1 { transform:translateX(-50%) translateY(-52%) scale(.82); filter:brightness(.72) saturate(.8) drop-shadow(0 2px 2px rgba(0,0,0,.4)); z-index:2; }
  .item.behind2 { transform:translateX(-50%) translateY(-88%) scale(.66); filter:brightness(.5) saturate(.7); z-index:1; }
  .item.selected { transform:translateX(-50%) translateY(-10px) scale(1.22); filter:drop-shadow(0 0 10px rgba(255,230,100,.95)) drop-shadow(0 6px 5px rgba(0,0,0,.4)); z-index:5; }
  .item.dim { opacity:.25; }
  .item.pop { animation:pop .35s ease forwards; }
  @keyframes pop {
    30% { transform:translateX(-50%) scale(1.35); }
    100% { transform:translateX(-50%) scale(0); opacity:0; }
  }
  .item.arrive { animation:arrive .22s ease; }
  @keyframes arrive { 0% { transform:translateX(-50%) scale(1.3) translateY(-10px); } }

  #ghost { position:fixed; z-index:100; pointer-events:none; font-size:calc(var(--fs, 26px) * 1.25); line-height:1;
    transform:translate(-50%,-60%) scale(1.15); filter:drop-shadow(0 10px 8px rgba(0,0,0,.5)); display:none; }

  .floatText {
    position:fixed; z-index:110; pointer-events:none; font-weight:900; font-size:20px;
    color:#ffe45c; text-shadow:0 2px 4px rgba(0,0,0,.6); animation:floatUp 1s ease forwards;
  }
  @keyframes floatUp { to { transform:translateY(-60px); opacity:0; } }

  /* ---------- Overlays ---------- */
  .overlay {
    position:fixed; inset:0; z-index:200; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; text-align:center;
    background:rgba(15,8,25,.86); backdrop-filter:blur(4px); padding:24px;
  }
  .overlay h1 { font-size:34px; }
  .overlay h2 { font-size:26px; }
  .overlay p { opacity:.85; font-size:15px; max-width:280px; }
  .stars { font-size:38px; letter-spacing:6px; }
  .bigBtn {
    background:linear-gradient(180deg,#4cd964,#2aa845); border:none; border-radius:16px;
    color:#fff; font-size:20px; font-weight:800; padding:14px 40px;
    box-shadow:0 5px 0 #1c7530; cursor:pointer;
  }
  .bigBtn:active { transform:translateY(3px); box-shadow:0 2px 0 #1c7530; }
  .hidden { display:none !important; }
  .titleEmoji { font-size:56px; }
</style>
</head>
<body>

<div id="hud">
  <button id="homeBtn" aria-label="Back to menu">🏠</button>
  <div class="pill"><small>LEVEL</small><span id="levelTxt">1</span></div>
  <div class="pill"><small>SCORE</small><span id="scoreTxt">0</span></div>
  <div class="pill"><small>BEST</small><span id="bestTxt">0</span></div>
  <button id="shuffleBtn">🔀 <span id="shuffleCount">3</span></button>
</div>
<div id="timebarWrap"><div id="timebar"></div></div>
<div id="cabinetWrap"><div id="cabinet"></div></div>
<div id="ghost"></div>

<div id="startOverlay" class="overlay">
  <div class="titleEmoji">🍔🍟🥤</div>
  <h1>Food Sort Master</h1>
  <p>Drag (or tap-tap) food between shelf sections. Group <b>3 identical items in one section</b> to clear them. Items stack 3 deep — clear the front to reveal what's behind. Clear everything before time runs out!</p>
  <button class="bigBtn" id="continueBtn" style="display:none;background:linear-gradient(180deg,#ffb347,#ff8c1a);box-shadow:0 5px 0 #b35900;">CONTINUE</button>
  <button class="bigBtn" id="startBtn">PLAY</button>
  <button class="menuLink" onclick="goMenu()">← Back to Menu</button>
</div>

<div id="winOverlay" class="overlay hidden">
  <h2>Shelf Cleared! 🎉</h2>
  <div class="stars" id="winStars">⭐⭐⭐</div>
  <p id="winInfo"></p>
  <button class="bigBtn" id="nextBtn">NEXT LEVEL</button>
  <button class="menuLink" onclick="goMenu()">← Back to Menu</button>
</div>

<div id="loseOverlay" class="overlay hidden">
  <h2>⏰ Time's Up!</h2>
  <p id="loseInfo"></p>
  <button class="bigBtn" id="retryBtn">RETRY</button>
  <button class="menuLink" onclick="goMenu()">← Back to Menu</button>
</div>

<script>
"use strict";

/* ================= CONFIG ================= */
var FOODS = ["🍔","🍟","🍕","🌭","🍩","🥤","🍎","🍪","🍦","🍇","🥕","🧀","🍗","🍉","🍌","🥐","🍓","🥦"];

var FREE = 4;        // front slots always left empty

function levelConfig(n) {
  var blocks = n < 3 ? 2 : (n < 7 ? 3 : 4);        // sections per shelf, 3 slots each
  var rows   = Math.min(5 + Math.floor((n - 1) / 4), 7);
  var layers = 3;                                   // stacks go 3 deep
  var slots  = rows * blocks * 3;
  var maxItems = (slots - FREE) * layers;
  var fill = Math.min(0.3 + n * 0.03, 0.6);
  // item count must NEVER exceed capacity, and is always whole triples
  var triples = Math.min(Math.floor(maxItems / 3), Math.max(4, Math.floor((maxItems * fill) / 3)));
  var types  = Math.min(4 + n, FOODS.length, triples);
  var time = 30 + triples * 7;
  return { rows: rows, blocks: blocks, layers: layers, types: types, triples: triples, time: time };
}

/* ================= STATE ================= */
var S = {
  level: 1, score: 0, best: 0, combo: 0, comboTimer: null,
  slots: [], rows: 0, layers: 1,
  timeLeft: 0, timeMax: 0, ticker: null,
  shuffles: 3, selected: -1, busy: 0, playing: false
};
try { S.best = parseInt(localStorage.getItem("fsm_best") || "0", 10) || 0; } catch (e) {}

/* ================= SAVE / RESUME ================= */
var SAVE_KEY = "gg-save-food-sort";
function saveProgress(level, score, shuffles) {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ level: level, score: score, shuffles: shuffles })); } catch (e) {}
}
function clearSaveProgress() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }
function loadProgress() {
  try { return JSON.parse(localStorage.getItem(SAVE_KEY) || "null"); } catch (e) { return null; }
}

var $ = function (id) { return document.getElementById(id); };
var cabinet = $("cabinet"), ghost = $("ghost");

/* ================= AUDIO (WebAudio beeps) ================= */
var AC = null;
function audioInit() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === "suspended") AC.resume();
}
function beep(freq, dur, type, vol) {
  if (!AC) return;
  try {
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = type || "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.15, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + dur);
  } catch (e) {}
}
function sndPick()  { beep(500, 0.08, "triangle", 0.1); }
function sndDrop()  { beep(320, 0.1, "triangle", 0.12); }
function sndMatch(c){ beep(600 + c * 120, 0.22, "sine", 0.2); beep(900 + c * 120, 0.3, "sine", 0.12); }
function sndWin()   { [523,659,784,1047].forEach(function (f, i) { setTimeout(function(){ beep(f, 0.25, "sine", 0.18); }, i * 120); }); }
function sndLose()  { [400,320,240].forEach(function (f, i) { setTimeout(function(){ beep(f, 0.3, "sawtooth", 0.1); }, i * 180); }); }

/* ================= LEVEL BUILD ================= */
function shuffleArr(a) {
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function buildLevel(n) {
  var cfg = levelConfig(n);
  S.rows = cfg.rows; S.layers = cfg.layers;
  S.slots = []; S.selected = -1; S.busy = 0;
  S.timeMax = S.timeLeft = cfg.time;

  // bag of triples
  var pool = shuffleArr(FOODS.slice()).slice(0, cfg.types);
  var bag = [];
  for (var t = 0; t < cfg.triples; t++) {
    var food = pool[t % pool.length];
    bag.push(food, food, food);
  }
  shuffleArr(bag);

  // distribute into slot queues, stacked up to `layers` deep in clusters
  var slotCount = cfg.rows * cfg.blocks * 3;
  var order = shuffleArr(Array.from({ length: slotCount }, function (_, i) { return i; }));
  var usedSlots = Math.min(slotCount - FREE, Math.ceil(bag.length / cfg.layers) + Math.floor(slotCount * 0.12));
  var usable = order.slice(0, usedSlots);
  var queues = [];
  for (var q = 0; q < slotCount; q++) queues.push([]);
  var qi = 0, guard = 0;
  while (bag.length && guard++ < 10000) {
    var si = usable[qi % usable.length]; qi++;
    if (queues[si].length < cfg.layers) queues[si].push(bag.pop());
  }
  // safety net: triples are capped to capacity, so the bag should always empty
  if (bag.length) console.warn("FSM: could not place " + bag.length + " items");

  // build DOM: rows -> blocks (sections) -> 3 slots each
  cabinet.innerHTML = "";
  S.blocks = cfg.blocks;
  for (var r = 0; r < cfg.rows; r++) {
    var rowEl = document.createElement("div");
    rowEl.className = "row";
    for (var b = 0; b < cfg.blocks; b++) {
      var blockEl = document.createElement("div");
      blockEl.className = "block";
      var blockId = r * cfg.blocks + b;
      for (var c = 0; c < 3; c++) {
        var idx = blockId * 3 + c;
        var slotEl = document.createElement("div");
        slotEl.className = "slot";
        slotEl.dataset.idx = idx;
        blockEl.appendChild(slotEl);
        S.slots.push({ el: slotEl, queue: queues[idx], row: r, block: blockId, locked: false });
      }
      rowEl.appendChild(blockEl);
    }
    cabinet.appendChild(rowEl);
  }
  S.slots.forEach(function (_, i) { renderSlot(i); });
  fitItems();
  updateHUD();
}

function fitItems() {
  if (!S.blocks) return;
  var cols = S.blocks * 3;
  var w = cabinet.clientWidth / cols;
  var h = cabinet.clientHeight / (S.rows || 1);
  var fs = Math.max(13, Math.min(w * 0.72, h * 0.42, 34));
  document.documentElement.style.setProperty("--fs", fs + "px");
}
window.addEventListener("resize", fitItems);

function renderSlot(i) {
  var s = S.slots[i];
  s.el.innerHTML = "";
  s.queue.forEach(function (food, d) {
    var it = document.createElement("div");
    it.className = "item" + (d === 1 ? " behind1" : d === 2 ? " behind2" : "");
    it.textContent = food;
    s.el.appendChild(it);
  });
}

/* ================= HUD / TIMER ================= */
function updateHUD() {
  $("levelTxt").textContent = S.level;
  $("scoreTxt").textContent = S.score;
  $("bestTxt").textContent = S.best;
  $("shuffleCount").textContent = S.shuffles;
  $("shuffleBtn").classList.toggle("disabled", S.shuffles <= 0);
}
function tick() {
  if (!S.playing) return;
  S.timeLeft--;
  var pct = Math.max(0, S.timeLeft / S.timeMax * 100);
  $("timebar").style.width = pct + "%";
  $("timebar").classList.toggle("low", pct < 30);
  if (S.timeLeft <= 0) gameOver();
}
function startTimer() {
  clearInterval(S.ticker);
  $("timebar").style.width = "100%";
  $("timebar").classList.remove("low");
  S.ticker = setInterval(tick, 1000);
}

/* ================= GAME LOGIC ================= */
function frontOf(i) { return S.slots[i].queue.length ? S.slots[i].queue[0] : null; }

function tryMove(from, to) {
  if (from === to) return false;
  var src = S.slots[from], dst = S.slots[to];
  if (src.locked || dst.locked) return false;
  if (!src.queue.length || dst.queue.length) return false;
  dst.queue.unshift(src.queue.shift());
  renderSlot(from); renderSlot(to);
  var el = dst.el.querySelector(".item");
  if (el) el.classList.add("arrive");
  sndDrop();
  checkBlock(dst.block);
  checkBlock(src.block); // in case a behind item slid forward
  return true;
}

function checkBlock(b) {
  // 3 identical front items in one section = match
  var a = b * 3, ids = [a, a + 1, a + 2];
  if (ids.some(function (i) { return S.slots[i].locked; })) return;
  var f0 = frontOf(a);
  if (!f0 || frontOf(a + 1) !== f0 || frontOf(a + 2) !== f0) return;

  // MATCH!
  ids.forEach(function (i) { S.slots[i].locked = true; });
  S.busy++;
  S.combo++;
  clearTimeout(S.comboTimer);
  S.comboTimer = setTimeout(function () { S.combo = 0; }, 3000);

  var gained = 30 * S.combo;
  S.score += gained;
  if (S.score > S.best) { S.best = S.score; try { localStorage.setItem("fsm_best", String(S.best)); } catch (e) {} }
  sndMatch(S.combo);
  if (navigator.vibrate) { try { navigator.vibrate(40); } catch (e) {} }

  var midEl = S.slots[ids[1]].el;
  var rect = midEl.getBoundingClientRect();
  floatText((S.combo > 1 ? "COMBO x" + S.combo + "  " : "") + "+" + gained, rect.left + rect.width / 2, rect.top);

  ids.forEach(function (i) {
    var el = S.slots[i].el.querySelector(".item");
    if (el) el.classList.add("pop");
  });

  setTimeout(function () {
    ids.forEach(function (i) {
      S.slots[i].queue.shift();      // remove matched front; behind slides forward
      S.slots[i].locked = false;
      renderSlot(i);
    });
    S.busy--;
    updateHUD();
    checkBlock(b);                   // cascade if revealed items also match
    checkWin();
  }, 380);
}

function checkWin() {
  if (S.busy > 0) return;
  var remaining = S.slots.reduce(function (n, s) { return n + s.queue.length; }, 0);
  if (remaining === 0 && S.playing) {
    S.playing = false;
    clearInterval(S.ticker);
    sndWin();
    var pct = S.timeLeft / S.timeMax;
    var stars = pct > 0.5 ? 3 : pct > 0.25 ? 2 : 1;
    var bonus = S.timeLeft * 5;
    S.score += bonus;
    if (S.score > S.best) { S.best = S.score; try { localStorage.setItem("fsm_best", String(S.best)); } catch (e) {} }
    $("winStars").textContent = "⭐".repeat(stars) + "☆".repeat(3 - stars);
    $("winInfo").textContent = "Time bonus +" + bonus + "  ·  Score " + S.score;
    S.shuffles++; // earn one per level
    updateHUD();
    saveProgress(S.level + 1, S.score, S.shuffles); // resume at next level
    $("winOverlay").classList.remove("hidden");
  }
}

function gameOver() {
  S.playing = false;
  clearInterval(S.ticker);
  clearSelection();
  sndLose();
  $("loseInfo").textContent = "Level " + S.level + "  ·  Score " + S.score;
  $("loseOverlay").classList.remove("hidden");
}

function doShuffle() {
  if (S.shuffles <= 0 || !S.playing || S.busy) return;
  S.shuffles--;
  clearSelection();
  var occupied = [], items = [];
  S.slots.forEach(function (s, i) { if (s.queue.length && !s.locked) { occupied.push(i); items.push(s.queue[0]); } });
  shuffleArr(items);
  occupied.forEach(function (i, k) { S.slots[i].queue[0] = items[k]; renderSlot(i); });
  sndPick();
  updateHUD();
  for (var b = 0; b < S.rows * S.blocks; b++) checkBlock(b);
}

/* ================= INPUT (drag + tap-tap) ================= */
var drag = null;

function clearSelection() {
  if (S.selected >= 0) {
    var el = S.slots[S.selected].el.querySelector(".item");
    if (el) el.classList.remove("selected");
    S.selected = -1;
  }
  markDroppables(false);
}
function markDroppables(on) {
  S.slots.forEach(function (s) {
    s.el.classList.toggle("droppable", !!on && s.queue.length === 0 && !s.locked);
  });
}
function slotFromPoint(x, y) {
  ghost.style.display = "none";
  var el = document.elementFromPoint(x, y);
  ghost.style.display = drag ? "block" : "none";
  while (el && el !== document.body) {
    if (el.classList && el.classList.contains("slot")) return parseInt(el.dataset.idx, 10);
    el = el.parentNode;
  }
  return -1;
}

cabinet.addEventListener("pointerdown", function (e) {
  if (!S.playing) return;
  audioInit();
  var idx = slotFromPoint(e.clientX, e.clientY);
  if (idx < 0) { clearSelection(); return; }
  var s = S.slots[idx];

  // tap-tap: something selected + tapped an empty slot -> move
  if (S.selected >= 0 && s.queue.length === 0) {
    var from = S.selected;
    clearSelection();
    tryMove(from, idx);
    return;
  }
  if (!s.queue.length || s.locked) { clearSelection(); return; }

  clearSelection();
  drag = { from: idx, moved: false, x: e.clientX, y: e.clientY };
  var itemEl = s.el.querySelector(".item");
  if (itemEl) itemEl.classList.add("dim");
  ghost.textContent = s.queue[0];
  ghost.style.left = e.clientX + "px";
  ghost.style.top = e.clientY + "px";
  ghost.style.display = "block";
  markDroppables(true);
  sndPick();
  e.preventDefault();
});

window.addEventListener("pointermove", function (e) {
  if (!drag) return;
  if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) > 12) drag.moved = true;
  ghost.style.left = e.clientX + "px";
  ghost.style.top = e.clientY + "px";
  e.preventDefault();
}, { passive: false });

window.addEventListener("pointerup", function (e) {
  if (!drag) return;
  var d = drag; drag = null;
  ghost.style.display = "none";
  var srcItem = S.slots[d.from].el.querySelector(".item");
  if (srcItem) srcItem.classList.remove("dim");
  markDroppables(false);

  if (!d.moved) {
    // treat as tap -> select this item
    S.selected = d.from;
    var el = S.slots[d.from].el.querySelector(".item");
    if (el) el.classList.add("selected");
    markDroppables(true);
    return;
  }
  var target = slotFromPoint(e.clientX, e.clientY);
  if (target >= 0) tryMove(d.from, target);
});

/* ================= FX ================= */
function floatText(txt, x, y) {
  var el = document.createElement("div");
  el.className = "floatText";
  el.textContent = txt;
  el.style.left = x + "px"; el.style.top = y + "px";
  el.style.transform = "translateX(-50%)";
  document.body.appendChild(el);
  setTimeout(function () { el.remove(); }, 1000);
}

/* ================= FLOW ================= */
function startLevel() {
  buildLevel(S.level);
  S.playing = true;
  startTimer();
  saveProgress(S.level, S.score, S.shuffles);
}
$("startBtn").addEventListener("click", function () {
  audioInit();
  S.level = 1; S.score = 0; S.shuffles = 3;
  clearSaveProgress();
  $("startOverlay").classList.add("hidden");
  startLevel();
});
$("continueBtn").addEventListener("click", function () {
  audioInit();
  var sv = loadProgress();
  if (sv) { S.level = sv.level || 1; S.score = sv.score || 0; S.shuffles = (typeof sv.shuffles === "number") ? sv.shuffles : 3; }
  $("startOverlay").classList.add("hidden");
  startLevel();
});
(function bootResume() {
  var sv = loadProgress();
  if (sv && (sv.level > 1 || sv.score > 0)) {
    var b = $("continueBtn");
    b.textContent = "CONTINUE · LEVEL " + sv.level;
    b.style.display = "";
    $("startBtn").textContent = "START NEW";
  }
})();
$("nextBtn").addEventListener("click", function () {
  $("winOverlay").classList.add("hidden");
  S.level++;
  startLevel();
});
$("retryBtn").addEventListener("click", function () {
  $("loseOverlay").classList.add("hidden");
  startLevel();
});
$("shuffleBtn").addEventListener("click", doShuffle);

function goMenu() { window.location.href = "index.html"; }
$("homeBtn").addEventListener("click", function () {
  if (S.playing && !confirm("Leave the game and go back to the menu?")) return;
  goMenu();
});

document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
updateHUD();
</script>
</body>
</html>
