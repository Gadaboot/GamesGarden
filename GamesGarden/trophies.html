<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Trophies — Offline Games Arcade</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, #1c3a2a 0%, #0f2419 100%);
    color: #f5efdd;
    min-height: 100vh;
    user-select: none; -webkit-user-select: none;
    padding: max(20px, env(safe-area-inset-top)) 14px calc(40px + env(safe-area-inset-bottom));
  }
  .wrap { max-width: 520px; margin: 0 auto; }
  a.back {
    display: inline-block;
    color: #ffd24a; text-decoration: none; font-weight: 700;
    margin-bottom: 14px; font-size: 15px;
  }
  h1 {
    color: #ffd24a; font-size: 26px; font-weight: 900; letter-spacing: 2px;
    text-align: center; text-shadow: 0 2px 6px rgba(0,0,0,.5);
  }
  .statsrow {
    display: flex; justify-content: center; gap: 10px;
    margin: 16px 0 22px;
  }
  .statbox {
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 14px;
    padding: 10px 18px;
    text-align: center;
    min-width: 92px;
  }
  .statbox b { display: block; font-size: 22px; color: #ffd24a; }
  .statbox span { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; opacity: .7; }
  .pbar {
    height: 10px; border-radius: 5px; overflow: hidden;
    background: rgba(0,0,0,.4); margin: 0 4px 24px;
  }
  .pbar div { height: 100%; background: linear-gradient(90deg, #ffd24a, #e8a614); border-radius: 5px; transition: width .6s; }
  h2 {
    font-size: 13px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase;
    color: #ffd24a; margin: 20px 4px 8px; opacity: .9;
  }
  .badge {
    display: flex; align-items: center; gap: 12px;
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 14px;
    padding: 10px 14px;
    margin-bottom: 8px;
  }
  .badge .ic {
    font-size: 30px; width: 44px; height: 44px; flex: none;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,210,74,.15);
    border-radius: 12px;
  }
  .badge .nm { font-size: 14.5px; font-weight: 800; }
  .badge .ds { font-size: 12px; opacity: .7; margin-top: 1px; }
  .badge .dt { margin-left: auto; font-size: 10px; opacity: .5; white-space: nowrap; padding-left: 8px; }
  .badge.locked { opacity: .45; }
  .badge.locked .ic { filter: grayscale(1); background: rgba(255,255,255,.06); }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">‹ Back to games</a>
  <h1>🏆 TROPHY CABINET</h1>

  <div class="statsrow">
    <div class="statbox"><b id="stEarned">0</b><span>Earned</span></div>
    <div class="statbox"><b id="stStreak">0</b><span>Day streak</span></div>
    <div class="statbox"><b id="stPlayed">0</b><span>Games tried</span></div>
  </div>
  <div class="pbar"><div id="pfill" style="width:0%"></div></div>

  <div id="list"></div>
</div>

<script src="achievements.js"></script>
<script>
"use strict";
(function () {
  var earned = GGA.earned();
  var defs = GGA.defs;

  var nEarned = 0;
  defs.forEach(function (d) { if (earned[d.id]) nEarned++; });

  document.getElementById("stEarned").textContent = nEarned + "/" + defs.length;
  document.getElementById("stStreak").textContent = GGA.streak();
  document.getElementById("stPlayed").textContent = GGA.playedCount() + "/" + GGA.totalGames;
  document.getElementById("pfill").style.width = Math.round(nEarned / defs.length * 100) + "%";

  /* group by game, earned first within each group */
  var groups = [], byName = {};
  defs.forEach(function (d) {
    if (!byName[d.game]) { byName[d.game] = []; groups.push(d.game); }
    byName[d.game].push(d);
  });

  function fmtDate(ts) {
    var d = new Date(ts);
    return d.getDate() + "/" + (d.getMonth() + 1) + "/" + String(d.getFullYear()).slice(-2);
  }

  var list = document.getElementById("list");
  groups.forEach(function (g) {
    var h = document.createElement("h2");
    h.textContent = g;
    list.appendChild(h);
    var arr = byName[g].slice().sort(function (a, b) {
      return (earned[b.id] ? 1 : 0) - (earned[a.id] ? 1 : 0);
    });
    arr.forEach(function (d) {
      var got = earned[d.id];
      var el = document.createElement("div");
      el.className = "badge" + (got ? "" : " locked");
      el.innerHTML =
        '<div class="ic">' + d.icon + '</div>' +
        '<div><div class="nm">' + d.name + '</div><div class="ds">' + d.desc + '</div></div>' +
        (got ? '<div class="dt">' + fmtDate(got) + '</div>' : '<div class="dt">🔒</div>');
      list.appendChild(el);
    });
  });
})();
</script>
</body>
</html>
