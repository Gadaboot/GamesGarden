<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Paint the Flag</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg,#1b1f3b 0%,#2d1b4e 55%,#1b2a4e 100%);
    color:#fff; display:flex; flex-direction:column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    touch-action:manipulation; user-select:none; -webkit-user-select:none;
  }
  header { display:flex; align-items:center; justify-content:space-between; padding:12px 14px 6px; }
  .menu-btn {
    display:inline-flex; align-items:center; gap:6px;
    background:rgba(255,255,255,.12); color:#fff; text-decoration:none;
    padding:9px 14px; border-radius:12px; font-weight:700; font-size:15px;
    border:1px solid rgba(255,255,255,.18);
  }
  .menu-btn:active { background:rgba(255,255,255,.25); }
  h1 { font-size:19px; font-weight:800; letter-spacing:.3px; text-align:center; }
  .hdr-spacer { width:86px; text-align:right; font-size:14px; color:#c9cdee; font-weight:700; }

  .screen { flex:1; display:flex; flex-direction:column; min-height:0; }
  [hidden] { display:none !important; }

  .scorebar {
    display:flex; align-items:center; justify-content:center; gap:10px;
    padding:4px 14px 8px; flex-wrap:wrap;
  }
  .chip {
    background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.14);
    border-radius:12px; padding:6px 12px; font-size:14px; font-weight:700; color:#c9cdee;
  }
  .chip b { color:#fff; }
  .chip.done b { color:#3ddc84; }
  .chip.passed b { color:#ff9d5c; }
  .pbar-wrap { flex-basis:100%; max-width:420px; margin:2px auto 0; padding:0 14px; }
  .pbar { height:8px; background:rgba(255,255,255,.12); border-radius:6px; overflow:hidden; }
  .pbar > div { height:100%; width:0%; background:linear-gradient(90deg,#22b573,#3ddc84); border-radius:6px; transition:width .5s; }

  .map-wrap { flex:1; position:relative; min-height:0; padding:4px 8px; }
  #worldMap { width:100%; height:100%; display:block; border-radius:16px; }
  .tile-x { font-size:9px; fill:#8b8fa8; font-weight:bold; }
  #marker .bob { animation:bob 1s ease-in-out infinite; }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
  .cur-tile { animation:pulse 1.2s infinite; }
  @keyframes pulse { 0%,100%{stroke-opacity:1} 50%{stroke-opacity:.25} }

  .prompt {
    display:flex; align-items:center; justify-content:center; gap:12px;
    padding:10px 16px calc(14px + env(safe-area-inset-bottom)); flex-wrap:wrap;
  }
  .prompt .where { font-size:18px; font-weight:800; text-align:center; }
  .prompt .where small { display:block; font-size:12px; color:#9ba1c9; font-weight:600; }
  .btn {
    border:none; border-radius:14px; font-size:16px; font-weight:800;
    padding:12px 26px; cursor:pointer; color:#fff;
    box-shadow:0 4px 14px rgba(0,0,0,.3);
  }
  .btn:active { transform:translateY(2px); }
  .btn:disabled { opacity:.4; }
  .btn-go { background:linear-gradient(135deg,#22b573,#1a9960); }
  .btn-pass { background:#5b5f8f; }
  .btn-hint { background:#5b5f8f; }
  .btn-check { background:linear-gradient(135deg,#22b573,#1a9960); }
  .btn-map { background:rgba(255,255,255,.14); padding:12px 16px; }
  .btn-primary { background:linear-gradient(135deg,#ff7847,#e5484d); }
  .btn-ghost { background:rgba(255,255,255,.14); }

  .info-card {
    position:absolute; right:14px; top:12px; width:212px; z-index:8;
    background:#262a4a; border:1px solid rgba(255,255,255,.18); border-radius:16px;
    padding:14px; box-shadow:0 14px 40px rgba(0,0,0,.5);
    animation:slidein .35s ease;
  }
  @keyframes slidein { from{opacity:0; transform:translateX(30px)} to{opacity:1; transform:none} }
  .info-card h3 { font-size:17px; margin-bottom:6px; display:flex; align-items:center; gap:8px; }
  .info-card svg { border-radius:3px; box-shadow:0 1px 4px rgba(0,0,0,.4); flex:none; }
  .info-card p { font-size:13px; color:#c9cdee; margin:3px 0; }
  .info-card p b { color:#fff; }
  .info-card .btn { width:100%; margin-top:10px; padding:10px; font-size:15px; }
  @media (max-width:540px) {
    .info-card { right:10px; left:10px; top:auto; bottom:8px; width:auto; }
    .info-card p { display:inline-block; margin-right:10px; }
  }

  .country { text-align:center; font-size:clamp(22px,6vw,30px); font-weight:800; padding:2px 10px 8px; text-shadow:0 2px 8px rgba(0,0,0,.4); }
  .flag-wrap { flex:1; display:flex; align-items:center; justify-content:center; padding:0 16px; min-height:0; }
  .flag-card {
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12);
    border-radius:18px; padding:14px;
    box-shadow:0 12px 40px rgba(0,0,0,.35);
    max-width:min(92vw,560px); width:100%;
  }
  #flagSvg { display:block; width:100%; height:auto; max-height:40vh; margin:0 auto; }
  #flagSvg .sec { cursor:pointer; }
  .shake { animation:shake .5s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-6px)} 80%{transform:translateX(6px)} }
  .palette { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; padding:12px 16px 4px; }
  .swatch {
    width:42px; height:42px; border-radius:50%;
    border:3px solid rgba(255,255,255,.25); box-shadow:0 3px 10px rgba(0,0,0,.35);
    cursor:pointer; transition:transform .12s, border-color .12s;
  }
  .swatch.selected { transform:scale(1.18); border-color:#ffd54a; box-shadow:0 0 0 3px rgba(255,213,74,.35),0 3px 10px rgba(0,0,0,.35); }
  .actions { display:flex; justify-content:center; gap:12px; padding:10px 16px calc(16px + env(safe-area-inset-bottom)); }

  .overlay {
    position:fixed; inset:0; background:rgba(10,10,25,.85);
    display:flex; align-items:center; justify-content:center; z-index:20;
    backdrop-filter:blur(4px);
  }
  .panel {
    background:#262a4a; border:1px solid rgba(255,255,255,.15); border-radius:22px;
    padding:26px 24px; text-align:center; max-width:360px; width:88%;
    box-shadow:0 20px 60px rgba(0,0,0,.5); max-height:86vh; display:flex; flex-direction:column;
  }
  .panel h2 { font-size:25px; margin-bottom:6px; }
  .panel .big { font-size:38px; margin-bottom:4px; }
  .panel .pct { font-size:44px; font-weight:900; color:#ffd54a; margin:4px 0; }
  .panel p { color:#c9cdee; font-size:15px; }
  .panel .btn { margin-top:12px; width:100%; }
  .passed-list {
    margin-top:12px; overflow-y:auto; text-align:left;
    border-top:1px solid rgba(255,255,255,.12); padding-top:8px; min-height:0;
  }
  .passed-list h4 { font-size:14px; color:#ff9d5c; margin-bottom:6px; }
  .passed-list .row { display:flex; align-items:center; gap:10px; padding:5px 2px; font-size:15px; font-weight:600; }
  .passed-list svg { border-radius:3px; box-shadow:0 1px 4px rgba(0,0,0,.4); flex:none; }

  .toast {
    position:fixed; top:16%; left:50%; transform:translateX(-50%);
    font-size:28px; font-weight:900; padding:14px 30px; border-radius:16px;
    z-index:25; pointer-events:none; opacity:0; transition:opacity .2s, transform .3s;
    text-shadow:0 2px 6px rgba(0,0,0,.4); white-space:nowrap;
  }
  .toast.show { opacity:1; transform:translateX(-50%) scale(1.08); }
  .toast.good { background:rgba(34,181,115,.94); }
  .toast.bad { background:rgba(229,72,77,.94); }
  .confetti { position:fixed; top:-12px; width:10px; height:16px; z-index:24; pointer-events:none; animation:fall linear forwards; }
  @keyframes fall { to { transform:translateY(105vh) rotate(720deg); opacity:.7; } }
</style>
</head>
<body>

<header>
  <a class="menu-btn" href="index.html">&#127968; Menu</a>
  <h1>&#127912; Paint the Flag</h1>
  <div class="hdr-spacer" id="hdrPct">0%</div>
</header>

<div class="screen" id="mapScreen">
  <div class="scorebar">
    <div class="chip done">&#9989; Done: <b id="doneCount">0</b>/<b id="totalCount">0</b></div>
    <div class="chip passed">&#9193; Passed: <b id="passCount">0</b></div>
    <div class="chip">&#127757; <b id="pctText">0%</b> complete</div>
    <div class="pbar-wrap"><div class="pbar"><div id="pbarFill"></div></div></div>
  </div>
  <div class="map-wrap">
    <svg id="worldMap" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="info-card" id="infoCard" hidden>
      <h3><span id="infoFlag"></span><span id="infoName"></span></h3>
      <p>&#127758; Continent: <b id="infoCont"></b></p>
      <p>&#127963;&#65039; Capital: <b id="infoCap"></b></p>
      <p>&#128101; Population: <b id="infoPop"></b></p>
      <button class="btn btn-go" id="continueBtn">Continue &#9654;</button>
    </div>
  </div>
  <div class="prompt" id="promptBar">
    <div class="where"><small id="promptCont">Next stop&hellip;</small><span id="promptName"></span></div>
    <button class="btn btn-go" id="goBtn">&#127912; Go!</button>
    <button class="btn btn-pass" id="passBtn">Pass &#9193;</button>
  </div>
</div>

<div class="screen" id="paintScreen" hidden>
  <div class="country" id="country"></div>
  <div class="flag-wrap">
    <div class="flag-card" id="flagCard">
      <svg id="flagSvg" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="hatch" width="14" height="14" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
            <rect width="14" height="14" fill="#e9eaf2"></rect>
            <line x1="0" y1="0" x2="0" y2="14" stroke="#c9cbdc" stroke-width="6"></line>
          </pattern>
        </defs>
        <g id="flagG"></g>
      </svg>
    </div>
  </div>
  <div class="palette" id="palette"></div>
  <div class="actions">
    <button class="btn btn-map" id="backBtn">&#128506;&#65039;</button>
    <button class="btn btn-hint" id="hintBtn">&#128161; Hint</button>
    <button class="btn btn-check" id="checkBtn" disabled>&#10003; Check</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="overlay" id="resumeOverlay" hidden>
  <div class="panel">
    <div class="big">🌍</div>
    <h2>Welcome back!</h2>
    <p id="resumeInfo"></p>
    <button class="btn btn-primary" id="resumeYes">Continue Journey</button>
    <button class="btn btn-ghost" id="resumeNo">Start New</button>
  </div>
</div>

<div class="overlay" id="endOverlay" hidden>
  <div class="panel">
    <div class="big" id="endEmoji">&#127942;</div>
    <h2>Journey Complete!</h2>
    <p>You painted <b id="endDone">0</b> of <b id="endTotal">0</b> flags</p>
    <div class="pct" id="endPct">0%</div>
    <div class="passed-list" id="passedList" hidden>
      <h4>&#9193; Countries you passed on:</h4>
      <div id="passedRows"></div>
    </div>
    <button class="btn btn-primary" id="restartBtn">Play Again</button>
    <button class="btn btn-ghost" onclick="location.href='index.html'">&#127968; Main Menu</button>
  </div>
</div>

<script src="achievements.js"></script>
<script>
"use strict";
/* ================= colors & geometry helpers ================= */
const COLORS = {
  red:"#D80027", maroon:"#8A1538", orange:"#FF8A1E", yellow:"#FFDA2C", green:"#1F9E48",
  sky:"#63B3E8", blue:"#0052B4", purple:"#6C2D8C", white:"#FFFFFF", gray:"#9BA0AE", black:"#23272F"
};
const COLOR_ORDER = ["red","maroon","orange","yellow","green","sky","blue","purple","white","gray","black"];
const R = (x,y,w,h,c) => ({t:"rect",x,y,w,h,c});
const C = (cx,cy,r,c)  => ({t:"circle",cx,cy,r,c});
const P = (d,c)        => ({t:"path",d,c});
function starPath(cx, cy, rOut, rIn, rot=-90, pts=5) {
  let d = "";
  for (let i = 0; i < pts*2; i++) {
    const r = i % 2 === 0 ? rOut : rIn;
    const a = (rot + i * 180/pts) * Math.PI / 180;
    d += (i === 0 ? "M" : "L") + (cx + r * Math.cos(a)).toFixed(1) + " " + (cy + r * Math.sin(a)).toFixed(1);
  }
  return d + "Z";
}
const stars = list => list.map(a => starPath.apply(null, a)).join("");
function crossPath(v0, v1, h0, h1, W=900, H=600) {
  return `M${v0} 0H${v1}V${h0}H${W}V${h1}H${v1}V${H}H${v0}V${h1}H0V${h0}H${v0}Z`;
}
function diagBar(x0,y0,x1,y1,t) {
  const dx=x1-x0, dy=y1-y0, len=Math.hypot(dx,dy);
  const nx=-dy/len*t/2, ny=dx/len*t/2;
  return `M${(x0+nx).toFixed(1)} ${(y0+ny).toFixed(1)}L${(x1+nx).toFixed(1)} ${(y1+ny).toFixed(1)}L${(x1-nx).toFixed(1)} ${(y1-ny).toFixed(1)}L${(x0-nx).toFixed(1)} ${(y0-ny).toFixed(1)}Z`;
}
function ellipsePath(cx,cy,rx,ry) {
  return `M${cx} ${cy-ry}A${rx} ${ry} 0 1 1 ${cx} ${cy+ry}A${rx} ${ry} 0 1 1 ${cx} ${cy-ry}Z`;
}
function crescent(cx,cy,r) {
  return `M${cx} ${cy-r}A${r} ${r} 0 1 0 ${cx} ${cy+r}A${(r*1.15).toFixed(1)} ${(r*1.15).toFixed(1)} 0 0 1 ${cx} ${cy-r}Z`;
}
/* ---- emblem builder helpers ---- */
function circlePath(cx,cy,r,sweep=1) {
  return `M${cx} ${cy-r}A${r} ${r} 0 1 ${sweep} ${cx} ${cy+r}A${r} ${r} 0 1 ${sweep} ${cx} ${cy-r}Z`;
}
function ringPath(cx,cy,rO,rI) {
  return circlePath(cx,cy,rO,1) + circlePath(cx,cy,rI,0);
}
function rotRect(cx,cy,len,th,angDeg) {
  const a=angDeg*Math.PI/180, ux=Math.cos(a), uy=Math.sin(a), vx=-Math.sin(a), vy=Math.cos(a);
  const hx=ux*len/2, hy=uy*len/2, wx=vx*th/2, wy=vy*th/2;
  return `M${(cx-hx-wx).toFixed(1)} ${(cy-hy-wy).toFixed(1)}L${(cx+hx-wx).toFixed(1)} ${(cy+hy-wy).toFixed(1)}L${(cx+hx+wx).toFixed(1)} ${(cy+hy+wy).toFixed(1)}L${(cx-hx+wx).toFixed(1)} ${(cy-hy+wy).toFixed(1)}Z`;
}
function raysPath(cx,cy,n,r0,r1,halfDeg,rot=-90,arc=360) {
  let d="";
  const step = arc < 360 ? arc/(n-1) : 360/n;
  for (let i=0;i<n;i++) {
    const a=(rot+i*step)*Math.PI/180;
    const a1=a-halfDeg*Math.PI/180, a2=a+halfDeg*Math.PI/180;
    d+=`M${(cx+r0*Math.cos(a1)).toFixed(1)} ${(cy+r0*Math.sin(a1)).toFixed(1)}L${(cx+r1*Math.cos(a)).toFixed(1)} ${(cy+r1*Math.sin(a)).toFixed(1)}L${(cx+r0*Math.cos(a2)).toFixed(1)} ${(cy+r0*Math.sin(a2)).toFixed(1)}Z`;
  }
  return d;
}
function sunPath(cx,cy,rDisc,n,r1,halfDeg,rot=-90) {
  return circlePath(cx,cy,rDisc) + raysPath(cx,cy,n,rDisc*0.92,r1,halfDeg,rot);
}
function starOutline(cx,cy,rO,rI,rot=-90,pts=5,frac=0.55) {
  let d = starPath(cx,cy,rO,rI,rot,pts);
  const n=pts*2;
  for (let i=n-1;i>=0;i--) {
    const r=(i%2===0?rO:rI)*frac;
    const a=(rot+i*180/pts)*Math.PI/180;
    d+=(i===n-1?"M":"L")+(cx+r*Math.cos(a)).toFixed(1)+" "+(cy+r*Math.sin(a)).toFixed(1);
  }
  return d+"Z";
}
function triOutline(cx,cy,r,rot,frac=0.6) {
  let d="", e="";
  for (let i=0;i<3;i++) {
    const a=(rot+i*120)*Math.PI/180;
    d+=(i?"L":"M")+(cx+r*Math.cos(a)).toFixed(1)+" "+(cy+r*Math.sin(a)).toFixed(1);
  }
  for (let i=2;i>=0;i--) {
    const a=(rot+i*120)*Math.PI/180;
    e+=(i===2?"M":"L")+(cx+r*frac*Math.cos(a)).toFixed(1)+" "+(cy+r*frac*Math.sin(a)).toFixed(1);
  }
  return d+"Z"+e+"Z";
}
function hexagramOutline(cx,cy,r,frac=0.62) {
  return triOutline(cx,cy,r,-90,frac) + triOutline(cx,cy,r,90,frac);
}
function chakraPath(cx,cy,r) {
  let d = ringPath(cx,cy,r,r*0.8) + circlePath(cx,cy,r*0.16);
  for (let i=0;i<24;i++) {
    const a=i*15*Math.PI/180;
    const p = (rr,da)=> (cx+rr*Math.cos(a+da)).toFixed(1)+" "+(cy+rr*Math.sin(a+da)).toFixed(1);
    d+=`M${p(r*0.18,-0.06)}L${p(r*0.5,-0.10)}L${p(r*0.82,0)}L${p(r*0.5,0.10)}Z`;
  }
  return d;
}
function starsCircle(cx,cy,R,n,rS,rot=-90) {
  let d="";
  for (let i=0;i<n;i++) {
    const a=(rot+i*360/n)*Math.PI/180;
    d+=starPath(cx+R*Math.cos(a), cy+R*Math.sin(a), rS, rS*0.4);
  }
  return d;
}
function trigram(cx,cy,angDeg,pattern) {
  let d="";
  pattern.forEach((solid,i)=>{
    const off=(i-1)*26;
    const a=angDeg*Math.PI/180;
    const ox=cx-Math.sin(a)*off, oy=cy+Math.cos(a)*off;
    if (solid) d+=rotRect(ox,oy,84,16,angDeg);
    else {
      const ux=Math.cos(a), uy=Math.sin(a);
      d+=rotRect(ox-ux*23,oy-uy*23,38,16,angDeg)+rotRect(ox+ux*23,oy+uy*23,38,16,angDeg);
    }
  });
  return d;
}
/* heraldic eagle (1 or 2 heads), centered, size s = half-height */
function eaglePath(cx,cy,s,heads=2) {
  const u=s/100;
  const X=v=>(cx+v*u).toFixed(1), Y=v=>(cy+v*u).toFixed(1);
  let d=`M${X(0)} ${Y(-60)}L${X(16)} ${Y(-20)}L${X(14)} ${Y(55)}L${X(0)} ${Y(75)}L${X(-14)} ${Y(55)}L${X(-16)} ${Y(-20)}Z`;
  const wing=f=>`M${X(14*f)} ${Y(-15)}L${X(95*f)} ${Y(-55)}L${X(70*f)} ${Y(-18)}L${X(105*f)} ${Y(-20)}L${X(72*f)} ${Y(12)}L${X(100*f)} ${Y(22)}L${X(62*f)} ${Y(38)}L${X(14*f)} ${Y(30)}Z`;
  d+=wing(1)+wing(-1);
  if (heads===2) {
    d+=`M${X(4)} ${Y(-48)}L${X(30)} ${Y(-78)}L${X(42)} ${Y(-66)}L${X(14)} ${Y(-38)}Z`;
    d+=`M${X(-4)} ${Y(-48)}L${X(-30)} ${Y(-78)}L${X(-42)} ${Y(-66)}L${X(-14)} ${Y(-38)}Z`;
  } else {
    d+=`M${X(-6)} ${Y(-50)}L${X(4)} ${Y(-84)}L${X(20)} ${Y(-72)}L${X(8)} ${Y(-44)}Z`;
  }
  d+=`M${X(0)} ${Y(72)}L${X(24)} ${Y(98)}L${X(0)} ${Y(90)}L${X(-24)} ${Y(98)}Z`;
  return d;
}
/* soaring bird silhouette, s = half wingspan */
function birdPath(cx,cy,s,flip=1) {
  const u=s/100, f=flip;
  const X=v=>(cx+v*u).toFixed(1), Y=v=>(cy+v*u*f).toFixed(1);
  return `M${X(-100)} ${Y(8)}Q${X(-55)} ${Y(-32)} ${X(-12)} ${Y(-12)}Q${X(-4)} ${Y(-26)} ${X(0)} ${Y(-26)}Q${X(4)} ${Y(-26)} ${X(12)} ${Y(-12)}Q${X(55)} ${Y(-32)} ${X(100)} ${Y(8)}Q${X(56)} ${Y(2)} ${X(30)} ${Y(6)}Q${X(14)} ${Y(22)} ${X(0)} ${Y(22)}Q${X(-14)} ${Y(22)} ${X(-30)} ${Y(6)}Q${X(-56)} ${Y(2)} ${X(-100)} ${Y(8)}Z`;
}
/* standing bird (crane/parrot/quetzal base), s = half-height */
function standingBird(cx,cy,s) {
  const u=s/100;
  const X=v=>(cx+v*u).toFixed(1), Y=v=>(cy+v*u).toFixed(1);

const MAP_W = 1000, MAP_H = 520;
const proj = (lat, lon) => [ (lon+180)/360*MAP_W, (85-lat)/145*MAP_H ];

/* two zoom insets */
const INSETS = {
  eu:{label:"EUROPE (zoomed)", x:6, y:298, w:278, h:214, lat0:34.5, lat1:66.8, lon0:-25, lon1:34.5},
  cb:{label:"CARIBBEAN", x:348, y:114, w:110, h:176, lat0:6.5, lat1:27.5, lon0:-92, lon1:-58}
};
const EU_BOX = (() => { const [x0,y0]=proj(67,-13), [x1,y1]=proj(34,34); return {x:x0,y:y0,w:x1-x0,h:y1-y0}; })();
const CB_BOX = (() => { const [x0,y0]=proj(27.5,-92), [x1,y1]=proj(6.5,-58); return {x:x0,y:y0,w:x1-x0,h:y1-y0}; })();

const TILE_W = 16, TILE_H = 11;

/* place all tiles, then relax overlaps apart */
function computeLayout() {
  const pts = FLAGS.map((f,i) => {
    if (f.reg && INSETS[f.reg]) {
      const n = INSETS[f.reg];
      return { i, region:f.reg,
        x: n.x + 10 + (f.ll[1]-n.lon0)/(n.lon1-n.lon0)*(n.w-20),
        y: n.y + 22 + (n.lat1-f.ll[0])/(n.lat1-n.lat0)*(n.h-32) };
    }
    const [x,y] = proj(f.ll[0], f.ll[1]);
    return { i, region:"main", x, y };
  });
  const bounds = {
    main:{x0:12, y0:12, x1:MAP_W-12, y1:MAP_H-12},
    eu:{x0:INSETS.eu.x+10, y0:INSETS.eu.y+20, x1:INSETS.eu.x+INSETS.eu.w-10, y1:INSETS.eu.y+INSETS.eu.h-8},
    cb:{x0:INSETS.cb.x+10, y0:INSETS.cb.y+20, x1:INSETS.cb.x+INSETS.cb.w-10, y1:INSETS.cb.y+INSETS.cb.h-8}
  };
  const obstacles = [INSETS.eu, INSETS.cb].map(n => ({x0:n.x-10, y0:n.y-8, x1:n.x+n.w+10, y1:n.y+n.h+8}));
  const needX = TILE_W+3, needY = TILE_H+3;
  for (let it = 0; it < 400; it++) {
    let moved = false;
    for (let a = 0; a < pts.length; a++) {
      for (let b = a+1; b < pts.length; b++) {
        const A = pts[a], B = pts[b];
        if (A.region !== B.region) continue;
        let dx = B.x-A.x, dy = B.y-A.y;
        if (Math.abs(dx) < needX && Math.abs(dy) < needY) {
          if (dx === 0 && dy === 0) dy = 0.5;
          const px = needX-Math.abs(dx), py = needY-Math.abs(dy);
          if (px < py) { const s = dx>=0?1:-1; A.x -= s*px/2; B.x += s*px/2; }
          else { const s = dy>=0?1:-1; A.y -= s*py/2; B.y += s*py/2; }
          moved = true;
        }
      }
    }
    pts.forEach(p => {
      const bd = bounds[p.region];
      p.x = Math.min(bd.x1, Math.max(bd.x0, p.x));
      p.y = Math.min(bd.y1, Math.max(bd.y0, p.y));
      if (p.region === "main") obstacles.forEach(o => {
        if (p.x > o.x0 && p.x < o.x1 && p.y > o.y0 && p.y < o.y1) {
          const dl = p.x-o.x0, dr = o.x1-p.x, dt = p.y-o.y0, db = o.y1-p.y;
          const m = Math.min(dl,dr,dt,db);
          if (m === dl) p.x = o.x0; else if (m === dr) p.x = o.x1;
          else if (m === dt) p.y = o.y0; else p.y = o.y1;
          moved = true;
        }
      });
    });
    if (!moved) break;
  }
  return pts;
}

let AC = null;
function beep(freq, dur=.12, type="sine", vol=.15, when=0) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime + when;
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t + dur + .02);
  } catch(e){}
}
const sndTap  = () => beep(600,.05,"square",.06);
const sndPick = () => beep(420,.06,"sine",.1);
const sndGo   = () => beep(520,.09,"sine",.12);
const sndPass = () => beep(300,.12,"sine",.1);
const sndWin  = () => { beep(523,.12,"sine",.15); beep(659,.12,"sine",.15,.1); beep(784,.22,"sine",.15,.2); };
const sndBad  = () => { beep(220,.2,"sawtooth",.12); beep(165,.28,"sawtooth",.12,.15); };

const $ = id => document.getElementById(id);
const SVGNS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function sectionEl(s) {
  let e;
  if (s.t === "rect") { e = document.createElementNS(SVGNS,"rect"); e.setAttribute("x",s.x); e.setAttribute("y",s.y); e.setAttribute("width",s.w); e.setAttribute("height",s.h); }
  else if (s.t === "circle") { e = document.createElementNS(SVGNS,"circle"); e.setAttribute("cx",s.cx); e.setAttribute("cy",s.cy); e.setAttribute("r",s.r); }
  else { e = document.createElementNS(SVGNS,"path"); e.setAttribute("d",s.d); }
  return e;
}
function miniFlag(f, w) {
  const fw = f.w || 900;
  const s = document.createElementNS(SVGNS,"svg");
  s.setAttribute("viewBox", `0 0 ${fw} 600`);
  s.setAttribute("width", w);
  s.setAttribute("height", Math.round(w*600/fw));
  f.sec.forEach(sec => {
    const e = sectionEl(sec);
    e.setAttribute("fill", COLORS[sec.c]);
    s.appendChild(e);
  });
  return s;
}

/* ================= state ================= */
let status = [];
let curIdx = -1;
let hints = 10;
let selected = "red";
let painted = [];
let locked = false;
let tiles = [];
const TOTAL = FLAGS.length;

/* ================= save / resume ================= */
const SAVE_KEY = "gg-save-paint-flag";
function saveGame() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ status, hints })); } catch(e) {}
}
function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch(e) {} }
function loadSave() {
  try { return JSON.parse(localStorage.getItem(SAVE_KEY) || "null"); } catch(e) { return null; }
}

function buildMap() {
  const svg = $("worldMap");
  svg.innerHTML = "";
  const defs = el("defs", {}, svg);
  tiles = [];

  el("rect", {x:0, y:0, width:MAP_W, height:MAP_H, rx:14, fill:"#0d1430"}, svg);
  LANDS.forEach(poly => {
    const d = poly.map((p,i) => (i?"L":"M") + proj(p[0],p[1]).map(v=>v.toFixed(1)).join(" ")).join("") + "Z";
    el("path", {d, fill:"#2e3a5c", stroke:"#465179", "stroke-width":1}, svg);
  });
  // source boxes + insets
  el("rect", {x:EU_BOX.x, y:EU_BOX.y, width:EU_BOX.w, height:EU_BOX.h, fill:"none", stroke:"#ffd54a", "stroke-width":1.2, "stroke-dasharray":"5 4", rx:4, opacity:.7}, svg);
  el("line", {x1:EU_BOX.x, y1:EU_BOX.y+EU_BOX.h, x2:INSETS.eu.x+INSETS.eu.w, y2:INSETS.eu.y, stroke:"#ffd54a", "stroke-width":1, "stroke-dasharray":"4 4", opacity:.4}, svg);
  el("rect", {x:CB_BOX.x, y:CB_BOX.y, width:CB_BOX.w, height:CB_BOX.h, fill:"none", stroke:"#63e0b8", "stroke-width":1.2, "stroke-dasharray":"5 4", rx:4, opacity:.7}, svg);
  el("line", {x1:CB_BOX.x+CB_BOX.w, y1:CB_BOX.y+CB_BOX.h/2, x2:INSETS.cb.x, y2:INSETS.cb.y+INSETS.cb.h/2, stroke:"#63e0b8", "stroke-width":1, "stroke-dasharray":"4 4", opacity:.4}, svg);
  [["eu","#ffd54a"],["cb","#63e0b8"]].forEach(([k,col]) => {
    const n = INSETS[k];
    el("rect", {x:n.x, y:n.y, width:n.w, height:n.h, rx:10, fill:"#101a3d", stroke:col, "stroke-width":1.2, opacity:.97}, svg);
    const lbl = el("text", {x:n.x+8, y:n.y+14, fill:col, "font-size":10, "font-weight":"bold"}, svg);
    lbl.textContent = n.label;
  });

  const layout = computeLayout();
  layout.forEach(p => {
    const g = el("g", {}, svg);
    const rect = el("rect", {
      x:p.x-TILE_W/2, y:p.y-TILE_H/2, width:TILE_W, height:TILE_H, rx:2,
      fill:"#556086", stroke:"#7c86b4", "stroke-width":1
    }, g);
    tiles[p.i] = {g, rect, x:p.x, y:p.y, tw:TILE_W, th:TILE_H};
  });

  const mk = el("g", {id:"marker", visibility:"hidden"}, svg);
  const bob = el("g", {"class":"bob"}, mk);
  el("line", {x1:0, y1:0, x2:0, y2:-28, stroke:"#e8eaf5", "stroke-width":2.5, "stroke-linecap":"round"}, bob);
  el("path", {d:"M1 -28L17 -22.5L1 -17Z", fill:"#D80027", stroke:"#8e0019", "stroke-width":1}, bob);
  el("circle", {cx:0, cy:-28, r:2.4, fill:"#ffd54a"}, bob);
  el("ellipse", {cx:0, cy:1.5, rx:5, ry:2, fill:"rgba(0,0,0,.45)"}, bob);

  svg._defs = defs;
}

function moveMarker(i) {
  const t = tiles[i];
  const mk = $("marker");
  mk.setAttribute("visibility", "visible");
  mk.setAttribute("transform", `translate(${t.x} ${t.y - t.th/2})`);
  $("worldMap").appendChild(mk);
  tiles.forEach((tl, j) => {
    tl.rect.classList.toggle("cur-tile", j === i);
    if (j === i) { tl.rect.setAttribute("stroke", "#ffd54a"); tl.rect.setAttribute("stroke-width", 2); }
    else if (status[j] === "pending") { tl.rect.setAttribute("stroke", "#7c86b4"); tl.rect.setAttribute("stroke-width", 1); }
  });
}

function markDone(i) {
  const f = FLAGS[i], t = tiles[i];
  const fw = f.w || 900;
  const patId = "pat-" + f.iso;
  if (!document.getElementById(patId)) {
    const pat = el("pattern", {id:patId, viewBox:`0 0 ${fw} 600`, width:1, height:1, preserveAspectRatio:"xMidYMid slice"}, $("worldMap")._defs);
    f.sec.forEach(sec => {
      const e = sectionEl(sec);
      e.setAttribute("fill", COLORS[sec.c]);
      pat.appendChild(e);
    });
  }
  t.rect.classList.remove("cur-tile");
  t.rect.setAttribute("fill", `url(#${patId})`);
  t.rect.setAttribute("stroke", "#3ddc84");
  t.rect.setAttribute("stroke-width", 1.4);
}

function markPassed(i) {
  const t = tiles[i];
  t.rect.classList.remove("cur-tile");
  t.rect.setAttribute("fill", "#2a2e44");
  t.rect.setAttribute("stroke", "#565b78");
  t.rect.setAttribute("stroke-width", 1);
  const x = el("text", {x:t.x, y:t.y+3.5, "text-anchor":"middle", "class":"tile-x"}, t.g);
  x.textContent = "✕";
}

function counts() {
  let d=0, p=0;
  status.forEach(s => { if (s==="done") d++; else if (s==="passed") p++; });
  return {d, p};
}
function updateScore() {
  const {d, p} = counts();
  const pct = Math.round(d / TOTAL * 100);
  $("doneCount").textContent = d;
  $("totalCount").textContent = TOTAL;
  $("passCount").textContent = p;
  $("pctText").textContent = pct + "%";
  $("hdrPct").textContent = pct + "%";
  $("pbarFill").style.width = pct + "%";
}

/* ================= flow ================= */
function pickNext() {
  $("infoCard").hidden = true;
  const pending = status.map((s,i) => s==="pending" ? i : -1).filter(i => i>=0);
  if (pending.length === 0) { endGame(); return; }
  curIdx = pending[Math.floor(Math.random() * pending.length)];
  $("promptName").textContent = FLAGS[curIdx].name;
  $("promptCont").textContent = "Next stop… " + FLAGS[curIdx].cont;
  $("promptBar").style.visibility = "visible";
  moveMarker(curIdx);
}

function onPass() {
  if (curIdx < 0) return;
  sndPass();
  status[curIdx] = "passed";
  markPassed(curIdx);
  updateScore();
  saveGame();
  pickNext();
}

function onGo() {
  sndGo();
  $("mapScreen").hidden = true;
  $("paintScreen").hidden = false;
  loadFlag();
}

function backToMap() {
  $("paintScreen").hidden = true;
  $("mapScreen").hidden = false;
}

function showInfo(i) {
  const f = FLAGS[i];
  $("infoFlag").innerHTML = "";
  $("infoFlag").appendChild(miniFlag(f, 34));
  $("infoName").textContent = f.name;
  $("infoCont").textContent = f.cont;
  $("infoCap").textContent = f.cap;
  $("infoPop").textContent = f.pop;
  $("infoCard").hidden = false;
  $("promptBar").style.visibility = "hidden";
}

function onFlagComplete() {
  status[curIdx] = "done";
  updateScore();
  saveGame();
  if (window.GGA) {
    const d = status.filter(s => s === "done").length;
    if (d >= 10) GGA.award('pf_10');
    if (d >= 25) GGA.award('pf_25');
    GGA.haptic('success');
  }
  toast("\u{1F389} Well done!", true);
  confetti();
  sndWin();
  setTimeout(() => {
    backToMap();
    markDone(curIdx);
    $("marker").setAttribute("visibility", "hidden");
    showInfo(curIdx);
  }, 1300);
}

/* ================= paint screen ================= */
const flagSvg = $("flagSvg"), flagG = $("flagG");

function buildPalette(flag) {
  const pal = $("palette");
  pal.innerHTML = "";
  const keys = COLOR_ORDER.filter(k => flag.sec.some(s => s.c === k));
  if (!keys.includes(selected)) selected = keys[0];
  keys.forEach(key => {
    const d = document.createElement("div");
    d.className = "swatch" + (key === selected ? " selected" : "");
    d.style.background = COLORS[key];
    d.dataset.key = key;
    d.addEventListener("pointerdown", e => {
      e.preventDefault();
      selected = key;
      sndPick();
      [...pal.children].forEach(s => s.classList.toggle("selected", s.dataset.key === key));
    });
    pal.appendChild(d);
  });
}

function loadFlag() {
  const f = FLAGS[curIdx];
  buildPalette(f);
  const fw = f.w || 900;
  flagSvg.setAttribute("viewBox", `0 0 ${fw} 600`);
  flagG.innerHTML = "";
  painted = f.sec.map(() => null);
  locked = false;
  f.sec.forEach((s, i) => {
    const e = sectionEl(s);
    e.classList.add("sec");
    e.setAttribute("fill", "url(#hatch)");
    e.setAttribute("stroke", "#2b2f3a");
    e.setAttribute("stroke-width", "3");
    e.addEventListener("pointerdown", ev => {
      ev.preventDefault();
      if (locked) return;
      painted[i] = selected;
      e.setAttribute("fill", COLORS[selected]);
      sndTap();
      updateCheck();
    });
    flagG.appendChild(e);
  });
  $("country").textContent = f.name;
  updateCheck();
  updateHint();
}

function updateCheck() {
  $("checkBtn").disabled = painted.some(p => p === null) || locked;
}
function updateHint() {
  $("hintBtn").textContent = "\u{1F4A1} Hint (" + hints + ")";
  $("hintBtn").disabled = hints <= 0 || locked;
}

function check() {
  if (locked) return;
  const f = FLAGS[curIdx];
  const wrong = [];
  f.sec.forEach((s, i) => { if (painted[i] !== s.c) wrong.push(i); });
  if (wrong.length === 0) {
    locked = true;
    onFlagComplete();
  } else {
    toast(wrong.length + " wrong — try again!", false);
    sndBad();
    $("flagCard").classList.add("shake");
    setTimeout(() => $("flagCard").classList.remove("shake"), 550);
    wrong.forEach(i => {
      const e = flagG.children[i];
      e.setAttribute("stroke", "#ff2d2d");
      e.setAttribute("stroke-width", "8");
      setTimeout(() => {
        e.setAttribute("stroke", "#2b2f3a");
        e.setAttribute("stroke-width", "3");
        e.setAttribute("fill", "url(#hatch)");
        painted[i] = null;
        updateCheck();
      }, 700);
    });
  }
}

function hint() {
  if (hints <= 0 || locked) return;
  const f = FLAGS[curIdx];
  let i = painted.findIndex(p => p === null);
  if (i === -1) i = f.sec.findIndex((s, j) => painted[j] !== s.c);
  if (i === -1) return;
  hints--;
  painted[i] = f.sec[i].c;
  flagG.children[i].setAttribute("fill", COLORS[f.sec[i].c]);
  sndPick();
  updateCheck();
  updateHint();
  saveGame();
}

/* ================= end screen ================= */
function endGame() {
  clearSave();
  const {d, p} = counts();
  const pct = Math.round(d / TOTAL * 100);
  $("endDone").textContent = d;
  $("endTotal").textContent = TOTAL;
  $("endPct").textContent = pct + "%";
  $("endEmoji").textContent = p === 0 ? "\u{1F3C6}" : "\u{1F3C1}";
  const rows = $("passedRows");
  rows.innerHTML = "";
  const passedIdx = status.map((s,i) => s==="passed" ? i : -1).filter(i => i>=0);
  $("passedList").hidden = passedIdx.length === 0;
  passedIdx
    .map(i => FLAGS[i])
    .sort((a,b) => a.name.localeCompare(b.name))
    .forEach(f => {
      const row = document.createElement("div");
      row.className = "row";
      row.appendChild(miniFlag(f, 42));
      const span = document.createElement("span");
      span.textContent = f.name;
      row.appendChild(span);
      rows.appendChild(row);
    });
  $("endOverlay").hidden = false;
}

/* ================= fx ================= */
function toast(msg, good) {
  const t = $("toast");
  t.textContent = msg;
  t.className = "toast show " + (good ? "good" : "bad");
  setTimeout(() => t.classList.remove("show"), 1100);
}
function confetti() {
  const cols = Object.values(COLORS).filter(c => c !== "#FFFFFF");
  for (let i = 0; i < 40; i++) {
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random() * 100 + "vw";
    c.style.background = cols[Math.floor(Math.random() * cols.length)];
    c.style.animationDuration = (1.1 + Math.random() * 1.2) + "s";
    c.style.animationDelay = Math.random() * .3 + "s";
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 2800);
  }
}

/* ================= game setup ================= */
function newGame() {
  clearSave();
  status = FLAGS.map(() => "pending");
  hints = 10;
  curIdx = -1;
  $("endOverlay").hidden = true;
  $("infoCard").hidden = true;
  $("paintScreen").hidden = true;
  $("mapScreen").hidden = false;
  buildMap();
  updateScore();
  pickNext();
}

$("goBtn").addEventListener("click", onGo);
$("passBtn").addEventListener("click", onPass);
$("continueBtn").addEventListener("click", pickNext);
$("checkBtn").addEventListener("click", check);
$("hintBtn").addEventListener("click", hint);
$("backBtn").addEventListener("click", backToMap);
$("restartBtn").addEventListener("click", newGame);

function resumeGame(sv) {
  status = sv.status;
  hints = (typeof sv.hints === "number") ? sv.hints : 10;
  curIdx = -1;
  $("endOverlay").hidden = true;
  $("infoCard").hidden = true;
  $("paintScreen").hidden = true;
  $("mapScreen").hidden = false;
  buildMap();
  status.forEach((s, i) => { if (s === "done") markDone(i); else if (s === "passed") markPassed(i); });
  updateScore();
  pickNext();
}

(function boot() {
  const sv = loadSave();
  const started = sv && Array.isArray(sv.status) && sv.status.length === TOTAL &&
    sv.status.some(s => s !== "pending");
  if (started) {
    const d = sv.status.filter(s => s === "done").length;
    $("resumeInfo").textContent = d + " of " + TOTAL + " flags painted · " + (sv.hints||0) + " hints left";
    resumeGame(sv);
    $("resumeOverlay").hidden = false;
    $("resumeYes").addEventListener("click", () => { $("resumeOverlay").hidden = true; });
    $("resumeNo").addEventListener("click", () => { $("resumeOverlay").hidden = true; newGame(); });
  } else {
    newGame();
  }
})();
</script>
