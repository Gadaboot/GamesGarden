<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Petal Words</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    background:
      radial-gradient(120% 85% at 6% -8%, #f7b6ef 0%, transparent 55%),
      radial-gradient(120% 80% at 96% 105%, #ffdcf2 0%, transparent 55%),
      linear-gradient(160deg, #b558d8 0%, #e585d2 48%, #fff0fa 100%);
    background-color:#e585d2;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    user-select:none;-webkit-user-select:none;touch-action:none;
    display:flex;flex-direction:column;align-items:center;
    padding:calc(env(safe-area-inset-top) + 6px) 8px calc(env(safe-area-inset-bottom) + 6px);
  }
  #shell{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column}
  .bar{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .pill{display:inline-flex;align-items:center;gap:5px;text-decoration:none;color:#9c2fae;
    background:rgba(255,255,255,.94);border:1.5px solid #fff;padding:6px 12px;border-radius:999px;
    font-size:12.5px;font-weight:800;box-shadow:0 3px 9px rgba(120,20,110,.28);cursor:pointer;white-space:nowrap}
  .pill:active{transform:scale(.95)}
  .title{flex:1;text-align:center;font-weight:900;letter-spacing:1.6px;line-height:1;
    font-size:clamp(15px,4.8vw,21px);text-shadow:0 2px 0 #b13fc4,0 4px 12px rgba(110,15,100,.4)}
  .strip{display:flex;gap:6px;margin-bottom:5px}
  .chip{flex:1;text-align:center;padding:6px 2px;border-radius:13px;
    background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.36)}
  .chip .k{font-size:8px;letter-spacing:1.1px;font-weight:900;opacity:.85}
  .chip .v{font-size:clamp(13px,4.2vw,17px);font-weight:900;font-variant-numeric:tabular-nums}
  .prog{height:6px;border-radius:99px;background:rgba(255,255,255,.26);
    border:1px solid rgba(255,255,255,.34);overflow:hidden;margin-bottom:7px}
  .pf{height:100%;width:0%;border-radius:99px;
    background:linear-gradient(90deg,#fff2fb,#ffd9f2 55%,#fff);transition:width .28s ease}
  #stage{flex:1;position:relative;min-height:0;display:flex;flex-direction:column}
  #wordbar{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.94);
    border:1.5px solid #fff;border-radius:14px;padding:6px 10px;cursor:pointer;
    box-shadow:0 3px 9px rgba(120,20,110,.2);flex:0 0 auto}
  #wordbar:active{transform:scale(.99)}
  #wbn{font-size:10.5px;font-weight:900;letter-spacing:.6px;color:#9c2fae;white-space:nowrap}
  #wblist{flex:1;overflow:hidden;white-space:nowrap;font-size:11.5px;font-weight:700;
    color:#c98fd6;text-overflow:ellipsis}
  #wbg{font-size:11px;font-weight:900;color:#c98fd6}
  #cur{position:absolute;left:0;right:0;text-align:center;
    display:flex;align-items:center;justify-content:center;
    font-weight:900;letter-spacing:2.5px;white-space:nowrap;overflow:hidden;
    text-shadow:0 2px 5px rgba(110,15,100,.32);line-height:1}
  #cur .mid{color:#ffe27a}
  #cur .caret{display:inline-block;width:2px;height:.86em;vertical-align:-.08em;
    background:#fff;margin-left:1px;animation:bl 1s steps(1,end) infinite}
  @keyframes bl{0%,50%{opacity:1}51%,100%{opacity:0}}
  #flower{position:absolute;left:0;right:0;bottom:0}
  #cv{display:block;position:absolute;inset:0;touch-action:none}
  #msg{position:absolute;left:50%;top:6px;transform:translateX(-50%);pointer-events:none;
    background:rgba(255,255,255,.96);color:#9c2fae;font-size:13px;font-weight:900;
    padding:7px 15px;border-radius:999px;box-shadow:0 5px 16px rgba(110,15,100,.3);
    opacity:0;white-space:nowrap;max-width:96%;overflow:hidden;text-overflow:ellipsis}
  #msg.show{animation:pop 1.25s ease forwards}
  #msg.good{background:#fff3fb}
  @keyframes pop{0%{opacity:0;transform:translate(-50%,7px) scale(.9)}
    14%{opacity:1;transform:translate(-50%,0) scale(1)}
    72%{opacity:1;transform:translate(-50%,0) scale(1)}
    100%{opacity:0;transform:translate(-50%,-9px) scale(.98)}}
  #tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:7px}
  .tool{background:rgba(255,255,255,.95);border:1.5px solid #fff;border-radius:15px;
    padding:9px 2px 8px;text-align:center;cursor:pointer;color:#9c2fae;
    box-shadow:0 4px 0 rgba(150,35,140,.35),0 6px 14px rgba(120,20,110,.22)}
  .tool:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(150,35,140,.35)}
  .tool.off{opacity:.42}
  .tool .ti{font-size:19px;line-height:1}
  .tool .tl{font-size:9px;font-weight:900;letter-spacing:.5px;margin-top:2px;opacity:.75}
  .ovl{position:absolute;inset:0;z-index:40;display:none;align-items:center;justify-content:center;
    background:rgba(140,30,130,.42);backdrop-filter:blur(6px);padding:12px}
  .ovl.on{display:flex}
  .card{width:100%;max-width:352px;background:linear-gradient(180deg,#fff,#fff4fc);
    border:2px solid #fff;border-radius:22px;padding:18px 16px 14px;text-align:center;
    color:#a878b4;box-shadow:0 20px 50px rgba(110,15,100,.45);max-height:100%;overflow:auto}
  .card h2{font-size:23px;font-weight:900;letter-spacing:1px;color:#b13fc4;margin-bottom:3px}
  .card p{font-size:13.5px;line-height:1.5;color:#c99ad4;margin:7px 0}
  .sizes{display:grid;grid-template-columns:1fr;gap:8px;margin-top:11px}
  .sz{border-radius:16px;padding:11px;cursor:pointer;color:#fff;font-weight:900;
    box-shadow:0 4px 0 rgba(0,0,0,.14);display:flex;align-items:center;justify-content:space-between}
  .sz:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.14)}
  .sz .sn{font-size:14.5px}
  .sz .stg{font-size:10px;opacity:.93;font-weight:800;margin-top:2px;text-align:left}
  .sz .sc{font-size:10px;font-weight:900;opacity:.95;text-align:right;white-space:nowrap}
  .z-p{background:linear-gradient(180deg,#f2a3e6,#b13fc4)}
  .z-a{background:linear-gradient(180deg,#8fe3c4,#22a37c)}
  .z-b{background:linear-gradient(180deg,#8fc9ff,#2f75d6)}
  .z-c{background:linear-gradient(180deg,#ffb27a,#e8702f)}
  .btn{display:block;width:100%;margin-top:8px;padding:12px;border:none;border-radius:15px;
    font-size:14.5px;font-weight:900;cursor:pointer;letter-spacing:.4px;font-family:inherit}
  .btn-go{background:linear-gradient(180deg,#f2a3e6,#b13fc4);color:#fff;
    box-shadow:0 5px 0 #8a2b9c,0 8px 18px rgba(180,60,190,.32)}
  .btn-go:active{transform:translateY(3px);box-shadow:0 2px 0 #8a2b9c}
  .btn-alt{background:#fdeefa;color:#9c2fae;border:1.5px solid #f6d9ef}
  .rules{text-align:left;font-size:12.6px;line-height:1.65;color:#c99ad4;margin:10px 2px}
  .rules b{color:#b13fc4}
  .stats{display:flex;gap:8px;margin-top:11px}
  .st{flex:1;background:#fdeefa;border-radius:13px;padding:8px 4px}
  .st .sk{font-size:8.5px;letter-spacing:1.1px;font-weight:900;color:#e3b8de}
  .st .sv{font-size:16px;font-weight:900;font-variant-numeric:tabular-nums;color:#b13fc4}
  .wlist{text-align:left;margin:10px 0 2px;max-height:44vh;overflow:auto;
    column-count:3;column-gap:8px;font-size:11.5px;line-height:1.62;color:#a878b4}
  .wlist span{display:block;break-inside:avoid}
  .wlist .pg{color:#b13fc4;font-weight:900}
  .wlist .miss{color:#dcb8e2}
  .ladder{text-align:left;font-size:11.6px;line-height:1.5;color:#c99ad4;margin:8px 2px 2px;
    column-count:2;column-gap:10px}
  .ladder span{display:block;break-inside:avoid}
  .ladder b{color:#b13fc4}
  .ladder .now{color:#b13fc4;font-weight:900}
  @media (max-height:700px){
    .card{padding:13px 13px 10px}.card h2{font-size:19px}
    .card p{font-size:12px;margin:5px 0}
    .rules{font-size:11.4px;line-height:1.45}.btn{padding:10px;font-size:13.5px;margin-top:6px}
    .sz{padding:9px}.sz .sn{font-size:13.5px}.sizes{gap:7px;margin-top:9px}
    .wlist{max-height:38vh}
  }
</style>
</head>

<div id="shell">
  <div class="bar">
    <a class="pill" href="index.html">&#9776; Menu</a>
    <div class="title">PETAL WORDS</div>
    <button class="pill" id="bPause">&#10074;&#10074;</button>
  </div>
  <div class="strip">
    <div class="chip"><div class="k">SCORE</div><div class="v" id="vScore">0</div></div>
    <div class="chip"><div class="k">RANK</div><div class="v" id="vRank">Seed</div></div>
    <div class="chip"><div class="k">WORDS</div><div class="v" id="vWords">0/0</div></div>
  </div>
  <div class="prog"><div class="pf" id="pf"></div></div>
  <div id="stage">
    <div id="wordbar">
      <span id="wbn">0 words</span><span id="wblist"></span><span id="wbg">&#9662;</span>
    </div>
    <div id="cur"></div>
    <div id="flower"><canvas id="cv"></canvas><div id="msg"></div></div>
    <!-- #cur and #flower are placed by layout() so the word and the flower
         read as one centred group instead of drifting apart on a tall phone -->
    <div class="ovl" id="ovl"><div class="card" id="card"></div></div>
  </div>
  <div id="tools">
    <div class="tool" id="tDel"><div class="ti">&#9003;</div><div class="tl">DELETE</div></div>
    <div class="tool" id="tShuf"><div class="ti">&#8635;</div><div class="tl">SHUFFLE</div></div>
    <div class="tool" id="tEnter"><div class="ti">&#10003;</div><div class="tl">ENTER</div></div>
  </div>
</div>

var PW_BANDS=[["gentle", 166], ["standard", 168], ["tricky", 166]];

function pwDict(){
  var out=[], prev="", s=PW_DICT_ENC, i=0, n=s.length;
  while(i<n){
    var k=s.charCodeAt(i)-48; i++;
    var j=i; while(j<n && s.charCodeAt(j)>=97) j++;
    var w=prev.slice(0,k)+s.slice(i,j);
    out.push(w); prev=w; i=j;
  }
  return out;
}
function pwPuzzle(idx){
  var o=idx*8;
  return { letters: PW_PACK.slice(o,o+7), centre: PW_PACK.charAt(o+7) };
}
function pwCount(){ return PW_PACK.length/8; }
function pwScore(w, letters){
  var base = w.length===4 ? 1 : w.length;
  if(pwIsPangram(w, letters)) base += 7;
  return base;
}
function pwIsPangram(w, letters){
  for(var i=0;i<letters.length;i++) if(w.indexOf(letters.charAt(i))<0) return false;
  return true;
}
function pwSolve(dict, letters, centre){
  var ok={}, i;
  for(i=0;i<letters.length;i++) ok[letters.charAt(i)]=1;
  var out=[];
  for(i=0;i<dict.length;i++){
    var w=dict[i];
    if(w.indexOf(centre)<0) continue;
    var good=true;
    for(var j=0;j<w.length;j++) if(!ok[w.charAt(j)]){ good=false; break; }
    if(good) out.push(w);
  }
  return out;
}
if(typeof module!=="undefined") module.exports={
  pwDict:pwDict, pwPuzzle:pwPuzzle, pwCount:pwCount, pwScore:pwScore,
  pwIsPangram:pwIsPangram, pwSolve:pwSolve, PW_BANDS:PW_BANDS
};

<script>
(function(){
"use strict";

var LS="gg_petal-words_";
function load(k,fb){ try{ var v=localStorage.getItem(LS+k); return v==null?fb:JSON.parse(v);}catch(e){return fb;} }
function save(k,v){ try{ localStorage.setItem(LS+k, JSON.stringify(v)); }catch(e){} }

/* ---------------- bands ---------------- */
var BANDS=[], off=0;
for(var bi=0;bi<PW_BANDS.length;bi++){
  BANDS.push({id:PW_BANDS[bi][0], from:off, count:PW_BANDS[bi][1]});
  off+=PW_BANDS[bi][1];
}
var BMETA={
  gentle:  {name:"Gentle",   cls:"z-a", tag:"Shorter lists &middot; kinder words"},
  standard:{name:"Standard", cls:"z-b", tag:"A proper puzzle &middot; the usual size"},
  tricky:  {name:"Tricky",   cls:"z-c", tag:"Long lists &middot; plenty to hunt for"}
};
function bandOf(id){ for(var i=0;i<BANDS.length;i++) if(BANDS[i].id===id) return BANDS[i]; return BANDS[0]; }

/* ---------------- ranks ---------------- */
var RANKS=[
  {n:"Seed",         f:0},
  {n:"Sprout",       f:0.02},
  {n:"Shoot",        f:0.05},
  {n:"Leaf",         f:0.08},
  {n:"Bud",          f:0.15},
  {n:"Petal",        f:0.25},
  {n:"Blossom",      f:0.40},
  {n:"Bloom",        f:0.50},
  {n:"Full Bloom",   f:0.70},
  {n:"Perfect Bloom",f:1.00}
];
var DONE_RANK=8;                       /* Full Bloom is "completed" */
function rankIdx(score,max){
  if(max<=0) return 0;
  var r=0;
  for(var i=0;i<RANKS.length;i++){
    /* Perfect Bloom is every word, not a rounded fraction */
    var need = i===RANKS.length-1 ? max : Math.floor(RANKS[i].f*max);
    if(score>=need) r=i;
  }
  return r;
}
function rankNeed(i,max){
  if(i>=RANKS.length) return max;
  return i===RANKS.length-1 ? max : Math.floor(RANKS[i].f*max);
}

/* ---------------- audio ---------------- */
var AC=null;
function muted(){ try{ return localStorage.getItem("gg_muted")==="1"; }catch(e){ return false; } }
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=false; } } return AC; }
function beep(f,dur,type,vol,slide){
  if(muted()) return; var a=ac(); if(!a) return;
  try{
    var o=a.createOscillator(), g=a.createGain();
    o.type=type||"sine"; o.frequency.setValueAtTime(f,a.currentTime);
    if(slide) o.frequency.exponentialRampToValueAtTime(slide,a.currentTime+dur);
    g.gain.setValueAtTime(.0001,a.currentTime);
    g.gain.exponentialRampToValueAtTime(vol||.05,a.currentTime+.012);
    g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+dur);
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+dur+.02);
  }catch(e){}
}
function haptic(k){ if(window.GGA&&GGA.haptic) GGA.haptic(k); }

/* ---------------- state ---------------- */
var DICT=pwDict();
var P=null;                 /* current puzzle */
var typed="";
var bandId=load("band","gentle");
var prog=load("prog",null);
if(!prog||typeof prog!=="object") prog={};
for(var k=0;k<BANDS.length;k++){
  var b=BANDS[k].id;
  if(!prog[b]||typeof prog[b]!=="object") prog[b]={i:0,f:[]};
  if(typeof prog[b].i!=="number"||prog[b].i<0||prog[b].i>=BANDS[k].count) prog[b].i=0;
  if(Object.prototype.toString.call(prog[b].f)!=="[object Array]") prog[b].f=[];
}
var doneCount=load("done",0);
if(typeof doneCount!=="number"||doneCount<0) doneCount=0;
var started=false, frozen=false;
var awarded=false;          /* completion badges already given for this puzzle */

function makePuzzle(band,i){
  var b=bandOf(band);
  var raw=pwPuzzle(b.from+i);
  var all=pwSolve(DICT, raw.letters, raw.centre).sort();
  var max=0, pans=[];
  for(var j=0;j<all.length;j++){
    max+=pwScore(all[j],raw.letters);
    if(pwIsPangram(all[j],raw.letters)) pans.push(all[j]);
  }
  /* the six outer letters, centre held separately */
  var outer=[];
  for(var c=0;c<raw.letters.length;c++) if(raw.letters.charAt(c)!==raw.centre) outer.push(raw.letters.charAt(c));
  return {band:band, i:i, letters:raw.letters, centre:raw.centre,
          outer:outer, all:all, set:dictSet(all), max:max, pans:pans,
          found:[], recent:[], score:0, rank:0};
}
function dictSet(a){ var s={}; for(var i=0;i<a.length;i++) s[a[i]]=1; return s; }

function startPuzzle(band,i,found){
  P=makePuzzle(band,i);
  bandId=band;
  typed="";
  awarded=false;
  if(found&&found.length){
    for(var j=0;j<found.length;j++){
      var w=found[j];
      if(P.set[w]===1 && !hasFound(w)){ P.found.push(w); P.score+=pwScore(w,P.letters); }
    }
    P.found.sort();
    P.recent=P.found.slice().reverse();
  }
  P.rank=rankIdx(P.score,P.max);
  shufflePetals(true);
  paintHUD(); layout(); paint();
}
function hasFound(w){ for(var i=0;i<P.found.length;i++) if(P.found[i]===w) return true; return false; }

function persist(){
  if(!P) return;
  prog[P.band]={i:P.i, f:P.found.slice()};
  save("prog",prog); save("band",bandId); save("done",doneCount);
}

/* ---------------- layout ---------------- */
var cv=document.getElementById("cv"), ctx=cv.getContext("2d");
var DPR=Math.min(window.devicePixelRatio||1,3);
var VW=0,VH=0,CX=0,CY=0,RAD=0,PR=0;
/* The whole vertical budget below the word bar is divided here in one pass:
   a fixed slot for the typed word, then the flower, then the leftover air is
   split evenly above and below the pair.  Reserving the word's slot up front
   is what stops it being squeezed off the top of a short screen. */
var CURH=0;
function layout(){
  var stg=document.getElementById("stage");
  var fl=document.getElementById("flower");
  var wb=document.getElementById("wordbar");
  var sw=stg.clientWidth, sh=stg.clientHeight;
  if(sw<40||sh<40) return;
  var wbH=wb.offsetHeight;
  var box=sh-wbH;                      /* everything under the word bar */
  CURH=Math.max(28, Math.min(46, Math.round(sh*0.062)));
  var GAP=Math.round(CURH*0.22);

  /* A petal is 1.10 x 0.90 of PR and sits RAD from the middle, so the flower
     spans 5.40 PR across and 5.90 PR down. */
  PR=Math.min(sw/5.7, (box-CURH-GAP)/6.1);
  if(PR<8) PR=8;
  RAD=PR*1.85;
  var flowerH=5.9*PR;
  var slack=Math.max(0, box-CURH-GAP-flowerH);
  var top=Math.round(slack/2);

  elCur.style.top=(wbH+top)+"px";
  elCur.style.height=CURH+"px";
  fl.style.top=(wbH+top+CURH+GAP)+"px";

  var aw=fl.clientWidth, ah=fl.clientHeight;
  VW=aw; VH=ah;
  cv.style.width=aw+"px"; cv.style.height=ah+"px";
  cv.width=Math.round(aw*DPR); cv.height=Math.round(ah*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  CX=Math.round(aw/2);
  CY=Math.round(RAD+1.10*PR);

  /* the toast sits under the flower, never over the petals */
  var my=CY+RAD+1.10*PR+6;
  if(my>ah-34) my=ah-34;
  if(my<0) my=0;
  elMsg.style.top=Math.round(my)+"px";
  fitCur();
}
/* keep the typed word on one line whatever its length */
function fitCur(){
  if(!CURH) return;
  var n=Math.max(4, typed.length);
  var size=Math.min(CURH*0.70, VW/(n*0.78));
  if(size<11) size=11;
  elCur.style.fontSize=Math.round(size)+"px";
}
window.addEventListener("resize", function(){ layout(); paint(); });

/* ---------------- petal geometry ---------------- */
/* slot 0..5 run clockwise from the top; order[] says which letter sits where */
var order=[0,1,2,3,4,5], anim=null;
function slotAngle(s){ return -Math.PI/2 + s*Math.PI/3; }
function petalPos(s){
  var a=slotAngle(s);
  return {x:CX+Math.cos(a)*RAD, y:CY+Math.sin(a)*RAD, a:a};
}
function shufflePetals(instant){
  var n=order.slice();
  /* Fisher-Yates, and never leave it exactly as it was */
  for(var i=n.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=n[i]; n[i]=n[j]; n[j]=t; }
  var same=true;
  for(var k=0;k<6;k++) if(n[k]!==order[k]) same=false;
  if(same){ var t2=n[0]; n[0]=n[3]; n[3]=t2; }
  if(instant){ order=n; anim=null; return; }
  anim={from:order.slice(), to:n, t:0, dur:300};
  order=n;
}
/* where a letter is drawn right now, allowing for the shuffle tween */
function letterSlot(li){
  var to=order.indexOf(li);
  if(!anim) return to;
  var from=anim.from.indexOf(li);
  return {from:from, to:to, k:anim.t/anim.dur};
}
function drawPos(li){
  var s=letterSlot(li);
  if(typeof s==="number") return petalPos(s);
  var a0=slotAngle(s.from), a1=slotAngle(s.to);
  var d=a1-a0;
  while(d>Math.PI) d-=Math.PI*2;
  while(d<-Math.PI) d+=Math.PI*2;
  var e=s.k<0?0:(s.k>1?1:s.k);
  e=e<.5 ? 2*e*e : 1-Math.pow(-2*e+2,2)/2;
  var a=a0+d*e;
  var r=RAD*(1-0.13*Math.sin(Math.PI*e));
  return {x:CX+Math.cos(a)*r, y:CY+Math.sin(a)*r, a:a};
}

/* ---------------- painting ---------------- */
var press={i:-1, t:0};      /* i: 0..5 outer index, or 6 for the centre */
function rr(x,y,w,h,rad){
  if(rad>w/2) rad=w/2; if(rad>h/2) rad=h/2;
  ctx.beginPath(); ctx.moveTo(x+rad,y);
  ctx.arcTo(x+w,y,x+w,y+h,rad); ctx.arcTo(x+w,y+h,x,y+h,rad);
  ctx.arcTo(x,y+h,x,y,rad); ctx.arcTo(x,y,x+w,y,rad); ctx.closePath();
}
function petalPath(x,y,ang,r,sq){
  ctx.save(); ctx.translate(x,y); ctx.rotate(ang);
  ctx.beginPath(); ctx.ellipse(0,0,r*1.10*sq,r*0.90*sq,0,0,Math.PI*2); ctx.restore();
}
function paint(){
  if(!ctx||!P||VW<40) return;
  ctx.clearRect(0,0,VW,VH);

  /* a soft halo behind the flower */
  var g=ctx.createRadialGradient(CX,CY,PR*0.4,CX,CY,RAD+PR*1.25);
  g.addColorStop(0,"rgba(255,255,255,.30)");
  g.addColorStop(1,"rgba(255,255,255,0)");
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.arc(CX,CY,RAD+PR*1.25,0,Math.PI*2); ctx.fill();

  var i;
  for(i=0;i<6;i++) drawPetal(i);
  drawCentre();
}
function petalScale(idx){
  if(press.i!==idx) return 1;
  var k=press.t/140; if(k>1) k=1;
  return 1-0.10*Math.sin(Math.PI*k);
}
function drawPetal(li){
  var p=drawPos(li), sq=petalScale(li);
  ctx.save();
  ctx.shadowColor="rgba(120,20,110,.30)"; ctx.shadowBlur=PR*0.34; ctx.shadowOffsetY=PR*0.11;
  petalPath(p.x,p.y,p.a,PR,sq);
  ctx.fillStyle="#ffffff";
  ctx.fill();
  ctx.restore();
  /* a blush towards the outer tip */
  ctx.save();
  petalPath(p.x,p.y,p.a,PR,sq); ctx.clip();
  var lg=ctx.createLinearGradient(p.x-Math.cos(p.a)*PR,p.y-Math.sin(p.a)*PR,
                                  p.x+Math.cos(p.a)*PR*1.2,p.y+Math.sin(p.a)*PR*1.2);
  lg.addColorStop(0,"rgba(255,255,255,0)");
  lg.addColorStop(1,"rgba(255,190,232,.85)");
  ctx.fillStyle=lg; ctx.fillRect(p.x-PR*2,p.y-PR*2,PR*4,PR*4);
  ctx.restore();

  ctx.fillStyle="#9c2fae";
  ctx.font="900 "+Math.round(PR*0.86)+"px -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif";
  ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillText(P.outer[li].toUpperCase(), p.x, p.y+PR*0.03);
}
function drawCentre(){
  var sq=petalScale(6);
  ctx.save();
  ctx.shadowColor="rgba(120,20,110,.36)"; ctx.shadowBlur=PR*0.4; ctx.shadowOffsetY=PR*0.12;
  ctx.beginPath(); ctx.arc(CX,CY,PR*sq,0,Math.PI*2);
  var g=ctx.createLinearGradient(CX,CY-PR,CX,CY+PR);
  g.addColorStop(0,"#ffd76b"); g.addColorStop(1,"#ff9ad0");
  ctx.fillStyle=g; ctx.fill();
  ctx.restore();
  ctx.fillStyle="#fff";
  ctx.font="900 "+Math.round(PR*0.86)+"px -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif";
  ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillText(P.centre.toUpperCase(), CX, CY+PR*0.03);
}

/* ---------------- HUD ---------------- */
var elScore=document.getElementById("vScore"), elRank=document.getElementById("vRank"),
    elWords=document.getElementById("vWords"), elPf=document.getElementById("pf"),
    elCur=document.getElementById("cur"), elWbn=document.getElementById("wbn"),
    elWbl=document.getElementById("wblist"), elMsg=document.getElementById("msg");
function paintHUD(){
  if(!P) return;
  elScore.textContent=String(P.score);
  elRank.textContent=RANKS[P.rank].n;
  elWords.textContent=P.found.length+"/"+P.all.length;
  var frac=P.max>0 ? P.score/P.max : 0;
  elPf.style.width=Math.round(Math.min(1,frac)*100)+"%";
  elWbn.textContent=P.found.length===1 ? "1 word" : P.found.length+" words";
  /* newest first - an alphabetical strip always shows the same few words */
  elWbl.textContent=P.recent.join("   ");
  paintCur();
}
function paintCur(){
  var h="", i;
  for(i=0;i<typed.length;i++){
    var ch=typed.charAt(i);
    h+= ch===P.centre ? '<span class="mid">'+ch.toUpperCase()+'</span>' : ch.toUpperCase();
  }
  h+='<span class="caret"></span>';
  elCur.innerHTML=h;
  fitCur();
}
var msgT=null;
function say(t,good){
  elMsg.textContent=t;
  elMsg.className="";
  void elMsg.offsetWidth;
  elMsg.className="show"+(good?" good":"");
}

/* ---------------- input ---------------- */
function tapLetter(ch){
  if(!started||frozen) return;
  if(typed.length>=20) return;
  typed+=ch;
  paintCur();
  beep(430+typed.length*18,.05,"sine",.035);
  haptic("light");
}
function del(){
  if(!started||frozen) return;
  if(!typed.length) return;
  typed=typed.slice(0,-1);
  paintCur();
  beep(300,.05,"sine",.03);
}
function clearWord(){ typed=""; paintCur(); }

function submit(){
  if(!started||frozen) return null;
  var w=typed;
  if(!w.length) return null;
  if(w.length<4){ say("Too short - four letters or more"); bad(); return "short"; }
  if(w.indexOf(P.centre)<0){ say("Needs the middle letter"); bad(); return "centre"; }
  if(hasFound(w)){ say("Already found"); bad(); return "dup"; }
  if(P.set[w]!==1){ say("Not in the word list"); bad(); return "unknown"; }

  var pts=pwScore(w,P.letters), pan=pwIsPangram(w,P.letters);
  P.found.push(w); P.found.sort(); P.recent.unshift(w);
  P.score+=pts;
  var before=P.rank;
  P.rank=rankIdx(P.score,P.max);
  typed="";
  paintHUD();

  if(pan){
    say("Pangram!  +"+pts, true);
    beep(520,.10,"triangle",.06,780); setTimeout(function(){ beep(780,.16,"triangle",.05,1170); },95);
    haptic("success");
    if(window.GGA) GGA.award("pw_pangram");
  }else{
    say("+"+pts, true);
    beep(600,.07,"triangle",.05,860);
    haptic("light");
  }
  if(w.length>=9 && window.GGA) GGA.award("pw_long");
  if(P.score>=100 && window.GGA) GGA.award("pw_century");
  if(P.rank>before && P.rank>=4){
    setTimeout(function(){ say(RANKS[P.rank].n+"!", true); },900);
    beep(660,.12,"sine",.045,990);
  }
  persist();
  if(P.found.length===P.all.length){
    setTimeout(function(){ finish(); },700);
  }else if(P.rank>=DONE_RANK && !awarded){
    markDone();
    setTimeout(function(){ finish(); },1000);
  }
  return "ok";
}
function bad(){ beep(210,.13,"sawtooth",.035,150); haptic("error"); }

function markDone(){
  if(awarded) return;
  awarded=true;
  doneCount++;
  save("done",doneCount);
  if(window.GGA){
    GGA.award("pw_first");
    if(P.band==="tricky") GGA.award("pw_tricky");
    if(doneCount>=5) GGA.award("pw_five");
    if(doneCount>=25) GGA.award("pw_25");
  }
}

/* ---------------- taps on the flower ---------------- */
function hit(x,y){
  var dx=x-CX, dy=y-CY;
  if(dx*dx+dy*dy<=PR*PR) return 6;
  for(var li=0;li<6;li++){
    var p=drawPos(li);
    var ox=x-p.x, oy=y-p.y;
    var c=Math.cos(-p.a), s=Math.sin(-p.a);
    var lx=ox*c-oy*s, ly=ox*s+oy*c;
    var a=PR*1.10, b=PR*0.90;
    if((lx*lx)/(a*a)+(ly*ly)/(b*b)<=1) return li;
  }
  return -1;
}
function pointerAt(e){
  var r=cv.getBoundingClientRect();
  var t=e.touches&&e.touches.length ? e.touches[0] : e;
  return {x:t.clientX-r.left, y:t.clientY-r.top};
}
function onDown(e){
  if(!started||frozen||!P) return;
  var q=pointerAt(e), i=hit(q.x,q.y);
  if(i<0) return;
  e.preventDefault();
  press.i=i; press.t=0;
  tapLetter(i===6 ? P.centre : P.outer[i]);
  paint();
}
cv.addEventListener("touchstart", onDown, {passive:false});
cv.addEventListener("mousedown", onDown);

document.addEventListener("keydown", function(e){
  if(!started||frozen||!P) return;
  if(ovl.classList.contains("on")) return;
  var k=e.key;
  if(k==="Enter"){ submit(); e.preventDefault(); return; }
  if(k==="Backspace"){ del(); e.preventDefault(); return; }
  if(k&&k.length===1){
    var c=k.toLowerCase();
    if(P.letters.indexOf(c)>=0){ tapLetter(c); e.preventDefault(); }
  }
});

document.getElementById("tDel").onclick=function(){ del(); };
document.getElementById("tEnter").onclick=function(){ submit(); };
document.getElementById("tShuf").onclick=function(){
  if(!started||frozen) return;
  shufflePetals(false); beep(400,.07,"sine",.03,300); haptic("light");
};
document.getElementById("wordbar").onclick=function(){ if(started) foundScreen(); };

/* ---------------- animation ---------------- */
var lastT=0;
function step(dt){
  if(anim){ anim.t+=dt; if(anim.t>=anim.dur) anim=null; }
  if(press.i>=0){ press.t+=dt; if(press.t>=140){ press.i=-1; press.t=0; } }
}
function frame(t){
  requestAnimationFrame(frame);
  if(frozen){ lastT=t; return; }
  if(!lastT) lastT=t;
  var dt=t-lastT; if(dt>100) dt=100;
  lastT=t;
  if(anim||press.i>=0){ step(dt); paint(); }
}

/* ---------------- screens ---------------- */
var ovl=document.getElementById("ovl"), card=document.getElementById("card");
function openOvl(h){ card.innerHTML=h; ovl.classList.add("on"); }
function closeOvl(){ ovl.classList.remove("on"); }

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function titleScreen(){
  started=false;
  var h='<h2>PETAL WORDS</h2>'+
        '<p>Make words from the seven petals. Every word must use the middle letter.</p>'+
        '<div class="sizes">';
  for(var i=0;i<BANDS.length;i++){
    var b=BANDS[i], m=BMETA[b.id];
    var pr=prog[b.id];
    h+='<div class="sz '+m.cls+'" data-b="'+b.id+'">'+
         '<div><div class="sn">'+m.name+'</div><div class="stg">'+m.tag+'</div></div>'+
         '<div class="sc">PUZZLE<br>'+(pr.i+1)+' / '+b.count+'</div>'+
       '</div>';
  }
  h+='</div>';
  h+='<button class="btn btn-alt" id="bRules">HOW TO PLAY</button>';
  openOvl(h);
  var els=card.querySelectorAll(".sz");
  for(var j=0;j<els.length;j++){
    els[j].onclick=function(){
      var b=this.getAttribute("data-b");
      startPuzzle(b, prog[b].i, prog[b].f);
      started=true; closeOvl(); persist(); layout(); paint(); paintHUD();
    };
  }
  card.querySelector("#bRules").onclick=function(){ rulesScreen(false); };
}

function rulesScreen(fromGame){
  var h='<h2>HOW TO PLAY</h2>'+
    '<div class="rules">'+
    '&bull; Tap the petals to build a word, then press <b>ENTER</b>.<br>'+
    '&bull; Words must be <b>four letters or longer</b>.<br>'+
    '&bull; Every word must use the <b>middle letter</b>.<br>'+
    '&bull; Letters may be used <b>as often as you like</b>.<br>'+
    '&bull; Four letters scores <b>1</b>. Longer words score <b>one point per letter</b>.<br>'+
    '&bull; A word using <b>all seven</b> petals is a <b>pangram</b> and scores <b>7 extra</b>.<br>'+
    '&bull; <b>SHUFFLE</b> moves the petals about. It never changes the puzzle.<br>'+
    '&bull; There is no letter S, so no plurals ending in S.<br>'+
    '</div>'+
    '<button class="btn btn-go" id="bBack">'+(fromGame?"CARRY ON":"BACK")+'</button>';
  openOvl(h);
  card.querySelector("#bBack").onclick=function(){
    if(fromGame) closeOvl(); else titleScreen();
  };
}

function ladderHTML(){
  var h='<div class="ladder">';
  for(var i=0;i<RANKS.length;i++){
    var need=rankNeed(i,P.max);
    h+='<span class="'+(i===P.rank?"now":"")+'">'+
        (i===P.rank?"<b>":"")+esc(RANKS[i].n)+(i===P.rank?"</b>":"")+
        " &middot; "+need+'</span>';
  }
  return h+'</div>';
}

function foundScreen(){
  var h='<h2>'+P.found.length+' OF '+P.all.length+'</h2>'+
        '<p>'+P.score+' points &middot; '+esc(RANKS[P.rank].n)+'</p>';
  if(P.found.length){
    h+='<div class="wlist">';
    for(var i=0;i<P.found.length;i++){
      var w=P.found[i], pan=pwIsPangram(w,P.letters);
      h+='<span class="'+(pan?"pg":"")+'">'+esc(w)+(pan?" &#10022;":"")+'</span>';
    }
    h+='</div>';
  }else{
    h+='<p>Nothing found yet.</p>';
  }
  h+=ladderHTML();
  h+='<button class="btn btn-go" id="bBack">CARRY ON</button>';
  openOvl(h);
  card.querySelector("#bBack").onclick=closeOvl;
}

function statsHTML(){
  return '<div class="stats">'+
    '<div class="st"><div class="sk">SCORE</div><div class="sv">'+P.score+'</div></div>'+
    '<div class="st"><div class="sk">WORDS</div><div class="sv">'+P.found.length+'/'+P.all.length+'</div></div>'+
    '<div class="st"><div class="sk">DONE</div><div class="sv">'+doneCount+'</div></div>'+
    '</div>';
}
/* `lead` is false when another button on the card is the obvious next step,
   so that two purple buttons never compete for the same tap. */
function tailButtons(h,lead){
  var more=P.i<bandOf(P.band).count-1;
  var cls=lead===false ? "btn-alt" : "btn-go";
  h+= more ? '<button class="btn '+cls+'" id="bNext">NEXT PUZZLE</button>'
           : '<p>That is the last '+esc(BMETA[P.band].name)+' puzzle. Well played.</p>';
  return h+'<button class="btn btn-alt" id="bMenu">BACK TO MENU</button>';
}
function wireTail(){
  var bn=card.querySelector("#bNext");
  if(bn) bn.onclick=function(){ nextPuzzle(); };
  card.querySelector("#bMenu").onclick=titleScreen;
}

function finish(){
  markDone();
  var perfect=P.found.length===P.all.length;
  if(perfect && window.GGA) GGA.award("pw_perfect");
  beep(520,.12,"triangle",.055,780);
  setTimeout(function(){ beep(780,.2,"triangle",.05,1170); },110);
  haptic("success");

  var h='<h2>'+(perfect?"PERFECT BLOOM":esc(RANKS[P.rank].n).toUpperCase())+'</h2>'+
        '<p>Puzzle '+(P.i+1)+' &middot; '+esc(BMETA[P.band].name)+'</p>'+
        statsHTML();
  if(perfect){
    h+='<p>Every word on the flower. Nothing left to find.</p>';
    h=tailButtons(h);
    openOvl(h); wireTail();
  }else{
    h+='<p>There are still '+(P.all.length-P.found.length)+' to find.</p>'+
       '<button class="btn btn-go" id="bKeep">KEEP LOOKING</button>'+
       '<button class="btn btn-alt" id="bShow">SHOW ME THE REST</button>';
    h=tailButtons(h,false);
    openOvl(h);
    card.querySelector("#bKeep").onclick=closeOvl;
    card.querySelector("#bShow").onclick=revealScreen;
    wireTail();
  }
}

/* Only ever reached by asking for it - finding Full Bloom must not spoil the
   words the player has not got yet. */
function revealScreen(){
  var h='<h2>THE REST</h2>'+
        '<p>'+(P.all.length-P.found.length)+' you did not get</p>'+
        '<div class="wlist">';
  for(var i=0;i<P.all.length;i++){
    var w=P.all[i];
    if(hasFound(w)) continue;
    var pan=pwIsPangram(w,P.letters);
    h+='<span class="miss'+(pan?" pg":"")+'">'+esc(w)+(pan?" &#10022;":"")+'</span>';
  }
  h+='</div>';
  h=tailButtons(h);
  openOvl(h); wireTail();
}

function nextPuzzle(){
  var last=bandOf(P.band).count-1;
  var i=P.i<last ? P.i+1 : P.i;
  prog[P.band]={i:i, f:[]};
  save("prog",prog);
  startPuzzle(P.band, i, []);
  started=true; closeOvl(); persist();
}

document.getElementById("bPause").onclick=function(){
  if(!started){ titleScreen(); return; }
  var h='<h2>PAUSED</h2>'+
        '<p>Puzzle '+(P.i+1)+' &middot; '+esc(BMETA[P.band].name)+'</p>'+
        '<div class="stats">'+
          '<div class="st"><div class="sk">SCORE</div><div class="sv">'+P.score+'</div></div>'+
          '<div class="st"><div class="sk">RANK</div><div class="sv" style="font-size:12px">'+esc(RANKS[P.rank].n)+'</div></div>'+
          '<div class="st"><div class="sk">WORDS</div><div class="sv">'+P.found.length+'/'+P.all.length+'</div></div>'+
        '</div>'+
        ladderHTML()+
        '<button class="btn btn-go" id="bGo">CARRY ON</button>'+
        '<button class="btn btn-alt" id="bSkip">SKIP TO NEXT PUZZLE</button>'+
        '<button class="btn btn-alt" id="bRules2">HOW TO PLAY</button>'+
        '<button class="btn btn-alt" id="bMenu2">BACK TO MENU</button>';
  openOvl(h);
  card.querySelector("#bGo").onclick=function(){ lastT=0; closeOvl(); };
  card.querySelector("#bSkip").onclick=function(){ nextPuzzle(); };
  card.querySelector("#bRules2").onclick=function(){ rulesScreen(true); };
  card.querySelector("#bMenu2").onclick=titleScreen;
};

/* ---------------- boot ---------------- */
/* NOTE: do not call persist() from here. Booting must leave the saved puzzle
   untouched so the title screen can offer it back exactly as it was. */
startPuzzle(bandId, prog[bandId].i, prog[bandId].f);
started=false;
titleScreen();
requestAnimationFrame(frame);
setTimeout(function(){ layout(); paint(); },50);
window.addEventListener("orientationchange", function(){ setTimeout(function(){ layout(); paint(); },220); });
document.addEventListener("visibilitychange", function(){ if(document.hidden) persist(); });
window.addEventListener("pagehide", persist);

})();
</script>
</body>
</html>
