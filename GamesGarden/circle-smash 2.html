<!DOCTYPE html>
<html lang="en">
<head>

<title>Circle Smash</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    background:
      radial-gradient(120% 85% at 6% -8%, #a9d4ff 0%, transparent 55%),
      radial-gradient(120% 80% at 96% 104%, #ffdda0 0%, transparent 55%),
      linear-gradient(160deg, #2f5fa8 0%, #6fa3e0 46%, #eaf3ff 100%);
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    user-select:none;-webkit-user-select:none;touch-action:none;
    display:flex;flex-direction:column;align-items:center;
    padding:calc(env(safe-area-inset-top) + 6px) 8px calc(env(safe-area-inset-bottom) + 6px);
  }
  #shell{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column}
  .bar{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .pill{display:inline-flex;align-items:center;gap:5px;text-decoration:none;color:#255499;
    background:rgba(255,255,255,.94);border:1.5px solid #fff;padding:6px 12px;border-radius:999px;
    font-size:12.5px;font-weight:800;box-shadow:0 3px 9px rgba(0,0,0,.30);cursor:pointer;white-space:nowrap}
  .pill:active{transform:scale(.95)}
  .title{flex:1;text-align:center;font-weight:900;letter-spacing:1.4px;line-height:1;
    font-size:clamp(14px,4.4vw,20px);text-shadow:0 2px 5px rgba(0,0,0,.5)}
  .strip{display:flex;gap:6px;margin-bottom:7px}
  .chip{flex:1;text-align:center;padding:6px 2px;border-radius:13px;
    background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.36)}
  .chip .k{font-size:8px;letter-spacing:1.1px;font-weight:900;opacity:.85}
  .chip .v{font-size:clamp(13px,4.2vw,17px);font-weight:900;font-variant-numeric:tabular-nums}
  #stage{flex:1;position:relative;min-height:0}
  #cv{display:block;position:absolute;inset:0;touch-action:none}
  #tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:7px}
  .tool{background:rgba(255,255,255,.95);border:1.5px solid #fff;border-radius:15px;
    padding:9px 2px 8px;text-align:center;cursor:pointer;color:#255499;
    box-shadow:0 4px 0 rgba(0,0,0,.24),0 6px 14px rgba(0,0,0,.22)}
  .tool:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.24)}
  .tool.off{opacity:.42}
  .tool .ti{font-size:19px;line-height:1}
  .tool .tl{font-size:9px;font-weight:900;letter-spacing:.5px;margin-top:2px;opacity:.75}
  .ovl{position:absolute;inset:0;z-index:40;display:none;align-items:center;justify-content:center;
    background:rgba(10,25,55,.52);backdrop-filter:blur(6px);padding:12px}
  .ovl.on{display:flex}
  .card{width:100%;max-width:352px;background:linear-gradient(180deg,#fff,#f2f8ff);
    border:2px solid #fff;border-radius:22px;padding:18px 16px 14px;text-align:center;
    color:#71879f;box-shadow:0 20px 50px rgba(0,0,0,.45);max-height:100%;overflow:auto}
  .card h2{font-size:23px;font-weight:900;letter-spacing:1px;color:#2f6fd0;margin-bottom:3px}
  .card p{font-size:13.5px;line-height:1.5;color:#93a8bd;margin:7px 0}
  .sizes{display:grid;grid-template-columns:1fr;gap:8px;margin-top:11px}
  .sz{border-radius:16px;padding:11px;cursor:pointer;color:#fff;font-weight:900;
    box-shadow:0 4px 0 rgba(0,0,0,.14);display:flex;align-items:center;justify-content:space-between}
  .sz:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.14)}
  .sz .sn{font-size:14.5px}
  .sz .stg{font-size:10px;opacity:.93;font-weight:800;margin-top:2px;text-align:left}
  .z-a{background:linear-gradient(180deg,#8fe0a8,#2fae6b)}
  .z-b{background:linear-gradient(180deg,#ffc857,#f0a020)}
  .z-c{background:linear-gradient(180deg,#ff9a86,#e0452f)}
  .btn{display:block;width:100%;margin-top:8px;padding:12px;border:none;border-radius:15px;
    font-size:14.5px;font-weight:900;cursor:pointer;letter-spacing:.4px;font-family:inherit}
  .btn-go{background:linear-gradient(180deg,#ffca62,#f09a12);color:#4a3208;
    box-shadow:0 5px 0 #c07a08,0 8px 18px rgba(200,140,20,.32)}
  .btn-go:active{transform:translateY(3px);box-shadow:0 2px 0 #c07a08}
  .btn-alt{background:#eaf3ff;color:#255499;border:1.5px solid #cfe2f8}
  .rules{text-align:left;font-size:12.6px;line-height:1.65;color:#93a8bd;margin:10px 2px}
  .rules b{color:#2f6fd0}
  .stats{display:flex;gap:8px;margin-top:11px}
  .st{flex:1;background:#eaf3ff;border-radius:13px;padding:8px 4px}
  .st .sk{font-size:8.5px;letter-spacing:1.1px;font-weight:900;color:#a8c4e2}
  .st .sv{font-size:16px;font-weight:900;font-variant-numeric:tabular-nums;color:#2f6fd0}
  @media (max-height:700px){
    .card{padding:13px 13px 10px}.card h2{font-size:19px}
    .card p{font-size:12px;margin:5px 0}
    .rules{font-size:11.4px;line-height:1.45}.btn{padding:10px;font-size:13.5px;margin-top:6px}
    .sz{padding:9px}.sz .sn{font-size:13.5px}.sizes{gap:7px;margin-top:9px}
  }

<body>
<div id="shell">
  <div class="bar">
    <a class="pill" href="index.html">&#9776; Menu</a>
    <div class="title">CIRCLE SMASH</div>
    <button class="pill" id="bPause">&#10074;&#10074;</button>
  </div>
  <div class="strip">
    <div class="chip"><div class="k">SCORE</div><div class="v" id="vScore">0</div></div>
    <div class="chip"><div class="k">BOARD</div><div class="v" id="vLevel">1</div></div>
    <div class="chip"><div class="k">BALLS</div><div class="v" id="vLives">3</div></div>
  </div>
  <div id="stage"><canvas id="cv"></canvas>
    <div class="ovl" id="ovl"><div class="card" id="card"></div></div>
  </div>
  <div id="tools">
    <div class="tool" id="tGo"><div class="ti">&#9679;</div><div class="tl">LAUNCH</div></div>
    <div class="tool" id="tNew"><div class="ti">&#8635;</div><div class="tl">NEW GAME</div></div>
    <div class="tool" id="tRules"><div class="ti">&#63;</div><div class="tl">HOW TO PLAY</div></div>
  </div>
</div>

<script src="achievements.js"></script>
<script>
/* Circle Smash - the rules and the physics, with no drawing and no input in
   them.  The whole world moves in step(), so the same code that runs on screen
   can be run headless for a few hundred thousand frames in Node.

   The playfield is a disc of radius 1.  Bricks sit in concentric rings in the
   middle; the paddle is a curved arc riding the outer edge; the outer wall is
   the floor, so a ball that gets past the paddle anywhere on the circle is
   gone.  There is no inner wall - the ball flies straight through the hole in
   the middle and out the other side, which is half the fun of it.

   Everything is Cartesian for the motion and polar for the collisions.  A
   brick is a cell in (ring, sector), and a cell is bounded by two radii and
   two angles, so resolving a hit is the polar version of resolving a box: work
   out how far into the cell the ball is through each of the four faces, and
   bounce off whichever it went through least.  */
function makeCircleSmash(){
  "use strict";

  var R_WALL=1.0;            /* past this and the ball is lost */
  var R_PAD=0.905;           /* the middle of the paddle's travel */
  var PAD_T=0.072;           /* how thick the paddle is - at 0.050 it was a
                                hairline on a phone and you could not see your own bat */
  var BALL_R=0.030;
  var R_IN=0.135;            /* the hole in the middle, kept clear of bricks */
  var RING_T=0.072;          /* thickness of one ring of bricks */
  var RING_GAP=0.014;
  var SLOW_IN=0.60;          /* the ball's speed near the centre, as a fraction
                                of its speed out by the wall - it winds up as it
                                comes at you and eases off as it flies away */
  var MAX_STEP=0.012;        /* substep distance, so nothing tunnels */
  /* The steepest a shot off the paddle may be, measured from straight inward.
     Left unbounded, a ball can leave the paddle almost sideways, and then it
     never dips far enough in to meet the bricks at all - it just orbits the rim
     off the paddle for ever.  Measured: 483 paddle hits to 4 brick hits.  At
     this angle the closest a ball can pass to the middle is sin(MAX_OFF) times
     the paddle radius, which is inside the outermost ring by construction, so
     every single shot has to meet the bricks. */
  var MAX_OFF=0.78;
  /* And the shallowest.  A shot that leaves dead straight retraces the very
     diameter it came in along, threads the same empty cells both ways, and
     does it for ever - measured at 96 seconds without touching a brick.  A
     flat breakout paddle has the same problem and the same answer: never
     return the ball perfectly square. */
  var MIN_OFF=0.075;
  /* `dry` counts the seconds since the ball last touched a brick.  It is a
     diagnostic and nothing more.  There WAS a safety net here that bent a dry
     ball back towards the middle; it turned out to be far worse than the
     problem, because a ball already inside the cluster got bent into a
     permanent orbit round the centre hole and sat there for five minutes.  The
     MAX_OFF clamp is what actually guarantees progress: every shot off the
     paddle passes within sin(MAX_OFF) x R_PAD of the middle, which is inside
     the outermost ring, so every shot has to cross every ring.  What is left
     after that is a rare periodic path that threads the same empty cells over
     and over; the cure for that is one random extra degree on the NEXT paddle
     bounce, which perturbs the cycle without ever steering the ball. */
  var DRY_LIMIT=7.0;
  /* There WAS a "cluster creeps outward when the ball goes quiet" mechanic
     here, meant to hunt down the last brick.  It made things worse in two
     different ways and both are worth remembering: close in, the ball jammed
     between a brick and the paddle face; further out, the outermost ring
     simply screened everything behind it, because a ball that bounces off the
     outer ring at 0.79 never gets deep enough to reach the inner ones at all.
     Clearable boards went from 92% to 41%.  Moving the geometry about was the
     wrong tool. */
  var DROP_V=0.34;           /* how fast a powerup drifts outward */
  var TAU=Math.PI*2;

  var KINDS=["wide","slow","multi","life"];

  function rng(seed){
    var s=seed>>>0||1;
    return function(){ s^=s<<13; s>>>=0; s^=s>>17; s^=s<<5; s>>>=0; return s/4294967296; };
  }
  function len(x,y){ return Math.sqrt(x*x+y*y); }
  /* the shortest way round from a to b, in radians */
  function angDiff(a,b){
    var d=(b-a)%TAU;
    if(d>Math.PI) d-=TAU;
    if(d<-Math.PI) d+=TAU;
    return d;
  }
  function norm(a){ a=a%TAU; return a<0?a+TAU:a; }

  /* ---- levels ----
     Ring 0 is the innermost.  Higher levels add rings and cut the gap between
     the outermost bricks and the paddle, which is what makes them quicker. */
  function buildLevel(st, level){
    var rand=st.rand;
    var rings=Math.min(4, 2+Math.floor((level-1)/3));
    /* The cluster hangs from the OUTSIDE, not the middle: the outermost ring
       always sits just inside the paddle's lane, and new rings stack inward.
       Built the other way round it was a small blob in the centre of a big
       empty disc, and most shots sailed straight past it. */
    var outerMax=Math.min(0.780, 0.660+0.015*(level-1));
    var out=[], k;
    for(k=0;k<rings;k++){
      var fromOut=rings-1-k;                        /* k=0 is the innermost */
      var r1=outerMax-fromOut*(RING_T+RING_GAP);
      var r0=r1-RING_T;
      if(r0<R_IN){ r0=R_IN; r1=Math.max(r0+0.03, r1); }
      /* Sector counts are held down hard.  Left to climb, a level-19 board
         carried 114 bricks and took over four minutes to clear even for a bot
         that never misses - which is not a phone game, it is a chore.  Trimmed
         to plateau near fifty. */
      var n=Math.min(16, 11+k+Math.floor((level-1)/6));
      var cells=new Array(n), i;
      var mode=Math.floor(rand()*4);
      for(i=0;i<n;i++){
        var on=true;
        if(mode===1) on=(i%4)!==3;
        else if(mode===2) on=(i%2===0)||k%2===0;
        else if(mode===3) on=!((i+k)%5===2);
        var hp=1;
        if(on && level>=3 && rand()<Math.min(0.30, 0.06*(level-2))) hp=2;
        if(on && level>=6 && rand()<Math.min(0.14, 0.03*(level-5))) hp=3;
        cells[i]= on ? hp : 0;
      }
      var any=false;
      for(i=0;i<n;i++) if(cells[i]) any=true;
      if(!any) for(i=0;i<n;i+=2) cells[i]=1;
      var marks={};
      var want=Math.min(3, 1+Math.floor(level/4));
      for(i=0;i<want;i++){
        var pick=Math.floor(rand()*n);
        if(cells[pick]) marks[pick]=KINDS[Math.floor(rand()*KINDS.length)];
      }
      out.push({ b0:r0, b1:r1, r0:r0, r1:r1, n:n, cells:cells, marks:marks });
    }
    st.rings=out;
    st.level=level;
    st.dry=0;
  }

  function bricksLeft(st){
    var n=0, k, i;
    for(k=0;k<st.rings.length;k++)
      for(i=0;i<st.rings[k].n;i++) if(st.rings[k].cells[i]>0) n++;
    return n;
  }

  function serveBall(st){
    st.balls=[{ x:Math.cos(st.pad.a)*(R_PAD-PAD_T), y:Math.sin(st.pad.a)*(R_PAD-PAD_T),
                vx:0, vy:0, stuck:true }];
    st.waiting=true;
  }

  function create(cfg){
    cfg=cfg||{};
    var st={
      R_WALL:R_WALL, R_PAD:R_PAD, PAD_T:PAD_T, BALL_R:BALL_R, R_IN:R_IN,
      cfg:cfg,
      rings:[], balls:[], drops:[],
      pad:{ a:Math.PI/2, av:0, arc:(cfg.arc||0.34) },
      baseArc:(cfg.arc||0.34),
      speed:(cfg.speed||0.62),
      lives:(cfg.lives==null?3:cfg.lives),
      level:1, score:0, cleared:0,
      power:{ wide:0, slow:0 },
      over:false, won:false, waiting:true,
      hits:0, clock:0, dry:0,
      rand:rng(cfg.seed||((Math.random()*1e9)|0))
    };
    buildLevel(st, cfg.level||1);
    serveBall(st);
    return st;
  }

  function launch(st){
    if(!st.waiting||st.over) return false;
    st.waiting=false;
    var b=st.balls[0];
    b.stuck=false;
    /* inward, with a bit of a lean so it never runs dead straight through the
       middle and back into the same spot for ever */
    var inward=st.pad.a+Math.PI;
    var lean=(st.rand()-0.5)*0.7;
    var v=speedAt(st, len(b.x,b.y));
    b.vx=Math.cos(inward+lean)*v;
    b.vy=Math.sin(inward+lean)*v;
    return true;
  }

  function speedAt(st, r){
    var f=SLOW_IN+(1-SLOW_IN)*Math.max(0,Math.min(1,r/R_WALL));
    var s=st.speed*f;
    /* The emptier the board, the quicker the ball - which is what breakout has
       always done, and here it also shortens the hunt for the last one or two,
       because the ball tries far more angles a minute. */
    var left=bricksLeft(st);
    if(left<=8) s*=1.45;
    else if(left<=16) s*=1.20;
    if(st.power.slow>0) s*=0.72;
    return s;
  }
  function padArc(st){ return st.pad.arc*(st.power.wide>0?1.65:1); }

  /* which cell of which ring a point is in, or null */
  function cellAt(st, r, th){
    var k, ring, idx;
    for(k=0;k<st.rings.length;k++){
      ring=st.rings[k];
      if(r>=ring.r0 && r<=ring.r1){
        idx=Math.floor(norm(th)/TAU*ring.n)%ring.n;
        return { k:k, i:idx, ring:ring };
      }
    }
    return null;
  }

  /* Bounce the ball off the cell it has got into.  The cell is bounded by two
     radii and two angles; whichever face it is least far past is the one it
     came through, so that is the one it bounces off. */
  function bounceCell(st, b, c){
    var r=len(b.x,b.y), th=Math.atan2(b.y,b.x);
    var ring=c.ring;
    var t0=c.i/ring.n*TAU, t1=(c.i+1)/ring.n*TAU;
    var dIn=r-ring.r0, dOut=ring.r1-r;
    var aCW=Math.abs(angDiff(t0, th))*Math.max(r,1e-3);
    var aCC=Math.abs(angDiff(th, t1))*Math.max(r,1e-3);
    var nx, ny, push;
    if(Math.min(dIn,dOut)<=Math.min(aCW,aCC)){
      /* through a curved face - bounce radially */
      var outward = dOut<dIn;
      nx=Math.cos(th); ny=Math.sin(th);
      if(!outward){ nx=-nx; ny=-ny; }
      push=(outward?ring.r1+BALL_R:ring.r0-BALL_R);
      b.x=Math.cos(th)*push; b.y=Math.sin(th)*push;
    }else{
      /* through a straight face - bounce round the way */
      var cw = aCW<aCC;
      var edge = cw ? t0 : t1;
      nx=-Math.sin(edge); ny=Math.cos(edge);
      if(cw){ nx=-nx; ny=-ny; }
      var offA = edge + (cw ? -1 : 1)*(BALL_R/Math.max(r,1e-3));
      b.x=Math.cos(offA)*r; b.y=Math.sin(offA)*r;
    }
    var dot=b.vx*nx+b.vy*ny;
    if(dot<0){ b.vx-=2*dot*nx; b.vy-=2*dot*ny; }
    /* A whisker of randomness on every brick bounce.  Without it the ball can
       fall into a repeating path that threads the same empty cells for ever;
       at this size it is invisible to play but it guarantees the ball keeps
       finding new angles, which is what hunts down the last brick. */
    var j=(st.rand()-0.5)*0.06;
    var ja=Math.atan2(b.vy,b.vx)+j, jv=len(b.vx,b.vy);
    b.vx=Math.cos(ja)*jv; b.vy=Math.sin(ja)*jv;
  }

  function hitBrick(st, b, ev){
    var r=len(b.x,b.y), th=Math.atan2(b.y,b.x);
    var c=cellAt(st, r, th);
    if(!c) return false;
    var hp=c.ring.cells[c.i];
    if(hp<=0) return false;
    bounceCell(st, b, c);
    c.ring.cells[c.i]=hp-1;
    st.hits++;
    st.dry=0;
    ev.hit++;
    if(hp-1<=0){
      ev.broke++;
      st.score+=10*(1+c.k);
      var kind=c.ring.marks[c.i];
      if(kind){
        delete c.ring.marks[c.i];
        var mid=(c.i+0.5)/c.ring.n*TAU, mr=(c.ring.r0+c.ring.r1)/2;
        st.drops.push({ x:Math.cos(mid)*mr, y:Math.sin(mid)*mr, a:mid, r:mr, kind:kind });
        ev.dropped++;
      }
    }else{
      st.score+=2;
      ev.dented++;
    }
    return true;
  }

  /* the paddle is an arc: catch the ball, and steer it with where it lands and
     how fast the paddle is sweeping */
  function hitPaddle(st, b, ev){
    var r=len(b.x,b.y);
    if(r+BALL_R < R_PAD-PAD_T/2) return false;
    var vr=(b.x*b.vx+b.y*b.vy)/Math.max(r,1e-6);
    if(vr<=0) return false;                       /* already heading back in */
    var th=Math.atan2(b.y,b.x);
    var half=padArc(st)/2;
    var off=angDiff(st.pad.a, th);
    if(Math.abs(off)>half) return false;
    var push=R_PAD-PAD_T/2-BALL_R;
    b.x=Math.cos(th)*push; b.y=Math.sin(th)*push;
    /* Steer by where it landed on the paddle and how fast the paddle is
       sweeping, then clamp: the shot leaves at MAX_OFF from straight inward at
       the very most, so it always dips far enough in to meet the bricks. */
    var turn=(off/half)*0.62 + Math.max(-1,Math.min(1,st.pad.av*0.9))*0.18;
    if(st.dry>DRY_LIMIT) turn+=(st.rand()-0.5)*0.55;

    if(Math.abs(turn)<MIN_OFF){
      var sgn = turn!==0 ? (turn>0?1:-1) : (st.rand()<0.5?-1:1);
      turn=sgn*MIN_OFF;
    }
    if(turn>MAX_OFF) turn=MAX_OFF;
    if(turn<-MAX_OFF) turn=-MAX_OFF;
    var inward=th+Math.PI+turn;
    var v=len(b.vx,b.vy);
    b.vx=Math.cos(inward)*v; b.vy=Math.sin(inward)*v;
    ev.paddle++;
    return true;
  }

  function setPaddle(st, a, dt){
    var prev=st.pad.a;
    st.pad.a=norm(a);
    if(dt>0) st.pad.av=angDiff(prev, st.pad.a)/dt;
  }

  function applyPower(st, kind, ev){
    if(kind==="wide") st.power.wide=9;
    else if(kind==="slow") st.power.slow=9;
    else if(kind==="life"){ st.lives++; }
    else if(kind==="multi"){
      var src=st.balls[0], i;
      if(src && !src.stuck){
        for(i=0;i<2;i++){
          var a=Math.atan2(src.vy,src.vx)+(i?0.5:-0.5);
          var v=len(src.vx,src.vy);
          st.balls.push({ x:src.x, y:src.y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, stuck:false });
        }
      }
    }
    ev.power=kind;
  }

  function step(st, dt){
    var ev={ hit:0, broke:0, dented:0, paddle:0, wall:0, dropped:0, caught:0,
             lost:0, power:null, cleared:false, over:false };
    if(st.over) return ev;
    if(dt>0.05) dt=0.05;
    st.clock+=dt;
    if(st.power.wide>0) st.power.wide-=dt;
    if(st.power.slow>0) st.power.slow-=dt;

    var i, b;
    st.dry=(st.dry||0)+dt;
    /* the ball waiting to be served rides the paddle */
    if(st.waiting){
      b=st.balls[0];
      if(b){ b.x=Math.cos(st.pad.a)*(R_PAD-PAD_T); b.y=Math.sin(st.pad.a)*(R_PAD-PAD_T); }
    }else{
      for(i=st.balls.length-1;i>=0;i--){
        b=st.balls[i];
        var r0=len(b.x,b.y);
        var want=speedAt(st, r0);
        var cur=len(b.vx,b.vy);
        if(cur>1e-6){ b.vx=b.vx/cur*want; b.vy=b.vy/cur*want; }
        var dist=want*dt;
        var steps=Math.max(1, Math.ceil(dist/MAX_STEP));
        var sdt=dt/steps, s;
        for(s=0;s<steps;s++){
          b.x+=b.vx*sdt; b.y+=b.vy*sdt;
          hitBrick(st, b, ev);
          hitPaddle(st, b, ev);
          var rr=len(b.x,b.y);
          if(rr>R_WALL){ ev.lost++; st.balls.splice(i,1); break; }
        }
      }
      if(!st.balls.length){
        st.lives--;
        st.power.wide=0; st.power.slow=0;
        st.drops=[];
        if(st.lives<=0){ st.over=true; st.won=false; ev.over=true; return ev; }
        serveBall(st);
      }
    }

    /* powerups drift out to the rim; catch them with the paddle */
    for(i=st.drops.length-1;i>=0;i--){
      var d=st.drops[i];
      d.r+=DROP_V*dt;
      d.x=Math.cos(d.a)*d.r; d.y=Math.sin(d.a)*d.r;
      if(d.r>=R_PAD-PAD_T/2){
        var off=Math.abs(angDiff(st.pad.a, d.a));
        if(off<=padArc(st)/2+0.03){ applyPower(st, d.kind, ev); ev.caught++; }
        st.drops.splice(i,1);
      }
    }

    if(bricksLeft(st)===0){
      st.cleared++;
      st.score+=100+25*st.level;
      ev.cleared=true;
      buildLevel(st, st.level+1);
      st.power.wide=0; st.power.slow=0;
      st.drops=[];
      serveBall(st);
    }
    return ev;
  }

  /* every promise the game makes, checked from the outside */
  function audit(st){
    var i, k, b;
    for(i=0;i<st.balls.length;i++){
      b=st.balls[i];
      if(!isFinite(b.x)||!isFinite(b.y)||!isFinite(b.vx)||!isFinite(b.vy))
        return "a ball went to infinity";
      var r=len(b.x,b.y);
      if(r>R_WALL+1e-6) return "a ball is outside the wall";
      if(!st.waiting && !b.stuck && len(b.vx,b.vy)<1e-6) return "a ball in play has stopped";
    }
    if(!st.over && !st.balls.length) return "no ball and the game is not over";
    if(st.waiting && st.balls.length!==1) return "waiting to serve with the wrong number of balls";
    if(st.lives<0) return "a negative number of lives";
    if(st.score<0) return "a negative score";
    if(st.pad.arc<=0||st.pad.arc>Math.PI) return "an odd paddle";
    if(!st.rings.length) return "a board with no rings";
    for(k=0;k<st.rings.length;k++){
      var ring=st.rings[k];
      if(ring.cells.length!==ring.n) return "ring "+k+" has the wrong number of cells";
      if(ring.r0<R_IN-1e-9) return "a ring reaches into the middle hole";
      if(ring.r1>R_PAD-PAD_T/2-BALL_R*2) return "a ring reaches into the paddle's lane";
      for(i=0;i<ring.n;i++){
        var hp=ring.cells[i];
        if(hp<0||hp>3||hp!==Math.floor(hp)) return "a brick with "+hp+" hits left";
      }
      for(var m in ring.marks) if(ring.marks.hasOwnProperty(m)){
        if(KINDS.indexOf(ring.marks[m])<0) return "an unknown powerup";
        if(!ring.cells[m|0]) return "a powerup on a brick that is already gone";
      }
    }
    if(!st.over && bricksLeft(st)===0) return "the board is clear but the level did not turn over";
    for(i=0;i<st.drops.length;i++){
      if(KINDS.indexOf(st.drops[i].kind)<0) return "an unknown powerup falling";
      if(st.drops[i].r<0) return "a powerup at a negative radius";
    }
    if(st.over && st.lives>0 && !st.won) return "over with lives left";
    return null;
  }

  return { R_WALL:R_WALL, R_PAD:R_PAD, PAD_T:PAD_T, BALL_R:BALL_R, R_IN:R_IN,
           RING_T:RING_T, RING_GAP:RING_GAP, KINDS:KINDS, TAU:TAU,
           rng:rng, len:len, angDiff:angDiff, norm:norm,
           create:create, buildLevel:buildLevel, serveBall:serveBall,
           launch:launch, step:step, setPaddle:setPaddle, padArc:padArc,
           speedAt:speedAt, bricksLeft:bricksLeft, cellAt:cellAt, audit:audit };
}
</script>
<script>
(function(){
"use strict";
var CS=makeCircleSmash();
var LS="gg_circlesmash_";
function load(k,fb){ try{ var v=localStorage.getItem(LS+k); return v==null?fb:JSON.parse(v);}catch(e){return fb;} }
function save(k,v){ try{ localStorage.setItem(LS+k, JSON.stringify(v)); }catch(e){} }

var MODES=[
  {id:"easy", name:"Gentle",   cls:"z-a", tag:"A slower ball and a wide bat",
   cfg:{speed:0.5, arc:0.46, lives:4}},
  {id:"med",  name:"Tricky",   cls:"z-b", tag:"An even contest",

var DROPC={ wide:"#7ed6a5", slow:"#67c3ee", multi:"#ffc857", life:"#ff6f91" };
var DROPT={ wide:"W", slow:"S", multi:"3", life:"+" };

/* ---------------- the screens you can pick ----------------
   Only the drawing changes.  Every one of these plays exactly the same game
   with exactly the same physics; what varies is the wall, the light at the far
   end, and what is drifting up the tunnel at you. */
var THEMES=[
  { id:"day", name:"DAYLIGHT", tag:"Bright and breezy",
    page:"radial-gradient(120% 85% at 6% -8%, #a9d4ff 0%, transparent 55%),"+
         "radial-gradient(120% 80% at 96% 104%, #ffdda0 0%, transparent 55%),"+
         "linear-gradient(160deg, #2f5fa8 0%, #6fa3e0 46%, #eaf3ff 100%)",
    wall:[[0,"#fff6e2"],[0.12,"#e2eeff"],[0.40,"#93bdf2"],[0.72,"#4a7fd0"],[1,"#27529c"]],
    rib1:"rgba(255,255,255,.26)", rib2:"rgba(40,85,155,.16)", hoop:"rgba(30,72,140,.20)",
    glow:["rgba(255,214,130,.95)","rgba(255,226,170,.45)","rgba(255,235,190,0)"],
    lip:"rgba(12,40,88,.46)", rim:"#2f5fa8", rimHi:"#7fb0ee",
    brick:["#ff6f91","#ff9a5f","#ffc857","#7ed6a5","#67c3ee","#b57ce0"],
    solid:"#9db6d4",
    ball:"#12305c", ballHi:"#8fb8ea",
    pad:"#ffb020", padHi:"#ffd98a", padD:"#c07a08", padGlow:"rgba(255,176,32,.55)",
    haze:"150,195,240", hazeK:0.20,
    banner:"rgba(12,40,86,.85)", bannerTx:"#ffffff",
    wheel:"#eef5ff", wheelD:"#b9d2f0", wheelInk:"#255499",
    mote:null },

  { id:"furnace", name:"FURNACE", tag:"Down a hot iron pipe",
    page:"radial-gradient(120% 85% at 8% -6%, #7a3a16 0%, transparent 55%),"+
         "radial-gradient(120% 80% at 94% 106%, #ff8a2b 0%, transparent 50%),"+
         "linear-gradient(160deg, #180f0c 0%, #3a2118 50%, #120b09 100%)",
    wall:[[0,"#fff0c4"],[0.09,"#ffb444"],[0.28,"#c9521c"],[0.58,"#5a2a18"],[1,"#22140f"]],
    rib1:"rgba(255,190,110,.20)", rib2:"rgba(0,0,0,.34)", hoop:"rgba(0,0,0,.36)",
    glow:["rgba(255,206,120,.98)","rgba(255,150,50,.55)","rgba(255,120,30,0)"],
    lip:"rgba(0,0,0,.58)", rim:"#6b3a1e", rimHi:"#d08040",
    brick:["#e8452c","#ff8a2b","#ffc247","#8bbf3a","#39a0c4","#a35fd0"],
    solid:"#6e6a66",
    ball:"#fff0c0", ballHi:"#ffffff",
    pad:"#ffb020", padHi:"#ffe9b4", padD:"#8a4a08", padGlow:"rgba(255,140,30,.75)",
    haze:"40,20,14", hazeK:0.34,
    banner:"rgba(24,12,8,.88)", bannerTx:"#ffd8a0",
    wheel:"#4a352a", wheelD:"#1b100c", wheelInk:"#ffbe86",
    mote:{ n:26, col:"rgba(255,170,70,", speed:0.10, len:0 } },

  { id:"warp", name:"WORMHOLE", tag:"Falling through space",
    page:"radial-gradient(120% 85% at 8% -8%, #6b3fd0 0%, transparent 52%),"+
         "radial-gradient(120% 80% at 94% 106%, #23a6d8 0%, transparent 50%),"+
         "linear-gradient(160deg, #120b34 0%, #2a1a6b 52%, #0b0722 100%)",
    wall:[[0,"#ffffff"],[0.07,"#d6ecff"],[0.24,"#7a63e8"],[0.56,"#33246f"],[1,"#100a2c"]],
    rib1:"rgba(150,220,255,.26)", rib2:"rgba(255,110,215,.16)", hoop:"rgba(180,220,255,.20)",
    glow:["rgba(240,250,255,.98)","rgba(150,200,255,.55)","rgba(110,150,255,0)"],
    lip:"rgba(6,3,24,.60)", rim:"#3a2a8f", rimHi:"#9d8cf5",
    brick:["#ff5fa2","#ff9d3c","#ffe14a","#4ff0b0","#4fd4ff","#b47cff"],
    solid:"#7f86b8",
    ball:"#ffffff", ballHi:"#d6ecff",
    pad:"#4fd4ff", padHi:"#c8f2ff", padD:"#1c6f96", padGlow:"rgba(79,212,255,.75)",
    haze:"55,45,140", hazeK:0.30,
    banner:"rgba(10,6,40,.88)", bannerTx:"#d6ecff",
    wheel:"#2e2166", wheelD:"#0e0a2a", wheelInk:"#a9ddff",
    mote:{ n:52, col:"rgba(220,240,255,", speed:0.34, len:0.055 } }
];
function themeOf(id){ for(var i=0;i<THEMES.length;i++) if(THEMES[i].id===id) return THEMES[i]; return THEMES[0]; }
var thId, TH, motes=[];
function setTheme(id){
  TH=themeOf(id); thId=TH.id;
  save("theme",thId);
  document.body.style.background=TH.page;
  motes=[];
  if(TH.mote) for(var i=0;i<TH.mote.n;i++)
    motes.push({ a:Math.random()*6.2832, r:0.04+Math.random()*0.96 });
}
/* darken or lighten a #rrggbb, for the lit and shaded faces of a brick */
function shade(hex,k){
  var n=parseInt(hex.slice(1),16);
  var r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  if(k>0){ r+=(255-r)*k; g+=(255-g)*k; b+=(255-b)*k; }
  else { r*=(1+k); g*=(1+k); b*=(1+k); }
  return "rgb("+Math.round(r)+","+Math.round(g)+","+Math.round(b)+")";
}

/* ---------------- state ---------------- */
var mId, S, started, running, lastT=0, flash=[], best, lostThisBoard=false;
/* Only the test hook ever sets this.  It stops the clock and nothing else, so a
   test can advance the world a frame at a time instead of racing the animation
   loop.  With the hook stripped out it stays false for good. */
var frozen=false;

function newGame(id, seed){
  mId=id; save("mode",id);
  var m=modeOf(id);
  S=CS.create({ speed:m.cfg.speed, arc:m.cfg.arc, lives:m.cfg.lives, seed:seed });
  running=true; lastT=0; flash=[];
  layout(); paintHUD();
  /* does not persist - boot calls this before the title screen reads the save */
}

/* ---------------- audio ---------------- */
var AC=null;
function muted(){ try{ return localStorage.getItem("gg_muted")==="1"; }catch(e){ return false; } }
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=false; } } return AC; }
function beep(f,dur,type,vol,slide){
  if(muted()) return; var a=ac(); if(!a) return;
  try{
    var o=a.createOscillator(), g=a.createGain();
    o.type=type||"sine"; o.frequency.setValueAtTime(f,a.currentTime);
    if(slide) o.frequency.exponentialRampToValueAtTime(slide,a.currentTime+dur);
    g.gain.setValueAtTime(.0001,a.currentTime);
    g.gain.exponentialRampToValueAtTime(vol||.05,a.currentTime+.012);
    g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+dur);
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+dur+.02);
  }catch(e){}
}

/* ---------------- layout ----------------
   The tunnel sits up top and the wheel sits underneath it, so the hand that is
   steering is never parked over the thing you are trying to watch. */
var cv=document.getElementById("cv"), ctx=cv.getContext("2d");
var DPR=Math.min(window.devicePixelRatio||1,3);
var VW=0, VH=0, CXP=0, CYP=0, SC=0;
var WH={ cx:0, cy:0, r:0, hole:0 };
function layout(){
  var st=document.getElementById("stage");
  var aw=st.clientWidth, ah=st.clientHeight;
  if(aw<40||ah<40) return;
  VW=aw; VH=ah;
  cv.style.width=aw+"px"; cv.style.height=ah+"px";
  cv.width=Math.round(aw*DPR); cv.height=Math.round(ah*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  /* The tunnel can never be wider than the screen, so on a tall phone there is
     vertical slack left once it is drawn.  Spend that slack on a roomier wheel
     rather than leaving a band of empty page: a 375 screen comes out the same,
     a 430 one gets a thumb target half again as big. */
  var maxSC=aw/2-3;
  var wr=Math.max(34, Math.min(aw*0.215, ah*0.160, 80));
  var slack=ah-(maxSC*2+10+wr*2+8);
  if(slack>0) wr=Math.min(wr+slack*0.40, aw*0.28, 116, ah*0.20);
  var band=wr*2+10;
  var top=Math.max(60, ah-band);
  SC=Math.min(maxSC, top/2-3);
  CXP=aw/2; CYP=top/2;
  WH.r=wr; WH.hole=wr*0.44;
  WH.cx=aw/2; WH.cy=ah-wr-4;
}
window.addEventListener("resize", function(){ layout(); });

/* ---------------- the tunnel ----------------
   The physics is a flat disc and stays a flat disc - what changes here is only
   how a radius is drawn.  A game radius of 1 is the mouth of the tunnel, right
   under your nose; 0 is the far end.  Running the radius through this curve
   instead of drawing it straight makes the inner rings bunch towards the middle
   the way real perspective does, so you are looking DOWN the thing rather than
   at a plate.  Angles are untouched, which is why the bat goes exactly where
   the wheel says. */
var PERSP=1.55;
var PDEN=Math.exp(PERSP)-1;
function proj(r){ return (Math.exp(PERSP*r)-1)/PDEN; }
/* how much a length at this depth shrinks - the ball uses it to get smaller as
   it goes away from you */
function projScale(r){ return PERSP*Math.exp(PERSP*r)/PDEN; }
function sr(r){ return SC*proj(r); }
function px(a,r){ return CXP+Math.cos(a)*sr(r); }
function py(a,r){ return CYP+Math.sin(a)*sr(r); }
function sx(x,y){ var r=Math.sqrt(x*x+y*y); return CXP+(r>1e-9?x/r:0)*sr(r); }
function sy(x,y){ var r=Math.sqrt(x*x+y*y); return CYP+(r>1e-9?y/r:0)*sr(r); }

/* ---------------- drawing ---------------- */
function ringPath(r0,r1,a0,a1){
  ctx.beginPath();
  ctx.arc(CXP,CYP,sr(r1),a0,a1,false);
  ctx.arc(CXP,CYP,sr(r0),a1,a0,true);
  ctx.closePath();
}
function drawTunnel(){
  var i;
  var g=ctx.createRadialGradient(CXP,CYP,0,CXP,CYP,SC);
  for(i=0;i<TH.wall.length;i++) g.addColorStop(TH.wall[i][0], TH.wall[i][1]);
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.arc(CXP,CYP,SC,0,6.284); ctx.fill();

  /* Ribs running down the tunnel, TAPERED - wide at the mouth, hairline at the
     far end.  Constant-width lines read as a flat wheel; it is the taper that
     makes it a tunnel. */
  var ribs=28;
  for(i=0;i<ribs;i++){
    var a=i/ribs*6.2832;
    var wN=SC*0.020, wF=SC*0.0015;
    var ca=Math.cos(a), sa=Math.sin(a);
    var nx=-sa, ny=ca;
    var x1=CXP+ca*sr(1.0), y1=CYP+sa*sr(1.0);
    var x0=CXP+ca*sr(0.05), y0=CYP+sa*sr(0.05);
    ctx.beginPath();
    ctx.moveTo(x1+nx*wN, y1+ny*wN);
    ctx.lineTo(x0+nx*wF, y0+ny*wF);
    ctx.lineTo(x0-nx*wF, y0-ny*wF);
    ctx.lineTo(x1-nx*wN, y1-ny*wN);
    ctx.closePath();
    ctx.fillStyle=(i%2===0)?TH.rib1:TH.rib2;
    ctx.fill();
  }
  /* hoops, also thinning with distance */
  for(i=1;i<=9;i++){
    var rr=i/9;
    ctx.strokeStyle=TH.hoop;
    ctx.lineWidth=Math.max(0.6, SC*0.011*projScale(rr)*0.55);
    ctx.beginPath(); ctx.arc(CXP,CYP,sr(rr),0,6.284); ctx.stroke();
  }
  /* whatever is drifting up the tunnel on this screen */
  if(TH.mote){
    for(i=0;i<motes.length;i++){
      var m=motes[i];
      var mr=Math.max(1, SC*0.010*projScale(m.r));
      var al=0.18+0.62*proj(m.r);
      if(TH.mote.len>0){
        ctx.strokeStyle=TH.mote.col+al.toFixed(2)+")";
        ctx.lineWidth=mr;
        var back=Math.max(0.02, m.r-TH.mote.len);
        ctx.beginPath();
        ctx.moveTo(px(m.a,back), py(m.a,back));
        ctx.lineTo(px(m.a,m.r), py(m.a,m.r));
        ctx.stroke();
      }else{
        ctx.fillStyle=TH.mote.col+al.toFixed(2)+")";
        ctx.beginPath(); ctx.arc(px(m.a,m.r), py(m.a,m.r), mr, 0, 6.284); ctx.fill();
      }
    }
  }
  /* the light at the bottom of it */
  var gl=ctx.createRadialGradient(CXP,CYP,0,CXP,CYP,SC*0.20);
  gl.addColorStop(0,TH.glow[0]);
  gl.addColorStop(0.5,TH.glow[1]);
  gl.addColorStop(1,TH.glow[2]);
  ctx.fillStyle=gl;
  ctx.beginPath(); ctx.arc(CXP,CYP,SC*0.20,0,6.284); ctx.fill();

  /* the mouth you are looking over, with the lip shaded so it has thickness */
  var lip=ctx.createRadialGradient(CXP,CYP,SC*0.80,CXP,CYP,SC);
  lip.addColorStop(0,"rgba(0,0,0,0)");
  lip.addColorStop(1,TH.lip);
  ctx.fillStyle=lip;
  ctx.beginPath(); ctx.arc(CXP,CYP,SC,0,6.284); ctx.fill();
  ctx.strokeStyle=TH.rim; ctx.lineWidth=Math.max(4,SC*0.050);
  ctx.beginPath(); ctx.arc(CXP,CYP,SC*0.982,0,6.284); ctx.stroke();
  ctx.strokeStyle=TH.rimHi; ctx.lineWidth=Math.max(1.5,SC*0.014);
  ctx.beginPath(); ctx.arc(CXP,CYP,SC*0.955,0,6.284); ctx.stroke();
}

/* A brick, with a lit face towards you and a shaded one behind, so it reads as
   a block set into the wall rather than a painted stripe. */
function drawBrick(r0,r1,a0,a1,col,hp){
  var depth=1-proj((r0+r1)/2);
  ringPath(r0,r1,a0,a1);
  ctx.fillStyle=col; ctx.fill();
  ringPath(r1-(r1-r0)*0.34, r1, a0, a1);
  ctx.fillStyle=shade(col, 0.30); ctx.fill();
  ringPath(r0, r0+(r1-r0)*0.26, a0, a1);
  ctx.fillStyle=shade(col, -0.30); ctx.fill();
  ringPath(r0,r1,a0,a1);
  ctx.strokeStyle="rgba(0,0,0,.35)";
  ctx.lineWidth=Math.max(1,SC*0.005);
  ctx.stroke();
  if(depth>0){
    ringPath(r0,r1,a0,a1);
    ctx.fillStyle="rgba("+TH.haze+","+(depth*TH.hazeK).toFixed(3)+")";
    ctx.fill();
  }
  if(hp>1){
    ctx.save();
    ctx.textAlign="center"; ctx.textBaseline="middle";
    var fs=Math.max(7, sr(r1)*0.085);
    ctx.font="900 "+Math.round(fs)+"px -apple-system,Helvetica,Arial";
    ctx.fillStyle="rgba(255,255,255,.92)";
    var mm=(a0+a1)/2, mr=(r0+r1)/2;
    ctx.fillText(String(hp), px(mm,mr), py(mm,mr));
    ctx.restore();
  }
}

/* The wheel.  Your thumb lives down here, clear of the tunnel, and the bat goes
   to whatever angle you are touching - straight up on the wheel is straight up
   in the tunnel. */
function drawWheel(){
  var i;
  ctx.fillStyle="rgba(0,0,0,.25)";
  ctx.beginPath(); ctx.arc(WH.cx, WH.cy+3, WH.r, 0, 6.284); ctx.fill();
  var g=ctx.createRadialGradient(WH.cx, WH.cy-WH.r*0.45, WH.r*0.08, WH.cx, WH.cy, WH.r);
  g.addColorStop(0, TH.wheel);
  g.addColorStop(1, TH.wheelD);
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.arc(WH.cx, WH.cy, WH.r, 0, 6.284); ctx.fill();
  /* an outer rim, or on the pale screen the wheel dissolves into the page */
  ctx.strokeStyle="rgba(0,0,0,.20)"; ctx.lineWidth=Math.max(1,WH.r*0.026);
  ctx.beginPath(); ctx.arc(WH.cx, WH.cy, WH.r-WH.r*0.013, 0, 6.284); ctx.stroke();
  ctx.strokeStyle="rgba(0,0,0,.22)"; ctx.lineWidth=Math.max(1,WH.r*0.030);
  ctx.beginPath(); ctx.arc(WH.cx, WH.cy, WH.r*0.80, 0, 6.284); ctx.stroke();
  /* where the bat is, shown on the wheel at the same angle */
  if(S){
    var half=CS.padArc(S)/2;
    ctx.beginPath();
    ctx.arc(WH.cx, WH.cy, WH.r*0.925, S.pad.a-half, S.pad.a+half, false);
    ctx.arc(WH.cx, WH.cy, WH.r*0.690, S.pad.a+half, S.pad.a-half, true);
    ctx.closePath();
    ctx.fillStyle=TH.pad; ctx.fill();
    ctx.strokeStyle=TH.padD; ctx.lineWidth=Math.max(1,WH.r*0.022); ctx.stroke();
  }
  /* the hole in the middle */
  ctx.fillStyle=TH.wheelD;
  ctx.beginPath(); ctx.arc(WH.cx, WH.cy, WH.hole, 0, 6.284); ctx.fill();
  ctx.strokeStyle="rgba(255,255,255,.20)"; ctx.lineWidth=Math.max(1,WH.r*0.022);
  ctx.beginPath(); ctx.arc(WH.cx, WH.cy, WH.hole, 0, 6.284); ctx.stroke();
  /* four faint marks, so it reads as something you turn */
  ctx.fillStyle="rgba(0,0,0,.18)";
  for(i=0;i<4;i++){
    var a=i/4*6.2832-Math.PI/2;
    ctx.beginPath();
    ctx.arc(WH.cx+Math.cos(a)*WH.r*0.575, WH.cy+Math.sin(a)*WH.r*0.575, WH.r*0.030, 0, 6.284);
    ctx.fill();
  }
  if(!started||!S||S.waiting){
    ctx.save();
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.font="900 "+Math.round(Math.max(7,WH.r*0.19))+"px -apple-system,Helvetica,Arial";
    ctx.fillStyle=TH.wheelInk;
    ctx.fillText("SPIN", WH.cx, WH.cy+1);
    ctx.restore();
  }
}

function frame(ts){
  requestAnimationFrame(frame);
  if(!S) return;
  if(!SC){ layout(); if(!SC) return; }
  if(!lastT) lastT=ts||0;
  var dt=Math.min(50,(ts||0)-lastT)/1000; lastT=ts||0;
  if(started && running && !frozen && !S.over) advance(dt);
  var i, k;
  for(i=flash.length-1;i>=0;i--){ flash[i].t-=dt*1000; if(flash[i].t<=0) flash.splice(i,1); }
  if(TH.mote && !frozen){
    for(i=0;i<motes.length;i++){
      motes[i].r+=TH.mote.speed*dt;
      if(motes[i].r>1.02){ motes[i].r=0.03; motes[i].a=Math.random()*6.2832; }
    }
  }

  ctx.clearRect(0,0,VW,VH);
  drawTunnel();

  for(k=0;k<S.rings.length;k++){
    var ring=S.rings[k];
    for(i=0;i<ring.n;i++){
      var hp=ring.cells[i];
      if(hp<=0) continue;
      var a0=i/ring.n*CS.TAU+0.012, a1=(i+1)/ring.n*CS.TAU-0.012;
      drawBrick(ring.r0+0.003, ring.r1-0.003, a0, a1,
                hp>1 ? TH.solid : TH.brick[k%TH.brick.length], hp);
      if(ring.marks[i]){
        ctx.save();
        var cm=(a0+a1)/2, cr=(ring.r0+ring.r1)/2;
        ctx.fillStyle="rgba(255,255,255,.9)";
        ctx.beginPath();
        ctx.arc(px(cm,cr), py(cm,cr), Math.max(2, sr(cr)*0.030), 0, 6.284);
        ctx.fill();
        ctx.restore();
      }
    }
  }

  for(i=0;i<flash.length;i++){
    var f=flash[i];
    var fr=Math.sqrt(f.x*f.x+f.y*f.y);
    ctx.globalAlpha=Math.max(0,f.t/f.life)*0.75;
    ctx.fillStyle=f.c;
    ctx.beginPath();
    ctx.arc(sx(f.x,f.y), sy(f.x,f.y),
            Math.max(2, SC*0.035*projScale(fr)*(1.4-f.t/f.life)), 0, 6.284);
    ctx.fill();
    ctx.globalAlpha=1;
  }

  for(i=0;i<S.drops.length;i++){
    var d=S.drops[i];
    var dr2=Math.max(2, SC*0.030*projScale(d.r));
    ctx.fillStyle="rgba(0,0,0,.30)";
    ctx.beginPath(); ctx.arc(sx(d.x,d.y), sy(d.x,d.y)+dr2*0.22, dr2, 0, 6.284); ctx.fill();
    ctx.fillStyle=DROPC[d.kind]||"#7ed6a5";
    ctx.beginPath(); ctx.arc(sx(d.x,d.y), sy(d.x,d.y), dr2, 0, 6.284); ctx.fill();
    ctx.save();
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.font="900 "+Math.round(dr2*1.15)+"px -apple-system,Helvetica,Arial";
    ctx.fillStyle="#122";
    ctx.fillText(DROPT[d.kind]||"?", sx(d.x,d.y), sy(d.x,d.y)+1);
    ctx.restore();
  }

  /* the bat, riding the mouth of the tunnel */
  var half=CS.padArc(S)/2;
  var pr0=CS.R_PAD-CS.PAD_T/2, pr1=CS.R_PAD+CS.PAD_T/2;
  ctx.save();
  ctx.shadowColor=TH.padGlow;
  ctx.shadowBlur=Math.max(6,SC*0.05);
  ringPath(pr0-0.012, pr1+0.012, S.pad.a-half, S.pad.a+half);
  ctx.fillStyle="rgba(0,0,0,.40)";
  ctx.fill();
  ctx.restore();
  ringPath(pr0, pr1-(pr1-pr0)*0.18, S.pad.a-half, S.pad.a+half);
  ctx.fillStyle=TH.pad; ctx.fill();
  ringPath(pr1-(pr1-pr0)*0.52, pr1-(pr1-pr0)*0.18, S.pad.a-half, S.pad.a+half);
  ctx.fillStyle=TH.padHi; ctx.fill();
  ringPath(pr0, pr0+(pr1-pr0)*0.22, S.pad.a-half, S.pad.a+half);
  ctx.fillStyle=TH.padD; ctx.fill();

  for(i=0;i<S.balls.length;i++){
    var b=S.balls[i];
    var br2=Math.sqrt(b.x*b.x+b.y*b.y);
    var rad=Math.max(2.5, CS.BALL_R*SC*projScale(br2));
    ctx.fillStyle="rgba(0,0,0,.30)";
    ctx.beginPath(); ctx.arc(sx(b.x,b.y), sy(b.x,b.y)+rad*0.25, rad, 0, 6.284); ctx.fill();
    ctx.fillStyle=TH.ball;
    ctx.beginPath(); ctx.arc(sx(b.x,b.y), sy(b.x,b.y), rad, 0, 6.284); ctx.fill();
    ctx.fillStyle=TH.ballHi;
    ctx.beginPath();
    ctx.arc(sx(b.x,b.y)-rad*0.30, sy(b.x,b.y)-rad*0.32, rad*0.36, 0, 6.284);
    ctx.fill();
  }

  if(started && S.waiting && !S.over){
    var say="SPIN THE WHEEL TO GO";
    ctx.save();
    ctx.textAlign="center"; ctx.textBaseline="middle";
    var fs2=Math.min(15, SC*0.072);
    ctx.font="900 "+Math.round(fs2)+"px -apple-system,Helvetica,Arial";
    var w=ctx.measureText(say).width, h=fs2*1.9;
    var bx=CXP-w/2-fs2*0.7, by=CYP-h/2;
    ctx.fillStyle=TH.banner;
    ctx.beginPath();
    ctx.moveTo(bx+h/2,by);
    ctx.arcTo(bx+w+fs2*1.4,by,bx+w+fs2*1.4,by+h,h/2);
    ctx.arcTo(bx+w+fs2*1.4,by+h,bx,by+h,h/2);
    ctx.arcTo(bx,by+h,bx,by,h/2);
    ctx.arcTo(bx,by,bx+w+fs2*1.4,by,h/2);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle=TH.bannerTx;
    ctx.fillText(say, CXP, CYP+1);
    ctx.restore();
  }

  if(started && !S.over && (S.power.wide>0||S.power.slow>0)){
    ctx.save();
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.font="900 "+Math.round(Math.min(12,SC*0.055))+"px -apple-system,Helvetica,Arial";
    var txt=(S.power.wide>0?"WIDE ":"")+(S.power.slow>0?"SLOW":"");
    ctx.fillStyle="rgba(255,255,255,.85)";
    ctx.fillText(txt.trim(), CXP, CYP+SC*0.30);
    ctx.restore();
  }

  drawWheel();
}

/* ---------------- the one place the world moves ---------------- */
function advance(dt){
  var ev=CS.step(S, dt);
  if(ev.broke){
    beep(560+Math.random()*220,.05,"square",.04);
    var lb=S.balls[0];
    if(lb) flash.push({ x:lb.x, y:lb.y, c:TH.glow[0], t:340, life:340 });
    if(window.GGA) GGA.haptic("light");
  }else if(ev.dented) beep(300,.05,"square",.035);
  else if(ev.paddle) beep(420,.04,"triangle",.04);
  if(ev.caught){
    beep(880,.12,"triangle",.06);
    if(window.GGA) GGA.haptic("success");
  }
  if(ev.lost){
    beep(240,.28,"sine",.06,110);
    if(window.GGA) GGA.haptic("error");
  }
  if(ev.cleared){
    beep(660,.12,"triangle",.07);
    setTimeout(function(){ beep(880,.12,"triangle",.07); },120);
    if(window.GGA){
      GGA.award("cs_first");
      if(S.cleared>=5) GGA.award("cs_b5");
      if(S.cleared>=10) GGA.award("cs_b10");
      if(mId==="hard") GGA.award("cs_hard");
      if(!lostThisBoard) GGA.award("cs_clean");
    }
    lostThisBoard=false;
    persist();
  }
  if(ev.lost) lostThisBoard=true;
  if(window.GGA && S.balls.length>=3) GGA.award("cs_multi");
  if(window.GGA && S.score>=1000) GGA.award("cs_score");
  if(ev.over) finish();
  paintHUD();
  return ev;
}

function finish(){
  running=false;
  save("cur",null);
  var played=load("played",0)+1; save("played",played);
  if(S.score>best){ best=S.score; save("best",best); }
  if(window.GGA){
    if(played>=10) GGA.award("cs_10");
    GGA.haptic("error");
  }
  beep(400,.16,"sine",.07,180);
  setTimeout(function(){ overScreen(); }, 900);
}

function paintHUD(){
  document.getElementById("vScore").textContent=S.score;
  document.getElementById("vLevel").textContent=S.level;
  document.getElementById("vLives").textContent=Math.max(0,S.lives);
  var g=document.getElementById("tGo");
  if(started && !S.over && S.waiting) g.classList.remove("off");
  else g.classList.add("off");
}

/* ---------------- save ---------------- */
function persist(){
  /* Before the player has started, this page owns nothing: pagehide and
     visibilitychange both fire while the title screen is up, and clearing here
     would eat the save that CARRY ON is about to offer. */
  if(!started||!S) return;
  if(S.over || (S.level===1 && S.score===0 && S.cleared===0)){ save("cur",null); return; }
  var rings=[], k;
  for(k=0;k<S.rings.length;k++)
    rings.push({ c:S.rings[k].cells.slice(), m:S.rings[k].marks });
  save("cur",{ v:1, m:mId, lv:S.level, sc:S.score, li:S.lives, cl:S.cleared, rings:rings });
}
function restore(){
  var c=load("cur",null);
  if(!c||c.v!==1||!c.rings) return false;
  if(!modeOf(c.m)) return false;
  newGame(c.m);
  CS.buildLevel(S, c.lv|0||1);
  if(c.rings.length!==S.rings.length){ newGame(c.m); return false; }
  var k, ok=true;
  for(k=0;k<S.rings.length;k++){
    if(!c.rings[k]||c.rings[k].c.length!==S.rings[k].n){ ok=false; break; }
    S.rings[k].cells=c.rings[k].c.slice();
    S.rings[k].marks=c.rings[k].m||{};
  }
  if(!ok){ newGame(c.m); return false; }
  S.score=c.sc|0; S.lives=c.li|0; S.cleared=c.cl|0;
  if(S.lives<=0) S.lives=1;
  /* a board saved with nothing left on it would clear itself the instant play
     resumed, so deal a fresh one instead */
  if(CS.bricksLeft(S)===0) CS.buildLevel(S, S.level);
  CS.serveBall(S);
  if(CS.audit(S)){ newGame(c.m); return false; }
  paintHUD();
  return true;
}

/* ---------------- input ----------------
   Everything happens on the wheel.  Touching the tunnel launches the ball but
   does not steer, because steering up there means a thumb parked over the very
   thing you are trying to watch. */
function onWheel(clientX, clientY){
  var b=cv.getBoundingClientRect();
  var dx=(clientX-b.left)-WH.cx, dy=(clientY-b.top)-WH.cy;
  return Math.sqrt(dx*dx+dy*dy) <= WH.r*1.30;
}
function steer(clientX, clientY){
  var b=cv.getBoundingClientRect();
  var dx=(clientX-b.left)-WH.cx, dy=(clientY-b.top)-WH.cy;
  if(dx*dx+dy*dy < 9) return;
  CS.setPaddle(S, Math.atan2(dy,dx), 1/60);
}
function pt(e){
  return (e.touches&&e.touches.length)?e.touches[0]
       :((e.changedTouches&&e.changedTouches.length)?e.changedTouches[0]:e);
}
var dragging=false;
function onDown(e){
  if(!started||!S||S.over||!running) return;
  if(e.cancelable) e.preventDefault();
  var q=pt(e);
  if(onWheel(q.clientX, q.clientY)){
    dragging=true;
    steer(q.clientX, q.clientY);
  }
  if(S.waiting) CS.launch(S);
}
function onMove(e){
  if(!dragging||!started||!S||S.over) return;
  if(e.cancelable) e.preventDefault();
  var q=pt(e);
  steer(q.clientX, q.clientY);
}
function onUp(){ dragging=false; }
cv.addEventListener("touchstart", onDown, {passive:false});
cv.addEventListener("touchmove", onMove, {passive:false});
cv.addEventListener("touchend", onUp);
cv.addEventListener("touchcancel", onUp);
cv.addEventListener("mousedown", onDown);
window.addEventListener("mousemove", onMove);
window.addEventListener("mouseup", onUp);
cv.addEventListener("contextmenu", function(e){ e.preventDefault(); });

document.getElementById("tGo").onclick=function(){
  if(!started||!S||S.over||!S.waiting) return;
  CS.launch(S); paintHUD();
};
document.getElementById("tRules").onclick=function(){ rulesScreen(true); };
document.getElementById("tNew").onclick=function(){
  if(!started) return;
  if(S.over){ newGame(mId); persist(); closeOvl(); started=true; return; }
  running=false;
  openOvl('<h2>START AGAIN?</h2><p>This game will be lost.</p>'+
    '<button class="btn btn-go" id="y">YES, NEW GAME</button>'+
    '<button class="btn btn-alt" id="n">KEEP PLAYING</button>');
  card.querySelector("#y").onclick=function(){ newGame(mId); persist(); closeOvl(); };
  card.querySelector("#n").onclick=function(){ running=true; lastT=0; closeOvl(); };
};

/* ---------------- screens ---------------- */
var ovl=document.getElementById("ovl"), card=document.getElementById("card");
function openOvl(h){ card.innerHTML=h; ovl.classList.add("on"); running=false; }
function closeOvl(){ ovl.classList.remove("on"); running=true; lastT=0; }

function titleScreen(){
  running=false;
  var cur=load("cur",null);
  var h='<h2>CIRCLE SMASH</h2><p>Your bat rides the mouth of the tunnel. Knock every brick out of it and do not let the ball past you.</p><div class="sizes">';
  for(var i=0;i<MODES.length;i++){
    var m=MODES[i];
    h+='<div class="sz '+m.cls+'" data-m="'+m.id+'"><div style="text-align:left">'+
       '<div class="sn">'+m.name+'</div><div class="stg">'+m.tag+'</div></div></div>';
  }
  h+='</div>';
  h+='<button class="btn btn-alt" id="bTheme">SCREEN &middot; '+TH.name+'</button>';
  if(cur&&cur.v===1) h+='<button class="btn btn-go" id="bResume">CARRY ON &middot; BOARD '+(cur.lv|0)+'</button>';
  h+='<button class="btn btn-alt" id="bRules">HOW TO PLAY</button>';
  openOvl(h);
  Array.prototype.forEach.call(card.querySelectorAll(".sz"), function(el){
    el.onclick=function(){
      started=true; newGame(el.getAttribute("data-m"));
      closeOvl(); layout(); persist();
    };
  });
  card.querySelector("#bTheme").onclick=function(){
    var k=0, j;
    for(j=0;j<THEMES.length;j++) if(THEMES[j].id===thId) k=j;
    setTheme(THEMES[(k+1)%THEMES.length].id);
    titleScreen();
  };
  var br=card.querySelector("#bResume");
  if(br) br.onclick=function(){
    started=true;
    if(!restore()) newGame(load("mode","med"));
    closeOvl(); layout(); persist();
  };
  card.querySelector("#bRules").onclick=function(){ rulesScreen(false); };
}
function rulesScreen(fromGame){
  openOvl('<h2>HOW TO PLAY</h2><div class="rules">'+
    '&#9642; <b>Steer with the wheel underneath.</b> Put a thumb on it and the bat goes to the same angle up in the tunnel; slide round the wheel and the bat sweeps round with you. Your hand never covers the game.<br><br>'+
    '&#9642; <b>The whole rim is the floor.</b> There is nowhere safe: if the ball reaches the mouth anywhere but on your bat, it is gone.<br><br>'+
    '&#9642; Touch anything to launch. The ball <b>winds up as it comes at you</b> and eases off down at the far end, so the return is always the quick bit.<br><br>'+
    '&#9642; Catch the ball off-centre to <b>angle your shot</b>, and keep the wheel moving as it lands to drag it round further.<br><br>'+
    '&#9642; Grey bricks need more than one hit. The number on them is how many are left.<br><br>'+
    '&#9642; Catch a falling token: <b>W</b> widens the bat, <b>S</b> slows the ball, <b>3</b> splits it in three and <b>+</b> is a spare ball.<br><br>'+
    '&#9642; Clear the tunnel and the next one is bigger. It goes on as long as you do.<br><br>'+
    '&#9642; <b>SCREEN</b> on the front page swaps the look between daylight, furnace and wormhole. They all play exactly the same.'+
    '</div><button class="btn btn-go" id="bBack">GOT IT</button>');
  card.querySelector("#bBack").onclick=function(){
    if(fromGame){ closeOvl(); } else { titleScreen(); }
  };
}
function statsBlock(){
  return '<div class="stats">'+
    '<div class="st"><div class="sk">SCORE</div><div class="sv">'+S.score+'</div></div>'+
    '<div class="st"><div class="sk">BOARDS</div><div class="sv">'+S.cleared+'</div></div>'+
    '<div class="st"><div class="sk">BEST</div><div class="sv">'+best+'</div></div>'+
    '</div>';
}
function overScreen(){
  var m=modeOf(mId);
  var head = S.score>=best && S.score>0 ? "BEST YET!" : "OUT OF BALLS";
  openOvl('<h2>'+head+'</h2>'+
    '<p>'+S.cleared+' board'+(S.cleared===1?"":"s")+' cleared on '+m.name.toLowerCase()+'.</p>'+
    statsBlock()+
    '<button class="btn btn-go" id="bAgain">ANOTHER GO</button>'+
    '<button class="btn btn-alt" id="bMenu">CHANGE LEVEL</button>');
  card.querySelector("#bAgain").onclick=function(){
    newGame(mId); persist(); closeOvl(); layout(); started=true;
  };
  card.querySelector("#bMenu").onclick=titleScreen;
}
document.getElementById("bPause").onclick=function(){
  if(!started||S.over){ titleScreen(); return; }
  persist();
  openOvl('<h2>PAUSED</h2>'+
    '<p>'+modeOf(mId).name+' &middot; board '+S.level+'</p>'+
    statsBlock()+
    '<button class="btn btn-go" id="bGo">BACK TO IT</button>'+
    '<button class="btn btn-alt" id="bMenu2">CHANGE LEVEL</button>');
  card.querySelector("#bGo").onclick=function(){ closeOvl(); };
  card.querySelector("#bMenu2").onclick=titleScreen;
};

/* ---------------- boot ---------------- */
best=load("best",0)|0;
setTheme(load("theme","day"));
newGame(load("mode","med"));
started=false; running=false;
titleScreen();
requestAnimationFrame(frame);
setTimeout(function(){ layout(); },50);
window.addEventListener("orientationchange", function(){ setTimeout(layout,220); });
document.addEventListener("visibilitychange", function(){
  if(document.hidden){ running=false; persist(); }   /* never lose a ball in your pocket */
});
window.addEventListener("pagehide", persist);

/* ---------------- the test hook ----------------
   Stripped out of the shipping build by the assembler; nothing in the game
   reads it, and `frozen` stays false without it. */

})();
</script>
</body>
